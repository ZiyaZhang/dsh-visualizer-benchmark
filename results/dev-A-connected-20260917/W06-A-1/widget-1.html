<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .rs-wrap { container-type: inline-size; font-family: inherit; color: var(--dsw-alias-label-primary); }
  .rs-panel { background: var(--dsw-alias-bg-layer-1, #fff); border: 1px solid var(--dsw-alias-border-l1, #e3e6ea); border-radius: 12px; padding: 14px 16px 12px; }
  .rs-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .rs-title { font-size: 14px; font-weight: 600; }
  .rs-unit { font-size: 12px; color: var(--dsw-alias-label-tertiary, #8a919c); }
  .rs-svg { display: block; width: 100%; height: auto; }
  .rs-col { cursor: pointer; }
  .rs-col:focus-visible { outline: 2px solid var(--dsw-alias-brand-primary, #2f6bff); outline-offset: 2px; border-radius: 8px; }
  .rs-hit { fill: transparent; }
  .rs-bar { fill: var(--dsw-alias-brand-primary, #2f6bff); opacity: .45; transition: opacity .15s ease, fill .15s ease; }
  .rs-col:hover .rs-bar { opacity: .7; }
  .rs-col[aria-pressed="true"] .rs-bar { fill: var(--dsw-alias-brand-primary, #2f6bff); opacity: 1; }
  .rs-baseline { stroke: var(--dsw-alias-border-l2, #c9ced6); stroke-width: 1; }
  .rs-axis { fill: var(--dsw-alias-label-tertiary, #8a919c); font-size: 12px; }
  .rs-region { fill: var(--dsw-alias-label-secondary, #5a626d); font-size: 13px; }
  .rs-col[aria-pressed="true"] .rs-region { fill: var(--dsw-alias-label-primary, #1c1f24); font-weight: 600; }
  .rs-value { fill: var(--dsw-alias-label-secondary, #5a626d); font-size: 13px; font-variant-numeric: tabular-nums; }
  .rs-col[aria-pressed="true"] .rs-value { fill: var(--dsw-alias-label-primary, #1c1f24); font-weight: 600; }
  .rs-dot { fill: var(--dsw-alias-brand-primary, #2f6bff); }
  .rs-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--dsw-alias-border-l1, #e3e6ea); }
  .rs-readout { font-size: 13px; min-width: 0; flex: 1 1 190px; color: var(--dsw-alias-label-secondary, #5a626d); }
  .rs-readout b { color: var(--dsw-alias-label-primary, #1c1f24); font-variant-numeric: tabular-nums; }
  .rs-btn { font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--dsw-alias-button-primary-fill, #2f6bff); background: var(--dsw-alias-button-primary-fill, #2f6bff); color: var(--dsw-alias-label-primary-inverted, #fff); cursor: pointer; white-space: nowrap; }
  .rs-btn:hover:not(:disabled) { filter: brightness(1.06); }
  .rs-btn:disabled { opacity: .5; cursor: not-allowed; }
  .rs-hint { flex: 1 1 100%; font-size: 12px; color: var(--dsw-alias-label-tertiary, #8a919c); }
  @container (max-width: 430px) { .rs-region { font-size: 12px; } }
</style>

<div class="rs-wrap" id="rsRoot">
  <div class="rs-panel">
    <div class="rs-head">
      <span class="rs-title" id="rsTitle">地区销售对比</span>
      <span class="rs-unit">单位：万元 · 点击柱形或标签选择地区</span>
    </div>

    <svg class="rs-svg" viewBox="0 0 800 215" role="group" aria-labelledby="rsTitle rsDesc">
      <desc id="rsDesc">柱状图：华东 120 万元，华南 80 万元，西部 50 万元。点击某地区可在本地选中，选中后可用按钮请求解释。</desc>
      <line class="rs-baseline" x1="0" y1="180" x2="800" y2="180"></line>
      <line class="rs-baseline" x1="230" y1="30" x2="230" y2="180"></line>

      <g class="rs-col" id="rsCol-east" role="button" tabindex="0" aria-pressed="false" aria-label="华东，120 万元">
        <rect class="rs-hit" x="230" y="30" width="190" height="150"></rect>
        <rect class="rs-bar" x="300" y="60" width="50" height="120" rx="4"></rect>
        <text class="rs-region" x="215" y="126" text-anchor="end">华东</text>
        <text class="rs-value" x="325" y="50" text-anchor="middle">120</text>
        <circle class="rs-dot" id="rsDot-east" cx="325" cy="192" r="4" opacity="0"></circle>
      </g>

      <g class="rs-col" id="rsCol-south" role="button" tabindex="0" aria-pressed="false" aria-label="华南，80 万元">
        <rect class="rs-hit" x="420" y="30" width="190" height="150"></rect>
        <rect class="rs-bar" x="490" y="100" width="50" height="80" rx="4"></rect>
        <text class="rs-region" x="405" y="146" text-anchor="end">华南</text>
        <text class="rs-value" x="515" y="90" text-anchor="middle">80</text>
        <circle class="rs-dot" id="rsDot-south" cx="515" cy="192" r="4" opacity="0"></circle>
      </g>

      <g class="rs-col" id="rsCol-west" role="button" tabindex="0" aria-pressed="false" aria-label="西部，50 万元">
        <rect class="rs-hit" x="610" y="30" width="190" height="150"></rect>
        <rect class="rs-bar" x="680" y="130" width="50" height="50" rx="4"></rect>
        <text class="rs-region" x="595" y="161" text-anchor="end">西部</text>
        <text class="rs-value" x="705" y="120" text-anchor="middle">50</text>
        <circle class="rs-dot" id="rsDot-west" cx="705" cy="192" r="4" opacity="0"></circle>
      </g>

      <text class="rs-axis" x="0" y="184">0</text>
      <text class="rs-axis" x="0" y="142">40</text>
      <text class="rs-axis" x="0" y="102">80</text>
      <text class="rs-axis" x="0" y="62">120</text>
    </svg>

    <div class="rs-footer">
      <span class="rs-readout" id="rsReadout" aria-live="polite">当前选择：<b>未选择</b></span>
      <button class="rs-btn" id="rsAskBtn" type="button" disabled>解释所选地区</button>
      <span class="rs-hint" id="rsHint">点击地区仅在本地选中，不会发起提问。</span>
    </div>
  </div>
</div>

<script>
  (function () {
    var regions = {
      east:  { name: '华东', value: 120 },
      south: { name: '华南', value: 80 },
      west:  { name: '西部', value: 50 }
    };
    var current = null;
    var sent = false;

    var cols = { east: document.getElementById('rsCol-east'), south: document.getElementById('rsCol-south'), west: document.getElementById('rsCol-west') };
    var dots = { east: document.getElementById('rsDot-east'), south: document.getElementById('rsDot-south'), west: document.getElementById('rsDot-west') };
    var readout = document.getElementById('rsReadout');
    var hint = document.getElementById('rsHint');
    var btn = document.getElementById('rsAskBtn');

    function render() {
      Object.keys(cols).forEach(function (key) {
        var on = key === current;
        cols[key].setAttribute('aria-pressed', on ? 'true' : 'false');
        dots[key].setAttribute('opacity', on ? '1' : '0');
      });
      if (current) {
        var r = regions[current];
        readout.innerHTML = '当前选择：<b>' + r.name + '</b> · <b>' + r.value + '</b> 万元';
        btn.disabled = sent;
        hint.textContent = sent ? '已发送解释请求。' : '已选中（仅本地）。点击按钮才会向助手追问。';
      } else {
        readout.innerHTML = '当前选择：<b>未选择</b>';
        btn.disabled = true;
        hint.textContent = '点击地区仅在本地选中，不会发起提问。';
      }
    }

    function select(key) {
      current = current === key ? null : key;
      if (current) sent = false;
      render();
    }

    Object.keys(cols).forEach(function (key) {
      cols[key].addEventListener('click', function () { select(key); });
      cols[key].addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(key); }
      });
    });

    btn.addEventListener('click', function () {
      if (!current || sent) return;
      var r = regions[current];
      sent = true;
      render();
      if (window.dshWidget && typeof window.dshWidget.sendPrompt === 'function') {
        window.dshWidget.sendPrompt('请解释所选地区的销售表现：' + r.name + '，' + r.value + ' 万元。结合这一数值说明该地区的销售地位、与其他地区的差距（华东 120 万元、华南 80 万元、西部 50 万元），并给出可能的原因与建议。');
      }
    });

    render();
  })();
</script></body></html>
