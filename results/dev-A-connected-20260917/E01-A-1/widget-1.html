<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}:where(body){padding:0}:where(body>svg){width:100%;height:auto}</style></head><body><svg viewBox="0 0 900 640" role="img" aria-labelledby="tcpTitle tcpDesc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
  <title id="tcpTitle">TCP 三次握手时序图与两次握手的失效对比</title>
  <desc id="tcpDesc">左图显示客户端与服务器的三次握手：SYN、SYN-ACK、ACK，并标注每步验证的收发能力；右图显示仅两次握手时，延迟到达的历史 SYN 会让服务器提前建立连接并长期占用资源。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="var(--dsw-alias-bg-base, #ffffff)"/>

  <!-- ================= Left panel: 3-way handshake ================= -->
  <text x="40" y="44" font-size="19" font-weight="700" fill="var(--dsw-alias-label-primary, #111827)">三次握手：三步各验证一件事</text>
  <text x="40" y="68" font-size="13" fill="var(--dsw-alias-label-secondary, #6b7280)">时间从上往下流动，箭头是实际发出的报文</text>

  <!-- lifelines -->
  <line x1="180" y1="120" x2="180" y2="560" stroke="var(--dsw-alias-border-l2, #d1d5db)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="470" y1="120" x2="470" y2="560" stroke="var(--dsw-alias-border-l2, #d1d5db)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- actor boxes -->
  <rect x="110" y="92" width="140" height="34" rx="8" fill="var(--dsw-alias-bg-layer-2, #f3f4f6)" stroke="var(--dsw-alias-border-l1, #e5e7eb)"/>
  <text x="180" y="114" font-size="14" font-weight="600" text-anchor="middle" fill="var(--dsw-alias-label-primary, #111827)">客户端 Client</text>
  <rect x="400" y="92" width="140" height="34" rx="8" fill="var(--dsw-alias-bg-layer-2, #f3f4f6)" stroke="var(--dsw-alias-border-l1, #e5e7eb)"/>
  <text x="470" y="114" font-size="14" font-weight="600" text-anchor="middle" fill="var(--dsw-alias-label-primary, #111827)">服务器 Server</text>

  <!-- step 1: SYN -->
  <line x1="182" y1="180" x2="466" y2="180" stroke="var(--dsw-alias-brand-primary, #2563eb)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="324" y="170" font-size="14" font-weight="700" text-anchor="middle" fill="var(--dsw-alias-brand-primary, #2563eb)">① SYN  seq = x</text>
  <text x="190" y="200" font-size="12" fill="var(--dsw-alias-label-secondary, #6b7280)">客户端：我要连，我的初始序号是 x</text>
  <text x="490" y="200" font-size="12" fill="var(--dsw-alias-label-secondary, #6b7280)">服务端：✅ 收到你的报文 → 你有发的能力</text>
  <text x="490" y="218" font-size="12" fill="var(--dsw-alias-label-secondary, #6b7280)">但我还不知道你是否能收</text>

  <!-- step 2: SYN-ACK -->
  <line x1="468" y1="290" x2="184" y2="290" stroke="var(--dsw-alias-state-error-primary, #dc2626)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="324" y="280" font-size="14" font-weight="700" text-anchor="middle" fill="var(--dsw-alias-state-error-primary, #dc2626)">② SYN + ACK  seq = y, ack = x+1</text>
  <text x="190" y="310" font-size="12" fill="var(--dsw-alias-label-secondary, #6b7280)">客户端：✅ 你收到了我的 SYN</text>
  <text x="190" y="328" font-size="12" fill="var(--dsw-alias-label-secondary, #6b7280)">✅ 我也收到你的报文 → 你能发我能收</text>
  <text x="490" y="310" font-size="12" fill="var(--dsw-alias-label-secondary, #6b7280)">服务端：我已发，但不知你收到没</text>

  <!-- step 3: ACK -->
  <line x1="182" y1="400" x2="466" y2="400" stroke="var(--dsw-alias-brand-primary, #2563eb)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="324" y="390" font-size="14" font-weight="700" text-anchor="middle" fill="var(--dsw-alias-brand-primary, #2563eb)">③ ACK  ack = y+1</text>
  <text x="190" y="420" font-size="12" fill="var(--dsw-alias-label-secondary, #6b7280)">客户端：确认收到你的 SYN</text>
  <text x="490" y="420" font-size="12" fill="var(--dsw-alias-label-secondary, #6b7280)">服务端：✅ 你收到了 → 双向通道确认</text>

  <!-- state labels -->
  <g font-size="11.5" fill="var(--dsw-alias-label-tertiary, #9ca3af)">
    <text x="180" y="152" text-anchor="middle">SYN_SENT</text>
    <text x="470" y="152" text-anchor="middle">LISTEN</text>
    <text x="180" y="352" text-anchor="middle">ESTABLISHED</text>
    <text x="470" y="352" text-anchor="middle">SYN_RCVD</text>
    <text x="470" y="462" text-anchor="middle">ESTABLISHED</text>
  </g>

  <!-- summary bar -->
  <rect x="40" y="490" width="430" height="106" rx="10" fill="var(--dsw-alias-bg-layer-1, #f9fafb)" stroke="var(--dsw-alias-border-l1, #e5e7eb)"/>
  <text x="60" y="516" font-size="13.5" font-weight="700" fill="var(--dsw-alias-label-primary, #111827)">为什么不能少一次？</text>
  <text x="60" y="540" font-size="12.5" fill="var(--dsw-alias-label-secondary, #6b7280)">两次：服务器发完 SYN-ACK 就以为连上了，</text>
  <text x="60" y="558" font-size="12.5" fill="var(--dsw-alias-label-secondary, #6b7280)">却还没得到“对方确实收到”的确认。</text>
  <text x="60" y="580" font-size="12.5" fill="var(--dsw-alias-label-secondary, #6b7280)">第三次 ACK 的作用就是补上这个确认。</text>

  <!-- ================= Right panel: 2-way failure ================= -->
  <line x1="510" y1="92" x2="510" y2="600" stroke="var(--dsw-alias-border-l1, #e5e7eb)"/>

  <text x="550" y="44" font-size="19" font-weight="700" fill="var(--dsw-alias-label-primary, #111827)">如果只有两次握手</text>
  <text x="550" y="68" font-size="13" fill="var(--dsw-alias-label-secondary, #6b7280)">一个“过期”的 SYN 就能骗服务器建连</text>

  <!-- lifelines right -->
  <line x1="600" y1="150" x2="600" y2="470" stroke="var(--dsw-alias-border-l2, #d1d5db)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="830" y1="150" x2="830" y2="470" stroke="var(--dsw-alias-border-l2, #d1d5db)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="545" y="112" width="110" height="30" rx="8" fill="var(--dsw-alias-bg-layer-2, #f3f4f6)" stroke="var(--dsw-alias-border-l1, #e5e7eb)"/>
  <text x="600" y="132" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--dsw-alias-label-primary, #111827)">客户端</text>
  <rect x="775" y="112" width="110" height="30" rx="8" fill="var(--dsw-alias-bg-layer-2, #f3f4f6)" stroke="var(--dsw-alias-border-l1, #e5e7eb)"/>
  <text x="830" y="132" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--dsw-alias-label-primary, #111827)">服务器</text>

  <!-- stale SYN -->
  <line x1="602" y1="190" x2="826" y2="190" stroke="var(--dsw-alias-state-error-primary, #dc2626)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="714" y="180" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--dsw-alias-state-error-primary, #dc2626)">SYN（旧连接的滞留报文）</text>
  <text x="560" y="210" font-size="11.5" fill="var(--dsw-alias-label-tertiary, #9ca3af)">客户端早已放弃这次请求，正在做别的事</text>

  <!-- server thinks connected -->
  <line x1="828" y1="270" x2="606" y2="270" stroke="var(--dsw-alias-brand-primary, #2563eb)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="714" y="260" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--dsw-alias-brand-primary, #2563eb)">SYN-ACK</text>
  <text x="832" y="292" font-size="11.5" fill="var(--dsw-alias-label-secondary, #6b7280)">两次握手下，服务端认为连接已建立 →</text>
  <text x="832" y="310" font-size="11.5" fill="var(--dsw-alias-label-secondary, #6b7280)">分配资源、进入 ESTABLISHED</text>
  <text x="560" y="292" font-size="11.5" fill="var(--dsw-alias-label-secondary, #6b7280)">客户端一头雾水，直接忽略/回 RST</text>

  <!-- resources held -->
  <rect x="545" y="340" width="340" height="118" rx="10" fill="var(--dsw-alias-bg-layer-1, #f9fafb)" stroke="var(--dsw-alias-state-error-primary, #dc2626)" stroke-opacity="0.4"/>
  <text x="565" y="366" font-size="13" font-weight="700" fill="var(--dsw-alias-state-error-primary, #dc2626)">后果：半开连接 / SYN Flood</text>
  <text x="565" y="390" font-size="12.5" fill="var(--dsw-alias-label-secondary, #6b7280)">服务端白白保留一条没人认领的连接，</text>
  <text x="565" y="408" font-size="12.5" fill="var(--dsw-alias-label-secondary, #6b7280)">占用内存和序号资源；大量伪造源地址的</text>
  <text x="565" y="426" font-size="12.5" fill="var(--dsw-alias-label-secondary, #6b7280)">SYN 就能把连接表塞满，正常用户连不进来。</text>
  <text x="565" y="447" font-size="12.5" font-weight="600" fill="var(--dsw-alias-label-primary, #111827)">第三次 ACK 让服务端先确认再投入资源。</text>

  <!-- bottom takeaway -->
  <rect x="40" y="612" width="845" height="0" fill="none"/>
</svg></body></html>
