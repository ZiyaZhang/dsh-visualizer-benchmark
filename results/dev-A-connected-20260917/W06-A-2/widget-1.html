<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><div class="sr-card">
  <style>
    .sr-card{--c-east:#2f6bff;--c-south:#12a594;--c-west:#c2620a;
      font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--dsw-alias-label-primary,#1c1f23);
      background:var(--dsw-alias-bg-layer-1,#fff);
      border:1px solid var(--dsw-alias-border-l1,rgba(0,0,0,.12));
      border-radius:12px;padding:14px 16px 16px;max-width:560px;box-sizing:border-box}
    .sr-card *{box-sizing:border-box}
    .sr-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between;margin-bottom:2px}
    .sr-title{font-size:15px;font-weight:600}
    .sr-sub{font-size:12px;color:var(--dsw-alias-label-tertiary,#6b7280)}
    .sr-legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
    .sr-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;border-radius:999px;
      border:1px solid var(--dsw-alias-border-l2,rgba(0,0,0,.16));background:transparent;cursor:pointer;
      color:inherit;font:inherit;font-variant-numeric:tabular-nums;transition:background .15s,box-shadow .15s}
    .sr-pill:hover{background:var(--dsw-alias-interactive-bg-hover,rgba(0,0,0,.05))}
    .sr-pill[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor;background:var(--dsw-alias-interactive-bg-active,rgba(0,0,0,.07))}
    .sr-pill:focus-visible{outline:2px solid var(--dsw-alias-brand-primary,#2f6bff);outline-offset:2px}
    .sr-dot{width:10px;height:10px;border-radius:3px;flex:none}
    .sr-chart{width:100%;height:auto;display:block;margin-top:2px;overflow:visible}
    .sr-svgbtn{cursor:pointer}
    .sr-svgbtn:focus-visible{outline:2px solid var(--dsw-alias-brand-primary,#2f6bff);outline-offset:3px;border-radius:6px}
    .sr-bar{transition:opacity .15s}
    .sr-readout{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--dsw-alias-bg-layer-2,rgba(0,0,0,.04));
      display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-variant-numeric:tabular-nums}
    .sr-readout-label{font-size:12px;color:var(--dsw-alias-label-secondary,#4b5563)}
    .sr-readout-value{font-size:18px;font-weight:600}
    .sr-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
    .sr-ask{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;
      background:var(--dsw-alias-button-primary-fill,#2f6bff);color:var(--dsw-alias-label-primary-inverted,#fff)}
    .sr-ask:focus-visible{outline:2px solid var(--dsw-alias-brand-primary,#2f6bff);outline-offset:2px}
    .sr-hint{font-size:12px;color:var(--dsw-alias-label-tertiary,#6b7280)}
  </style>

  <div class="sr-head">
    <div class="sr-title" id="sr-title">地区销售额对比</div>
    <div class="sr-sub">单位：万元 · 点击地区只做本地选中</div>
  </div>

  <div class="sr-legend" role="group" aria-label="点击选择地区（仅本地高亮，不发送）">
    <button type="button" class="sr-pill" data-region="east" aria-pressed="false" style="color:var(--c-east)">
      <span class="sr-dot" style="background:var(--c-east)"></span><span>华东 120 万元</span>
    </button>
    <button type="button" class="sr-pill" data-region="south" aria-pressed="false" style="color:var(--c-south)">
      <span class="sr-dot" style="background:var(--c-south)"></span><span>华南 80 万元</span>
    </button>
    <button type="button" class="sr-pill" data-region="west" aria-pressed="false" style="color:var(--c-west)">
      <span class="sr-dot" style="background:var(--c-west)"></span><span>西部 50 万元</span>
    </button>
  </div>

  <svg class="sr-chart" viewBox="0 0 520 220" role="img" aria-labelledby="sr-title">
    <title>地区销售额柱状图：华东 120 万元，华南 80 万元，西部 50 万元</title>
    <line x1="58" y1="170" x2="500" y2="170" stroke="var(--dsw-alias-border-l1,rgba(0,0,0,.12))"></line>
    <g font-size="11" fill="var(--dsw-alias-label-tertiary,#6b7280)" text-anchor="end">
      <text x="50" y="174">0</text>
      <text x="50" y="124">50</text>
      <text x="50" y="74">100</text>
      <text x="50" y="24">150</text>
    </g>
    <g class="sr-grid" stroke="var(--dsw-alias-border-l1,rgba(0,0,0,.12))" stroke-dasharray="3 4" opacity=".55">
      <line x1="58" y1="70" x2="500" y2="70"></line>
      <line x1="58" y1="120" x2="500" y2="120"></line>
    </g>
    <g class="sr-svgbtn" data-region="east" tabindex="0" role="button" aria-pressed="false"
       aria-label="华东 120 万元，点击选择（仅本地）">
      <rect x="90" y="10" width="80" height="160" rx="6" fill="transparent"></rect>
      <rect class="sr-bar" x="106" y="50" width="48" height="120" rx="5" fill="var(--c-east)"></rect>
      <text class="sr-v" x="130" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dsw-alias-label-primary,#1c1f23)">120</text>
      <text x="130" y="190" text-anchor="middle" font-size="12" fill="var(--dsw-alias-label-secondary,#4b5563)">华东</text>
    </g>
    <g class="sr-svgbtn" data-region="south" tabindex="0" role="button" aria-pressed="false"
       aria-label="华南 80 万元，点击选择（仅本地）">
      <rect x="240" y="10" width="80" height="160" rx="6" fill="transparent"></rect>
      <rect class="sr-bar" x="256" y="90" width="48" height="80" rx="5" fill="var(--c-south)"></rect>
      <text class="sr-v" x="280" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dsw-alias-label-primary,#1c1f23)">80</text>
      <text x="280" y="190" text-anchor="middle" font-size="12" fill="var(--dsw-alias-label-secondary,#4b5563)">华南</text>
    </g>
    <g class="sr-svgbtn" data-region="west" tabindex="0" role="button" aria-pressed="false"
       aria-label="西部 50 万元，点击选择（仅本地）">
      <rect x="390" y="10" width="80" height="160" rx="6" fill="transparent"></rect>
      <rect class="sr-bar" x="406" y="120" width="48" height="50" rx="5" fill="var(--c-west)"></rect>
      <text class="sr-v" x="430" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dsw-alias-label-primary,#1c1f23)">50</text>
      <text x="430" y="190" text-anchor="middle" font-size="12" fill="var(--dsw-alias-label-secondary,#4b5563)">西部</text>
    </g>
  </svg>

  <p class="sr-readout" role="status" aria-live="polite">
    <span class="sr-readout-label">当前选中</span>
    <span class="sr-readout-value" id="sr-value">未选择</span>
    <span class="sr-readout-label" id="sr-detail">点击上方地区即可本地选中，不会发送任何消息</span>
  </p>

  <div class="sr-actions">
    <button type="button" class="sr-ask" id="sr-ask" disabled>解释所选地区</button>
    <span class="sr-hint" id="sr-hint">需先选中一个地区</span>
  </div>

  <script>
    (function () {
      var chart = document.currentScript.closest('.sr-card');
      if (!chart) return;
      var data = {
        east:  { name: '华东', value: 120 },
        south: { name: '华南', value: 80 },
        west:  { name: '西部', value: 50 }
      };
      var selected = null;
      var valueEl = chart.querySelector('#sr-value');
      var detailEl = chart.querySelector('#sr-detail');
      var askBtn = chart.querySelector('#sr-ask');
      var hintEl = chart.querySelector('#sr-hint');
      var svgGroups = Array.prototype.slice.call(chart.querySelectorAll('.sr-svgbtn'));
      var pills = Array.prototype.slice.call(chart.querySelectorAll('.sr-pill'));
      var groups = svgGroups.concat(pills);

      function render() {
        groups.forEach(function (g) {
          var id = g.getAttribute('data-region');
          var on = selected === id;
          g.setAttribute('aria-pressed', on ? 'true' : 'false');
          var bar = g.querySelector ? g.querySelector('.sr-bar') : null;
          var dot = g.querySelector ? g.querySelector('.sr-dot') : null;
          if (bar) bar.setAttribute('opacity', selected === null || on ? '1' : '0.35');
          if (dot) dot.setAttribute('opacity', selected === null || on ? '1' : '0.4');
        });
        if (selected === null) {
          valueEl.textContent = '未选择';
          detailEl.textContent = '点击上方地区即可本地选中，不会发送任何消息';
          askBtn.disabled = true;
          hintEl.textContent = '需先选中一个地区';
        } else {
          var d = data[selected];
          valueEl.textContent = d.name + ' ' + d.value + ' 万元';
          var total = 0;
          Object.keys(data).forEach(function (k) { total += data[k].value; });
          var pct = Math.round(d.value / total * 100);
          detailEl.textContent = '占三地区合计 ' + total + ' 万元的 ' + pct + '%';
          askBtn.disabled = false;
          hintEl.textContent = '点击按钮才会带着该地区与数值向你追问';
        }
      }

      function pick(id) {
        selected = id;
        render();
      }

      groups.forEach(function (g) {
        g.addEventListener('click', function () { pick(g.getAttribute('data-region')); });
        g.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            pick(g.getAttribute('data-region'));
          }
        });
      });

      askBtn.addEventListener('click', function () {
        if (selected === null) return;
        var d = data[selected];
        var total = 0;
        Object.keys(data).forEach(function (k) { total += data[k].value; });
        var text = '请解释所选地区：' + d.name + '，销售额 ' + d.value + ' 万元。' +
          '（对比数据：华东 120 万元、华南 80 万元、西部 50 万元；' + d.name + '占三地区合计 ' + total + ' 万元的 ' +
          Math.round(d.value / total * 100) + '%。）' +
          '请分析这个业绩水平、可能的原因和值得关注的方向。';
        if (window.dshWidget && typeof window.dshWidget.sendPrompt === 'function') {
          window.dshWidget.sendPrompt(text);
        }
      });

      render();
    })();
  </script>
</div></body></html>
