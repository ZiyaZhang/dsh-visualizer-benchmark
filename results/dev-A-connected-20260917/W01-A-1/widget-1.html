:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>

  .bs-note b{color:var(--dsw-alias-label-primary,#1c1c1e);font-variant-numeric:tabular-nums}

  @media (prefers-reduced-motion:reduce){.cell,.cell.found{transition:none;animation:none}}

<div class="bs-wrap">
  <div class="bs-head">
    <div class="bs-title">二分查找 · 在有序数组中找 23</div>
    <div class="bs-target">目标 = 23</div>
  </div>

  <div class="bs-board" id="bs-board" role="img" aria-label="有序数组与当前搜索区间">
    <div id="bs-cells" style="display:contents"></div>
    <div class="bs-band" id="bs-band"></div>
  </div>

  <div class="bs-legend">
    <span><i style="border-color:#3b82f6;background:rgba(59,130,246,.25)"></i>low 左边界</span>
    <span><i style="border-color:#16a34a;background:rgba(34,197,94,.3)"></i>mid 中间位置</span>
    <span><i style="border-color:#f59e0b;background:rgba(245,158,11,.25)"></i>high 右边界</span>
    <span><i style="border-color:#a1a1aa;background:rgba(128,128,128,.18)"></i>已排除</span>
  </div>

  <div class="bs-stats">
    <div class="bs-stat"><div class="k">步骤</div><div class="v" id="bs-round">准备</div></div>
    <div class="bs-stat"><div class="k">low</div><div class="v" id="bs-low">0</div></div>
    <div class="bs-stat"><div class="k">mid 刚比较</div><div class="v" id="bs-mid">—</div></div>
    <div class="bs-stat"><div class="k">high</div><div class="v" id="bs-high">7</div></div>
    <div class="bs-stat"><div class="k">候选</div><div class="v" id="bs-size">8</div></div>
  </div>

  <div class="bs-excl" id="bs-excl"></div>
  <div class="bs-note" id="bs-note" aria-live="polite"></div>

  <div class="bs-controls">
    <button id="bs-next" type="button">下一步</button>
    <button id="bs-reset" type="button">重置</button>
    <span class="bs-hint" id="bs-hint"></span>
  </div>

  <div class="bs-logtitle">过程记录</div>
  <ol class="bs-log" id="bs-log"></ol>
</div>
<script>
(function () {
  var ARR = [2, 5, 8, 12, 16, 23, 38, 56];
  var TARGET = 23;
  var FRAMES = [
    {
      round: '准备', low: 0, high: 7, mid: null, alive: [0, 7], excluded: [], found: null,
      band: '[0, 7] · 8 个候选',
      note: '<b>目标 23</b>，数组已经升序排列。先看整个区间：low = 0，high = 7，共 8 个元素。点「下一步」开始第 1 轮。',
      log: null
    },
    {
      round: '第 1 轮', low: 4, high: 7, mid: 3, alive: [4, 7], excluded: [[0, 3]], found: null,
      band: '[4, 7] · 4 个候选',
      note: '取 mid = ⌊(0 + 7) / 2⌋ = <b>3</b>，a[3] = <b>12</b>。因为 12 &lt; 23，目标只可能在<b>右半边</b>：排除 [0, 3]（连 mid 一起排除），low 移到 <b>4</b>，候选从 8 个降到 4 个。',
      log: '第 1 轮：比较时 low=0, mid=3, high=7 → a[3]=12 &lt; 23，排除 [0, 3]，low ← 4'
    },
    {
      round: '第 2 轮', low: 4, high: 7, mid: 5, alive: [4, 7], excluded: [[0, 3]], found: 5,
      band: '命中下标 5 · 结束搜索',
      note: '取 mid = ⌊(4 + 7) / 2⌋ = <b>5</b>，a[5] = <b>23</b>。23 == 23 → <b>命中</b>，目标就在下标 5。总共只比较了 2 次；顺序查找最坏要看 8 次。',
      log: '第 2 轮：比较时 low=4, mid=5, high=7 → a[5]=23 == 23，命中下标 5 ✓'
    }
  ];

  var board = document.getElementById('bs-board');
  var cellsWrap = document.getElementById('bs-cells');
  var band = document.getElementById('bs-band');
  var nextBtn = document.getElementById('bs-next');
  var resetBtn = document.getElementById('bs-reset');
  var logEl = document.getElementById('bs-log');

  function el(id) { return document.getElementById(id); }

  var cellEls = ARR.map(function (v, k) {
    var d = document.createElement('div');
    d.className = 'cell';
    var idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = k;
    var val = document.createElement('span');
    val.className = 'val';
    val.textContent = v;
    var role = document.createElement('span');
    role.className = 'role';
    d.appendChild(idx);
    d.appendChild(val);
    d.appendChild(role);
    cellsWrap.appendChild(d);
    return { el: d, role: role };
  });

  var idx = 0;
  var last = FRAMES.length - 1;

  function render(i) {
    var f = FRAMES[i];

    cellEls.forEach(function (c, k) {
      var isOut = f.excluded.some(function (r) { return k >= r[0] && k <= r[1]; });
      var isMid = f.mid === k;
      var isFound = f.found === k;
      var isLow = f.low === k && !isOut;
      var isHigh = f.high === k && !isOut;

      var cls = 'cell';
      if (isLow) cls += ' low';
      if (isHigh) cls += ' high';
      if (isMid) cls += ' mid';
      if (isOut) cls += ' out';
      if (isFound) cls += ' found';
      c.el.className = cls;

      var text = '';
      var color = 'transparent';
      if (isFound) { text = '✓ 命中'; color = '#16a34a'; }
      else if (isMid && isOut) { text = 'mid→排除'; color = '#8e8e93'; }
      else if (isMid) { text = 'mid'; color = '#16a34a'; }
      else if (isOut) { text = '排除'; color = '#8e8e93'; }
      else if (isLow && isHigh) { text = 'low·high'; color = '#3b82f6'; }
      else if (isLow) { text = 'low'; color = '#3b82f6'; }
      else if (isHigh) { text = 'high'; color = '#d97706'; }

      c.role.textContent = text;
      c.role.style.color = color;
    });

    band.style.gridColumn = (f.alive[0] + 1) + ' / ' + (f.alive[1] + 2);
    band.textContent = f.band;

    el('bs-round').textContent = f.round;
    el('bs-low').textContent = f.low;
    el('bs-mid').textContent = (f.mid === null ? '—' : f.mid);
    el('bs-high').textContent = f.high;
    el('bs-size').textContent = f.alive[1] - f.alive[0] + 1;

    var chips = f.excluded.map(function (r) { return '<span class="chip">[' + r[0] + ', ' + r[1] + ']</span>'; });
    el('bs-excl').innerHTML = chips.length
      ? '本轮排除：' + chips.join('') + '（这些元素已不可能包含目标）'
      : '本轮排除：<span class="chip">无</span>';

    el('bs-note').innerHTML = f.note;

    var items = [];
    for (var k = 1; k <= i; k++) { if (FRAMES[k].log) items.push(FRAMES[k].log); }
    if (!items.length) { items.push('还没开始，点「下一步」走第 1 轮。'); }
    var logHtml = '';
    for (var m = 0; m < items.length; m++) {
      var done = (m === items.length - 1 && f.found !== null);
      logHtml += '<li class="' + (done ? 'done' : '') + '">' + items[m] + '</li>';
    }
    logEl.innerHTML = logHtml;

    nextBtn.disabled = (i === last);
    nextBtn.textContent = (i === last) ? '已完成 ✓' : '下一步';
    el('bs-hint').textContent = i === 0
      ? '共 2 轮比较'
      : '第 ' + i + ' / ' + last + ' 轮' + (i === last ? ' · 完成' : '');

    board.setAttribute('aria-label',
      '有序数组 ' + ARR.join(', ') + '，目标 ' + TARGET + '。' +
      (i === 0
        ? '搜索区间 [' + f.low + ', ' + f.high + ']。'
        : f.round + '：low=' + f.low + '，mid=' + f.mid + '，high=' + f.high +
          '，候选区间 [' + f.alive[0] + ', ' + f.alive[1] + ']。'));
  }

  nextBtn.addEventListener('click', function () {
    if (idx < last) { idx += 1; render(idx); }
  });
  resetBtn.addEventListener('click', function () {
    idx = 0;
    render(0);
  });

  render(0);
})();
</script></body></html>
