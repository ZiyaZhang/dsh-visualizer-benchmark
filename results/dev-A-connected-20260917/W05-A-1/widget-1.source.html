<style>
  .qty-wrap {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--dsw-alias-bg-layer-1, #ffffff);
    border: 1px solid var(--dsw-alias-border-l1, #e3e6ea);
    border-radius: 14px;
    padding: 18px 20px;
    max-width: 360px;
    color: var(--dsw-alias-label-primary, #1b1f24);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .qty-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--dsw-alias-label-secondary, #5b6470);
  }
  .qty-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .qty-btn {
    width: 46px;
    height: 46px;
    flex: 0 0 auto;
    border-radius: 10px;
    border: 1px solid var(--dsw-alias-border-l2, #cfd5db);
    background: var(--dsw-alias-bg-layer-2, #f4f6f8);
    color: var(--dsw-alias-label-primary, #1b1f24);
    font-size: 24px;
    line-height: 1;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease, transform .08s ease;
  }
  .qty-btn:not(:disabled):hover { background: var(--dsw-alias-interactive-bg-hover, #e9edf1); }
  .qty-btn:not(:disabled):active { transform: scale(.94); background: var(--dsw-alias-interactive-bg-active, #dde3e9); }
  .qty-btn:disabled {
    opacity: .35;
    cursor: not-allowed;
    color: var(--dsw-alias-label-tertiary, #98a1ab);
  }
  .qty-value {
    flex: 1 1 auto;
    min-width: 0;
    text-align: center;
    font-size: 34px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    padding: 2px 0;
  }
  .qty-scale {
    position: relative;
    height: 26px;
    display: flex;
    align-items: center;
  }
  .qty-track {
    position: relative;
    height: 6px;
    flex: 1 1 auto;
    border-radius: 999px;
    background: var(--dsw-alias-bg-layer-2, #eef1f4);
    border: 1px solid var(--dsw-alias-border-l1, #e3e6ea);
  }
  .qty-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 40%;
    border-radius: 999px;
    background: var(--dsw-alias-brand-primary, #3b6ef6);
    transition: width .18s ease;
  }
  .qty-ticks {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--dsw-alias-label-tertiary, #98a1ab);
    font-variant-numeric: tabular-nums;
    margin-top: 6px;
  }
  .qty-status {
    font-size: 12px;
    color: var(--dsw-alias-label-secondary, #5b6470);
    min-height: 16px;
  }
  @media (prefers-reduced-motion: reduce) {
    .qty-btn, .qty-fill { transition: none; }
  }
</style>

<div class="qty-wrap" role="group" aria-labelledby="qtyTitle">
  <span class="qty-label" id="qtyTitle">数量（0–5）</span>

  <div class="qty-row">
    <button class="qty-btn" id="qtyMinus" type="button" aria-label="减少 1">−</button>
    <div class="qty-value" id="qtyValue" role="status" aria-live="polite" aria-atomic="true">2</div>
    <button class="qty-btn" id="qtyPlus" type="button" aria-label="增加 1">+</button>
  </div>

  <div class="qty-scale">
    <div class="qty-track" aria-hidden="true"><div class="qty-fill" id="qtyFill"></div></div>
  </div>
  <div class="qty-ticks" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>

  <div class="qty-status" id="qtyStatus">点击 − / + 试试边界手感</div>
</div>

<script>
  (function () {
    var MIN = 0, MAX = 5;
    var value = 2;

    var valueEl = document.getElementById('qtyValue');
    var minusEl = document.getElementById('qtyMinus');
    var plusEl = document.getElementById('qtyPlus');
    var fillEl = document.getElementById('qtyFill');
    var statusEl = document.getElementById('qtyStatus');

    function render() {
      valueEl.textContent = String(value);
      minusEl.disabled = value <= MIN;
      plusEl.disabled = value >= MAX;
      fillEl.style.width = ((value - MIN) / (MAX - MIN)) * 100 + '%';

      if (value <= MIN) statusEl.textContent = '已到下限 0，− 已禁用';
      else if (value >= MAX) statusEl.textContent = '已到上限 5，+ 已禁用';
      else statusEl.textContent = '还可减 ' + (value - MIN) + ' 次、可加 ' + (MAX - value) + ' 次';
    }

    minusEl.addEventListener('click', function () {
      if (value > MIN) { value -= 1; render(); }
    });
    plusEl.addEventListener('click', function () {
      if (value < MAX) { value += 1; render(); }
    });

    render();
  })();
</script>
