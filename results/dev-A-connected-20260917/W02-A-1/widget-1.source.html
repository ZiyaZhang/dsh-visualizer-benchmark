<style>
  .hc-root{
    display:flex; flex-direction:column; gap:12px; max-width:580px;
    padding:14px; border:1px solid var(--dsw-alias-border-l1); border-radius:12px;
    background:var(--dsw-alias-bg-layer-1); color:var(--dsw-alias-label-primary);
    font-size:13px; line-height:1.45; font-variant-numeric:tabular-nums;
  }
  .hc-head{display:flex; gap:10px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;}
  .hc-title{font-size:14px; font-weight:600;}
  .hc-sub{font-size:11.5px; color:var(--dsw-alias-label-secondary); margin-top:2px; max-width:40em;}
  .hc-pill{
    flex:none; padding:4px 10px; border-radius:999px; font-size:11.5px;
    background:var(--dsw-alias-bg-layer-2); border:1px solid var(--dsw-alias-border-l1);
    color:var(--dsw-alias-label-secondary); white-space:nowrap;
  }
  .hc-pill b{color:var(--dsw-alias-label-primary); font-size:12.5px;}
  .hc-sec{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;
    font-size:10.5px; color:var(--dsw-alias-label-tertiary); margin-bottom:6px;}
  .hc-rod{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px;}
  .hc-cell{min-width:0;}
  .hc-swatch{height:26px; border-radius:6px; border:1px solid var(--dsw-alias-border-l1);
    transition:background-color .28s ease;}
  .hc-name{display:flex; align-items:center; gap:4px; margin-top:6px; min-width:0;
    font-size:10.5px; color:var(--dsw-alias-label-secondary);}
  .hc-badge{font-size:9px; padding:0 3px; border-radius:4px; white-space:nowrap;
    background:var(--dsw-alias-bg-layer-2); border:1px solid var(--dsw-alias-border-l1);
    color:var(--dsw-alias-label-tertiary);}
  .hc-val{font-size:13.5px; font-weight:600; margin-top:1px;}
  .hc-delta{font-size:10.5px; color:var(--dsw-alias-label-tertiary);}
  .hc-bar{height:8px; border-radius:999px; border:1px solid var(--dsw-alias-border-l1); margin-top:8px;}
  .hc-barlab{display:flex; justify-content:space-between; font-size:10px;
    color:var(--dsw-alias-label-tertiary); margin-top:3px;}
  .hc-chart{display:block; width:100%; height:auto;}
  .hc-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:10.5px;
    color:var(--dsw-alias-label-secondary); margin-top:4px;}
  .hc-legend span{display:inline-flex; align-items:center; gap:5px;}
  .hc-controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    border-top:1px solid var(--dsw-alias-border-l1); padding-top:11px;}
  .hc-btn{padding:6px 15px; border-radius:8px; font-size:13px; cursor:pointer;
    border:1px solid var(--dsw-alias-border-l2); background:var(--dsw-alias-bg-layer-2);
    color:var(--dsw-alias-label-primary); font-family:inherit;}
  .hc-btn:hover{background:var(--dsw-alias-interactive-bg-hover);}
  .hc-btn-primary{background:var(--dsw-alias-button-primary-fill); border-color:transparent;
    color:var(--dsw-alias-label-primary-inverted); font-weight:600;}
  .hc-hint{font-size:11px; color:var(--dsw-alias-label-secondary); min-width:0;}
  @media (prefers-reduced-motion: reduce){ .hc-swatch{transition:none;} }
</style>

<div class="hc-root">
  <div class="hc-head">
    <div>
      <div class="hc-title">离散热传导 · 一根杆 5 个节点</div>
      <div class="hc-sub">两端固定 100&nbsp;°C / 0&nbsp;°C，中间 3 个节点初始 0&nbsp;°C。每步用<strong>上一时刻</strong>的温度同步更新全部节点，扩散系数 α&nbsp;=&nbsp;0.25。</div>
    </div>
    <div class="hc-pill">步数 n = <b id="hcN">0</b></div>
  </div>

  <div>
    <div class="hc-sec"><span>各节点温度（°C）</span><span>小字 Δ = 本步 − 上一时刻</span></div>
    <div class="hc-rod" id="hcRod" role="group" aria-label="5 个节点的温度色块与读数"></div>
    <div class="hc-bar" id="hcBar"></div>
    <div class="hc-barlab"><span>0 °C</span><span>色标（示意）</span><span>100 °C</span></div>
  </div>

  <div>
    <div class="hc-sec"><span>温度分布（节点 1 → 5）</span><span id="hcChartNote">第 0 步 · 初始</span></div>
    <svg class="hc-chart" id="hcChart" viewBox="0 0 360 180" role="img" aria-label="节点温度分布曲线"></svg>
    <div class="hc-legend">
      <span><svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="var(--dsw-alias-brand-primary)" stroke-width="2"/></svg>当前一步</span>
      <span><svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="var(--dsw-alias-label-tertiary)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>上一时刻</span>
    </div>
  </div>

  <div class="hc-controls">
    <button type="button" class="hc-btn hc-btn-primary" id="hcStep">单步</button>
    <button type="button" class="hc-btn" id="hcReset">重置</button>
    <span class="hc-hint" id="hcHint" role="status" aria-live="polite">初始状态：T2 = T3 = T4 = 0 °C</span>
  </div>
</div>

<script>
(function(){
  var N = 5, ALPHA = 0.25, FIXED = {0:100, 4:0};
  var rod = document.getElementById('hcRod');
  var nEl = document.getElementById('hcN');
  var hint = document.getElementById('hcHint');
  var chart = document.getElementById('hcChart');
  var note = document.getElementById('hcChartNote');
  var bar = document.getElementById('hcBar');
  var btnStep = document.getElementById('hcStep');
  var btnReset = document.getElementById('hcReset');

  var STOPS = [[47,111,178],[232,163,61],[214,69,60]];
  function heatColor(f){
    f = Math.max(0, Math.min(1, f));
    var seg = f < 0.5 ? 0 : 1;
    var u = f < 0.5 ? f/0.5 : (f-0.5)/0.5;
    var a = STOPS[seg], b = STOPS[seg+1], c = [];
    for (var k=0;k<3;k++){ c.push(Math.round(a[k] + (b[k]-a[k])*u)); }
    return 'rgb(' + c.join(',') + ')';
  }
  function fmt(v){ return v.toFixed(2); }

  // ---- build rod cells once ----
  var cells = [];
  for (var i=0;i<N;i++){
    var cell = document.createElement('div'); cell.className = 'hc-cell';
    var sw = document.createElement('div'); sw.className = 'hc-swatch';
    var name = document.createElement('div'); name.className = 'hc-name';
    var nm = document.createElement('span'); nm.textContent = 'T' + (i+1);
    name.appendChild(nm);
    if (FIXED[i] !== undefined){
      var bd = document.createElement('span'); bd.className = 'hc-badge'; bd.textContent = '固定';
      name.appendChild(bd);
    }
    var val = document.createElement('div'); val.className = 'hc-val';
    var dl = document.createElement('div'); dl.className = 'hc-delta';
    cell.appendChild(sw); cell.appendChild(name); cell.appendChild(val); cell.appendChild(dl);
    rod.appendChild(cell);
    cells.push({sw:sw, val:val, dl:dl});
  }
  bar.style.background = 'linear-gradient(90deg,' + heatColor(0) + ',' + heatColor(0.5) + ',' + heatColor(1) + ')';

  // ---- chart ----
  function chartSVG(cur, prevT){
    var W=360, H=180, L=36, R=12, TP=12, B=36;
    var pw = W-L-R, ph = H-TP-B;
    function X(i){ return L + i/(N-1)*pw; }
    function Y(t){ return TP + (1 - Math.max(0, Math.min(100,t))/100)*ph; }
    function pts(arr){ return arr.map(function(t,i){ return X(i).toFixed(1) + ',' + Y(t).toFixed(1); }).join(' '); }
    var s = '';
    [0,25,50,75,100].forEach(function(g){
      s += '<line x1="'+L+'" y1="'+Y(g).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(g).toFixed(1)+
           '" stroke="var(--dsw-alias-border-l1)" stroke-width="1"'+(g===0?'':' stroke-dasharray="2 3"')+'/>';
      s += '<text x="'+(L-6)+'" y="'+(Y(g)+3.4).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--dsw-alias-label-tertiary)">'+g+'</text>';
    });
    for (var i=0;i<N;i++){
      s += '<text x="'+X(i).toFixed(1)+'" y="160" text-anchor="middle" font-size="9.5" fill="var(--dsw-alias-label-secondary)">T'+(i+1)+'</text>';
      if (FIXED[i] !== undefined){
        s += '<text x="'+X(i).toFixed(1)+'" y="172" text-anchor="middle" font-size="9" fill="var(--dsw-alias-label-tertiary)">固定</text>';
      }
    }
    if (prevT){
      s += '<polyline points="'+pts(prevT)+'" fill="none" stroke="var(--dsw-alias-label-tertiary)" stroke-width="1.5" stroke-dasharray="4 3"/>';
    }
    s += '<polyline points="'+pts(cur)+'" fill="none" stroke="var(--dsw-alias-brand-primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    for (var j=0;j<N;j++){
      s += '<circle cx="'+X(j).toFixed(1)+'" cy="'+Y(cur[j]).toFixed(1)+'" r="'+(FIXED[j]!==undefined?3.2:3.9)+
           '" fill="'+heatColor(cur[j]/100)+'" stroke="var(--dsw-alias-bg-layer-1)" stroke-width="1.5"/>';
    }
    return s;
  }

  // ---- state ----
  function initial(){ var a = []; for (var i=0;i<N;i++){ a.push(FIXED[i] !== undefined ? FIXED[i] : 0); } return a; }
  var T = initial(), prev = null, n = 0;

  function render(){
    for (var i=0;i<N;i++){
      var c = cells[i], t = T[i];
      c.sw.style.background = heatColor(t/100);
      c.val.textContent = fmt(t);
      if (prev){                                  // at n >= 1 prev is a real array
        var d = t - prev[i];
        c.dl.textContent = (Math.abs(d) < 0.005) ? '0.00' : (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2);
      } else {
        c.dl.textContent = '—';                   // no previous value yet
      }
    }
    nEl.textContent = n;
    chart.innerHTML = chartSVG(T, prev);
    chart.setAttribute('aria-label', '节点温度分布：' + T.map(function(t,i){ return 'T'+(i+1)+' '+fmt(t)+' 摄氏度'; }).join('，'));
    note.textContent = '第 ' + n + ' 步' + (n === 0 ? ' · 初始' : '');
  }

  function maxChange(next){ var m = 0; for (var i=0;i<N;i++){ m = Math.max(m, Math.abs(next[i]-T[i])); } return m; }

  btnStep.addEventListener('click', function(){
    var next = T.slice();
    for (var i=1;i<N-1;i++){                       // read only from old T → synchronous update
      next[i] = T[i] + ALPHA*(T[i-1] - 2*T[i] + T[i+1]);
    }
    var ch = maxChange(next);
    prev = T.slice();
    T = next;
    n++;
    render();
    hint.textContent = ch < 1e-3
      ? '已基本达到稳定分布（T2/T3/T4 ≈ 75 / 50 / 25 °C）'
      : '已同步更新到第 ' + n + ' 步，最大变化 ' + ch.toFixed(3) + ' °C';
  });

  btnReset.addEventListener('click', function(){
    T = initial(); prev = null; n = 0; render();
    hint.textContent = '已重置：T2 = T3 = T4 = 0 °C';
  });

  render();
})();
</script>
