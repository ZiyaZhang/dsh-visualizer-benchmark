<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .hc-root{

    padding:14px; border:1px solid var(--dsw-alias-border-l1); border-radius:12px;
    background:var(--dsw-alias-bg-layer-1); color:var(--dsw-alias-label-primary);

  }

</style>

<div class="hc-root">
  <div class="hc-head">
    <div>
      <div class="hc-title">离散热传导 · 一根杆 5 个节点</div>
      <div class="hc-sub">两端固定 100&nbsp;°C / 0&nbsp;°C，中间 3 个节点初始 0&nbsp;°C。每步用<strong>上一时刻</strong>的温度同步更新全部节点，扩散系数 α&nbsp;=&nbsp;0.25。</div>
    </div>
    <div class="hc-pill">步数 n = <b id="hcN">0</b></div>
  </div>

  <div>
    <div class="hc-sec"><span>各节点温度（°C）</span><span>小字 Δ = 本步 − 上一时刻</span></div>
    <div class="hc-rod" id="hcRod" role="group" aria-label="5 个节点的温度色块与读数"></div>
    <div class="hc-bar" id="hcBar"></div>
    <div class="hc-barlab"><span>0 °C</span><span>色标（示意）</span><span>100 °C</span></div>
  </div>

  <div>
    <div class="hc-sec"><span>温度分布（节点 1 → 5）</span><span id="hcChartNote">第 0 步 · 初始</span></div>
    <svg class="hc-chart" id="hcChart" viewBox="0 0 360 180" role="img" aria-label="节点温度分布曲线"></svg>
    <div class="hc-legend">
      <span><svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="var(--dsw-alias-brand-primary)" stroke-width="2"/></svg>当前一步</span>
      <span><svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="var(--dsw-alias-label-tertiary)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>上一时刻</span>
    </div>
  </div>

  <div class="hc-controls">
    <button type="button" class="hc-btn hc-btn-primary" id="hcStep">单步</button>
    <button type="button" class="hc-btn" id="hcReset">重置</button>
    <span class="hc-hint" id="hcHint" role="status" aria-live="polite">初始状态：T2 = T3 = T4 = 0 °C</span>
  </div>
</div>

<script>
(function(){
  var N = 5, ALPHA = 0.25, FIXED = {0:100, 4:0};
  var rod = document.getElementById('hcRod');
  var nEl = document.getElementById('hcN');
  var hint = document.getElementById('hcHint');
  var chart = document.getElementById('hcChart');
  var note = document.getElementById('hcChartNote');
  var bar = document.getElementById('hcBar');
  var btnStep = document.getElementById('hcStep');
  var btnReset = document.getElementById('hcReset');

  var STOPS = [[47,111,178],[232,163,61],[214,69,60]];
  function heatColor(f){
    f = Math.max(0, Math.min(1, f));
    var seg = f < 0.5 ? 0 : 1;
    var u = f < 0.5 ? f/0.5 : (f-0.5)/0.5;
    var a = STOPS[seg], b = STOPS[seg+1], c = [];
    for (var k=0;k<3;k++){ c.push(Math.round(a[k] + (b[k]-a[k])*u)); }
    return 'rgb(' + c.join(',') + ')';
  }
  function fmt(v){ return v.toFixed(2); }

  // ---- build rod cells once ----
  var cells = [];
  for (var i=0;i<N;i++){
    var cell = document.createElement('div'); cell.className = 'hc-cell';
    var sw = document.createElement('div'); sw.className = 'hc-swatch';
    var name = document.createElement('div'); name.className = 'hc-name';
    var nm = document.createElement('span'); nm.textContent = 'T' + (i+1);
    name.appendChild(nm);
    if (FIXED[i] !== undefined){
      var bd = document.createElement('span'); bd.className = 'hc-badge'; bd.textContent = '固定';
      name.appendChild(bd);
    }
    var val = document.createElement('div'); val.className = 'hc-val';
    var dl = document.createElement('div'); dl.className = 'hc-delta';
    cell.appendChild(sw); cell.appendChild(name); cell.appendChild(val); cell.appendChild(dl);
    rod.appendChild(cell);
    cells.push({sw:sw, val:val, dl:dl});
  }
  bar.style.background = 'linear-gradient(90deg,' + heatColor(0) + ',' + heatColor(0.5) + ',' + heatColor(1) + ')';

  // ---- chart ----
  function chartSVG(cur, prevT){
    var W=360, H=180, L=36, R=12, TP=12, B=36;
    var pw = W-L-R, ph = H-TP-B;
    function X(i){ return L + i/(N-1)*pw; }
    function Y(t){ return TP + (1 - Math.max(0, Math.min(100,t))/100)*ph; }
    function pts(arr){ return arr.map(function(t,i){ return X(i).toFixed(1) + ',' + Y(t).toFixed(1); }).join(' '); }
    var s = '';
    [0,25,50,75,100].forEach(function(g){
      s += '<line x1="'+L+'" y1="'+Y(g).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(g).toFixed(1)+
           '" stroke="var(--dsw-alias-border-l1)" stroke-width="1"'+(g===0?'':' stroke-dasharray="2 3"')+'/>';
      s += '<text x="'+(L-6)+'" y="'+(Y(g)+3.4).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--dsw-alias-label-tertiary)">'+g+'</text>';
    });
    for (var i=0;i<N;i++){
      s += '<text x="'+X(i).toFixed(1)+'" y="160" text-anchor="middle" font-size="9.5" fill="var(--dsw-alias-label-secondary)">T'+(i+1)+'</text>';
      if (FIXED[i] !== undefined){
        s += '<text x="'+X(i).toFixed(1)+'" y="172" text-anchor="middle" font-size="9" fill="var(--dsw-alias-label-tertiary)">固定</text>';
      }
    }
    if (prevT){
      s += '<polyline points="'+pts(prevT)+'" fill="none" stroke="var(--dsw-alias-label-tertiary)" stroke-width="1.5" stroke-dasharray="4 3"/>';
    }
    s += '<polyline points="'+pts(cur)+'" fill="none" stroke="var(--dsw-alias-brand-primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    for (var j=0;j<N;j++){
      s += '<circle cx="'+X(j).toFixed(1)+'" cy="'+Y(cur[j]).toFixed(1)+'" r="'+(FIXED[j]!==undefined?3.2:3.9)+
           '" fill="'+heatColor(cur[j]/100)+'" stroke="var(--dsw-alias-bg-layer-1)" stroke-width="1.5"/>';
    }
    return s;
  }

  // ---- state ----
  function initial(){ var a = []; for (var i=0;i<N;i++){ a.push(FIXED[i] !== undefined ? FIXED[i] : 0); } return a; }
  var T = initial(), prev = null, n = 0;

  function render(){
    for (var i=0;i<N;i++){
      var c = cells[i], t = T[i];
      c.sw.style.background = heatColor(t/100);
      c.val.textContent = fmt(t);
      if (prev){                                  // at n >= 1 prev is a real array
        var d = t - prev[i];
        c.dl.textContent = (Math.abs(d) < 0.005) ? '0.00' : (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2);
      } else {
        c.dl.textContent = '—';                   // no previous value yet
      }
    }
    nEl.textContent = n;
    chart.innerHTML = chartSVG(T, prev);
    chart.setAttribute('aria-label', '节点温度分布：' + T.map(function(t,i){ return 'T'+(i+1)+' '+fmt(t)+' 摄氏度'; }).join('，'));
    note.textContent = '第 ' + n + ' 步' + (n === 0 ? ' · 初始' : '');
  }

  function maxChange(next){ var m = 0; for (var i=0;i<N;i++){ m = Math.max(m, Math.abs(next[i]-T[i])); } return m; }

  btnStep.addEventListener('click', function(){
    var next = T.slice();
    for (var i=1;i<N-1;i++){                       // read only from old T → synchronous update
      next[i] = T[i] + ALPHA*(T[i-1] - 2*T[i] + T[i+1]);
    }
    var ch = maxChange(next);
    prev = T.slice();
    T = next;
    n++;
    render();
    hint.textContent = ch < 1e-3
      ? '已基本达到稳定分布（T2/T3/T4 ≈ 75 / 50 / 25 °C）'
      : '已同步更新到第 ' + n + ' 步，最大变化 ' + ch.toFixed(3) + ' °C';
  });

  btnReset.addEventListener('click', function(){
    T = initial(); prev = null; n = 0; render();
    hint.textContent = '已重置：T2 = T3 = T4 = 0 °C';
  });

  render();
})();
</script></body></html>
