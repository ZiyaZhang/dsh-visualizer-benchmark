<style>
  .rs-wrap{box-sizing:border-box;width:100%;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);border:1px solid var(--dsw-alias-border-l1);border-radius:12px;padding:14px;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .rs-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .rs-title{font-size:15px;font-weight:600;color:var(--dsw-alias-label-primary)}
  .rs-sub{font-size:12px;color:var(--dsw-alias-label-tertiary)}
  .rs-hint{font-size:12.5px;color:var(--dsw-alias-label-secondary);margin:0 0 8px}
  .rs-svg{width:100%;height:auto;display:block}
  .rs-row{cursor:pointer;outline:none}
  .rs-bg{fill:var(--dsw-alias-bg-layer-2)}
  .rs-row:hover .rs-bg{fill:var(--dsw-alias-interactive-bg-hover)}
  .rs-row.is-sel .rs-bg{fill:var(--dsw-alias-interactive-bg-active);stroke:var(--dsw-alias-brand-primary);stroke-width:2}
  .rs-row:focus-visible .rs-bg{stroke:var(--dsw-alias-brand-primary);stroke-width:2;stroke-dasharray:4 3}
  .rs-bar{fill:var(--dsw-alias-brand-primary)}
  .rs-row:not(.is-sel) .rs-bar{opacity:.42}
  .rs-name{font-size:14px;font-weight:600;fill:var(--dsw-alias-label-primary);pointer-events:none}
  .rs-val{font-size:14px;font-weight:600;fill:var(--dsw-alias-label-primary);font-variant-numeric:tabular-nums;pointer-events:none}
  .rs-sel{font-size:13px;font-weight:700;fill:var(--dsw-alias-brand-primary);pointer-events:none}
  .rs-trail{margin-top:12px;border-top:1px solid var(--dsw-alias-border-l1);padding-top:10px}
  .rs-tlabel{font-size:12px;color:var(--dsw-alias-label-tertiary);margin-bottom:3px}
  .rs-tval{font-size:13.5px;color:var(--dsw-alias-label-primary);font-variant-numeric:tabular-nums;min-height:21px}
  .rs-tval .rs-big{font-weight:700}
  .rs-dash{color:var(--dsw-alias-label-tertiary)}
  .rs-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  button.rs-explain{font:inherit;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid transparent;background:var(--dsw-alias-button-primary-fill);color:var(--dsw-alias-label-primary-inverted);cursor:pointer}
  button.rs-explain:hover:not(:disabled){opacity:.9}
  button.rs-explain:disabled{opacity:.45;cursor:not-allowed}
  .rs-note{font-size:12px;color:var(--dsw-alias-label-tertiary)}
  @media (max-width:520px){.rs-sub{display:none}}
</style>
<div class="rs-wrap">
  <div class="rs-head">
    <div class="rs-title">地区销售对比 · 单位：万元</div>
    <div class="rs-sub">合计 250.0 万元（华东 48.0% · 华南 32.0% · 西部 20.0%）</div>
  </div>
  <p class="rs-hint">点击条形 = 只在本页选中，不会向你追问；选中后按下方按钮才发起追问。</p>

  <svg class="rs-svg" viewBox="0 0 700 260" role="img" aria-label="地区销售条形图：华东 120 万元，华南 80 万元，西部 50 万元；点击可本地选中">
    <rect class="rs-bg" data-key="华东" x="82" y="26"  width="588" height="48" rx="8" tabindex="0" role="button" aria-label="华东，120 万元，点击选中"></rect>
    <rect class="rs-bar" data-key="华东" x="82" y="26" width="470.4" height="48" rx="8"></rect>
    <text class="rs-name" x="0" y="55">华东</text>
    <text class="rs-val" x="562.4" y="55">120.0</text>
    <text class="rs-sel" data-sel="华东" x="651" y="55" visibility="hidden">✓</text>

    <rect class="rs-bg" data-key="华南" x="82" y="106" width="588" height="48" rx="8" tabindex="0" role="button" aria-label="华南，80 万元，点击选中"></rect>
    <rect class="rs-bar" data-key="华南" x="82" y="106" width="313.6" height="48" rx="8"></rect>
    <text class="rs-name" x="0" y="135">华南</text>
    <text class="rs-val" x="405.6" y="135">80.0</text>
    <text class="rs-sel" data-sel="华南" x="651" y="135" visibility="hidden">✓</text>

    <rect class="rs-bg" data-key="西部" x="82" y="186" width="588" height="48" rx="8" tabindex="0" role="button" aria-label="西部，50 万元，点击选中"></rect>
    <rect class="rs-bar" data-key="西部" x="82" y="186" width="196" height="48" rx="8"></rect>
    <text class="rs-name" x="0" y="215">西部</text>
    <text class="rs-val" x="288" y="215">50.0</text>
    <text class="rs-sel" data-sel="西部" x="651" y="215" visibility="hidden">✓</text>
  </svg>

  <div class="rs-trail">
    <div class="rs-tlabel">当前选中（仅本地）</div>
    <div class="rs-tval" id="rsSel" aria-live="polite"><span class="rs-dash">未选中</span></div>
    <div class="rs-actions">
      <button type="button" class="rs-explain" id="rsBtn" disabled>解释所选地区</button>
      <span class="rs-note" id="rsNote">请先在上图中点击一个地区。</span>
    </div>
  </div>
</div>
<script>
(function () {
  var DATA = { "华东": 120, "华南": 80, "西部": 50 };
  var selName = null;
  var selEl = document.getElementById("rsSel");
  var btn = document.getElementById("rsBtn");
  var note = document.getElementById("rsNote");
  var rows = Array.prototype.slice.call(document.querySelectorAll(".rs-row, .rs-bg"));
  var boxes = Array.prototype.slice.call(document.querySelectorAll(".rs-bg"));

  function fmt(v) { return Number(v).toFixed(1); }

  function barRect(name) {
    var b = boxes.filter(function (r) { return r.getAttribute("data-key") === name; })[0];
    return b ? { w: parseFloat(b.getAttribute("width")), y: parseFloat(b.getAttribute("y")) } : null;
  }

  function render() {
    boxes.forEach(function (b) {
      var name = b.getAttribute("data-key");
      var on = name === selName;
      var row = b.parentNode;
      if (row && row.classList) row.classList.toggle("is-sel", on);
      var tick = document.querySelector('.rs-sel[data-sel="' + name + '"]');
      if (tick) tick.setAttribute("visibility", on ? "visible" : "hidden");
    });
    if (selName === null) {
      selEl.innerHTML = '<span class="rs-dash">未选中</span>';
      btn.disabled = true;
      note.textContent = "请先在上图中点击一个地区。";
      return;
    }
    var v = DATA[selName];
    var pct = (v / 250 * 100).toFixed(1);
    selEl.innerHTML = "已选：<span class=\"rs-big\">" + selName + "</span> · " + fmt(v) + " 万元（占合计 " + pct + "%）";
    btn.disabled = false;
    note.textContent = "选中仅本地生效；点按钮才把该地区与数值发给你。";
  }

  function select(name) {
    if (!(name in DATA)) return;
    selName = name;
    render();
  }

  function msgFor() {
    var v = DATA[selName];
    return "请解释所选地区 " + selName + " 的销售额 " + fmt(v) + " 万元：可能的构成、同比或对标因素，以及可核实的判断要点。";
  }

  boxes.forEach(function (b) {
    var name = b.getAttribute("data-key");
    b.addEventListener("click", function () { select(name); });
    b.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        select(name);
      }
    });
  });

  btn.addEventListener("click", function () {
    if (selName === null) return;
    var text = msgFor();
    if (window.dshWidget && typeof window.dshWidget.sendPrompt === "function") {
      window.dshWidget.sendPrompt(text);
      note.textContent = "已发送追问，等待回复。";
    } else {
      note.textContent = "追问内容：" + text;
    }
  });

  render();
})();
</script>
