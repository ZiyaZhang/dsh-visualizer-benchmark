<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}

:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .rs-wrap{box-sizing:border-box;width:100%;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);border:1px solid var(--dsw-alias-border-l1);border-radius:12px;padding:14px;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .rs-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}

  .rs-svg{width:100%;height:auto;display:block}

  .rs-row.is-sel .rs-bg{fill:var(--dsw-alias-interactive-bg-active);stroke:var(--dsw-alias-brand-primary);stroke-width:2}
  .rs-row:focus-visible .rs-bg{stroke:var(--dsw-alias-brand-primary);stroke-width:2;stroke-dasharray:4 3}
  .rs-bar{fill:var(--dsw-alias-brand-primary)}

  button.rs-explain:hover:not(:disabled){opacity:.9}

</style>
<div class="rs-wrap">
  <div class="rs-head">
    <div class="rs-title">地区销售对比 · 单位：万元</div>
    <div class="rs-sub">合计 250.0 万元（华东 48.0% · 华南 32.0% · 西部 20.0%）</div>
  </div>
  <p class="rs-hint">点击条形 = 只在本页选中，不会向你追问；选中后按下方按钮才发起追问。</p>

  <svg class="rs-svg" viewBox="0 0 700 260" role="img" aria-label="地区销售条形图：华东 120 万元，华南 80 万元，西部 50 万元；点击可本地选中">
    <rect class="rs-bg" data-key="华东" x="82" y="26"  width="588" height="48" rx="8" tabindex="0" role="button" aria-label="华东，120 万元，点击选中"></rect>
    <rect class="rs-bar" data-key="华东" x="82" y="26" width="470.4" height="48" rx="8"></rect>
    <text class="rs-name" x="0" y="55">华东</text>
    <text class="rs-val" x="562.4" y="55">120.0</text>
    <text class="rs-sel" data-sel="华东" x="651" y="55" visibility="hidden">✓</text>

    <rect class="rs-bg" data-key="华南" x="82" y="106" width="588" height="48" rx="8" tabindex="0" role="button" aria-label="华南，80 万元，点击选中"></rect>
    <rect class="rs-bar" data-key="华南" x="82" y="106" width="313.6" height="48" rx="8"></rect>
    <text class="rs-name" x="0" y="135">华南</text>
    <text class="rs-val" x="405.6" y="135">80.0</text>
    <text class="rs-sel" data-sel="华南" x="651" y="135" visibility="hidden">✓</text>

    <rect class="rs-bg" data-key="西部" x="82" y="186" width="588" height="48" rx="8" tabindex="0" role="button" aria-label="西部，50 万元，点击选中"></rect>
    <rect class="rs-bar" data-key="西部" x="82" y="186" width="196" height="48" rx="8"></rect>
    <text class="rs-name" x="0" y="215">西部</text>
    <text class="rs-val" x="288" y="215">50.0</text>
    <text class="rs-sel" data-sel="西部" x="651" y="215" visibility="hidden">✓</text>
  </svg>

  <div class="rs-trail">
    <div class="rs-tlabel">当前选中（仅本地）</div>
    <div class="rs-tval" id="rsSel" aria-live="polite"><span class="rs-dash">未选中</span></div>
    <div class="rs-actions">
      <button type="button" class="rs-explain" id="rsBtn" disabled>解释所选地区</button>
      <span class="rs-note" id="rsNote">请先在上图中点击一个地区。</span>
    </div>
  </div>
</div>
<script>
(function () {
  var DATA = { "华东": 120, "华南": 80, "西部": 50 };
  var selName = null;
  var selEl = document.getElementById("rsSel");
  var btn = document.getElementById("rsBtn");
  var note = document.getElementById("rsNote");
  var rows = Array.prototype.slice.call(document.querySelectorAll(".rs-row, .rs-bg"));
  var boxes = Array.prototype.slice.call(document.querySelectorAll(".rs-bg"));

  function fmt(v) { return Number(v).toFixed(1); }

  function barRect(name) {
    var b = boxes.filter(function (r) { return r.getAttribute("data-key") === name; })[0];
    return b ? { w: parseFloat(b.getAttribute("width")), y: parseFloat(b.getAttribute("y")) } : null;
  }

  function render() {
    boxes.forEach(function (b) {
      var name = b.getAttribute("data-key");
      var on = name === selName;
      var row = b.parentNode;
      if (row && row.classList) row.classList.toggle("is-sel", on);
      var tick = document.querySelector('.rs-sel[data-sel="' + name + '"]');
      if (tick) tick.setAttribute("visibility", on ? "visible" : "hidden");
    });
    if (selName === null) {
      selEl.innerHTML = '<span class="rs-dash">未选中</span>';
      btn.disabled = true;
      note.textContent = "请先在上图中点击一个地区。";
      return;
    }
    var v = DATA[selName];
    var pct = (v / 250 * 100).toFixed(1);
    selEl.innerHTML = "已选：<span class=\"rs-big\">" + selName + "</span> · " + fmt(v) + " 万元（占合计 " + pct + "%）";
    btn.disabled = false;
    note.textContent = "选中仅本地生效；点按钮才把该地区与数值发给你。";
  }

  function select(name) {
    if (!(name in DATA)) return;
    selName = name;
    render();
  }

  function msgFor() {
    var v = DATA[selName];
    return "请解释所选地区 " + selName + " 的销售额 " + fmt(v) + " 万元：可能的构成、同比或对标因素，以及可核实的判断要点。";
  }

  boxes.forEach(function (b) {
    var name = b.getAttribute("data-key");
    b.addEventListener("click", function () { select(name); });
    b.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        select(name);
      }
    });
  });

  btn.addEventListener("click", function () {
    if (selName === null) return;
    var text = msgFor();
    if (window.dshWidget && typeof window.dshWidget.sendPrompt === "function") {
      window.dshWidget.sendPrompt(text);
      note.textContent = "已发送追问，等待回复。";
    } else {
      note.textContent = "追问内容：" + text;
    }
  });

  render();
})();
</script></body></html>
