<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><div class="tcp-widget">
  <style>
    .tcp-widget {
      --syn-c: var(--dsw-alias-brand-primary, #4c7cf0);
      --synack-c: #8b5cf6;
      --ack-c: #0d9488;
      --node-fill: var(--dsw-alias-bg-layer-2, #f4f6fa);
      --ink: var(--dsw-alias-label-primary, #1c2030);
      --ink-2: var(--dsw-alias-label-secondary, #565d73);
      --ink-3: var(--dsw-alias-label-tertiary, #8a90a4);
      --line: var(--dsw-alias-border-l1, #dfe3ec);
      --line-2: var(--dsw-alias-border-l2, #c9cfdd);
      --layer: var(--dsw-alias-bg-layer-1, #fff);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
    }
    .tcp-widget *, .tcp-widget *::before, .tcp-widget *::after { box-sizing: border-box; }
    .tcp-widget .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--layer);
      overflow: hidden;
    }
    .tcp-widget svg.seq { display: block; width: 100%; height: auto; }
    .tcp-widget .stage-note { font-size: 13px; fill: var(--ink-3); }
    .tcp-widget .stage-title { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .tcp-widget .node-label { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .tcp-widget .node-state { font-size: 11px; font-weight: 600; fill: var(--ink-3); font-family: var(--mono); }
    .tcp-widget .node.is-up .node-box { stroke: var(--ack-c); }
    .tcp-widget .node.is-up .node-state { fill: var(--ack-c); }
    .tcp-widget .lane { stroke: var(--line); stroke-dasharray: 3 4; }
    .tcp-widget .msg { opacity: .16; transition: opacity .25s ease; }
    .tcp-widget .msg .msg-label { font-size: 11.5px; font-weight: 600; }
    .tcp-widget .msg[data-msg="syn"] .msg-label { fill: var(--syn-c); }
    .tcp-widget .msg[data-msg="synack"] .msg-label { fill: var(--synack-c); }
    .tcp-widget .msg[data-msg="ack"] .msg-label { fill: var(--ack-c); }
    .tcp-widget .msg.is-active { opacity: 1; }
    .tcp-widget .msg.is-active .msg-line { animation: tcpDash 1.1s linear infinite; }
    @keyframes tcpDash { to { stroke-dashoffset: -20; } }
    @media (prefers-reduced-motion: reduce) {
      .tcp-widget .msg.is-active .msg-line { animation: none; }
    }
    .tcp-widget .states {
      display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--layer) 82%, var(--node-fill));
    }
    .tcp-widget .state-pair { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .tcp-widget .state-host { color: var(--ink-2); font-size: 12.5px; }
    .tcp-widget .state-chip {
      font-family: var(--mono); font-size: 12px; font-weight: 600;
      padding: 2px 9px; border-radius: 999px;
      border: 1px solid var(--line-2); background: var(--layer); color: var(--ink-2);
      white-space: nowrap;
    }
    .tcp-widget .state-chip.is-established { border-color: var(--ack-c); color: var(--ack-c); }
    .tcp-widget #stateHint { margin-left: auto; color: var(--ink-3); font-size: 12.5px; }
    .tcp-widget .steps {
      display: grid; gap: 6px; padding: 12px 14px 4px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .tcp-widget .step {
      appearance: none; text-align: left; cursor: pointer;
      border: 1px solid var(--line); border-radius: 9px;
      background: var(--layer); color: var(--ink-2);
      padding: 7px 9px; font: inherit; font-size: 12.5px;
      display: flex; flex-direction: column; gap: 2px; min-width: 0;
      transition: background .2s ease, border-color .2s ease, color .2s ease;
    }
    .tcp-widget .step:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(76,124,240,.08)); }
    .tcp-widget .step:focus-visible { outline: 2px solid var(--syn-c); outline-offset: 2px; }
    .tcp-widget .step .n { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
    .tcp-widget .step .t { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
    .tcp-widget .step.is-active { border-color: var(--syn-c); background: color-mix(in srgb, var(--syn-c) 12%, var(--layer)); }
    .tcp-widget .step.is-active .n { color: var(--syn-c); }
    .tcp-widget .detail { padding: 10px 14px 12px; }
    .tcp-widget .detail-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .tcp-widget .detail-head h4 { margin: 0; font-size: 14px; }
    .tcp-widget .step-tag {
      font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border-radius: 6px;
      border: 1px solid var(--line-2); color: var(--ink-2); background: var(--node-fill);
    }
    .tcp-widget .step-tag.is-syn { border-color: var(--syn-c); color: var(--syn-c); }
    .tcp-widget .step-tag.is-synack { border-color: var(--synack-c); color: var(--synack-c); }
    .tcp-widget .step-tag.is-ack { border-color: var(--ack-c); color: var(--ack-c); }
    .tcp-widget .detail p { margin: 6px 0 0; color: var(--ink-2); }
    .tcp-widget table.seq-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    .tcp-widget .seq-table caption { text-align: left; color: var(--ink-2); font-size: 12.5px; padding-bottom: 5px; }
    .tcp-widget .seq-table th, .tcp-widget .seq-table td {
      text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top;
    }
    .tcp-widget .seq-table thead th { color: var(--ink-3); font-size: 11.5px; font-weight: 600; }
    .tcp-widget .seq-table tbody tr { opacity: .5; transition: opacity .25s ease; }
    .tcp-widget .seq-table tbody tr.is-active { opacity: 1; }
    .tcp-widget .seq-table tbody tr.is-active td:first-child { color: var(--syn-c); font-weight: 600; }
    .tcp-widget .seq-table code { font-family: var(--mono); font-size: 12px; }
    .tcp-widget .legend { margin-top: 8px; color: var(--ink-3); font-size: 12px; }
    .tcp-widget .legend code { font-family: var(--mono); }
    @media (max-width: 620px) {
      .tcp-widget .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tcp-widget #stateHint { margin-left: 0; }
    }
  </style>

  <div class="card">
    <div class="states" aria-live="polite">
      <div class="state-pair"><span class="state-host">客户端</span><span class="state-chip" id="cstate">CLOSED</span></div>
      <div class="state-pair"><span class="state-host">服务端</span><span class="state-chip" id="sstate">LISTEN</span></div>
      <span id="stateHint">尚未建立连接</span>
    </div>

    <svg class="seq" viewBox="0 0 830 352" role="img" aria-labelledby="tcpTitle tcpDesc">
      <title id="tcpTitle">TCP 三次握手时序图</title>
      <desc id="tcpDesc">客户端与服务端之间依次交换 SYN、SYN+ACK、ACK 三条报文，双方状态从 CLOSED 和 LISTEN 逐步变为 ESTABLISHED。</desc>
      <defs>
        <linearGradient id="tcpNodeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--dsw-alias-bg-layer-2, #f4f6fa)"/>
          <stop offset="1" stop-color="var(--dsw-alias-bg-layer-1, #fff)"/>
        </linearGradient>
        <marker id="tcpArrowSyn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--syn-c)"/>
        </marker>
        <marker id="tcpArrowSynack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--synack-c)"/>
        </marker>
        <marker id="tcpArrowAck" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--ack-c)"/>
        </marker>
      </defs>

      <text class="stage-title" x="185" y="46" text-anchor="middle">客户端</text>
      <text class="node-state" id="node-client" x="185" y="84" text-anchor="middle">CLOSED</text>
      <rect x="110" y="52" width="150" height="48" rx="10" fill="url(#tcpNodeGrad)" stroke="var(--line-2)" stroke-width="1.5"/>

      <text class="stage-title" x="645" y="46" text-anchor="middle">服务端</text>
      <text class="node-state" id="node-server" x="645" y="84" text-anchor="middle">LISTEN</text>
      <rect x="570" y="52" width="150" height="48" rx="10" fill="url(#tcpNodeGrad)" stroke="var(--line-2)" stroke-width="1.5"/>

      <line class="lane" x1="185" y1="104" x2="185" y2="290"/>
      <line class="lane" x1="645" y1="104" x2="645" y2="290"/>

      <g class="msg" data-msg="syn">
        <text class="msg-label" x="415" y="131" text-anchor="middle">SYN  seq = x</text>
        <line class="msg-line" x1="191" y1="146" x2="633" y2="146" stroke="var(--syn-c)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#tcpArrowSyn)"/>
      </g>
      <g class="msg" data-msg="synack">
        <text class="msg-label" x="415" y="181" text-anchor="middle">SYN  seq = y,  ack = x + 1</text>
        <line class="msg-line" x1="639" y1="196" x2="197" y2="196" stroke="var(--synack-c)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#tcpArrowSynack)"/>
      </g>
      <g class="msg" data-msg="ack">
        <text class="msg-label" x="415" y="231" text-anchor="middle">ACK  ack = y + 1</text>
        <line class="msg-line" x1="191" y1="246" x2="633" y2="246" stroke="var(--ack-c)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#tcpArrowAck)"/>
      </g>

      <circle cx="185" cy="146" r="4" fill="var(--syn-c)"/>
      <circle cx="645" cy="146" r="4" fill="var(--syn-c)"/>
      <circle cx="645" cy="196" r="4" fill="var(--synack-c)"/>
      <circle cx="185" cy="196" r="4" fill="var(--synack-c)"/>
      <circle cx="185" cy="246" r="4" fill="var(--ack-c)"/>
      <circle cx="645" cy="246" r="4" fill="var(--ack-c)"/>

      <line x1="90" y1="290" x2="740" y2="290" stroke="var(--line)"/>
      <text class="stage-note" x="415" y="312" text-anchor="middle">每一方都要收到对方的初始序列号，并让对方确认自己已被收到</text>
      <text class="stage-note" x="415" y="332" text-anchor="middle">实线箭头 = 实际发送的报文段（示意，未按比例）</text>
    </svg>
  </div>

  <div class="steps" role="group" aria-label="握手步骤">
    <button class="step" type="button" aria-current="step"><span class="n">00</span><span class="t">初始状态</span></button>
    <button class="step" type="button"><span class="n">01</span><span class="t">SYN →</span></button>
    <button class="step" type="button"><span class="n">02</span><span class="t">← SYN + ACK</span></button>
    <button class="step" type="button"><span class="n">03</span><span class="t">ACK →</span></button>
  </div>

  <div class="detail">
    <div class="detail-head">
      <h4 id="stepTitle">初始状态</h4>
      <span class="step-tag" id="stepTag">握手尚未开始</span>
    </div>
    <p id="stepDesc"></p>

    <table class="seq-table">
      <caption>双方序列号由此对齐（各自随机选择，避免旧报文造成混淆）</caption>
      <thead>
        <tr><th scope="col">方向</th><th scope="col">报文</th><th scope="col">seq</th><th scope="col">ack</th></tr>
      </thead>
      <tbody>
        <tr data-row><td>客户端 → 服务端</td><td>SYN</td><td><code>x</code></td><td>—</td></tr>
        <tr data-row><td>服务端 → 客户端</td><td>SYN + ACK</td><td><code>y</code></td><td><code>x + 1</code></td></tr>
        <tr data-row><td>客户端 → 服务端</td><td>ACK</td><td><code>x + 1</code></td><td><code>y + 1</code></td></tr>
      </tbody>
    </table>
    <p class="legend">阅读提示：<code>SYN</code> 表示“我的初始序列号是……”，<code>ACK</code> 表示“你上一条我收到了”。</p>
  </div>
</div>

<script>
(function () {
  var steps = [
    { name: '初始状态', desc: '客户端处于 CLOSED，服务端在某个端口上 LISTEN，等待连接请求。此时双方都还不知道对方的初始序列号（ISN）。', c: 'CLOSED', s: 'LISTEN', tag: '握手尚未开始', kind: 'idle' },
    { name: '第一次握手', desc: '客户端发送 SYN，携带自己的初始序列号 seq = x，随后进入 SYN_SENT。它表达的是：我想连你，我的序号从 x 开始。', c: 'SYN_SENT', s: 'LISTEN', tag: '客户端：SYN, seq = x', kind: 'syn' },
    { name: '第二次握手', desc: '服务端回 SYN + ACK：确认号 ack = x + 1（你的 x 我收到了），同时带上自己的初始序列号 seq = y，并进入 SYN_RCVD。', c: 'SYN_SENT', s: 'SYN_RCVD', tag: '服务端：SYN, seq = y, ack = x + 1', kind: 'synack' },
    { name: '第三次握手', desc: '客户端回 ACK：ack = y + 1（你的 y 我也收到了），同时带上 seq = x + 1。此后双方都进入 ESTABLISHED，连接建立完成。', c: 'ESTABLISHED', s: 'ESTABLISHED', tag: '客户端：ACK, ack = y + 1', kind: 'ack' }
  ];
  var stepButtons = Array.prototype.slice.call(document.querySelectorAll('.step'));
  var stage = document.querySelector('.seq');
  var stepTitle = document.getElementById('stepTitle');
  var stepDesc = document.getElementById('stepDesc');
  var stepTag = document.getElementById('stepTag');
  var cState = document.getElementById('cstate');
  var sState = document.getElementById('sstate');
  var stateHint = document.getElementById('stateHint');
  var rows = Array.prototype.slice.call(document.querySelectorAll('[data-row]'));
  var arrows = Array.prototype.slice.call(document.querySelectorAll('.msg'));
  var i = 0;

  function render() {
    var step = steps[i];
    stepButtons.forEach(function (b, k) {
      var on = k === i;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-current', on ? 'step' : 'false');
    });
    stage.setAttribute('data-active', String(i));
    stepTitle.textContent = step.name;
    stepDesc.textContent = step.desc;
    stepTag.textContent = step.tag;
    stepTag.className = 'step-tag is-' + step.kind;
    cState.textContent = step.c;
    sState.textContent = step.s;
    cState.className = 'state-chip' + (step.c === 'ESTABLISHED' ? ' is-established' : '');
    sState.className = 'state-chip' + (step.s === 'ESTABLISHED' ? ' is-established' : '');
    document.getElementById('node-client').textContent = step.c;
    document.getElementById('node-server').textContent = step.s;
    document.getElementById('node-client').parentNode.classList.toggle('is-up', step.c === 'ESTABLISHED');
    document.getElementById('node-server').parentNode.classList.toggle('is-up', step.s === 'ESTABLISHED');
    var rowIndex = { syn: 0, synack: 1, ack: 2 }[step.kind];
    rows.forEach(function (r, k) { r.classList.toggle('is-active', k === rowIndex); });
    arrows.forEach(function (a) { a.classList.remove('is-active'); });
    if (rowIndex !== undefined) {
      var el = document.querySelector('.msg[data-msg="' + step.kind + '"]');
      if (el) el.classList.add('is-active');
    }
    stateHint.textContent = step.kind === 'idle'
      ? '尚未建立连接'
      : (step.c === 'ESTABLISHED' && step.s === 'ESTABLISHED' ? '双向可达已确认，连接建立完成' : '握手进行中……');
  }

  stepButtons.forEach(function (b, k) {
    b.addEventListener('click', function () { i = k; render(); });
  });
  document.getElementById('prev').addEventListener('click', function () { i = (i + steps.length - 1) % steps.length; render(); });
  document.getElementById('next').addEventListener('click', function () { i = (i + 1) % steps.length; render(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { i = (i + 1) % steps.length; render(); }
    if (e.key === 'ArrowLeft') { i = (i + steps.length - 1) % steps.length; render(); }
  });
  render();
})();
</script></body></html>
