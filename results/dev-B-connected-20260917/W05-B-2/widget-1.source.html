<style>
  .qty-wrap {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    padding: 18px 18px 16px;
    background: var(--dsw-alias-bg-layer-1, #f7f8fa);
    border: 1px solid var(--dsw-alias-border-l1, #e3e6ea);
    border-radius: 14px;
    color: var(--dsw-alias-label-primary, #1b1f24);
    font-family: inherit;
    font-size: 14px;
    max-width: 340px;
    margin: 0 auto;
  }
  .qty-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
  }
  .qty-label { font-weight: 600; }
  .qty-range {
    font-size: 12px;
    color: var(--dsw-alias-label-tertiary, #8a9199);
    font-variant-numeric: tabular-nums;
  }
  .qty-stepper {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .qty-btn {
    width: 44px;
    height: 44px;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    line-height: 1;
    border-radius: 10px;
    border: 1px solid var(--dsw-alias-border-l2, #ccd2d9);
    background: var(--dsw-alias-bg-layer-2, #ffffff);
    color: var(--dsw-alias-label-primary, #1b1f24);
    cursor: pointer;
    transition: background-color 120ms ease, transform 60ms ease;
  }
  .qty-btn:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover, #eef1f4); }
  .qty-btn:active:not(:disabled) { background: var(--dsw-alias-interactive-bg-active, #e2e7ec); transform: scale(0.96); }
  .qty-btn:disabled {
    opacity: 0.38;
    cursor: not-allowed;
    color: var(--dsw-alias-label-tertiary, #8a9199);
  }
  .qty-value {
    min-width: 2ch;
    text-align: center;
    font-size: 30px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    font-family: inherit;
    color: var(--dsw-alias-brand-primary, #2f6fed);
  }
  .qty-track {
    display: flex;
    gap: 6px;
  }
  .qty-pip {
    width: 26px;
    height: 6px;
    border-radius: 3px;
    background: var(--dsw-alias-border-l1, #e3e6ea);
    transition: background-color 140ms ease;
  }
  .qty-pip.is-on { background: var(--dsw-alias-brand-primary, #2f6fed); }
  .qty-status {
    margin: 0;
    min-height: 1.2em;
    font-size: 12px;
    color: var(--dsw-alias-label-secondary, #5c646d);
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .qty-btn, .qty-pip { transition: none; }
  }
</style>

<div class="qty-wrap" role="group" aria-label="数量选择器，范围 0 到 5">
  <div class="qty-head">
    <span class="qty-label">数量</span>
    <span class="qty-range">0 – 5，步长 1</span>
  </div>

  <div class="qty-stepper">
    <button id="qty-dec" type="button" class="qty-btn" aria-label="减少一个">−</button>
    <output id="qty-value" class="qty-value">2</output>
    <button id="qty-inc" type="button" class="qty-btn" aria-label="增加一个">+</button>
  </div>

  <div id="qty-track" class="qty-track" aria-hidden="true">
    <span class="qty-pip"></span>
    <span class="qty-pip"></span>
    <span class="qty-pip"></span>
    <span class="qty-pip"></span>
    <span class="qty-pip"></span>
  </div>

  <p id="qty-live" class="qty-status" role="status" aria-live="polite">当前数量 2</p>
</div>

<script>
  (function () {
    var MIN = 0, MAX = 5;
    var value = 2;

    var dec = document.getElementById('qty-dec');
    var inc = document.getElementById('qty-inc');
    var out = document.getElementById('qty-value');
    var live = document.getElementById('qty-live');
    var pips = Array.prototype.slice.call(
      document.querySelectorAll('#qty-track .qty-pip')
    );

    function statusText() {
      if (value === MIN) return '当前数量 0：已达下限，− 已禁用';
      if (value === MAX) return '当前数量 5：已达上限，+ 已禁用';
      return '当前数量 ' + value;
    }

    function render() {
      out.textContent = String(value);
      dec.disabled = value <= MIN;
      inc.disabled = value >= MAX;
      for (var i = 0; i < pips.length; i++) {
        pips[i].classList.toggle('is-on', i < value);
      }
      live.textContent = statusText();
    }

    function step(delta) {
      var next = value + delta;
      if (next < MIN || next > MAX) return;
      value = next;
      render();
    }

    dec.addEventListener('click', function () { step(-1); });
    inc.addEventListener('click', function () { step(1); });

    render();
  })();
</script>
