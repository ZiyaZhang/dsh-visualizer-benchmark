<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}:where(body){padding:0}:where(body>svg){width:100%;height:auto}</style></head><body><svg viewBox="0 0 720 384" width="100%" role="img" aria-labelledby="netUsersTitle netUsersDesc" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
  <title id="netUsersTitle">每月净新增用户柱状图</title>
  <desc id="netUsersDesc">1月120人，2月0人，3月数据缺失，4月-30人，5月80人。正值柱在零线之上，负值柱在零线之下，真实为零用空心圆标出，数据缺失用斜纹空列表示。</desc>
  <defs>
    <pattern id="hatchMissing" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="var(--dsw-alias-bg-layer-2, #f1f3f7)"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--dsw-alias-border-l2, #c6cbd4)" stroke-width="2.5"/>
    </pattern>
  </defs>

  <!-- title -->
  <text x="70" y="20" font-size="15" font-weight="600" fill="var(--dsw-alias-label-primary, #1f2329)">每月净新增用户（人）</text>

  <!-- gridlines -->
  <g stroke="var(--dsw-alias-border-l1, #e5e8ee)" stroke-width="1">
    <line x1="70" y1="51.3" x2="690" y2="51.3" stroke-dasharray="3 4"/>
    <line x1="70" y1="112.5" x2="690" y2="112.5" stroke-dasharray="3 4"/>
    <line x1="70" y1="173.6" x2="690" y2="173.6" stroke-dasharray="3 4"/>
    <line x1="70" y1="296" x2="690" y2="296"/>
  </g>
  <!-- zero baseline -->
  <line x1="70" y1="234.8" x2="690" y2="234.8" stroke="var(--dsw-alias-border-l2, #c6cbd4)" stroke-width="1.6"/>

  <!-- y tick labels -->
  <g font-size="12" text-anchor="end">
    <text x="60" y="55.3" fill="var(--dsw-alias-label-tertiary, #8a9099)">120</text>
    <text x="60" y="116.5" fill="var(--dsw-alias-label-tertiary, #8a9099)">80</text>
    <text x="60" y="177.6" fill="var(--dsw-alias-label-tertiary, #8a9099)">40</text>
    <text x="60" y="239" font-weight="600" fill="var(--dsw-alias-label-secondary, #5b6270)">0</text>
    <text x="60" y="300.5" fill="var(--dsw-alias-label-tertiary, #8a9099)">-40</text>
  </g>

  <!-- 3月 数据缺失：斜纹空列 -->
  <rect x="348" y="36" width="64" height="260" rx="4" fill="url(#hatchMissing)" stroke="var(--dsw-alias-border-l2, #c6cbd4)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="380" y="178" font-size="24" text-anchor="middle" fill="var(--dsw-alias-label-tertiary, #8a9099)">—</text>

  <!-- 1月 120 -->
  <path d="M100,234.8 V57.3 Q100,51.3 106,51.3 H158 Q164,51.3 164,57.3 V234.8 Z" fill="var(--dsw-alias-brand-primary, #4f7cff)"/>
  <text x="132" y="41.3" font-size="15" font-weight="600" text-anchor="middle" fill="var(--dsw-alias-label-primary, #1f2329)">120</text>

  <!-- 4月 -30 -->
  <path d="M472,234.8 V274.7 Q472,280.7 478,280.7 H530 Q536,280.7 536,274.7 V234.8 Z" fill="var(--dsw-alias-state-error-primary, #e5484d)"/>
  <text x="504" y="302" font-size="15" font-weight="600" text-anchor="middle" fill="var(--dsw-alias-state-error-primary, #e5484d)">-30</text>

  <!-- 5月 80 -->
  <path d="M596,234.8 V118.5 Q596,112.5 602,112.5 H654 Q660,112.5 660,118.5 V234.8 Z" fill="var(--dsw-alias-brand-primary, #4f7cff)"/>
  <text x="628" y="102.5" font-size="15" font-weight="600" text-anchor="middle" fill="var(--dsw-alias-label-primary, #1f2329)">80</text>

  <!-- 2月 0：空心圆标在零线上 -->
  <circle cx="256" cy="234.8" r="8" fill="none" stroke="var(--dsw-alias-label-secondary, #5b6270)" stroke-width="2.5"/>
  <text x="256" y="212" font-size="15" font-weight="600" text-anchor="middle" fill="var(--dsw-alias-label-secondary, #5b6270)">0</text>

  <!-- x labels -->
  <g font-size="14" text-anchor="middle" fill="var(--dsw-alias-label-secondary, #5b6270)">
    <text x="132" y="322">1月</text>
    <text x="256" y="322">2月</text>
    <text x="380" y="322">3月</text>
    <text x="504" y="322">4月</text>
    <text x="628" y="322">5月</text>
  </g>
  <text x="380" y="342" font-size="11.5" text-anchor="middle" fill="var(--dsw-alias-label-tertiary, #8a9099)">数据缺失</text>

  <!-- legend -->
  <g>
    <rect x="70" y="356" width="14" height="14" rx="3" fill="var(--dsw-alias-brand-primary, #4f7cff)"/>
    <text x="90" y="368" font-size="12.5" fill="var(--dsw-alias-label-secondary, #5b6270)">净增（正）</text>

    <circle cx="194" cy="363" r="6.5" fill="none" stroke="var(--dsw-alias-label-secondary, #5b6270)" stroke-width="2.2"/>
    <text x="208" y="368" font-size="12.5" fill="var(--dsw-alias-label-secondary, #5b6270)">真实为零</text>

    <rect x="318" y="356" width="14" height="14" rx="3" fill="url(#hatchMissing)" stroke="var(--dsw-alias-border-l2, #c6cbd4)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="338" y="368" font-size="12.5" fill="var(--dsw-alias-label-secondary, #5b6270)">数据缺失</text>

    <rect x="438" y="356" width="14" height="14" rx="3" fill="var(--dsw-alias-state-error-primary, #e5484d)"/>
    <text x="458" y="368" font-size="12.5" fill="var(--dsw-alias-label-secondary, #5b6270)">净减（负）</text>
  </g>
</svg></body></html>
