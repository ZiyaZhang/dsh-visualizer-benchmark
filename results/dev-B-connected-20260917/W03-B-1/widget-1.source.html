<svg viewBox="0 0 760 430" width="100%" role="img" aria-labelledby="netUsersTitle netUsersDesc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="netUsersTitle">每月净新增用户：1月120人，2月0人，3月数据缺失，4月-30人，5月80人</title>
  <desc id="netUsersDesc">柱状图对比五个月的净新增人数。1月120人为正值，柱子在零线以上；2月为0人，只显示零线上的圆点；3月数据缺失，用虚线斜纹框表示没有任何数值；4月-30人为负值，柱子在零线以下；5月80人为正值。网格尺度从-30到120人，零线为基准。</desc>

  <style>
    .ax { fill: var(--dsw-alias-label-secondary, #6B7280); font-size: 13px; }
    .cat { fill: var(--dsw-alias-label-primary, #111827); font-size: 15px; font-weight: 600; }
    .val { fill: var(--dsw-alias-label-primary, #111827); font-size: 17px; font-weight: 700; }
    .note { fill: var(--dsw-alias-label-secondary, #6B7280); font-size: 12.5px; }
    .lg { fill: var(--dsw-alias-label-secondary, #6B7280); font-size: 12.5px; }
    .gridline { stroke: var(--dsw-alias-border-l1, #E5E7EB); stroke-width: 1; }
    .zero { stroke: var(--dsw-alias-label-secondary, #6B7280); stroke-width: 1.6; }
    .pos { fill: #0E8A9E; }
    .neg { fill: #C0392B; }
    .missbox { fill: none; stroke: var(--dsw-alias-label-tertiary, #9CA3AF); stroke-width: 1.6; stroke-dasharray: 6 5; }
    @media (prefers-color-scheme: dark) {
      .pos { fill: #3FBFD0; }
      .neg { fill: #FF7A6B; }
    }
  </style>

  <!-- axis title -->
  <text x="80" y="26" class="ax" font-size="13">净新增人数（人）</text>
  <text x="80" y="44" class="ax">↑ 正值（净增）</text>

  <!-- gridlines -->
  <line x1="80" y1="84"  x2="720" y2="84"  class="gridline"/>
  <line x1="80" y1="180" x2="720" y2="180" class="gridline"/>
  <line x1="80" y1="372" x2="720" y2="372" class="gridline"/>
  <text x="70" y="88"  class="ax" text-anchor="end">120</text>
  <text x="70" y="184" class="ax" text-anchor="end">60</text>
  <text x="70" y="376" class="ax" text-anchor="end">-30</text>

  <!-- zero baseline -->
  <line x1="80" y1="276" x2="720" y2="276" class="zero"/>
  <text x="70" y="280" class="ax" text-anchor="end" font-weight="600">0</text>

  <!-- Jan: +120 -->
  <rect x="216" y="84" width="72" height="192" rx="4" class="pos"/>
  <text x="252" y="70" class="val" text-anchor="middle">+120</text>

  <!-- Feb: 0 -->
  <rect x="344" y="272" width="72" height="4" fill="var(--dsw-alias-label-tertiary, #9CA3AF)" opacity="0.45" rx="2"/>
  <circle cx="380" cy="276" r="5" fill="var(--dsw-alias-label-primary, #111827)"/>
  <text x="380" y="304" class="val" text-anchor="middle">0</text>
  <text x="380" y="322" class="note" text-anchor="middle">有数据，为零</text>

  <!-- Mar: missing -->
  <rect x="472" y="84" width="72" height="192" class="missbox" rx="4"/>
  <text x="508" y="128" class="note" text-anchor="middle" font-size="22" font-weight="700">?</text>
  <text x="508" y="304" class="val" text-anchor="middle" fill="var(--dsw-alias-label-secondary, #6B7280)">—</text>
  <text x="508" y="322" class="note" text-anchor="middle">数据缺失</text>

  <!-- Apr: -30 -->
  <rect x="600" y="276" width="72" height="96" rx="4" class="neg"/>
  <text x="636" y="396" class="val" text-anchor="middle" fill="#C0392B">−30</text>

  <!-- category labels -->
  <text x="252" y="304" class="cat" text-anchor="middle">1月</text>
  <text x="380" y="304" class="cat" text-anchor="middle">2月</text>
  <text x="508" y="304" class="cat" text-anchor="middle">3月</text>
  <text x="636" y="304" class="cat" text-anchor="middle">4月</text>
  <text x="700" y="304" class="cat" text-anchor="middle">5月</text>
  <text x="252" y="322" class="note" text-anchor="middle">有数据</text>
  <text x="700" y="322" class="note" text-anchor="middle">有数据</text>

  <!-- May: +80 -->
  <rect x="664" y="148" width="72" height="128" rx="4" class="pos"/>
  <text x="700" y="134" class="val" text-anchor="middle">+80</text>
  <text x="700" y="396" class="note" text-anchor="middle">5月</text>

  <!-- legend -->
  <line x1="80" y1="416" x2="720" y2="416" class="gridline" opacity="0.7"/>
  <rect x="80" y="418" width="14" height="14" rx="3" class="pos"/>
  <text x="100" y="430" class="lg">正值（净增）</text>
  <circle cx="240" cy="425" r="5" fill="var(--dsw-alias-label-primary, #111827)"/>
  <text x="254" y="430" class="lg">0：有数据但无变化</text>
  <rect x="425" y="418" width="14" height="14" rx="3" class="missbox"/>
  <text x="445" y="430" class="lg">虚线框：数据缺失，无数值</text>
  <rect x="635" y="418" width="14" height="14" rx="3" class="neg"/>
  <text x="655" y="430" class="lg">负数（净流失）</text>
</svg>
