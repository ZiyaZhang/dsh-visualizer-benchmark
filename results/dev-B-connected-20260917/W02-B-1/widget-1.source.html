<style>
  .ht { display: grid; gap: 12px; color: var(--dsw-alias-label-primary); font-size: 13px; }
  .ht-rod { display: flex; flex-wrap: wrap; gap: 6px; }
  .ht-cell { flex: 1 1 56px; min-width: 56px; border: 1px solid var(--dsw-alias-border-l1); border-radius: 10px; padding: 8px 4px 7px; text-align: center; transition: background-color .18s ease; }
  .ht-cell.fixed { border-style: dashed; border-width: 2px; }
  .ht-idx { font-size: 11px; opacity: .85; white-space: nowrap; }
  .ht-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ht-tag { font-size: 10px; opacity: .85; }
  .ht-chart { background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l1); border-radius: 10px; padding: 4px; }
  .ht-svg { display: block; width: 100%; height: auto; }
  .ht-axis { font-size: 10px; fill: currentColor; opacity: .7; }
  .ht-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ht-n { font-variant-numeric: tabular-nums; color: var(--dsw-alias-label-secondary); }
  .ht-prev { font-size: 11px; color: var(--dsw-alias-label-secondary); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .ht-cell { transition: none; } }
</style>

<div class="ht">
  <div class="ht-rod" id="htRod" role="img" aria-label="5节点杆离散温度示意：节点1为100.0摄氏度，节点2至4为0.0摄氏度，节点5为0.0摄氏度">
    <div class="ht-cell fixed" id="htCell0"><div class="ht-idx">节点1 · x=0</div><div class="ht-val" id="htV0">100.00</div><div class="ht-tag">固定</div></div>
    <div class="ht-cell" id="htCell1"><div class="ht-idx">节点2 · x=1</div><div class="ht-val" id="htV1">0.00</div><div class="ht-tag">内部</div></div>
    <div class="ht-cell" id="htCell2"><div class="ht-idx">节点3 · x=2</div><div class="ht-val" id="htV2">0.00</div><div class="ht-tag">内部</div></div>
    <div class="ht-cell" id="htCell3"><div class="ht-idx">节点4 · x=3</div><div class="ht-val" id="htV3">0.00</div><div class="ht-tag">内部</div></div>
    <div class="ht-cell fixed" id="htCell4"><div class="ht-idx">节点5 · x=4</div><div class="ht-val" id="htV4">0.00</div><div class="ht-tag">固定</div></div>
  </div>

  <div class="ht-chart">
    <svg class="ht-svg" viewBox="0 0 340 150" role="img" aria-labelledby="htChartTitle">
      <title id="htChartTitle">5个节点上的离散温度分布，纵轴温度0至100摄氏度，虚线为两端固定温度连成的最终稳态直线</title>
      <text class="ht-axis" x="2" y="9">°C</text>
      <line x1="34" y1="10" x2="334" y2="10" stroke="currentColor" opacity=".16"/>
      <line x1="34" y1="67" x2="334" y2="67" stroke="currentColor" opacity=".16"/>
      <line x1="34" y1="124" x2="334" y2="124" stroke="currentColor" opacity=".28"/>
      <text class="ht-axis" x="30" y="13.5" text-anchor="end">100</text>
      <text class="ht-axis" x="30" y="70.5" text-anchor="end">50</text>
      <text class="ht-axis" x="30" y="127.5" text-anchor="end">0</text>
      <line x1="34" y1="10" x2="328" y2="124" stroke="currentColor" opacity=".45" stroke-dasharray="4 4"/>
      <polyline id="htLine" fill="none" stroke="var(--dsw-alias-brand-primary)" stroke-width="2.5" stroke-linejoin="round" points="34,10 107.5,124 181,124 254.5,124 328,124"/>
      <circle id="htD0" cx="34" cy="10" r="3.4" fill="var(--dsw-alias-brand-primary)"/>
      <circle id="htD1" cx="107.5" cy="124" r="3.4" fill="var(--dsw-alias-brand-primary)"/>
      <circle id="htD2" cx="181" cy="124" r="3.4" fill="var(--dsw-alias-brand-primary)"/>
      <circle id="htD3" cx="254.5" cy="124" r="3.4" fill="var(--dsw-alias-brand-primary)"/>
      <circle id="htD4" cx="328" cy="124" r="3.4" fill="var(--dsw-alias-brand-primary)"/>
      <text class="ht-axis" x="34" y="140" text-anchor="middle">1</text>
      <text class="ht-axis" x="107.5" y="140" text-anchor="middle">2</text>
      <text class="ht-axis" x="181" y="140" text-anchor="middle">3</text>
      <text class="ht-axis" x="254.5" y="140" text-anchor="middle">4</text>
      <text class="ht-axis" x="328" y="140" text-anchor="middle">5</text>
    </svg>
  </div>

  <div class="ht-ctrl">
    <button id="htStep" type="button">单步更新</button>
    <button id="htReset" type="button">重置</button>
    <span class="ht-n" id="htN">第 0 步</span>
  </div>
  <div class="ht-prev" id="htPrev" aria-live="polite">上一时刻（本次更新所用）：—</div>
</div>

<script>
(function () {
  var X = [34, 107.5, 181, 254.5, 328];
  var T = [100, 0, 0, 0, 0];
  var prev = null;
  var n = 0;
  var cells = [], vals = [], dots = [];
  for (var i = 0; i < 5; i++) {
    cells.push(document.getElementById('htCell' + i));
    vals.push(document.getElementById('htV' + i));
    dots.push(document.getElementById('htD' + i));
  }
  var line = document.getElementById('htLine');
  var nEl = document.getElementById('htN');
  var prevEl = document.getElementById('htPrev');
  var rod = document.getElementById('htRod');
  var stops = [[0, [62, 114, 214]], [0.5, [233, 166, 63]], [1, [211, 63, 54]]];

  function color(v) {
    var t = Math.max(0, Math.min(1, v / 100));
    var a = t <= 0.5 ? stops[0] : stops[1];
    var b = t <= 0.5 ? stops[1] : stops[2];
    var k = (t - a[0]) / (b[0] - a[0]);
    return [0, 1, 2].map(function (j) { return Math.round(a[1][j] + (b[1][j] - a[1][j]) * k); });
  }
  function lum(c) { return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }
  function y(v) { return 10 + (1 - Math.max(0, Math.min(100, v)) / 100) * 114; }

  function render() {
    var pts = [], summary = [];
    for (var i = 0; i < 5; i++) {
      var c = color(T[i]);
      cells[i].style.background = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
      cells[i].style.color = lum(c) > 0.62 ? '#14161a' : '#ffffff';
      vals[i].textContent = T[i].toFixed(2);
      dots[i].setAttribute('cy', y(T[i]).toFixed(2));
      pts.push(X[i] + ',' + y(T[i]).toFixed(2));
      summary.push('节点' + (i + 1) + ' ' + T[i].toFixed(1) + '摄氏度');
    }
    line.setAttribute('points', pts.join(' '));
    nEl.textContent = '第 ' + n + ' 步';
    prevEl.textContent = '上一时刻（本次更新所用）：' + (prev ? prev.map(function (v) { return v.toFixed(2); }).join(' / ') : '—');
    rod.setAttribute('aria-label', '5节点杆离散温度示意：' + summary.join('，'));
  }

  document.getElementById('htStep').addEventListener('click', function () {
    var p = T.slice();
    for (var i = 1; i < 4; i++) {
      T[i] = p[i] + 0.25 * (p[i - 1] - 2 * p[i] + p[i + 1]);
    }
    prev = p;
    n++;
    render();
  });

  document.getElementById('htReset').addEventListener('click', function () {
    T = [100, 0, 0, 0, 0];
    prev = null;
    n = 0;
    render();
  });

  render();
})();
</script>
