<style>
  .qty-card {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--dsw-alias-bg-layer-1, #fff);
    border: 1px solid var(--dsw-alias-border-l1, #e3e5e9);
    border-radius: 14px;
    padding: 20px;
    max-width: 380px;
    color: var(--dsw-alias-label-primary, #1a1d21);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .qty-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--dsw-alias-label-secondary, #5b6169);
    letter-spacing: 0.01em;
  }
  .qty-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .qty-btn {
    width: 44px;
    height: 44px;
    flex: 0 0 auto;
    border-radius: 10px;
    border: 1px solid var(--dsw-alias-border-l2, #cfd3d9);
    background: var(--dsw-alias-bg-layer-2, #f5f6f8);
    color: var(--dsw-alias-label-primary, #1a1d21);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 120ms ease;
  }
  .qty-btn:not(:disabled):hover { background: var(--dsw-alias-interactive-bg-hover, #e9ebef); }
  .qty-btn:not(:disabled):active { background: var(--dsw-alias-interactive-bg-active, #dde1e7); }
  .qty-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .qty-value {
    flex: 1 1 auto;
    text-align: center;
    font-size: 40px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 0;
  }
  .qty-track {
    display: flex;
    gap: 6px;
  }
  .qty-pip {
    flex: 1 1 0;
    height: 6px;
    border-radius: 3px;
    background: var(--dsw-alias-border-l1, #e3e5e9);
    transition: background 120ms ease;
  }
  .qty-pip.on { background: var(--dsw-alias-brand-primary, #2f6bff); }
  .qty-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--dsw-alias-label-tertiary, #83898f);
    font-variant-numeric: tabular-nums;
  }
  .qty-status { text-align: center; font-size: 12px; color: var(--dsw-alias-label-secondary, #5b6169); min-height: 16px; }
</style>

<div class="qty-card" role="group" aria-label="数量选择器，范围 0 到 5，初始 2">
  <div class="qty-title">数量</div>
  <div class="qty-row">
    <button class="qty-btn" id="qtyMinus" type="button" aria-label="减少一个">−</button>
    <div class="qty-value" id="qtyValue" role="status" aria-live="polite">2</div>
    <button class="qty-btn" id="qtyPlus" type="button" aria-label="增加一个">+</button>
  </div>
  <div class="qty-track" aria-hidden="true">
    <div class="qty-pip" id="pip0"></div>
    <div class="qty-pip" id="pip1"></div>
    <div class="qty-pip" id="pip2"></div>
    <div class="qty-pip" id="pip3"></div>
    <div class="qty-pip" id="pip4"></div>
  </div>
  <div class="qty-status" id="qtyStatus">可增加、可减少</div>
  <div class="qty-meta"><span>最小值 0</span><span>最大值 5</span></div>
</div>

<script>
  (function () {
    var MIN = 0, MAX = 5, step = 1;
    var value = 2;
    var minus = document.getElementById('qtyMinus');
    var plus = document.getElementById('qtyPlus');
    var out = document.getElementById('qtyValue');
    var status = document.getElementById('qtyStatus');
    var pips = [0, 1, 2, 3, 4].map(function (i) { return document.getElementById('pip' + i); });

    function render() {
      out.textContent = String(value);
      minus.disabled = value <= MIN;
      plus.disabled = value >= MAX;
      pips.forEach(function (p, i) { p.classList.toggle('on', i < value); });
      if (value <= MIN) status.textContent = '已到下限，减少按钮已禁用';
      else if (value >= MAX) status.textContent = '已到上限，增加按钮已禁用';
      else status.textContent = '可增加、可减少';
    }

    minus.addEventListener('click', function () {
      if (value - step < MIN) return;
      value -= step;
      render();
    });
    plus.addEventListener('click', function () {
      if (value + step > MAX) return;
      value += step;
      render();
    });

    render();
  })();
</script>
