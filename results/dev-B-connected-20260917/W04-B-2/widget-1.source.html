<style>
  .usage-chart{--bar-color:var(--dsw-alias-brand-primary,#4b6bfb);display:flex;flex-direction:column;gap:16px;padding:16px;border:1px solid var(--dsw-alias-border-l1,#e3e5ea);border-radius:12px;background:var(--dsw-alias-bg-layer-1,#fff);color:var(--dsw-alias-label-primary,#1a1a1a);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;box-sizing:border-box}
  .usage-chart *{box-sizing:border-box}
  .usage-row{display:flex;flex-direction:column;gap:7px;min-width:0}
  .usage-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
  .usage-name{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
  .usage-val{flex:0 0 auto;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .usage-val small{margin-left:2px;font-size:12px;font-weight:500;color:var(--dsw-alias-label-secondary,#5b6068)}
  .usage-track{width:100%;height:16px;border-radius:8px;background:var(--dsw-alias-bg-layer-2,#eef0f4);overflow:hidden}
  .usage-fill{height:100%;border-radius:8px;background:var(--bar-color)}
  .usage-note{margin:0;font-size:12px;line-height:1.4;color:var(--dsw-alias-label-tertiary,#7a8088)}
</style>
<div class="usage-chart" role="img" aria-label="横向条形图，比较四类功能的使用次数：直接生成一个简短答案 300 次，长文档的跨章节证据追溯 120 次，多轮对话中的上下文恢复 80 次，插件热更新后继续当前任务 45 次。条形从 0 起，长度与次数成正比。">
  <div class="usage-row">
    <div class="usage-head">
      <span class="usage-name">直接生成一个简短答案</span>
      <span class="usage-val">300<small>次</small></span>
    </div>
    <div class="usage-track"><div class="usage-fill" style="width:100%"></div></div>
  </div>
  <div class="usage-row">
    <div class="usage-head">
      <span class="usage-name">长文档的跨章节证据追溯</span>
      <span class="usage-val">120<small>次</small></span>
    </div>
    <div class="usage-track"><div class="usage-fill" style="width:40%"></div></div>
  </div>
  <div class="usage-row">
    <div class="usage-head">
      <span class="usage-name">多轮对话中的上下文恢复</span>
      <span class="usage-val">80<small>次</small></span>
    </div>
    <div class="usage-track"><div class="usage-fill" style="width:26.67%"></div></div>
  </div>
  <div class="usage-row">
    <div class="usage-head">
      <span class="usage-name">插件热更新后继续当前任务</span>
      <span class="usage-val">45<small>次</small></span>
    </div>
    <div class="usage-track"><div class="usage-fill" style="width:15%"></div></div>
  </div>
  <p class="usage-note">横轴从 0 起，条长与使用次数成正比；最长条（300 次）为满格基准。</p>
</div>
