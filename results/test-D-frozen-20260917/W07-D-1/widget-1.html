<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><div class="eb-wrap" id="eb-root">
<style>
.eb-wrap{
  --eb-ok:#19a974;
  --eb-bad:var(--dsw-alias-state-error-primary,#d9534f);
  --eb-wait:#c98a1b;
  --eb-line:var(--dsw-alias-border-l1,rgba(127,127,127,.28));
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--dsw-alias-label-primary,#1f2328);
  background:var(--dsw-alias-bg-layer-1,#fff);
  border:1px solid var(--eb-line);
  border-radius:12px;padding:16px;display:grid;gap:14px;max-width:780px;
}
.eb-wrap *{box-sizing:border-box}
.eb-wrap h3{margin:0;font-size:15px;font-weight:650;letter-spacing:.01em}
.eb-wrap .eb-sub{margin:2px 0 0;font-size:12px;color:var(--dsw-alias-label-tertiary,#7b828c)}
.eb-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.eb-btns{display:flex;gap:8px}
.eb-btn{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:6px 14px;cursor:pointer}
.eb-btn[disabled]{opacity:.45;cursor:not-allowed}
.eb-btn.primary{background:var(--dsw-alias-button-primary-fill,#3b6cf0);color:var(--dsw-alias-label-primary-inverted,#fff);border:1px solid transparent}
.eb-btn.ghost{background:transparent;color:var(--dsw-alias-label-primary,#1f2328);border:1px solid var(--eb-line)}
.eb-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.eb-stat{background:var(--dsw-alias-bg-layer-2,rgba(127,127,127,.07));border:1px solid var(--eb-line);border-radius:9px;padding:8px 10px;min-width:0}
.eb-stat .k{display:block;font-size:11px;color:var(--dsw-alias-label-tertiary,#7b828c)}
.eb-stat .v{display:block;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;min-height:24px}
.eb-stat .v small{font-size:12px;font-weight:500;color:var(--dsw-alias-label-secondary,#5b6470)}
.eb-main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:600px){.eb-main{grid-template-columns:minmax(0,1fr)}}
.eb-sec-t{font-size:12px;font-weight:650;color:var(--dsw-alias-label-secondary,#5b6470);margin:0 0 8px}
.eb-tl{list-style:none;margin:0;padding:0;position:relative}
.eb-tl::before{content:"";position:absolute;left:9px;top:16px;bottom:16px;width:1px;background:var(--eb-line)}
.eb-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px 0;position:relative}
.eb-dot{width:11px;height:11px;border-radius:50%;justify-self:start;margin-left:4px;background:var(--dsw-alias-bg-layer-1,#fff);border:2px solid var(--eb-line)}
.eb-row.is-pending{opacity:.42}
.eb-row.is-pending .eb-lab{color:var(--dsw-alias-label-secondary,#5b6470)}
.eb-row.is-current{opacity:1}
.eb-row.is-current .eb-dot{border-color:var(--dsw-alias-brand-primary,#3b6cf0);box-shadow:0 0 0 3px color-mix(in srgb,var(--dsw-alias-brand-primary,#3b6cf0) 20%,transparent)}
.eb-row.is-bad .eb-dot{border-color:var(--eb-bad);background:var(--eb-bad)}
.eb-row.is-ok .eb-dot{border-color:var(--eb-ok);background:var(--eb-ok)}
.eb-row.is-wait .eb-dot{border-color:var(--eb-wait);background:var(--eb-wait)}
.eb-lab{min-width:0;overflow-wrap:anywhere}
.eb-row.is-bad .eb-lab{color:var(--eb-bad);font-weight:600}
.eb-row.is-ok .eb-lab{color:var(--eb-ok);font-weight:650}
.eb-row.is-wait .eb-lab{font-weight:600}
.eb-meta{font-size:12px;color:var(--dsw-alias-label-tertiary,#7b828c);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.eb-lads{display:grid;gap:9px}
.eb-lad{padding:2px 0}
.eb-lad-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dsw-alias-label-secondary,#5b6470);margin-bottom:4px}
.eb-lad-top b{font-variant-numeric:tabular-nums;color:var(--dsw-alias-label-primary,#1f2328)}
.eb-track{height:10px;border-radius:5px;background:var(--dsw-alias-bg-layer-2,rgba(127,127,127,.1));border:1px solid var(--eb-line);overflow:hidden}
.eb-fill{height:100%;width:0;border-radius:4px 0 0 4px;background:var(--eb-wait);transition:width .35s ease,background .2s ease}
.eb-lad[data-state="next"] .eb-fill{background:var(--dsw-alias-brand-primary,#3b6cf0);opacity:.55}
.eb-lad[data-state="next"] .eb-lad-top b{color:var(--dsw-alias-brand-primary,#3b6cf0)}
.eb-lad[data-state="unused"]{opacity:.5}
.eb-lad[data-state="unused"] .eb-track{border-style:dashed}
.eb-lad[data-state="unused"] .eb-fill{width:100%!important;background:transparent}
.eb-lad .tag{font-size:11px;color:var(--dsw-alias-label-tertiary,#7b828c)}
.eb-status{font-size:13px;font-weight:600;min-height:20px}
.eb-foot{font-size:12px;color:var(--dsw-alias-label-tertiary,#7b828c);border-top:1px solid var(--eb-line);padding-top:9px}
@media (prefers-reduced-motion:reduce){.eb-wrap *{transition:none!important}}
</style>

<div class="eb-head">
  <div>
    <h3>指数退避 · 单步演示</h3>
    <p class="eb-sub">示意场景，不发起真实网络请求</p>
  </div>
  <div class="eb-btns">
    <button class="eb-btn primary" id="eb-next" type="button">下一步</button>
    <button class="eb-btn ghost" id="eb-reset" type="button">重置</button>
  </div>
</div>

<div class="eb-stats">
  <div class="eb-stat"><span class="k">已用请求</span><span class="v"><span id="eb-att">0</span><small> / 4</small></span></div>
  <div class="eb-stat"><span class="k">累计等待</span><span class="v"><span id="eb-cum">0</span><small> s</small></span></div>
  <div class="eb-stat"><span class="k">下一次等待</span><span class="v"><span id="eb-nextw">1</span><small> s</small></span></div>
  <div class="eb-stat"><span class="k">状态</span><span class="v" style="font-size:13px;line-height:1.4" id="eb-status" aria-live="polite">待开始</span></div>
</div>

<div class="eb-main">
  <div>
    <p class="eb-sec-t">事件时间线</p>
    <ol class="eb-tl" id="eb-tl"></ol>
  </div>
  <div>
    <p class="eb-sec-t">退避阶梯（等待时长）</p>
    <div class="eb-lads">
      <div class="eb-lad" data-i="0" data-state="idle">
        <div class="eb-lad-top"><span>第 1 次失败后</span><b>1 s</b></div>
        <div class="eb-track"><div class="eb-fill" data-w="25"></div></div>
      </div>
      <div class="eb-lad" data-i="1" data-state="idle">
        <div class="eb-lad-top"><span>第 2 次失败后</span><b>2 s</b></div>
        <div class="eb-track"><div class="eb-fill" data-w="50"></div></div>
      </div>
      <div class="eb-lad" data-i="2" data-state="unused">
        <div class="eb-lad-top"><span>第 3 次若也失败 <span class="tag">未触发</span></span><b>4 s</b></div>
        <div class="eb-track"><div class="eb-fill" data-w="100"></div></div>
      </div>
    </div>
    <p class="eb-status" id="eb-status2" style="margin:10px 0 0;font-size:12px;font-weight:500;color:var(--dsw-alias-label-secondary,#5b6470)"></p>
  </div>
</div>

<p class="eb-foot">规则：最多 4 次请求；第 3 次成功即停止，因此第 4 次不会发起，等待阶梯中的 4 s 也不会被触发。等待按 1 → 2 → 4 秒翻倍。</p>
</div>

<script>
(function(){
  var STEPS = [
    {kind:'attempt', n:1, ok:false, wait:1},
    {kind:'wait', dur:1},
    {kind:'attempt', n:2, ok:false, wait:2},
    {kind:'wait', dur:2},
    {kind:'attempt', n:3, ok:true,  wait:null}
  ];
  var N = STEPS.length;
  var s = 0;

  var tl = document.getElementById('eb-tl');
  var attEl = document.getElementById('eb-att');
  var cumEl = document.getElementById('eb-cum');
  var nextwEl = document.getElementById('eb-nextw');
  var statusEl = document.getElementById('eb-status');
  var status2El = document.getElementById('eb-status2');
  var nextBtn = document.getElementById('eb-next');
  var resetBtn = document.getElementById('eb-reset');
  var lads = Array.prototype.slice.call(document.querySelectorAll('.eb-lad'));

  var rows = [];
  for (var i = 0; i < N; i++) {
    var li = document.createElement('li');
    li.className = 'eb-row';
    li.innerHTML = '<span class="eb-dot"></span><span class="eb-lab"></span><span class="eb-meta"></span>';
    tl.appendChild(li);
    rows.push(li);
  }

  function cumUpTo(k) {
    var t = 0;
    for (var i = 0; i < k; i++) if (STEPS[i].kind === 'wait') t += STEPS[i].dur;
    return t;
  }
  function attemptsUpTo(k) {
    var t = 0;
    for (var i = 0; i < k; i++) if (STEPS[i].kind === 'attempt') t++;
    return t;
  }
  function pendingWait() {
    for (var i = s; i < N; i++) if (STEPS[i].kind === 'wait') return STEPS[i].dur;
    return null;
  }
  function statusText() {
    if (s === 0) return '待开始';
    if (s === N) return '第 3 次成功 · 已停止';
    var last = STEPS[s - 1];
    if (last.kind === 'attempt') return '第 ' + last.n + ' 次失败 · 准备等待 ' + last.wait + ' s';
    return '等待完成 · 准备第 ' + (attemptsUpTo(s) + 1) + ' 次请求';
  }

  function render() {
    attEl.textContent = attemptsUpTo(s);
    cumEl.textContent = cumUpTo(s);
    var pw = pendingWait();
    nextwEl.textContent = (pw === null) ? '—' : pw;
    var st = statusText();
    statusEl.textContent = st;
    status2El.textContent = st;

    for (var i = 0; i < N; i++) {
      var li = rows[i], step = STEPS[i], done = i < s;
      var lab = li.querySelector('.eb-lab'), meta = li.querySelector('.eb-meta');
      li.className = 'eb-row' + (step.kind === 'wait' ? ' eb-wait' : ' eb-att');
      if (!done) {
        li.classList.add('is-pending');
        if (i === s) li.classList.add('is-current');
        lab.textContent = (step.kind === 'wait') ? ('等待 ' + step.dur + ' s') : ('请求 #' + step.n);
        meta.textContent = '待执行';
      } else if (step.kind === 'wait') {
        li.classList.add('is-wait');
        lab.textContent = '已等待 ' + step.dur + ' s';
        meta.textContent = '累计 ' + cumUpTo(i + 1) + ' s';
      } else if (step.ok) {
        li.classList.add('is-ok');
        lab.textContent = '请求 #' + step.n + ' → 成功';
        meta.textContent = '停止重试';
      } else {
        li.classList.add('is-bad');
        lab.textContent = '请求 #' + step.n + ' → 失败';
        meta.textContent = '下一次等待 ' + step.wait + ' s';
      }
    }

    // 退避阶梯：0 行 = 1s（s>=2 已完成，s===1 待执行）；1 行 = 2s（s>=4 已完成，s===3 待执行）；2 行 = 预留
    var doneAt = [2, 4];
    var nextAt = [1, 3];
    for (var j = 0; j < 2; j++) {
      var stt = (s >= doneAt[j]) ? 'done' : (s === nextAt[j] ? 'next' : 'idle');
      lads[j].dataset.state = stt;
      lads[j].querySelector('.eb-fill').style.width = (stt === 'idle') ? '0%' : lads[j].querySelector('.eb-fill').dataset.w + '%';
    }
    lads[2].dataset.state = 'unused';

    nextBtn.disabled = (s >= N);
    nextBtn.textContent = (s >= N) ? '已结束' : '下一步';
  }

  nextBtn.addEventListener('click', function () {
    if (s < N) { s++; render(); }
  });
  resetBtn.addEventListener('click', function () {
    s = 0;
    for (var j = 0; j < 2; j++) lads[j].querySelector('.eb-fill').style.width = '0%';
    render();
  });

  render();
})();
</script>
</body></html>
