<style>
.rv{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--dsw-alias-label-primary,#1f2328);}
.rv *{box-sizing:border-box;}
.rv .card{background:var(--dsw-alias-bg-layer-1,#fff);border:1px solid var(--dsw-alias-border-l1,#e6e8eb);border-radius:16px;padding:18px 18px 16px;}
.rv h3{margin:0 0 4px;font-size:16px;line-height:1.4;}
.rv .hint{margin:0 0 14px;font-size:12.5px;line-height:1.5;color:var(--dsw-alias-label-secondary,#5c6470);}
.rv .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;}
@media (max-width:620px){.rv .cols{grid-template-columns:minmax(0,1fr);}}
.rv .controls{display:flex;flex-direction:column;gap:10px;min-width:0;}
.rv .field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.rv .field>span{font-size:12px;color:var(--dsw-alias-label-secondary,#5c6470);}
.rv select{width:100%;max-width:100%;font:inherit;font-size:13px;padding:7px 8px;border-radius:9px;border:1px solid var(--dsw-alias-border-l2,#cfd4da);background:var(--dsw-alias-bg-layer-2,transparent);color:inherit;}
.rv .out{min-width:0;display:flex;flex-direction:column;gap:12px;}
.rv .verdict{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
.rv .badge{font-size:15px;font-weight:650;padding:3px 11px;border-radius:999px;background:var(--dsw-alias-interactive-bg-active,rgba(0,0,0,.07));}
.rv .sub{font-size:12.5px;line-height:1.55;color:var(--dsw-alias-label-secondary,#5c6470);flex:1 1 220px;min-width:0;}
.rv .track{position:relative;height:10px;border-radius:999px;border:1px solid var(--dsw-alias-border-l1,#e6e8eb);background:linear-gradient(90deg,rgba(180,83,9,.22),rgba(127,127,127,.10) 50%,rgba(47,133,90,.22));}
.rv .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--dsw-alias-border-l2,#cfd4da);}
.rv .marker{position:absolute;top:-4px;width:16px;height:18px;margin-left:-8px;border-radius:5px;background:var(--dsw-alias-brand-primary,#3b6cf0);box-shadow:0 1px 3px rgba(0,0,0,.28);transition:left .18s ease;}
@media (prefers-reduced-motion:reduce){.rv .marker{transition:none;}}
.rv .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--dsw-alias-label-tertiary,#8b939e);margin-top:5px;}
.rv .scoreline{font-size:12px;color:var(--dsw-alias-label-secondary,#5c6470);}
.rv .scoreline b{font-variant-numeric:tabular-nums;font-size:13px;}
.rv .why{display:flex;flex-direction:column;gap:9px;}
.rv h4{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--dsw-alias-label-tertiary,#8b939e);}
.rv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;}
.rv li{font-size:12.5px;line-height:1.5;display:flex;gap:6px;align-items:flex-start;min-width:0;}
.rv .delta{flex:0 0 auto;font-size:11px;padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums;background:rgba(127,127,127,.16);}
.rv .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px;}
.rv button{font:inherit;font-size:12.5px;padding:7px 12px;border-radius:9px;border:1px solid transparent;background:var(--dsw-alias-button-primary-fill,#1f6feb);color:var(--dsw-alias-label-primary-inverted,#fff);cursor:pointer;}
.rv button.ghost{background:transparent;color:inherit;border-color:var(--dsw-alias-border-l2,#cfd4da);}
</style>
<div class="rv">
  <section class="card">
    <h3>小团队移动端接口选型天平</h3>
    <p class="hint">按实际情况选，右边给出倾向与理由。倾向度只是把“成本放在哪”显式化，不是评分排名。</p>
    <div class="cols">
      <div class="controls" id="rv-controls"></div>
      <div class="out">
        <div class="verdict">
          <span class="badge" id="rv-vlabel">混合，按路径分</span>
          <span class="sub" id="rv-vsub" aria-live="polite"></span>
        </div>
        <div>
          <div class="track" id="rv-meter" role="img" aria-label="选型倾向天平">
            <div class="mid"></div>
            <div class="marker" id="rv-marker" style="left:56%"></div>
          </div>
          <div class="scale"><span>REST 更合适</span><span>GraphQL 更合适</span></div>
        </div>
        <div class="scoreline">倾向度 <b id="rv-score">+8</b> <span style="color:var(--dsw-alias-label-tertiary,#8b939e)">（−100 纯 REST … +100 纯 GraphQL）</span></div>
        <div class="why">
          <div>
            <h4 id="rv-pros-t">权重最大的两个因素</h4>
            <ul id="rv-pros"></ul>
          </div>
          <div>
            <h4 id="rv-cons-t">决定性变量</h4>
            <ul id="rv-cons"></ul>
          </div>
        </div>
        <div class="actions">
          <button id="rv-ask" type="button">按这套条件给具体方案</button>
          <button id="rv-reset" class="ghost" type="button">重置</button>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
(function(){
  var FACTORS=[
    {id:'clients',label:'客户端种类',def:1,options:[['只有 1 个 App',-12],['2–3 个端，形态相近',4],['4 个以上，还在增加',14]]},
    {id:'churn',label:'页面数据形状的变化',def:1,options:[['基本稳定，一季度动几次',-10],['每季度都有几次改动',2],['几乎每周都在改',12]]},
    {id:'agg',label:'一个屏幕的数据来源',def:1,options:[['基本对应一个接口',-10],['常要拼 2–4 个接口',6],['大量跨模块拼装，字段还要各自裁剪',14]]},
    {id:'cache',label:'HTTP 缓存 / CDN / 网关复用',def:1,options:[['很重要，靠它扛量',-14],['有就行，不指望',-4],['不太在意',6]]},
    {id:'exp',label:'团队 GraphQL 经验',def:1,options:[['没人写过',-12],['有人写过，没形成基建',0],['熟练，愿意建网关与可观测',12]]},
    {id:'write',label:'接口形态',def:1,options:[['以查询为主',6],['读写各半',0],['大量写、事务、文件上传',-12]]}
  ];
  var MAXP=64,MAXN=70,TH=16;
  var host=document.getElementById('rv-controls');
  FACTORS.forEach(function(f){
    var w=document.createElement('label');w.className='field';
    var s=document.createElement('span');s.textContent=f.label;
    var sel=document.createElement('select');sel.id='rv-'+f.id;
    f.options.forEach(function(o){var op=document.createElement('option');op.value=String(o[1]);op.textContent=o[0];sel.appendChild(op);});
    sel.selectedIndex=f.def;
    sel.addEventListener('change',render);
    w.appendChild(s);w.appendChild(sel);host.appendChild(w);
  });
  var el={vlabel:document.getElementById('rv-vlabel'),vsub:document.getElementById('rv-vsub'),
    marker:document.getElementById('rv-marker'),score:document.getElementById('rv-score'),
    meter:document.getElementById('rv-meter'),pros:document.getElementById('rv-pros'),
    cons:document.getElementById('rv-cons'),prosT:document.getElementById('rv-pros-t'),
    consT:document.getElementById('rv-cons-t')};
  function read(){return FACTORS.map(function(f){var sel=document.getElementById('rv-'+f.id);var i=sel.selectedIndex;return {label:f.label,text:f.options[i][0],v:f.options[i][1]};});}
  function desc(a,b){return b.v-a.v;}function asc(a,b){return a.v-b.v;}function mag(a,b){return Math.abs(b.v)-Math.abs(a.v);}
  function fill(ul,arr,fallback){
    ul.innerHTML='';
    var list=arr.length?arr:[{label:'',text:fallback,v:null}];
    list.forEach(function(it){
      var li=document.createElement('li');
      if(it.v!==null){var d=document.createElement('span');d.className='delta';d.textContent=(it.v>0?'+':'')+it.v;
        d.style.background=it.v>0?'rgba(47,133,90,.18)':it.v<0?'rgba(180,83,9,.18)':'rgba(127,127,127,.16)';li.appendChild(d);}
      var t=document.createElement('span');t.textContent=it.label?it.label+'：'+it.text:it.text;li.appendChild(t);
      ul.appendChild(li);
    });
  }
  function render(){
    var items=read();
    var score=items.reduce(function(a,b){return a+b.v;},0);
    var pos=score>=0?50+score/MAXP*50:50+score/MAXN*50;
    pos=Math.max(0,Math.min(100,pos));
    el.marker.style.left=pos.toFixed(1)+'%';
    el.score.textContent=(score>0?'+':'')+score;
    var posv=items.filter(function(i){return i.v>0;}).sort(desc);
    var negv=items.filter(function(i){return i.v<0;}).sort(asc);
    var label;
    if(score>=TH){
      label='偏向 GraphQL';
      el.vlabel.textContent=label;
      el.vsub.textContent='建议只用在读路径：把 GraphQL 当移动端 BFF，写操作、支付、文件继续走 REST，先在一个端试点。';
      el.prosT.textContent='为什么偏 GraphQL';el.consT.textContent='别忽略这些代价';
      fill(el.pros,posv.slice(0,2),'客户端多、字段变化快时，GraphQL 能省掉大量接口版本协商');
      fill(el.cons,negv.slice(0,2),'注意查询复杂度、N+1 与缓存治理，这些是新增的运维成本');
    } else if(score<=-TH){
      label='偏向 REST';
      el.vlabel.textContent=label;
      el.vsub.textContent='用 REST 加一个很薄的 BFF 聚合层：只对着真实屏幕做少量专用端点，比引入 GraphQL 全量基建更省。';
      el.prosT.textContent='为什么偏 REST';el.consT.textContent='如果这些变强，天平会倒向 GraphQL';
      fill(el.pros,negv.slice(0,2),'需求稳定、缓存重要时，HTTP 语义本身就能解决很多问题');
      fill(el.cons,posv.slice(0,2),'一旦端变多、字段增删频繁，靠人肉加接口会开始拖慢迭代');
    } else {
      label='混合';
      el.vlabel.textContent='混合，按路径分';
      el.vsub.textContent='REST 管资源与写，GraphQL 或 BFF 只覆盖字段裁剪频繁、聚合重的读场景；不要同时上两套全量基建。';
      el.prosT.textContent='权重最大的两个因素';el.consT.textContent=score>=0?'把你拉回 REST 的信号':'把你推向 GraphQL 的信号';
      fill(el.pros,items.slice().sort(mag).slice(0,2),'两侧都有一票，说明当前条件还不必做全量选边');
      fill(el.cons,(score>=0?negv:posv).slice(0,2),score>=0?'写操作、事务、缓存/CDN 需求一旦变重，就该往 REST 收':'客户端数量或字段变更频率再上一档，读路径就该独立出来');
    }
    el.meter.setAttribute('aria-label','选型倾向：'+label+'，倾向度 '+score+'，负一百为纯 REST，正一百为纯 GraphQL');
  }
  document.getElementById('rv-ask').addEventListener('click',function(){
    var t=read().map(function(i){return i.label+'='+i.text;}).join('；');
    if(window.dshWidget&&typeof window.dshWidget.sendPrompt==='function'){
      window.dshWidget.sendPrompt('我的移动端接口条件是：'+t+'。请据此给出具体方案：选 REST、GraphQL 还是混合，并列出接口或类型边界示例与迁移步骤。');
    }
  });
  document.getElementById('rv-reset').addEventListener('click',function(){
    FACTORS.forEach(function(f){document.getElementById('rv-'+f.id).selectedIndex=f.def;});
    render();
  });
  render();
})();
</script>
