<style>
.fc{--ok:#22a06b;--err:#e05252;--loop:#5b8def;--mut:#94a3b8;overflow-x:auto;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--dsw-alias-label-primary,#1f2329)}
.fc svg{display:block;width:100%;min-width:800px;height:auto}
.lane{fill:var(--dsw-alias-bg-layer-1,#f5f6f8);stroke:var(--dsw-alias-border-l1,#e4e7ec);stroke-width:1}
.div{stroke:var(--dsw-alias-border-l1,#e4e7ec);stroke-width:1}
.lt{fill:var(--dsw-alias-label-primary,#1f2329);font-size:14px;font-weight:650}
.lr{fill:var(--dsw-alias-label-tertiary,#808795);font-size:10.5px}
.node{fill:var(--dsw-alias-bg-base,#fff);stroke:var(--dsw-alias-border-l2,#cfd5dd);stroke-width:1.3}
.node.ok{stroke:var(--ok);stroke-width:1.7}
.node.err{stroke:var(--err);stroke-width:1.7}
.t{font-size:13px;font-weight:650;fill:var(--dsw-alias-label-primary,#1f2329);text-anchor:middle}
.s{font-size:10.5px;fill:var(--dsw-alias-label-secondary,#5b6270);text-anchor:middle}
.t.ok{fill:var(--ok)}
.t.err{fill:var(--err)}
.ln{fill:none;stroke:var(--mut);stroke-width:1.7}
.ln.ok{stroke:var(--ok)}
.ln.err{stroke:var(--err)}
.ln.loop{stroke:var(--loop);stroke-dasharray:7 6}
.lb{font-size:11px;font-weight:650;text-anchor:middle}
.lb.ok{fill:var(--ok)}
.lb.err{fill:var(--err)}
.lb.loop{fill:var(--loop)}
.lba{text-anchor:start}
.sec{font-size:11px;font-weight:650;fill:var(--err)}
.sec.ok{fill:var(--ok)}
.mt{font-size:10.5px;fill:var(--dsw-alias-label-secondary,#5b6270)}
.mc{font-size:10.5px;font-weight:650;fill:var(--err);text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--dsw-alias-label-secondary,#5b6270)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:20px;border-top:2px solid var(--mut)}
.legend i.ok{border-color:var(--ok)}
.legend i.err{border-color:var(--err)}
.legend i.loop{border-color:var(--loop);border-top-style:dashed}
</style>
<div class="fc">
<svg viewBox="0 0 956 920" role="img" aria-labelledby="fcT fcD">
<title id="fcT">模型 / Host / Web 三方协作的源码提交与修复流程图</title>
<desc id="fcD">模型提交源码，Host 校验并记录版本，Web 隔离渲染。成功则用户在卡片上操作；运行报错时 Web 发起修复请求，Host 从运行日志取回当前源码并请模型修复，再更新原卡片，随后重新隔离渲染。</desc>

<marker id="mErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e05252"/></marker>
<marker id="mLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5b8def"/></marker>
