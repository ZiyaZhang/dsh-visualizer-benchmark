<div class="viz7d">
  <style>
    .viz7d{--bg:#fbfbfa;--panel:#fff;--line:#e7e6e2;--ink:#1c1b19;--muted:#6f6d68;--accent:#4a6cf7;--peak:#d94a3d;--sel:#4a6cf7;
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;color:var(--ink);
      background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;max-width:640px;box-sizing:border-box;font-variant-numeric:tabular-nums}
    .viz7d *{box-sizing:border-box}
    .viz7d h3{margin:0 0 2px;font-size:15px;font-weight:650;letter-spacing:.01em}
    .viz7d .sub{margin:0 0 10px;font-size:12px;color:var(--muted)}
    .viz7d .canvas{position:relative}
    .viz7d svg{display:block;width:100%;height:auto;touch-action:manipulation}
    .viz7d .gridline{stroke:#eeede9;stroke-width:1;shape-rendering:crispEdges}
    .viz7d .axis{stroke:#d8d7d2;stroke-width:1;shape-rendering:crispEdges}
    .viz7d .ytick{fill:#8a8880;font-size:10.5px;text-anchor:end}
    .viz7d .xtick{fill:#55534e;font-size:11.5px;text-anchor:middle}
    .viz7d .xtick.peaked{fill:var(--peak);font-weight:650}
    .viz7d .pt{font-size:10.5px;font-weight:600;text-anchor:middle;fill:#55534e;font-variant-numeric:tabular-nums}
    .viz7d .pt.peaked{fill:var(--peak)}
    .viz7d .unit{fill:#8a8880;font-size:10px}
    .viz7d .barbg{fill:#eceae5}
    .viz7d .bar{fill:var(--accent);transition:fill .15s ease}
    .viz7d .bar.peak{fill:var(--peak)}
    .viz7d .hit{fill:transparent;cursor:pointer}
    .viz7d .hit:focus{outline:none}
    .viz7d .selring{fill:none;stroke:var(--sel);stroke-width:2.5;rx:8;pointer-events:none;opacity:0;transition:opacity .15s ease}
    .viz7d .selring.on{opacity:1}
    .viz7d .baseline{stroke:#b9b7b0;stroke-width:1;stroke-dasharray:4 4}
    .viz7d .baselabel{fill:#8a8880;font-size:10px}
    .viz7d .focus{gap:0}
    .viz7d .focus:focus-visible .hit{outline:2px solid #1c1b19;outline-offset:2px}
    .viz7d .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;padding-top:11px;border-top:1px solid var(--line)}
    .viz7d .readout{flex:1 1 220px;min-height:40px;display:flex;flex-direction:column;justify-content:center;gap:2px}
    .viz7d .readout .k{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
    .viz7d .readout .v{font-size:14.5px;font-weight:600}
    .viz7d .readout .v .num{font-variant-numeric:tabular-nums;color:var(--sel)}
    .viz7d .readout .v.peak .num{color:var(--peak)}
    .viz7d .readout .v .dash{color:#a9a7a0;font-weight:500}
    .viz7d .readout .hint{font-size:12px;color:var(--muted)}
    .viz7d button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
    .viz7d button:hover:not(:disabled){border-color:#c9c7c1;background:#f7f6f3}
    .viz7d button:disabled{opacity:.42;cursor:not-allowed;background:#fff}
    .viz7d button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
    .viz7d button.primary{background:var(--sel);border-color:var(--sel);color:#fff;min-width:172px}
    .viz7d button.primary:hover:not(:disabled){background:#3a5be6;border-color:#3a5be6}
    .viz7d button.primary:disabled{background:#fff;color:var(--ink)}
    .viz7d .peaknote{margin:9px 0 0;font-size:12px;color:var(--peak)}
    @media (prefers-reduced-motion:reduce){.viz7d *{transition:none!important}}
  </style>

  <h3>近 7 天错误率</h3>
  <p class="sub">单位：%（纵轴自 0 起）。点击某一天只会选中它；确认后按“分析所选日期”再发起追问。</p>

  <div class="canvas">
    <svg id="w12svg" viewBox="0 0 620 302" role="group" aria-label="柱状图：第1至7天错误率，可点击选择一天">
      <text class="unit" x="16" y="12">错误率（%）</text>

      <line class="gridline" x1="46" y1="272.0" x2="600" y2="272.0"/>
      <text class="ytick" x="39" y="275.5">0.0</text>
      <line class="gridline" x1="46" y1="236.8" x2="600" y2="236.8"/>
      <text class="ytick" x="39" y="240.3">0.5</text>
      <line class="gridline" x1="46" y1="201.5" x2="600" y2="201.5"/>
      <text class="ytick" x="39" y="205.0">1.0</text>
      <line class="gridline" x1="46" y1="166.3" x2="600" y2="166.3"/>
      <text class="ytick" x="39" y="169.8">1.5</text>
      <line class="gridline" x1="46" y1="131.1" x2="600" y2="131.1"/>
      <text class="ytick" x="39" y="134.6">2.0</text>
      <line class="gridline" x1="46" y1="95.8" x2="600" y2="95.8"/>
      <text class="ytick" x="39" y="99.3">2.5</text>
      <line class="gridline" x1="46" y1="60.6" x2="600" y2="60.6"/>
      <text class="ytick" x="39" y="64.1">3.0</text>

      <line class="axis" x1="46" y1="30" x2="46" y2="272"/>
      <line class="axis" x1="46" y1="272" x2="600" y2="272"/>

      <line class="baseline" x1="46" y1="236.8" x2="600" y2="236.8"/>
      <text class="baselabel" x="600" y="233">基线 0.5%</text>

      <g class="focus" data-key="d1" tabindex="0" role="button" aria-pressed="false" aria-label="第1天 错误率 0.4%">
        <rect class="barbg" x="56.0" y="30" width="30" height="242" rx="8"/>
        <rect class="bar" data-key="d1" x="56.0" y="243.8" width="30" height="28.2" rx="8"/>
        <text class="pt" x="71.0" y="240.8">0.4</text>
        <rect class="hit" data-key="d1" x="46.0" y="30" width="50.0" height="242"/>
      </g>
      <g class="focus" data-key="d2" tabindex="0" role="button" aria-pressed="false" aria-label="第2天 错误率 0.5%">
        <rect class="barbg" x="126.0" y="30" width="30" height="242" rx="8"/>
        <rect class="bar" data-key="d2" x="126.0" y="236.8" width="30" height="35.2" rx="8"/>
        <text class="pt" x="141.0" y="233.8">0.5</text>
        <rect class="hit" data-key="d2" x="116.0" y="30" width="50.0" height="242"/>
      </g>
      <g class="focus" data-key="d3" tabindex="0" role="button" aria-pressed="false" aria-label="第3天 错误率 0.3%">
        <rect class="barbg" x="196.0" y="30" width="30" height="242" rx="8"/>
        <rect class="bar" data-key="d3" x="196.0" y="250.8" width="30" height="21.2" rx="8"/>
        <text class="pt" x="211.0" y="247.8">0.3</text>
        <rect class="hit" data-key="d3" x="186.0" y="30" width="50.0" height="242"/>
      </g>
      <g class="focus" data-key="d4" tabindex="0" role="button" aria-pressed="false" aria-label="第4天 错误率 2.8%，明显高于其余各天">
        <rect class="barbg" x="266.0" y="30" width="30" height="242" rx="8"/>
        <rect class="bar peak" data-key="d4" x="266.0" y="74.8" width="30" height="197.2" rx="8"/>
        <text class="pt peaked" x="281.0" y="71.8">2.8</text>
        <rect class="hit" data-key="d4" x="256.0" y="30" width="50.0" height="242"/>
      </g>
      <g class="focus" data-key="d5" tabindex="0" role="button" aria-pressed="false" aria-label="第5天 错误率 0.6%">
        <rect class="barbg" x="336.0" y="30" width="30" height="242" rx="8"/>
        <rect class="bar" data-key="d5" x="336.0" y="229.8" width="30" height="42.2" rx="8"/>
        <text class="pt" x="351.0" y="226.8">0.6</text>
        <rect class="hit" data-key="d5" x="326.0" y="30" width="50.0" height="242"/>
      </g>
      <g class="focus" data-key="d6" tabindex="0" role="button" aria-pressed="false" aria-label="第6天 错误率 0.5%">
        <rect class="barbg" x="406.0" y="30" width="30" height="242" rx="8"/>
        <rect class="bar" data-key="d6" x="406.0" y="236.8" width="30" height="35.2" rx="8"/>
        <text class="pt" x="421.0" y="233.8">0.5</text>
        <rect class="hit" data-key="d6" x="396.0" y="30" width="50.0" height="242"/>
      </g>
      <g class="focus" data-key="d7" tabindex="0" role="button" aria-pressed="false" aria-label="第7天 错误率 0.4%">
        <rect class="barbg" x="476.0" y="30" width="30" height="242" rx="8"/>
        <rect class="bar" data-key="d7" x="476.0" y="243.8" width="30" height="28.2" rx="8"/>
        <text class="pt" x="491.0" y="240.8">0.4</text>
        <rect class="hit" data-key="d7" x="466.0" y="30" width="50.0" height="242"/>
      </g>
      <rect class="selring" id="w12ring" x="0" y="0" width="0" height="0" rx="8"/>

      <text class="xtick" data-key="d1" x="71.0" y="290">第1天</text>
      <text class="xtick" data-key="d2" x="141.0" y="290">第2天</text>
      <text class="xtick" data-key="d3" x="211.0" y="290">第3天</text>
      <text class="xtick peaked" data-key="d4" x="281.0" y="290">第4天</text>
      <text class="xtick" data-key="d5" x="351.0" y="290">第5天</text>
      <text class="xtick" data-key="d6" x="421.0" y="290">第6天</text>
      <text class="xtick" data-key="d7" x="491.0" y="290">第7天</text>
    </svg>
  </div>

  <div class="row">
    <div class="readout" id="w12readout" aria-live="polite">
      <span class="k">已选日期</span>
      <span class="v" id="w12sel"><span class="dash">未选择（点击某一天以选中）</span></span>
    </div>
    <button type="button" class="primary" id="w12btn" disabled>分析所选日期</button>
  </div>
  <p class="peaknote">第 4 天 2.8% 约为其余各天（0.3%–0.6%）的 5–9 倍，是这一周唯一的异常点。</p>

  <script>
    (function(){
      var DATA = {
        d1:{day:1, label:'第1天', v:0.4, x:56,  y:243.8, h:28.2,   cx:71.0,  cw:30},
        d2:{day:2, label:'第2天', v:0.5, x:126, y:236.8, h:35.2,   cx:141.0, cw:30},
        d3:{day:3, label:'第3天', v:0.3, x:196, y:250.8, h:21.2,   cx:211.0, cw:30},
        d4:{day:4, label:'第4天', v:2.8, x:266, y:74.8,  h:197.2,  cx:281.0, cw:30},
        d5:{day:5, label:'第5天', v:0.6, x:336, y:229.8, h:42.2,   cx:351.0, cw:30},
        d6:{day:6, label:'第6天', v:0.5, x:406, y:236.8, h:35.2,   cx:421.0, cw:30},
        d7:{day:7, label:'第7天', v:0.4, x:476, y:243.8, h:28.2,   cx:491.0, cw:30}
      };
      var svg   = document.getElementById('w12svg');
      if(!svg || svg.dataset.bound === '1') return;
      svg.dataset.bound = '1';
      var ring  = document.getElementById('w12ring');
      var selEl = document.getElementById('w12sel');
      var btn   = document.getElementById('w12btn');
      if(!ring || !selEl || !btn) return;
      var groups = Array.prototype.slice.call(svg.querySelectorAll('.focus'));
      var bars   = Array.prototype.slice.call(svg.querySelectorAll('.bar'));
      var ticks  = Array.prototype.slice.call(svg.querySelectorAll('.xtick'));
      var selected = null;

      function fmt(n){ return n.toFixed(1); }

      function paint(){
        groups.forEach(function(g){
          g.setAttribute('aria-pressed', g.dataset.key === selected ? 'true' : 'false');
        });
        bars.forEach(function(b){
          b.style.fill = (b.dataset.key === selected) ? '#4a6cf7' : '';
        });
        ticks.forEach(function(t){
          if(t.dataset.key === selected) t.style.fill = '#4a6cf7';
          else t.style.fill = '';
        });
        if(!selected){
          ring.classList.remove('on');
          selEl.innerHTML = '<span class="dash">未选择（点击某一天以选中）</span>';
          btn.disabled = true;
          return;
        }
        var d = DATA[selected];
        ring.setAttribute('x', String(d.x - 4));
        ring.setAttribute('y', String(d.y - 4));
        ring.setAttribute('width', String(d.cw + 8));
        ring.setAttribute('height', String(d.h + 8));
        ring.classList.add('on');
        selEl.innerHTML = '<span class="k2"></span>' + d.label + ' · <span class="num">' + fmt(d.v) + '%</span> 错误率';
        selEl.className = 'v' + (d.v >= 2 ? ' peak' : '');
        btn.disabled = false;
      }

      function select(key){
        if(!DATA[key]) return;
        selected = key;
        paint();
      }

      svg.addEventListener('click', function(e){
        var el = e.target.closest('[data-key]');
        if(!el) return;
        select(el.dataset.key);
      });
      svg.addEventListener('keydown', function(e){
        var g = e.target.closest('.focus');
        if(!g) return;
        if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
          e.preventDefault();
          select(g.dataset.key);
        }
      });

      btn.addEventListener('click', function(){
        if(!selected) return;
        var d = DATA[selected];
        var others = Object.keys(DATA).filter(function(k){ return k !== selected; })
          .map(function(k){ return fmt(DATA[k].v) + '%'; }).join('、');
        var text = '请分析我选中的日期：' + d.label + '，错误率 ' + fmt(d.v) + '%。'
          + '（同期其余各天：' + others + '）'
          + '为什么这一天的错误率会明显偏高，最可能的原因是什么，需要优先核查哪些环节？';
        if(window.dshWidget && typeof window.dshWidget.sendPrompt === 'function'){
          window.dshWidget.sendPrompt(text);
        }
      });

      paint();
    })();
  </script>
</div>
