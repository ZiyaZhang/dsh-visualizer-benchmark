<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}

:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>

</style>
<section class="cc-wrap" aria-label="缓存命中率与输入成本示意">
  <div class="cc-controls">
    <div class="cc-presets" role="group" aria-label="命中率快捷选择">
      <button type="button" data-rate="0" aria-pressed="false">0%</button>
      <button type="button" data-rate="50" aria-pressed="true">50%</button>
      <button type="button" data-rate="100" aria-pressed="false">100%</button>
    </div>
    <div class="cc-slider">
      <label for="cc-rate">命中率</label>
      <input type="range" id="cc-rate" min="0" max="100" step="1" value="50" aria-valuetext="命中率 50%">
      <span class="cc-rate-out" id="cc-rate-out">50%</span>
    </div>
  </div>

  <div class="cc-panel">
    <div class="cc-title"><span>输入构成 · 固定 1000 token</span><span>每格 = 1000 token 总量</span></div>
    <div class="cc-bar" id="cc-tok-bar" role="img" aria-label="命中 500 token，未命中 500 token">
      <div class="cc-seg hit" id="cc-hit-tok-bar" style="width:50%"></div>
      <div class="cc-seg miss" id="cc-miss-tok-bar" style="width:50%"></div>
    </div>
    <div class="cc-legend">
      <div class="cc-item"><span class="cc-swatch hit" aria-hidden="true"></span><span>命中</span><span class="cc-val" id="cc-hit-tok">500 token · 50%</span></div>
      <div class="cc-item"><span class="cc-swatch miss" aria-hidden="true"></span><span>未命中</span><span class="cc-val" id="cc-miss-tok">500 token · 50%</span></div>
    </div>
  </div>

  <div class="cc-panel">
    <div class="cc-title"><span>成本构成 · 示意成本单位</span><span>标尺 0 – 1.00</span></div>
    <div class="cc-track-wrap">
      <div class="cc-bar cost" id="cc-cost-bar" role="img" aria-label="命中成本 0.05，未命中成本 0.50，合计 0.55">
        <div class="cc-seg hit" id="cc-hit-cost-bar" style="width:5%"></div>
        <div class="cc-seg miss" id="cc-miss-cost-bar" style="width:50%"></div>
      </div>
      <span class="cc-ref" aria-hidden="true"></span>
    </div>
    <div class="cc-scale"><span>0</span><span>1.00 · 全未命中</span></div>
    <div class="cc-legend">
      <div class="cc-item"><span class="cc-swatch hit" aria-hidden="true"></span><span>命中成本</span><span class="cc-val" id="cc-hit-cost">0.05</span></div>
      <div class="cc-item"><span class="cc-swatch miss" aria-hidden="true"></span><span>未命中成本</span><span class="cc-val" id="cc-miss-cost">0.50</span></div>
    </div>
  </div>

  <div class="cc-total">
    <div><span class="cc-total-label">总成本</span> <span class="cc-big" id="cc-total">0.55</span> <span class="cc-unit">示意成本单位</span></div>
    <div class="cc-save">较全未命中（1.00）节省 <b id="cc-save">0.45</b> · <b id="cc-save-pct">45%</b></div>
  </div>
  <p class="cc-note">单价示意：未命中 1 单位 / 1000 token，命中 0.1 单位 / 1000 token。总输入固定 1000 token，所以总成本也就是每 1000 token 的示意成本。数值仅作演示，不代表真实价格。</p>
</section>
<script>
  (function () {
    var rate = document.getElementById('cc-rate');
    var rateOut = document.getElementById('cc-rate-out');
    var tokBar = document.getElementById('cc-tok-bar');
    var costBar = document.getElementById('cc-cost-bar');
    var hitTokBar = document.getElementById('cc-hit-tok-bar');
    var missTokBar = document.getElementById('cc-miss-tok-bar');
    var hitCostBar = document.getElementById('cc-hit-cost-bar');
    var missCostBar = document.getElementById('cc-miss-cost-bar');
    var hitTok = document.getElementById('cc-hit-tok');
    var missTok = document.getElementById('cc-miss-tok');
    var hitCostOut = document.getElementById('cc-hit-cost');
    var missCostOut = document.getElementById('cc-miss-cost');
    var totalOut = document.getElementById('cc-total');
    var saveOut = document.getElementById('cc-save');
    var savePctOut = document.getElementById('cc-save-pct');
    var presets = Array.prototype.slice.call(document.querySelectorAll('.cc-presets button'));

    var TOTAL_TOKENS = 1000;
    var MISS_UNIT = 1;
    var HIT_UNIT = 0.1;
    var MAX_COST = TOTAL_TOKENS / 1000 * MISS_UNIT;

    function fmtCost(v) {
      var s = v.toFixed(3);
      return s.charAt(s.length - 1) === '0' ? v.toFixed(2) : s;
    }

    function render() {
      var r = Number(rate.value);
      var hitTokens = TOTAL_TOKENS * r / 100;
      var missTokens = TOTAL_TOKENS - hitTokens;
      var hitCost = hitTokens / 1000 * HIT_UNIT;
      var missCost = missTokens / 1000 * MISS_UNIT;
      var total = hitCost + missCost;
      var saved = MAX_COST - total;
      var pct = Math.round(saved / MAX_COST * 100);

      rateOut.textContent = r + '%';
      rate.setAttribute('aria-valuetext', '命中率 ' + r + '%，1000 token 中命中 ' + hitTokens + ' token，未命中 ' + missTokens + ' token');

      hitTokBar.style.width = r + '%';
      missTokBar.style.width = (100 - r) + '%';
      hitCostBar.style.width = (hitCost / MAX_COST * 100) + '%';
      missCostBar.style.width = (missCost / MAX_COST * 100) + '%';

      tokBar.setAttribute('aria-label', '命中 ' + hitTokens + ' token，未命中 ' + missTokens + ' token');
      costBar.setAttribute('aria-label', '命中成本 ' + fmtCost(hitCost) + '，未命中成本 ' + fmtCost(missCost) + '，合计 ' + fmtCost(total));

      hitTok.textContent = hitTokens + ' token · ' + r + '%';
      missTok.textContent = missTokens + ' token · ' + (100 - r) + '%';
      hitCostOut.textContent = fmtCost(hitCost);
      missCostOut.textContent = fmtCost(missCost);
      totalOut.textContent = fmtCost(total);
      saveOut.textContent = fmtCost(saved);
      savePctOut.textContent = pct + '%';

      presets.forEach(function (b) {
        b.setAttribute('aria-pressed', String(Number(b.dataset.rate) === r));
      });
    }

    rate.addEventListener('input', render);
    presets.forEach(function (b) {
      b.addEventListener('click', function () {
        rate.value = b.dataset.rate;
        render();
      });
    });
    render();
  })();
</script></body></html>
