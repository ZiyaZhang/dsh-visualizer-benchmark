<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}:where(body){padding:0}:where(body>svg){width:100%;height:auto}</style></head><body><svg viewBox="0 0 720 420" width="100%" role="img" aria-labelledby="chTitle chDesc" xmlns="http://www.w3.org/2000/svg">
  <title id="chTitle">月度净新增用户趋势图（1月至6月）</title>
  <desc id="chDesc">折线图：1月 120 人，2月 80 人，3月 160 人，4月 -20 人，5月 0 人，6月 100 人。最高为 3月 160 人，最低为 4月 -20 人（净流失）。</desc>
  <style>
    .bg{fill:var(--dsw-alias-bg-layer-1);stroke:var(--dsw-alias-border-l1)}
    .ttl{font-size:17px;font-weight:600;fill:var(--dsw-alias-label-primary)}
    .unit{font-size:12px;fill:var(--dsw-alias-label-tertiary)}
    .g{stroke:var(--dsw-alias-border-l1);stroke-width:1}
    .zero{stroke:var(--dsw-alias-border-l2);stroke-width:1.5;stroke-dasharray:6 4}
    .neg{stroke:var(--dsw-alias-border-l1);stroke-width:1;stroke-dasharray:3 4}
    .ax{font-size:12px;fill:var(--dsw-alias-label-tertiary)}
    .xl{font-size:13px;fill:var(--dsw-alias-label-secondary)}
    .val{font-size:13px;font-weight:600;fill:var(--dsw-alias-label-primary)}
    .maxlbl{font-size:13px;font-weight:600;fill:var(--dsw-alias-brand-primary)}
    .minlbl{font-size:13px;font-weight:600;fill:var(--dsw-alias-state-error-primary)}
    .line{fill:none;stroke:var(--dsw-alias-brand-primary);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
    .dot{fill:var(--dsw-alias-brand-primary);stroke:var(--dsw-alias-bg-layer-1);stroke-width:2}
    .dotMax{fill:var(--dsw-alias-brand-primary);stroke:var(--dsw-alias-bg-layer-1);stroke-width:2.5}
    .dotMin{fill:var(--dsw-alias-state-error-primary);stroke:var(--dsw-alias-bg-layer-1);stroke-width:2.5}
  </style>

  <rect class="bg" x="0.5" y="0.5" width="719" height="419" rx="12"/>
  <text class="ttl" x="28" y="34">月度净新增用户趋势（1–6月）</text>
  <text class="unit" x="692" y="34" text-anchor="end">单位：人</text>

  <!-- 网格与刻度 -->
  <line class="g" x1="60" y1="72.7" x2="660" y2="72.7"/>
  <line class="g" x1="60" y1="130.2" x2="660" y2="130.2"/>
  <line class="g" x1="60" y1="187.6" x2="660" y2="187.6"/>
  <line class="g" x1="60" y1="245.1" x2="660" y2="245.1"/>
  <line class="zero" x1="60" y1="302.6" x2="660" y2="302.6"/>
  <line class="neg" x1="60" y1="331.3" x2="660" y2="331.3"/>

  <text class="ax" x="52" y="76.7" text-anchor="end">160</text>
  <text class="ax" x="52" y="134.2" text-anchor="end">120</text>
  <text class="ax" x="52" y="191.6" text-anchor="end">80</text>
  <text class="ax" x="52" y="249.1" text-anchor="end">40</text>
  <text class="ax" x="52" y="306.6" text-anchor="end">0</text>
  <text class="ax" x="52" y="335.3" text-anchor="end">-20</text>

  <!-- 趋势线 -->
  <polyline class="line" points="110,130.2 210,187.6 310,72.7 410,331.3 510,302.6 610,158.9"/>

  <!-- 数据点 -->
  <circle class="dot" cx="110" cy="130.2" r="4.5"/>
  <circle class="dot" cx="210" cy="187.6" r="4.5"/>
  <circle class="dotMax" cx="310" cy="72.7" r="7"/>
  <circle class="dotMin" cx="410" cy="331.3" r="6.5"/>
  <circle class="dot" cx="510" cy="302.6" r="4.5"/>
  <circle class="dot" cx="610" cy="158.9" r="4.5"/>

  <!-- 数值标签 -->
  <text class="val" x="110" y="116" text-anchor="middle">120</text>
  <text class="val" x="210" y="174" text-anchor="middle">80</text>
  <text class="val" x="510" y="289" text-anchor="middle">0</text>
  <text class="val" x="610" y="145" text-anchor="middle">100</text>

  <!-- 最高 / 最低标注 -->
  <text class="maxlbl" x="310" y="54" text-anchor="middle">最高 3月 160</text>
  <text class="minlbl" x="410" y="356" text-anchor="middle">最低 4月 -20（净流失）</text>

  <!-- 月份轴 -->
  <text class="xl" x="110" y="386" text-anchor="middle">1月</text>
  <text class="xl" x="210" y="386" text-anchor="middle">2月</text>
  <text class="xl" x="310" y="386" text-anchor="middle">3月</text>
  <text class="xl" x="410" y="386" text-anchor="middle">4月</text>
  <text class="xl" x="510" y="386" text-anchor="middle">5月</text>
  <text class="xl" x="610" y="386" text-anchor="middle">6月</text>
</svg></body></html>
