<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" style="max-width:100%;height:auto" aria-label="柱状图：1月净新增120人，2月0人（有数据），3月数据缺失（斜纹虚框表示），4月负30人，5月80人。零线位于中部，正数柱向上、负数柱向下。">
  <style>
    .t  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif; }
    .h1 { font-size:17px; font-weight:700; fill:var(--dsw-alias-label-primary,#1f2328); }
    .sub{ font-size:12.5px; fill:var(--dsw-alias-label-secondary,#5b6270); }
    .tick{ font-size:12px; fill:var(--dsw-alias-label-tertiary,#8b8f9a); }
    .mon{ font-size:13px; font-weight:600; fill:var(--dsw-alias-label-secondary,#5b6270); }
    .val{ font-size:14px; font-weight:700; }
    .pos{ fill:var(--dsw-alias-brand-primary,#4f7cf7); }
    .neg{ fill:var(--dsw-alias-state-error-primary,#e5484d); }
    .zer{ fill:var(--dsw-alias-label-tertiary,#8b8f9a); }
    .grid{ stroke:var(--dsw-alias-border-l1,#e4e6eb); stroke-width:1; }
    .zero{ stroke:var(--dsw-alias-label-secondary,#5b6270); stroke-width:1.6; }
    .vlab-pos{ fill:var(--dsw-alias-brand-primary,#4f7cf7); }
    .vlab-neg{ fill:var(--dsw-alias-state-error-primary,#e5484d); }
    .vlab-zer{ fill:var(--dsw-alias-label-tertiary,#8b8f9a); }
    .missbox{ fill:url(#hatch); stroke:var(--dsw-alias-label-tertiary,#8b8f9a); stroke-width:1.3; stroke-dasharray:5 4; }
    .leg{ font-size:12px; fill:var(--dsw-alias-label-secondary,#5b6270); }
    .zero-dot{ fill:none; stroke:var(--dsw-alias-label-tertiary,#8b8f9a); stroke-width:2.5; }
    .note{ font-size:11.5px; fill:var(--dsw-alias-label-tertiary,#8b8f9a); }
  </style>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="var(--dsw-alias-label-tertiary,#8b8f9a)" stroke-width="2" opacity="0.38"/>
    </pattern>
  </defs>

  <text class="t h1" x="24" y="30">每月净新增用户</text>
  <text class="t sub" x="24" y="50">1–5 月 · 单位：人</text>

  <!-- gridlines and ticks -->
  <line class="grid" x1="76" y1="80"  x2="672" y2="80"/>
  <line class="grid" x1="76" y1="125" x2="672" y2="125"/>
  <line class="grid" x1="76" y1="170" x2="672" y2="170"/>
  <line class="grid" x1="76" y1="215" x2="672" y2="215"/>
  <line class="grid" x1="76" y1="305" x2="672" y2="305"/>
  <text class="t tick" x="66" y="84"  text-anchor="end">120</text>
  <text class="t tick" x="66" y="129" text-anchor="end">90</text>
  <text class="t tick" x="66" y="174" text-anchor="end">60</text>
  <text class="t tick" x="66" y="219" text-anchor="end">30</text>
  <text class="t tick" x="66" y="264" text-anchor="end">0</text>
  <text class="t tick" x="66" y="309" text-anchor="end">−30</text>

  <!-- zero baseline -->
  <line class="zero" x1="76" y1="260" x2="672" y2="260"/>

  <!-- 1月 +120 -->
  <rect class="pos" x="120" y="80" width="64" height="180" rx="3"/>
  <text class="t val vlab-pos" x="152" y="68" text-anchor="middle">+120</text>
  <text class="t mon" x="152" y="345" text-anchor="middle">1月</text>

  <!-- 2月 0（有数据） -->
  <circle class="zero-dot" cx="264" cy="260" r="7"/>
  <text class="t val vlab-zer" x="264" y="240" text-anchor="middle">0</text>
  <text class="t note" x="264" y="284" text-anchor="middle">有数据</text>
  <text class="t mon" x="264" y="345" text-anchor="middle">2月</text>

  <!-- 3月 缺失 -->
  <rect class="missbox" x="344" y="80" width="64" height="225" rx="4"/>
  <text class="t" x="376" y="188" text-anchor="middle" font-size="26" font-weight="700" fill="var(--dsw-alias-label-tertiary,#8b8f9a)">?</text>
  <text class="t note" x="376" y="212" text-anchor="middle">无数据</text>
  <text class="t mon" x="376" y="345" text-anchor="middle">3月</text>

  <!-- 4月 −30 -->
  <rect class="neg" x="456" y="260" width="64" height="45" rx="3"/>
  <text class="t val vlab-neg" x="488" y="326" text-anchor="middle">−30</text>
  <text class="t mon" x="488" y="345" text-anchor="middle">4月</text>

  <!-- 5月 +80 -->
  <rect class="pos" x="568" y="140" width="64" height="120" rx="3"/>
  <text class="t val vlab-pos" x="600" y="128" text-anchor="middle">+80</text>
  <text class="t mon" x="600" y="345" text-anchor="middle">5月</text>

  <!-- legend -->
  <rect class="pos" x="48" y="384" width="13" height="13" rx="2"/>
  <text class="t leg" x="68" y="395">正数（净增）</text>
  <circle class="zero-dot" cx="176" cy="390" r="6.5"/>
  <text class="t leg" x="190" y="395">0（有数据）</text>
  <rect class="missbox" x="282" y="384" width="13" height="13" rx="2"/>
  <text class="t leg" x="302" y="395">缺失（无数据）</text>
  <rect class="neg" x="404" y="384" width="13" height="13" rx="2"/>
  <text class="t leg" x="424" y="395">负数（净流失）</text>
</svg>
