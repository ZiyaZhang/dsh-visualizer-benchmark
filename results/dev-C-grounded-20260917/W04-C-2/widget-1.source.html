<style>
  .hb-wrap{--hb-max:300;--hb-track:var(--dsw-alias-bg-layer-2,#f2f4f7);--hb-fill:var(--dsw-alias-brand-primary,#4a6cf7);--hb-fill-2:#7f9dff;
    font-family:inherit;color:var(--dsw-alias-label-primary,#1c1f26);
    background:var(--dsw-alias-bg-layer-1,#fff);border:1px solid var(--dsw-alias-border-l1,rgba(0,0,0,.1));
    border-radius:12px;padding:14px 14px 10px;box-sizing:border-box;max-width:640px}
  .hb-wrap *{box-sizing:border-box}
  .hb-title{font-size:14px;font-weight:600;margin:0 0 2px;line-height:1.35}
  .hb-sub{font-size:12px;color:var(--dsw-alias-label-tertiary,#6b7280);margin:0 0 12px}
  .hb-rows{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
  .hb-row{min-width:0}
  .hb-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-bottom:5px}
  .hb-name{font-size:13px;line-height:1.35;min-width:0;flex:1 1 60%}
  .hb-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
  .hb-val span{font-weight:400;font-size:11px;color:var(--dsw-alias-label-tertiary,#6b7280);margin-left:2px}
  .hb-track{position:relative;height:14px;border-radius:7px;background:var(--hb-track);
    box-shadow:inset 0 0 0 1px var(--dsw-alias-border-l1,rgba(0,0,0,.06));overflow:hidden}
  .hb-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--hb-fill),var(--hb-fill-2));
    min-width:4px}
  .hb-axis{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;
    color:var(--dsw-alias-label-tertiary,#6b7280);font-variant-numeric:tabular-nums;
    border-top:1px solid var(--dsw-alias-border-l1,rgba(0,0,0,.1));padding-top:6px}
  .hb-note{font-size:11.5px;color:var(--dsw-alias-label-secondary,#4b5563);margin:10px 0 0;line-height:1.5}
</style>

<div class="hb-wrap">
  <p class="hb-title" id="hb-cap">四个功能的使用次数对比</p>
  <p class="hb-sub">单位：次 · 横向条形长度按统一刻度（0–300）绘制</p>

  <ul class="hb-rows" role="img" aria-labelledby="hb-cap"
      aria-label="横向条形图：直接生成一个简短答案300次，长文档的跨章节证据追溯120次，多轮对话中的上下文恢复80次，插件热更新后继续当前任务45次。">
    <li class="hb-row">
      <div class="hb-head">
        <span class="hb-name">直接生成一个简短答案</span>
        <span class="hb-val">300<span>次</span></span>
      </div>
      <div class="hb-track"><div class="hb-fill" style="width:100%"></div></div>
    </li>
    <li class="hb-row">
      <div class="hb-head">
        <span class="hb-name">长文档的跨章节证据追溯</span>
        <span class="hb-val">120<span>次</span></span>
      </div>
      <div class="hb-track"><div class="hb-fill" style="width:40%"></div></div>
    </li>
    <li class="hb-row">
      <div class="hb-head">
        <span class="hb-name">多轮对话中的上下文恢复</span>
        <span class="hb-val">80<span>次</span></span>
      </div>
      <div class="hb-track"><div class="hb-fill" style="width:26.667%"></div></div>
    </li>
    <li class="hb-row">
      <div class="hb-head">
        <span class="hb-name">插件热更新后继续当前任务</span>
        <span class="hb-val">45<span>次</span></span>
      </div>
      <div class="hb-track"><div class="hb-fill" style="width:15%"></div></div>
    </li>
  </ul>

  <div class="hb-axis" aria-hidden="true"><span>0</span><span>75</span><span>150</span><span>225</span><span>300 次</span></div>
  <p class="hb-note">四次使用次数总和 = 300+120+80+45 = 545 次。最高的“直接生成一个简短答案”（300 次）约占总量的 55%。</p>
</div>
