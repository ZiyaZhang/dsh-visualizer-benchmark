<style>
  .hd-wrap{--hot:#d94a1e;--warm:#e0a020;--cool:#2f7fbf;--cold:#2b5f9e;
    font-size:13px;line-height:1.5;color:var(--dsw-alias-label-primary);
    background:var(--dsw-alias-bg-base);border:1px solid var(--dsw-alias-border-l1);
    border-radius:12px;padding:14px;max-width:620px;margin:0 auto;
    font-variant-numeric:tabular-nums;}
  .hd-wrap *{box-sizing:border-box;}
  .hd-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
  .hd-title{font-weight:650;font-size:14px;}
  .hd-sub{color:var(--dsw-alias-label-secondary);font-size:12px;}
  .hd-rod{margin:10px 0 4px;}
  .hd-rod svg{display:block;width:100%;height:auto;}
  .hd-node{cursor:pointer;}
  .hd-node circle{transition:none;}
  .hd-node:focus{outline:none;}
  .hd-node:focus-visible .ring,.hd-node:hover .ring{opacity:1;}
  .hd-readouts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:8px 0 4px;}
  .hd-cell{background:var(--dsw-alias-bg-layer-2,var(--dsw-alias-bg-layer-1));border:1px solid var(--dsw-alias-border-l1);
    border-radius:8px;padding:6px 8px;text-align:center;min-width:0;}
  .hd-cell .lb{font-size:11px;color:var(--dsw-alias-label-secondary);white-space:nowrap;}
  .hd-cell .vl{font-weight:650;font-size:15px;white-space:nowrap;}
  .hd-cell .tg{font-size:10px;color:var(--dsw-alias-label-tertiary);white-space:nowrap;}
  .hd-cell.sel{border-color:var(--dsw-alias-brand-primary);}
  .hd-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px;}
  .hd-btn{min-height:32px;padding:4px 12px;}
  .hd-stat{margin-left:auto;color:var(--dsw-alias-label-secondary);font-size:12px;white-space:nowrap;}
  .hd-explain{border-top:1px solid var(--dsw-alias-border-l1);margin-top:10px;padding-top:8px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;}
  .hd-expl-txt{flex:1 1 200px;min-width:0;font-size:12px;color:var(--dsw-alias-label-secondary);}
  .hd-eq{color:var(--dsw-alias-label-primary);font-weight:600;}
  .hd-chartbox{flex:0 1 250px;min-width:0;}
  .hd-chartbox canvas{width:100%;height:118px;display:block;}
  .hd-note{font-size:11.5px;color:var(--dsw-alias-label-tertiary);margin-top:6px;}
  @media (max-width:430px){.hd-readouts{grid-template-columns:repeat(3,minmax(0,1fr));} .hd-stat{margin-left:0;}}
</style>
<div class="hd-wrap" id="hdRoot">
  <div class="hd-head">
    <div class="hd-title">5 节点离散热传导示意</div>
    <div class="hd-sub">左端固定 100&nbsp;°C &middot; 右端固定 0&nbsp;°C &middot; 中间 3 节点初始 0&nbsp;°C</div>
  </div>

  <div class="hd-rod">
    <svg id="hdRod" viewBox="0 0 460 132" role="img"
         aria-label="一根离散为 5 个节点的杆，左端固定 100 摄氏度，右端固定 0 摄氏度，中间 3 个节点温度随迭代变化；每个节点颜色与数字表示当前温度。">
      <defs>
        <linearGradient id="hdGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#d94a1e"/><stop offset="1" stop-color="#2b5f9e"/>
        </linearGradient>
      </defs>
      <rect x="40" y="30" width="380" height="26" rx="13" fill="url(#hdGrad)"
            stroke="var(--dsw-alias-border-l2)" stroke-width="1"/>
      <g id="hdLinks"></g>
      <g id="hdNodes"></g>
      <text x="40" y="24" text-anchor="middle" font-size="10.5" fill="var(--dsw-alias-label-tertiary)">左端固定</text>
      <text x="420" y="24" text-anchor="middle" font-size="10.5" fill="var(--dsw-alias-label-tertiary)">右端固定</text>
      <text x="230" y="112" text-anchor="middle" font-size="11" fill="var(--dsw-alias-label-tertiary)">位置 i = 0 … 4（等间距，间距 Δx）</text>
    </svg>
  </div>

  <div class="hd-readouts" id="hdReadouts"></div>

  <div class="hd-ctrl">
    <button class="hd-btn" id="hdStep" type="button">单步</button>
    <button class="hd-btn" id="hdPlay" type="button">连续</button>
    <button class="hd-btn" id="hdReset" type="button">重置</button>
    <div class="hd-stat" id="hdStat">t = 0</div>
  </div>

  <div class="hd-explain">
    <div class="hd-expl-txt" id="hdExpl"></div>
    <div class="hd-chartbox">
      <canvas id="hdChart" role="img" aria-label="中间 3 个节点的温度随迭代步数变化曲线，纵轴 0 到 100 摄氏度。"></canvas>
    </div>
  </div>
  <div class="hd-note" id="hdNote"></div>
</div>
<script>
(function(){
  var root=document.getElementById('hdRoot');
  if(!root||root.dataset.ready)return; root.dataset.ready='1';
  var N=5, ALPHA=0.25, FIXED={0:100,4:0}, MAXT=60;
  var base=[100,0,0,0,0];
  var t=0, cur=base.slice(), prevFrozen=null, hist=[base.slice()], sel=null, timer=null;
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var nodeG=document.getElementById('hdNodes'), linkG=document.getElementById('hdLinks');
  var readouts=document.getElementById('hdReadouts'), stat=document.getElementById('hdStat');
  var expl=document.getElementById('hdExpl'), note=document.getElementById('hdNote');
  var stepBtn=document.getElementById('hdStep'), playBtn=document.getElementById('hdPlay'), resetBtn=document.getElementById('hdReset');
  var canvas=document.getElementById('hdChart'), ctx=canvas.getContext('2d');

  var X=function(i){return 40+i*95;}, Y=43, R=21;
  var NS='http://www.w3.org/2000/svg';
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function lerp(a,b,p){return a+(b-a)*p;}
  function hsl2rgb(h,s,l){
    h=((h%360)+360)%360; s/=100; l/=100;
    var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, r=0,g=0,b=0;
    if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
    else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
    return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
  }
  function color(v){
    var f=Math.min(1,Math.max(0,v/100));
    var rgb=hsl2rgb(30+190*f,72,34+26*f);
    return 'rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')';
  }
  function textColor(v){
    var f=Math.min(1,Math.max(0,v/100));
    var rgb=hsl2rgb(30+190*f,72,34+26*f);
    var L=(0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2])/255;
    return L>0.62?'#1b1b1b':'#ffffff';
  }
  function fmt(v){return v.toFixed(1);}

  // build nodes
  var nodeEls=[];
  for(var i=0;i<N;i++){
    var g=el('g',{class:'hd-node',tabindex:'0',role:'button','aria-label':'节点 '+i});
    var ring=el('circle',{class:'ring',cx:X(i),cy:Y,r:R+4,fill:'none',
      stroke:'var(--dsw-alias-brand-primary)',['stroke-width']:2,opacity:0,'pointer-events':'none'});
    var c=el('circle',{cx:X(i),cy:Y,r:R,stroke:'var(--dsw-alias-bg-base)','stroke-width':2});
    var tx=el('text',{x:X(i),y:Y+4,'text-anchor':'middle','font-size':12,'font-weight':650,'pointer-events':'none'});
    var l=el('text',{x:X(i),y:Y+38,'text-anchor':'middle','font-size':10.5,
      fill:'var(--dsw-alias-label-tertiary)','pointer-events':'none'});
    l.textContent='节点 '+i;
    g.appendChild(ring); g.appendChild(c); g.appendChild(tx); g.appendChild(l);
    (function(idx,gg){ gg.addEventListener('click',function(){ sel=(sel===idx?null:idx); render(); });
      gg.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault(); sel=(sel===idx?null:idx); render();} });
    })(i,g);
    nodeG.appendChild(g);
    nodeEls.push({g:g,c:c,tx:tx});
  }
  // build readout cells
  var cells=[];
  for(var j=0;j<N;j++){
    var d=document.createElement('div'); d.className='hd-cell';
    d.innerHTML='<div class="lb">节点 '+j+'</div><div class="vl">–</div><div class="tg">–</div>';
    readouts.appendChild(d);
    cells.push({box:d,vl:d.querySelector('.vl'),tg:d.querySelector('.tg')});
  }

  function step(){
    if(t>=MAXT)return false;
    var old=cur.slice(), next=old.slice();
    for(var i=1;i<N-1;i++) next[i]=old[i]+ALPHA*(old[i-1]-2*old[i]+old[i+1]);
    for(var k in FIXED) next[k]=FIXED[k];
    t++; prevFrozen=old; cur=next; hist.push(next.slice());
    return true;
  }
  function reset(){
    stop(); t=0; cur=base.slice(); hist=[base.slice()]; prevFrozen=null; sel=null; render();
  }
  function stop(){ if(timer){clearInterval(timer);timer=null;} if(playBtn)playBtn.textContent='连续'; }
  function play(){
    if(timer){stop();return;}
    if(t>=MAXT)reset();
    playBtn.textContent='暂停';
    timer=setInterval(function(){ if(!step()){stop();render();return;} render(); }, reduced?900:520);
  }

  function render(){
    for(var i=0;i<N;i++){
      var v=cur[i], isF=(i in FIXED);
      nodeEls[i].c.setAttribute('fill',color(v));
      nodeEls[i].tx.setAttribute('fill',textColor(v));
      nodeEls[i].tx.textContent=fmt(v);
      nodeEls[i].g.setAttribute('aria-label','节点 '+i+'，当前温度 '+fmt(v)+' 摄氏度'+(isF?'，固定边界':''));
      cells[i].vl.textContent=fmt(v)+'°';
      cells[i].tg.textContent=isF?'固定边界':'计算节点';
      cells[i].box.classList.toggle('sel', sel===i);
      nodeEls[i].g.querySelector('.ring').setAttribute('opacity', sel===i?1:0);
    }
    // links for selected interior node
    linkG.textContent='';
    if(sel!==null && !(sel in FIXED)){
      var nbr=[sel-1,sel+1];
      for(var m=0;m<2;m++){
        var a=Math.min(sel,nbr[m]), b=Math.max(sel,nbr[m]);
        linkG.appendChild(el('line',{x1:X(a),y1:Y,x2:X(b),y2:Y,stroke:'var(--dsw-alias-brand-primary)',
          ['stroke-width']:3,['stroke-dasharray']:'4 3',opacity:0.95}));
      }
      var o=prevFrozen||cur;
      expl.innerHTML='选中 <b>节点 '+sel+'</b>：用上一时刻的邻居值同步更新，'+
        '<span class="hd-eq">T′<sub>'+sel+'</sub> = T<sub>'+sel+'</sub> + 0.25·(T<sub>'+(sel-1)+'</sub> + T<sub>'+(sel+1)+'</sub> − 2·T<sub>'+sel+'</sub>)</span>'+
        '<br>代入 t = '+t+'：'+
        (t===0?'（尚未迭代，右侧为初始值 0）':fmt(o[sel])+' + 0.25·('+fmt(o[sel-1])+' + '+fmt(o[sel+1])+' − 2·'+fmt(o[sel])+')')+
        ' → T′<sub>'+sel+'</sub> = <b>'+fmt(cur[sel])+' °C</b>'+
        '<br><span style="color:var(--dsw-alias-label-tertiary)">虚线连到两个邻居：它们都取 t = '+t+' 时刻的值。</span>';
    }else{
      expl.innerHTML='点击任一<b>中间节点</b>可看它这一步的代入过程。当前 t = '+t+'；'+
        '所有内部节点<b>同时</b>用 t = '+t+' 时刻的温度算出 t = '+(t+1)+' 时刻的值（同步更新，不是原地顺序更新）。'+
        '<br><span style="color:var(--dsw-alias-label-tertiary)">两端为固定边界：温度始终 100 °C 与 0 °C，不参与更新。</span>';
    }
    stat.textContent='t = '+t+' / '+MAXT;
    stepBtn.disabled = (t>=MAXT);
    drawChart();
    if(t>=MAXT){
      note.textContent='已到 '+MAXT+' 步：离散稳态是线性分布，内部节点分别趋于 75.0 / 50.0 / 25.0 °C（与解析稳态一致，因为固定端为 100 与 0）。';
    }else{
      note.textContent='示意说明：这是把杆离散成 5 个节点的显式差分示意，并非连续杆的真实解；区域只用节点温度代表，节点之间用颜色渐变填充仅为视觉连接。';
    }
  }

  function drawChart(){
    var dpr=window.devicePixelRatio||1, w=canvas.clientWidth||250, h=118;
    if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
      canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    var L=26,Rp=6,Tp=8,B=17, pw=Math.max(10,w-L-Rp), ph=h-Tp-B, cols=['#e0a020','#d9622a','#3f8ad0'];
    ctx.font='9px system-ui,sans-serif';
    for(var g=0;g<=4;g++){
      var y=Tp+ph*g/4, val=100-g*25;
      ctx.strokeStyle='var(--dsw-alias-border-l1)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(L,Math.round(y)+0.5); ctx.lineTo(w-Rp,Math.round(y)+0.5); ctx.stroke();
      ctx.fillStyle='var(--dsw-alias-label-tertiary)'; ctx.textAlign='right';
      ctx.fillText(String(val),L-3,y+3);
    }
    var xat=function(k){return L+pw*(MAXT?k/MAXT:0);}, yat=function(v){return Tp+ph*(1-v/100);};
    for(var n=0;n<3;n++){
      var idx=n+1;
      ctx.strokeStyle=cols[n]; ctx.lineWidth=1.8; ctx.beginPath();
      for(var k=0;k<=t;k++){
        var xx=xat(k), yy=yat(hist[k][idx]);
        if(k===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
      }
      ctx.stroke();
      ctx.fillStyle=cols[n];
      ctx.beginPath(); ctx.arc(xat(t),yat(cur[idx]),2.6,0,7); ctx.fill();
    }
    ctx.strokeStyle='var(--dsw-alias-border-l2)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L+0.5,Tp); ctx.lineTo(L+0.5,Tp+ph); ctx.lineTo(w-Rp,Tp+ph); ctx.stroke();
    ctx.fillStyle='var(--dsw-alias-label-tertiary)'; ctx.textAlign='left';
    ctx.fillText('t = 0',L,Tp+ph+12); ctx.textAlign='right'; ctx.fillText('t = '+MAXT,w-Rp,Tp+ph+12);
    ctx.textAlign='left'; ctx.fillStyle='var(--dsw-alias-label-secondary)';
    ctx.fillText('节点 1',L+2,Tp+9);
    ctx.fillStyle='#e0a020'; ctx.fillText('•',L+38,Tp+9);
    ctx.fillStyle='var(--dsw-alias-label-secondary)'; ctx.fillText('节点 2',L+45,Tp+9);
    ctx.fillStyle='#d9622a'; ctx.fillText('•',L+81,Tp+9);
    ctx.fillStyle='var(--dsw-alias-label-secondary)'; ctx.fillText('节点 3',L+88,Tp+9);
    ctx.fillStyle='#3f8ad0'; ctx.fillText('•',L+124,Tp+9);
    void nodeG; void Y;
  }

  stepBtn.addEventListener('click',function(){ stop(); if(step())render(); });
  playBtn.addEventListener('click',play);
  resetBtn.addEventListener('click',reset);

  render();
})();
</script>
