<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .hs-wrap{font-family:inherit;color:var(--dsw-alias-label-primary);display:flex;flex-direction:column;gap:12px;max-width:680px;margin:0 auto;padding:14px;border:1px solid var(--dsw-alias-border-l1);border-radius:14px;background:var(--dsw-alias-bg-layer-1);}
  .hs-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .hs-title{font-size:15px;font-weight:600;}
  .hs-badge{font-size:12px;color:var(--dsw-alias-label-secondary);}
  .hs-wrap svg{width:100%;height:auto;display:block;}
  .lifeline{stroke:var(--dsw-alias-border-l2);stroke-width:1.5;stroke-dasharray:4 4;}
  .node{fill:var(--dsw-alias-bg-layer-2);stroke:var(--dsw-alias-border-l2);}
  .nlabel{fill:var(--dsw-alias-label-primary);font-size:14px;font-weight:600;}
  .seg{stroke:var(--dsw-alias-border-l2);stroke-width:1.6;fill:none;opacity:.4;transition:stroke .25s,opacity .25s;}
  .seg.on{stroke:var(--dsw-alias-brand-primary);stroke-width:2.6;opacity:1;}
  .slabel{fill:var(--dsw-alias-label-secondary);font-size:12.5px;transition:fill .25s;}
  .slabel.on{fill:var(--dsw-alias-brand-primary);font-weight:600;}
  .mtx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .chip{border:1px solid var(--dsw-alias-border-l1);border-radius:10px;padding:8px 10px;background:var(--dsw-alias-bg-layer-2);opacity:.45;transition:opacity .25s,border-color .25s;min-width:0;}
  .chip.on{opacity:1;border-color:var(--dsw-alias-brand-primary);}
  .chip b{display:block;font-size:13px;font-weight:600;}
  .chip span{font-size:11.5px;color:var(--dsw-alias-label-secondary);}
  .read{font-size:13px;line-height:1.65;background:var(--dsw-alias-bg-layer-2);border-radius:10px;padding:10px 12px;border:1px solid var(--dsw-alias-border-l1);min-height:78px;}
  .read strong{color:var(--dsw-alias-brand-primary);}
  .ctrl{display:flex;align-items:center;gap:10px;}
  .ctrl input{flex:1;min-width:0;}
  .ctrl label{font-size:12.5px;color:var(--dsw-alias-label-secondary);white-space:nowrap;}
</style>
<div class="hs-wrap" role="group" aria-label="TCP 三次握手交互示意图">
  <div class="hs-head">
    <div class="hs-title">TCP 三次握手：每一步多确认了什么</div>
    <div class="hs-badge" id="hsBadge">步骤 1 / 3</div>
  </div>

  <svg viewBox="0 0 660 300" role="img" aria-labelledby="hsSvgTitle">
    <title id="hsSvgTitle">客户端与服务器之间 SYN、SYN+ACK、ACK 三次报文交换的时序图</title>
    <defs>
      <marker id="ahDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="var(--dsw-alias-border-l2)"/>
      </marker>
      <marker id="ahOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="var(--dsw-alias-brand-primary)"/>
      </marker>
    </defs>

    <line class="lifeline" x1="120" y1="64" x2="120" y2="288"/>
    <line class="lifeline" x1="540" y1="64" x2="540" y2="288"/>
    <rect class="node" x="70" y="20" width="100" height="34" rx="9"/>
    <text class="nlabel" x="120" y="42" text-anchor="middle">客户端</text>
    <rect class="node" x="490" y="20" width="100" height="34" rx="9"/>
    <text class="nlabel" x="540" y="42" text-anchor="middle">服务器</text>

    <text id="hsT1" class="slabel" x="330" y="100" text-anchor="middle">① SYN  seq=x</text>
    <line id="hsS1" class="seg" x1="120" y1="112" x2="540" y2="112" marker-end="url(#ahDim)"/>

    <text id="hsT2" class="slabel" x="330" y="168" text-anchor="middle">② SYN+ACK  seq=y, ack=x+1</text>
    <line id="hsS2" class="seg" x1="540" y1="180" x2="120" y2="180" marker-end="url(#ahDim)"/>

    <text id="hsT3" class="slabel" x="330" y="236" text-anchor="middle">③ ACK  ack=y+1</text>
    <line id="hsS3" class="seg" x1="120" y1="248" x2="540" y2="248" marker-end="url(#ahDim)"/>
  </svg>

  <div class="ctrl">
    <label for="hsRange">握手进度</label>
    <input id="hsRange" type="range" min="1" max="3" step="1" value="1" aria-label="握手进度，1 到 3"/>
  </div>

  <div class="read" id="hsRead"></div>

  <div class="mtx" aria-label="四项能力被确认的步骤">
    <div class="chip" data-step="1"><b>服务器能接收</b><span>步骤 1 确认</span></div>
    <div class="chip" data-step="2"><b>客户端能发送</b><span>步骤 2 确认</span></div>
    <div class="chip" data-step="2"><b>服务器能发送</b><span>步骤 2 确认</span></div>
    <div class="chip" data-step="3"><b>客户端能接收</b><span>步骤 3 确认</span></div>
  </div>
</div>
<script>
(function(){
  var R = {
    1: '① 客户端发出的 <strong>SYN（seq=x）</strong> 到达服务器。服务器由此确认：<strong>客户端能发、自己能收</strong>，于是回 SYN+ACK。<br>此刻客户端什么也还没确认——它只知道自己发过一个包，对服务器是否在线、自己的包是否送达一无所知。',
    2: '② <strong>SYN+ACK</strong> 回到客户端。客户端由「我发的 SYN 被正确应答」确认<strong>自己能发</strong>，又因为收到对方报文而确认<strong>自己能收、服务器能发</strong>。<br>但服务器仍不知道这个 SYN+ACK 有没有被收到，所以还不敢认为连接已建立。',
    3: '③ 客户端补上 <strong>ACK（ack=y+1）</strong>。服务器收到后确认<strong>自己能发、客户端能收</strong>。<br>至此收发四个方向全部被确认，双方的初始序号 x、y 也各自得到对方确认，连接正式建立。'
  };
  var range = document.getElementById('hsRange');
  var badge = document.getElementById('hsBadge');
  var read = document.getElementById('hsRead');
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));

  function render(n){
    badge.textContent = '步骤 ' + n + ' / 3';
    read.innerHTML = R[n];
    [1,2,3].forEach(function(i){
      var on = n >= i;
      document.getElementById('hsS' + i).classList.toggle('on', on);
      document.getElementById('hsT' + i).classList.toggle('on', on);
      document.getElementById('hsS' + i).setAttribute('marker-end', on ? 'url(#ahOn)' : 'url(#ahDim)');
    });
    chips.forEach(function(c){
      c.classList.toggle('on', n >= parseInt(c.getAttribute('data-step'), 10));
    });
  }
  range.addEventListener('input', function(){ render(parseInt(range.value, 10)); });
  render(parseInt(range.value, 10));
})();
</script></body></html>
