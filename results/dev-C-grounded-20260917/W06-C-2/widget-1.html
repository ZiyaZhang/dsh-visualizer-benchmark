<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .rs-wrap { display:flex; flex-direction:column; gap:12px; padding:14px 16px; background:var(--dsw-alias-bg-layer-1); border:1px solid var(--dsw-alias-border-l1); border-radius:12px; color:var(--dsw-alias-label-primary); font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .rs-head { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; }
  .rs-title { font-weight:600; font-size:15px; }
  .rs-unit { color:var(--dsw-alias-label-tertiary); font-size:12px; }
  .rs-rows { display:flex; flex-direction:column; gap:6px; }
  .rs-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:10px; width:100%; padding:7px 8px; border:1px solid transparent; border-radius:8px; background:transparent; color:inherit; font:inherit; text-align:left; cursor:pointer; }
  .rs-row:hover { background:var(--dsw-alias-interactive-bg-hover); }
  .rs-row:focus-visible { outline:2px solid var(--dsw-alias-brand-primary); outline-offset:1px; }
  .rs-row[aria-pressed="true"] { border-color:var(--dsw-alias-brand-primary); background:var(--dsw-alias-interactive-bg-active); }
  .rs-name { min-width:44px; white-space:nowrap; }
  .rs-track { position:relative; height:16px; min-width:0; border-radius:4px; background:var(--dsw-alias-bg-layer-2); overflow:hidden; }
  .rs-bar { height:100%; width:0; border-radius:4px; background:var(--dsw-alias-brand-primary); opacity:.45; transition:width .18s ease, opacity .18s ease; }
  .rs-row[aria-pressed="true"] .rs-bar { opacity:1; }
  .rs-val { min-width:70px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .rs-foot { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding-top:10px; border-top:1px solid var(--dsw-alias-border-l1); }
  .rs-read { min-width:0; font-variant-numeric:tabular-nums; color:var(--dsw-alias-label-secondary); }
  .rs-read strong { color:var(--dsw-alias-label-primary); font-weight:600; }
  .rs-btn { margin-left:auto; padding:7px 14px; border:1px solid transparent; border-radius:8px; background:var(--dsw-alias-button-primary-fill); color:var(--dsw-alias-label-primary-inverted); font:inherit; font-weight:600; cursor:pointer; }
  .rs-btn:disabled { cursor:not-allowed; opacity:.5; }
  .rs-hint { flex-basis:100%; color:var(--dsw-alias-label-tertiary); font-size:12px; }
  .rs-echo { display:none; margin:0; padding:8px 10px; border-left:2px solid var(--dsw-alias-brand-primary); border-radius:0 6px 6px 0; background:var(--dsw-alias-bg-layer-2); color:var(--dsw-alias-label-secondary); font-size:12px; }
  @media (prefers-reduced-motion: reduce) { .rs-bar { transition:none; } }
</style>
<div class="rs-wrap" id="rsRoot">
  <div class="rs-head">
    <span class="rs-title" id="rsTitle">地区销售对比</span>
    <span class="rs-unit">单位：万元</span>
  </div>
  <div class="rs-rows" role="group" aria-labelledby="rsTitle" id="rsRows">
    <button type="button" class="rs-row" data-region="华东" data-value="120" aria-pressed="false">
      <span class="rs-name">华东</span><span class="rs-track"><span class="rs-bar" data-bar="120"></span></span><span class="rs-val">120</span>
    </button>
    <button type="button" class="rs-row" data-region="华南" data-value="80" aria-pressed="false">
      <span class="rs-name">华南</span><span class="rs-track"><span class="rs-bar" data-bar="80"></span></span><span class="rs-val">80</span>
    </button>
    <button type="button" class="rs-row" data-region="西部" data-value="50" aria-pressed="false">
      <span class="rs-name">西部</span><span class="rs-track"><span class="rs-bar" data-bar="50"></span></span><span class="rs-val">50</span>
    </button>
  </div>
  <div class="rs-foot">
    <span class="rs-read" id="rsRead"><strong>未选择</strong> · 点击地区仅本地选中</span>
    <button type="button" class="rs-btn" id="rsAsk" disabled>解释所选地区</button>
    <span class="rs-hint" id="rsHint">还未选择地区：请先点选一个地区，再点击“解释所选地区”。</span>
    <p class="rs-echo" id="rsEcho" aria-live="polite"></p>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('rsRoot');
  if (!root) return;
  var rows = Array.prototype.slice.call(root.querySelectorAll('.rs-row'));
  var bars = root.querySelectorAll('.rs-bar');
  var read = document.getElementById('rsRead');
  var hint = document.getElementById('rsHint');
  var ask = document.getElementById('rsAsk');
  var echo = document.getElementById('rsEcho');

  // 固定比例尺：以最大值为满格，所有条形共用同一比例
  var max = 0, i;
  for (i = 0; i < rows.length; i++) max = Math.max(max, Number(rows[i].dataset.value));
  for (i = 0; i < bars.length; i++) {
    bars[i].style.width = (Number(bars[i].dataset.bar) / max * 100) + '%';
  }

  function render() {
    var selected = null;
    for (var j = 0; j < rows.length; j++) {
      var on = rows[j].getAttribute('aria-pressed') === 'true';
      rows[j].setAttribute('aria-pressed', on ? 'true' : 'false');
      if (on) selected = rows[j];
    }
    if (selected) {
      read.innerHTML = '已选择 <strong>' + selected.dataset.region + '</strong> · ' + selected.dataset.value + ' 万元';
      ask.disabled = false;
      hint.textContent = '点击“解释所选地区”后，才会把所选地区与数值发送给我。';
    } else {
      read.innerHTML = '<strong>未选择</strong> · 点击地区仅本地选中';
      ask.disabled = true;
      hint.textContent = '还未选择地区：请先点选一个地区，再点击“解释所选地区”。';
    }
  }

  root.addEventListener('click', function (e) {
    var row = e.target.closest ? e.target.closest('.rs-row') : null;
    if (!row || !root.contains(row)) return;
    var wasOn = row.getAttribute('aria-pressed') === 'true';
    for (var k = 0; k < rows.length; k++) rows[k].setAttribute('aria-pressed', 'false');
    row.setAttribute('aria-pressed', wasOn ? 'false' : 'true');
    echo.style.display = 'none';   // 清掉上一次追问的旧回显
    render();                      // 本地选中：不发任何追问
  });

  ask.addEventListener('click', function () {
    var selected = null;
    for (var j = 0; j < rows.length; j++) {
      if (rows[j].getAttribute('aria-pressed') === 'true') selected = rows[j];
    }
    if (!selected || typeof window.dshWidget === 'undefined' || !window.dshWidget.sendPrompt) return;
    var message = '我选择了' + selected.dataset.region + '，销售额为' + selected.dataset.value + '万元（华东120万元、华南80万元、西部50万元）。请解释这个地区的销售表现，并结合其他地区做对比。';
    window.dshWidget.sendPrompt(message);
    echo.textContent = '已追问：' + message;
    echo.style.display = 'block';
  });

  render();
})();
</script></body></html>
