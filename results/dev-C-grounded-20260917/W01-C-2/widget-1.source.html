<div class="bsv" role="group" aria-label="二分查找演示：在有序数组 2、5、8、12、16、23、38、56 中查找 23">
<style>
.bsv{--brand:var(--dsw-alias-brand-primary,#3b6ef5);font:inherit;color:var(--dsw-alias-label-primary,#101828);display:grid;gap:12px;min-width:0}
.bsv *{box-sizing:border-box}
.bsv-top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
.bsv-target{font-size:14px;color:var(--dsw-alias-label-secondary,#555)}
.bsv-target b{font-size:19px;color:var(--brand);font-variant-numeric:tabular-nums}
.bsv-stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--dsw-alias-label-secondary,#555)}
.bsv-stats b{color:var(--dsw-alias-label-primary,#101828);font-variant-numeric:tabular-nums}
.bsv-scroll{overflow-x:auto;padding:2px 0 4px;min-width:0}
.bsv-array{display:flex;gap:clamp(4px,1.1vw,9px);min-width:max-content;padding:2px}
.bsv-col{display:flex;flex-direction:column;align-items:center;gap:3px}
.bsv-cell{width:clamp(34px,8.2vw,50px);height:clamp(34px,8.2vw,50px);display:grid;place-items:center;border:1.5px solid var(--dsw-alias-border-l1,#d0d5dd);border-radius:10px;background:var(--dsw-alias-bg-layer-2,#f4f6f9);font-size:clamp(13px,3.3vw,17px);font-weight:600;font-variant-numeric:tabular-nums;transition:background .18s,border-color .18s,opacity .18s,box-shadow .18s}
.bsv-cell.in{background:color-mix(in srgb,var(--brand) 12%,var(--dsw-alias-bg-layer-1,#fff));border-color:color-mix(in srgb,var(--brand) 50%,transparent)}
.bsv-cell.out{opacity:.34;border-style:dashed;text-decoration:line-through}
.bsv-cell.mid{box-shadow:0 0 0 2.5px color-mix(in srgb,var(--brand) 45%,transparent)}
.bsv-cell.found{background:color-mix(in srgb,#22c55e 26%,var(--dsw-alias-bg-layer-1,#fff));border-color:#16a34a;box-shadow:0 0 0 2.5px color-mix(in srgb,#22c55e 45%,transparent)}
.bsv-idx{font-size:10.5px;color:var(--dsw-alias-label-tertiary,#8a8f98);font-variant-numeric:tabular-nums}
.bsv-slot{min-height:17px;display:flex;align-items:center;justify-content:center}
.bsv-tag{font-size:10.5px;line-height:1.4;padding:0 5px;border-radius:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bsv-tag.low,.bsv-tag.high{background:var(--dsw-alias-bg-layer-1,#fff);border:1px solid var(--dsw-alias-border-l2,#b9c0cc);color:var(--dsw-alias-label-primary,#101828)}
.bsv-tag.mid{background:var(--brand);border:1px solid transparent;color:var(--dsw-alias-label-primary-inverted,#fff);font-weight:600}
.bsv-status{border:1px solid var(--dsw-alias-border-l1,#e0e4ea);background:var(--dsw-alias-bg-layer-1,#fff);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.7;min-height:86px}
.bsv-status .hd{font-weight:600}
.bsv-status .dt{color:var(--dsw-alias-label-secondary,#555);font-variant-numeric:tabular-nums}
.bsv-status em{font-style:normal;background:color-mix(in srgb,var(--brand) 14%,transparent);border-radius:4px;padding:0 3px;font-variant-numeric:tabular-nums}
.bsv-status .hit{color:#16a34a;font-weight:600}
.bsv-shrinkwrap{display:grid;gap:5px}
.bsv-shrink{display:flex;gap:5px;min-height:22px}
.bsv-seg{flex:1 1 0;min-width:34px;border-radius:6px;background:color-mix(in srgb,var(--brand) 16%,transparent);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);display:grid;place-items:center;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--dsw-alias-label-primary,#101828);transition:flex-grow .25s}
.bsv-seg.found{background:color-mix(in srgb,#22c55e 26%,transparent);border-color:#16a34a}
.bsv-cap{font-size:11px;color:var(--dsw-alias-label-tertiary,#8a8f98)}
.bsv-log{display:grid;gap:6px}
.bsv-row{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:12.5px;line-height:1.6;background:var(--dsw-alias-bg-layer-2,#f4f6f9);border-radius:8px;padding:6px 9px}
.bsv-row .rd{font-weight:600;white-space:nowrap}
.bsv-row .dt,.bsv-row .cc{color:var(--dsw-alias-label-secondary,#555);font-variant-numeric:tabular-nums;min-width:0}
.bsv-row .cc{color:var(--dsw-alias-label-primary,#101828)}
.bsv-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.bsv-actions button{border-radius:8px;padding:6px 15px;font-size:13px;font-weight:600;cursor:pointer}
#bsvNext{background:var(--dsw-alias-button-primary-fill,#101828);color:var(--dsw-alias-label-primary-inverted,#fff);border:1px solid transparent}
#bsvReset{background:var(--dsw-alias-bg-layer-2,#f4f6f9);color:var(--dsw-alias-label-primary,#101828);border:1px solid var(--dsw-alias-border-l1,#d0d5dd)}
.bsv-actions button:disabled{opacity:.42;cursor:not-allowed}
.bsv-note{font-size:11.5px;color:var(--dsw-alias-label-tertiary,#8a8f98)}
@media (prefers-reduced-motion:reduce){.bsv-cell,.bsv-seg{transition:none}}
</style>

<div class="bsv-top">
  <div class="bsv-target">目标值 <b>23</b> · 有序数组（8 个元素）</div>
  <div class="bsv-stats">
    <span>比较次数 <b id="bsvCmp">0</b></span>
    <span>当前区间 <b id="bsvWin">[0, 7]</b></span>
    <span>候选元素 <b id="bsvSize">8</b></span>
  </div>
</div>

<div class="bsv-scroll">
  <div class="bsv-array" id="bsvArray" role="img" aria-label="数组：索引 0 到 7 依次为 2、5、8、12、16、23、38、56"></div>
</div>

<div class="bsv-status" id="bsvStatus" role="status" aria-live="polite"></div>

<div class="bsv-shrinkwrap" id="bsvShrinkWrap">
  <div class="bsv-shrink" id="bsvShrink"></div>
  <div class="bsv-cap">候选元素数（每轮大致减半）</div>
</div>

<div class="bsv-log" id="bsvLog"></div>

<div class="bsv-actions">
  <button id="bsvNext" type="button">下一步</button>
  <button id="bsvReset" type="button">重置</button>
  <span class="bsv-note" id="bsvNote"></span>
</div>
</div>

<script>
(function(){
  var DATA=[2,5,8,12,16,23,38,56], TARGET=23;
  var steps=[], low=0, high=DATA.length-1, cum=[];
  while(low<=high){
    var mid=Math.floor((low+high)/2), v=DATA[mid];
    var before={low:low,high:high}, kind, elim=null, nl=low, nh=high, found=null;
    if(v===TARGET){kind='eq';found=mid;}
    else if(v<TARGET){kind='lt';elim={from:low,to:mid};nl=mid+1;}
    else{kind='gt';elim={from:mid,to:high};nh=mid-1;}
    if(elim){cum=cum.concat([elim]);}
    var size=(kind==='eq')?1:(nh-nl+1);
    steps.push({r:steps.length+1,before:before,mid:mid,v:v,kind:kind,elim:elim,
      win:(kind==='eq')?{low:low,high:high}:{low:nl,high:nh},cum:cum.slice(),found:found,size:size});
    if(found!==null){break;}
    low=nl;high=nh;
  }
  var MAXCMP=Math.ceil(Math.log2(DATA.length));
  var arrayEl=document.getElementById('bsvArray');
  if(!arrayEl){return;}
  var cmpEl=document.getElementById('bsvCmp'), winEl=document.getElementById('bsvWin');
  var sizeEl=document.getElementById('bsvSize'), stEl=document.getElementById('bsvStatus');
  var logEl=document.getElementById('bsvLog'), shEl=document.getElementById('bsvShrink');
  var shWrap=document.getElementById('bsvShrinkWrap'), noteEl=document.getElementById('bsvNote');
  var nextBtn=document.getElementById('bsvNext'), resetBtn=document.getElementById('bsvReset');
  var cells=[], slots=[];
  DATA.forEach(function(val,i){
    var col=document.createElement('div'); col.className='bsv-col';
    var cell=document.createElement('div'); cell.className='bsv-cell'; cell.textContent=val;
    var ix=document.createElement('div'); ix.className='bsv-idx'; ix.textContent=i;
    col.appendChild(cell); col.appendChild(ix);
    var s={};
    ['low','mid','high'].forEach(function(k){
      var slot=document.createElement('div'); slot.className='bsv-slot';
      col.appendChild(slot); s[k]=slot;
    });
    arrayEl.appendChild(col); cells.push(cell); slots.push(s);
  });
  noteEl.textContent='最多需要 ⌈log₂'+DATA.length+'⌉ = '+MAXCMP+' 次比较；本例 '+steps.length+' 次命中。';
  var idx=0;

  function concl(st){
    if(st.kind==='eq'){return 'arr['+st.mid+'] = '+st.v+' = '+TARGET+' → 命中，索引 '+st.mid;}
    var side=(st.kind==='lt')?'< ':'>';
    var ex='排除 ['+st.elim.from+', '+st.elim.to+']（含 mid）';
    var nw='新区间 ['+st.win.low+', '+st.win.high+']';
    return 'arr['+st.mid+'] = '+st.v+' '+side+' '+TARGET+' → '+ex+'，'+nw;
  }

  function render(){
    var st=(idx>0)?steps[idx-1]:null;
    var win=st?st.win:{low:0,high:DATA.length-1};
    var gone={};
    (st?st.cum:[]).forEach(function(g){for(var k=g.from;k<=g.to;k++){gone[k]=true;}});
    cells.forEach(function(cell,i){
      cell.className='bsv-cell';
      if(gone[i]){cell.classList.add('out');}
      else if(i>=win.low&&i<=win.high){cell.classList.add('in');}
      if(st&&i===st.mid){cell.classList.add('mid');}
      if(st&&st.kind==='eq'&&i===st.mid){cell.classList.add('found');}
      ['low','mid','high'].forEach(function(k){slots[i][k].innerHTML='';});
    });
    if(st){
      slots[win.low].low.innerHTML='<span class="bsv-tag low">low</span>';
      slots[win.high].high.innerHTML='<span class="bsv-tag high">high</span>';
      slots[st.mid].mid.innerHTML='<span class="bsv-tag mid">mid</span>';
    } else {
      slots[win.low].low.innerHTML='<span class="bsv-tag low">low</span>';
      slots[win.high].high.innerHTML='<span class="bsv-tag high">high</span>';
    }

    cmpEl.textContent=idx;
    winEl.textContent='['+win.low+', '+win.high+']';
    sizeEl.textContent=st?st.size:DATA.length;

    if(!st){
      stEl.innerHTML='<div class="hd">初始区间 [0, 7]，候选 8 个元素。</div>'+
        '<div class="dt">每轮取 <em>mid = ⌊(low + high) / 2⌋</em> 与目标 23 比较，然后丢弃肯定不含目标的那一半。点击「下一步」开始第 1 轮。</div>';
    } else if(st.kind==='eq'){
      stEl.innerHTML='<div class="hd">第 '+st.r+' 轮：low = '+st.before.low+'，high = '+st.before.high+
        ' → <em>mid = ⌊('+st.before.low+' + '+st.before.high+') / 2⌋ = '+st.mid+'</em>，取 arr['+st.mid+'] = '+st.v+'。</div>'+
        '<div class="dt">arr['+st.mid+'] = '+st.v+' 恰好等于目标 23，<span class="hit">命中！</span>答案：索引 '+st.mid+
        '，共比较 '+st.r+' 次。搜索到这里就结束了，右侧 6、7 两个元素从未被检查过。</div>';
    } else {
      var isLt=(st.kind==='lt');
      var arrow=isLt?'<':' >';
      var move=isLt?('low = mid + 1 = '+(st.mid+1)):('high = mid − 1 = '+(st.mid-1));
      stEl.innerHTML='<div class="hd">第 '+st.r+' 轮：low = '+st.before.low+'，high = '+st.before.high+
        ' → <em>mid = ⌊('+st.before.low+' + '+st.before.high+') / 2⌋ = '+st.mid+'</em>，取 arr['+st.mid+'] = '+st.v+'。</div>'+
        '<div class="dt">arr['+st.mid+'] = '+st.v+' '+(isLt?'<':'>')+' 23：目标只可能在'+(isLt?'右':'左')+'半边。排除索引 '+st.elim.from+'–'+st.elim.to+
        '（含 mid，它已经比过且不等于 23），'+move+'，新区间 ['+st.win.low+', '+st.win.high+']，剩 '+st.size+' 个候选。</div>';
    }

    var sizes=[DATA.length];
    for(var i=0;i<idx;i++){sizes.push(steps[i].size);}
    shEl.innerHTML=sizes.map(function(s,i){
      var last=(i===sizes.length-1)&&st&&st.kind==='eq';
      return '<div class="bsv-seg'+(last?' found':'')+'" style="flex-grow:'+s+'">'+s+'</div>';
    }).join('');
    shWrap.setAttribute('aria-label','候选元素数：'+sizes.join('、'));

    logEl.innerHTML='';
    for(var j=0;j<idx;j++){
      var s=steps[j];
      var row=document.createElement('div'); row.className='bsv-row';
      row.innerHTML='<span class="rd">第 '+s.r+' 轮</span>'+
        '<span class="dt">low='+s.before.low+', high='+s.before.high+' → mid='+s.mid+'，arr['+s.mid+']='+s.v+'</span>'+
        '<span class="cc">'+concl(s)+'</span>';
      logEl.appendChild(row);
    }

    nextBtn.disabled=(idx>=steps.length);
    resetBtn.disabled=(idx===0);
  }

  nextBtn.addEventListener('click',function(){if(idx<steps.length){idx++;render();}});
  resetBtn.addEventListener('click',function(){idx=0;render();});
  render();
})();
</script>
