<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .nv-wrap { display: flex; flex-direction: column; gap: 10px; font-family: inherit; color: var(--dsw-alias-label-primary, #111827); }
  .nv-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .nv-title { font-size: 14px; font-weight: 600; }
  .nv-unit { font-size: 12px; color: var(--dsw-alias-label-tertiary, #6b7280); }
  .nv-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--dsw-alias-label-secondary, #4b5563); }
  .nv-li { display: flex; align-items: center; gap: 6px; }
  .nv-swatch { width: 14px; height: 14px; flex: none; display: block; }
  .nv-chart { width: 100%; max-width: 520px; height: auto; display: block; }
</style>

<div class="nv-wrap">
  <div class="nv-head">
    <span class="nv-title">每月净新增用户</span>
    <span class="nv-unit">单位：人 · 1–5月</span>
  </div>

  <div class="nv-legend">
    <span class="nv-li">
      <svg class="nv-swatch" viewBox="0 0 14 14" aria-hidden="true"><rect width="14" height="14" rx="3" fill="var(--dsw-alias-brand-primary, #3b82f6)"/></svg>
      正值：净增长
    </span>
    <span class="nv-li">
      <svg class="nv-swatch" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="var(--dsw-alias-bg-base, #ffffff)" stroke="var(--dsw-alias-label-secondary, #4b5563)" stroke-width="2"/></svg>
      0：无净变化
    </span>
    <span class="nv-li">
      <svg class="nv-swatch" viewBox="0 0 14 14" aria-hidden="true"><rect y="9.5" width="14" height="4.5" rx="2" fill="var(--dsw-alias-state-error-primary, #dc2626)"/><rect width="14" height="1.5" fill="var(--dsw-alias-bg-base, #ffffff)"/></svg>
      负值：净流失
    </span>
    <span class="nv-li">
      <svg class="nv-swatch" viewBox="0 0 14 14" aria-hidden="true">
        <defs>
          <pattern id="nvHatchL" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
            <rect width="6" height="6" fill="var(--dsw-alias-bg-layer-2, #f3f4f6)"/>
            <line x1="0" y1="0" x2="0" y2="6" stroke="var(--dsw-alias-label-tertiary, #9ca3af)" stroke-width="1.5" opacity="0.5"/>
          </pattern>
        </defs>
        <rect x="0.5" y="0.5" width="13" height="13" rx="2" fill="url(#nvHatchL)" stroke="var(--dsw-alias-border-l2, #d1d5db)" stroke-dasharray="3 2"/>
      </svg>
      缺失：无记录
    </span>
  </div>

  <svg class="nv-chart" viewBox="0 0 400 348" role="img" aria-label="每月净新增用户柱状图：1月120人，2月0人，3月数据缺失，4月-30人，5月80人">
    <title>每月净新增用户（1–5月）</title>
    <desc>以0为基准的柱状图：1月向上120人，2月为0（零线空心底点），3月数据缺失（斜纹占位，不画柱），4月向下30人，5月向上80人。</desc>
    <defs>
      <pattern id="nvHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
        <rect width="8" height="8" fill="var(--dsw-alias-bg-layer-2, #f3f4f6)"/>
        <line x1="0" y1="0" x2="0" y2="8" stroke="var(--dsw-alias-label-tertiary, #9ca3af)" stroke-width="1.5" opacity="0.5"/>
      </pattern>
    </defs>

    <!-- 网格线：同一 0 基准的两侧刻度 -->
    <g stroke="var(--dsw-alias-border-l1, #e5e7eb)" stroke-width="1">
      <line x1="46" y1="30" x2="396" y2="30"/>
      <line x1="46" y1="92" x2="396" y2="92"/>
      <line x1="46" y1="154" x2="396" y2="154"/>
      <line x1="46" y1="262.5" x2="396" y2="262.5"/>
    </g>
    <g font-size="12" text-anchor="end" fill="var(--dsw-alias-label-tertiary, #6b7280)">
      <text x="40" y="34.5">120</text>
      <text x="40" y="96.5">80</text>
      <text x="40" y="158.5">40</text>
      <text x="40" y="220.5">0</text>
      <text x="40" y="267">-30</text>
    </g>
    <line x1="46" y1="26" x2="46" y2="266" stroke="var(--dsw-alias-border-l1, #e5e7eb)" stroke-width="1"/>

    <!-- 3月：缺失，用斜纹占位，不画柱 -->
    <rect x="202" y="30" width="38" height="232.5" rx="3" fill="url(#nvHatch)" stroke="var(--dsw-alias-border-l2, #d1d5db)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="221" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="var(--dsw-alias-label-secondary, #4b5563)">缺失</text>
    <text x="221" y="164" text-anchor="middle" font-size="11" fill="var(--dsw-alias-label-tertiary, #6b7280)">无记录</text>

    <!-- 0 基准线 -->
    <line x1="46" y1="216" x2="396" y2="216" stroke="var(--dsw-alias-label-tertiary, #6b7280)" stroke-width="1.5"/>

    <!-- 柱形：正值向上，负值向下 -->
    <rect x="62" y="30" width="38" height="186" rx="3" fill="var(--dsw-alias-brand-primary, #3b82f6)"/>
    <rect x="272" y="216" width="38" height="46.5" rx="3" fill="var(--dsw-alias-state-error-primary, #dc2626)"/>
    <rect x="342" y="92" width="38" height="124" rx="3" fill="var(--dsw-alias-brand-primary, #3b82f6)"/>

    <!-- 2月：恰好为 0，零线空心底点 -->
    <circle cx="151" cy="216" r="5.5" fill="var(--dsw-alias-bg-base, #ffffff)" stroke="var(--dsw-alias-label-secondary, #4b5563)" stroke-width="2"/>

    <!-- 数值标签 -->
    <g text-anchor="middle" font-size="14" font-weight="700">
      <text x="81" y="21" fill="var(--dsw-alias-label-primary, #111827)">120</text>
      <text x="151" y="203" fill="var(--dsw-alias-label-secondary, #4b5563)">0</text>
      <text x="291" y="279" fill="var(--dsw-alias-state-error-primary, #dc2626)">-30</text>
      <text x="361" y="83" fill="var(--dsw-alias-label-primary, #111827)">80</text>
    </g>

    <!-- 月份 -->
    <g text-anchor="middle" font-size="13" fill="var(--dsw-alias-label-secondary, #4b5563)">
      <text x="81" y="304">1月</text>
      <text x="151" y="304">2月</text>
      <text x="221" y="304">3月</text>
      <text x="291" y="304">4月</text>
      <text x="361" y="304">5月</text>
    </g>

    <text x="46" y="332" font-size="11.5" fill="var(--dsw-alias-label-tertiary, #6b7280)">柱形以 0 为基准，向上为正、向下为负；斜纹仅表示数据缺失，不代表 0。</text>
  </svg>
</div></body></html>
