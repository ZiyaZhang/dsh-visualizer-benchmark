<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .rs-wrap{--rs-accent:var(--dsw-alias-brand-primary,#3b82f6);font:inherit;color:var(--dsw-alias-label-primary,#1f2328);background:var(--dsw-alias-bg-layer-2,transparent);border:1px solid var(--dsw-alias-border-l1,#e5e7eb);border-radius:12px;padding:14px 16px;max-width:560px;box-sizing:border-box}
  .rs-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:2px}
  .rs-title{font-size:14px;font-weight:600}
  .rs-unit{font-size:12px;color:var(--dsw-alias-label-tertiary,#6b7280)}
  .rs-rows{display:flex;flex-direction:column;gap:4px;margin-top:10px}
  .rs-row{display:grid;grid-template-columns:3.6em minmax(60px,1fr) 5.6em;grid-template-areas:"name bar value";align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:8px 8px;border:1px solid transparent;border-radius:8px;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .rs-row:hover{background:var(--dsw-alias-interactive-bg-hover,rgba(0,0,0,.04))}
  .rs-row[aria-pressed="true"]{background:var(--dsw-alias-interactive-bg-active,rgba(59,130,246,.1));border-color:var(--rs-accent)}
  .rs-name{grid-area:name;font-size:13px;font-weight:500;max-width:6em;white-space:normal}
  .rs-track{grid-area:bar;height:14px;border-radius:7px;background:var(--dsw-alias-bg-layer-1,rgba(0,0,0,.06));overflow:hidden}
  .rs-fill{height:100%;border-radius:7px;background:var(--dsw-alias-border-l2,#c7ccd4)}
  .rs-row[aria-pressed="true"] .rs-fill{background:var(--rs-accent)}
  .rs-val{grid-area:value;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--dsw-alias-label-secondary,#4b5563)}
  .rs-row[aria-pressed="true"] .rs-val{color:var(--dsw-alias-label-primary,#1f2328);font-weight:600}
  .rs-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--dsw-alias-border-l1,#e5e7eb)}
  .rs-read{font-size:12.5px;color:var(--dsw-alias-label-secondary,#4b5563);min-width:0}
  .rs-read-num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--dsw-alias-label-primary,#1f2328)}
  .rs-btn{font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:var(--dsw-alias-button-primary-fill,var(--rs-accent));color:var(--dsw-alias-label-primary-inverted,#fff)}
  .rs-btn:disabled{cursor:not-allowed;background:var(--dsw-alias-bg-layer-1,rgba(0,0,0,.06));color:var(--dsw-alias-label-tertiary,#9ca3af);border-color:var(--dsw-alias-border-l1,#e5e7eb)}
  @media (max-width:380px){.rs-row{grid-template-columns:3.2em minmax(40px,1fr);grid-template-areas:"name value" "bar bar";row-gap:5px}}
</style>
<div class="rs-wrap" role="group" aria-label="地区销售对比，数值为销售额（万元），可点选地区">
  <div class="rs-head">
    <span class="rs-title">地区销售对比</span>
    <span class="rs-unit">单位：万元</span>
  </div>
  <div class="rs-rows" id="rsRows">
    <button type="button" class="rs-row" data-name="华东" data-value="120" aria-pressed="false">
      <span class="rs-name">华东</span>
      <span class="rs-track"><span class="rs-fill" style="width:100%"></span></span>
      <span class="rs-val">120 万元</span>
    </button>
    <button type="button" class="rs-row" data-name="华南" data-value="80" aria-pressed="false">
      <span class="rs-name">华南</span>
      <span class="rs-track"><span class="rs-fill" style="width:66.67%"></span></span>
      <span class="rs-val">80 万元</span>
    </button>
    <button type="button" class="rs-row" data-name="西部" data-value="50" aria-pressed="false">
      <span class="rs-name">西部</span>
      <span class="rs-track"><span class="rs-fill" style="width:41.67%"></span></span>
      <span class="rs-val">50 万元</span>
    </button>
  </div>
  <div class="rs-foot">
    <span class="rs-read" id="rsRead" aria-live="polite">未选择地区，点上方地区行即可选中（仅本地选中）。</span>
    <button type="button" class="rs-btn" id="rsAsk" disabled>解释所选地区</button>
  </div>
</div>
<script>
(function () {
  var rows = Array.prototype.slice.call(document.querySelectorAll('#rsRows .rs-row'));
  var read = document.getElementById('rsRead');
  var ask = document.getElementById('rsAsk');
  var selected = null;

  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function render() {
    rows.forEach(function (r) {
      r.setAttribute('aria-pressed', selected && r.dataset.name === selected.name ? 'true' : 'false');
    });
    if (!selected) {
      read.innerHTML = '未选择地区，点上方地区行即可选中（仅本地选中）。';
      ask.disabled = true;
      return;
    }
    var share = Math.round(selected.value / 250 * 1000) / 10;
    read.innerHTML = '已选：<span class="rs-read-num">' + selected.name + '</span>　销售额 <span class="rs-read-num">' + fmt(selected.value) + ' 万元</span>（占三地区合计 ' + share + '%）';
    ask.disabled = false;
  }

  rows.forEach(function (r) {
    r.addEventListener('click', function () {
      var name = r.dataset.name;
      selected = (selected && selected.name === name) ? null : { name: name, value: Number(r.dataset.value) };
      render();
    });
  });

  ask.addEventListener('click', function () {
    if (!selected) return;
    var text = '请解释所选地区的销售表现：' + selected.name + '，销售额 ' + selected.value +
      ' 万元。三地区对比：华东 120 万元、华南 80 万元、西部 50 万元（单位：万元）。请说明该地区这一业绩的可能原因与后续建议。';
    if (window.dshWidget && typeof window.dshWidget.sendPrompt === 'function') {
      window.dshWidget.sendPrompt(text);
    }
  });

  render();
})();
</script></body></html>
