<style>
  .rs-wrap{--rs-accent:var(--dsw-alias-brand-primary,#3b82f6);font:inherit;color:var(--dsw-alias-label-primary,#1f2328);background:var(--dsw-alias-bg-layer-2,transparent);border:1px solid var(--dsw-alias-border-l1,#e5e7eb);border-radius:12px;padding:14px 16px;max-width:560px;box-sizing:border-box}
  .rs-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:2px}
  .rs-title{font-size:14px;font-weight:600}
  .rs-unit{font-size:12px;color:var(--dsw-alias-label-tertiary,#6b7280)}
  .rs-rows{display:flex;flex-direction:column;gap:4px;margin-top:10px}
  .rs-row{display:grid;grid-template-columns:3.6em minmax(60px,1fr) 5.6em;grid-template-areas:"name bar value";align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:8px 8px;border:1px solid transparent;border-radius:8px;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .rs-row:hover{background:var(--dsw-alias-interactive-bg-hover,rgba(0,0,0,.04))}
  .rs-row[aria-pressed="true"]{background:var(--dsw-alias-interactive-bg-active,rgba(59,130,246,.1));border-color:var(--rs-accent)}
  .rs-name{grid-area:name;font-size:13px;font-weight:500;max-width:6em;white-space:normal}
  .rs-track{grid-area:bar;height:14px;border-radius:7px;background:var(--dsw-alias-bg-layer-1,rgba(0,0,0,.06));overflow:hidden}
  .rs-fill{height:100%;border-radius:7px;background:var(--dsw-alias-border-l2,#c7ccd4)}
  .rs-row[aria-pressed="true"] .rs-fill{background:var(--rs-accent)}
  .rs-val{grid-area:value;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--dsw-alias-label-secondary,#4b5563)}
  .rs-row[aria-pressed="true"] .rs-val{color:var(--dsw-alias-label-primary,#1f2328);font-weight:600}
  .rs-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--dsw-alias-border-l1,#e5e7eb)}
  .rs-read{font-size:12.5px;color:var(--dsw-alias-label-secondary,#4b5563);min-width:0}
  .rs-read-num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--dsw-alias-label-primary,#1f2328)}
  .rs-btn{font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:var(--dsw-alias-button-primary-fill,var(--rs-accent));color:var(--dsw-alias-label-primary-inverted,#fff)}
  .rs-btn:disabled{cursor:not-allowed;background:var(--dsw-alias-bg-layer-1,rgba(0,0,0,.06));color:var(--dsw-alias-label-tertiary,#9ca3af);border-color:var(--dsw-alias-border-l1,#e5e7eb)}
  @media (max-width:380px){.rs-row{grid-template-columns:3.2em minmax(40px,1fr);grid-template-areas:"name value" "bar bar";row-gap:5px}}
</style>
<div class="rs-wrap" role="group" aria-label="地区销售对比，数值为销售额（万元），可点选地区">
  <div class="rs-head">
    <span class="rs-title">地区销售对比</span>
    <span class="rs-unit">单位：万元</span>
  </div>
  <div class="rs-rows" id="rsRows">
    <button type="button" class="rs-row" data-name="华东" data-value="120" aria-pressed="false">
      <span class="rs-name">华东</span>
      <span class="rs-track"><span class="rs-fill" style="width:100%"></span></span>
      <span class="rs-val">120 万元</span>
    </button>
    <button type="button" class="rs-row" data-name="华南" data-value="80" aria-pressed="false">
      <span class="rs-name">华南</span>
      <span class="rs-track"><span class="rs-fill" style="width:66.67%"></span></span>
      <span class="rs-val">80 万元</span>
    </button>
    <button type="button" class="rs-row" data-name="西部" data-value="50" aria-pressed="false">
      <span class="rs-name">西部</span>
      <span class="rs-track"><span class="rs-fill" style="width:41.67%"></span></span>
      <span class="rs-val">50 万元</span>
    </button>
  </div>
  <div class="rs-foot">
    <span class="rs-read" id="rsRead" aria-live="polite">未选择地区，点上方地区行即可选中（仅本地选中）。</span>
    <button type="button" class="rs-btn" id="rsAsk" disabled>解释所选地区</button>
  </div>
</div>
<script>
(function () {
  var rows = Array.prototype.slice.call(document.querySelectorAll('#rsRows .rs-row'));
  var read = document.getElementById('rsRead');
  var ask = document.getElementById('rsAsk');
  var selected = null;

  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function render() {
    rows.forEach(function (r) {
      r.setAttribute('aria-pressed', selected && r.dataset.name === selected.name ? 'true' : 'false');
    });
    if (!selected) {
      read.innerHTML = '未选择地区，点上方地区行即可选中（仅本地选中）。';
      ask.disabled = true;
      return;
    }
    var share = Math.round(selected.value / 250 * 1000) / 10;
    read.innerHTML = '已选：<span class="rs-read-num">' + selected.name + '</span>　销售额 <span class="rs-read-num">' + fmt(selected.value) + ' 万元</span>（占三地区合计 ' + share + '%）';
    ask.disabled = false;
  }

  rows.forEach(function (r) {
    r.addEventListener('click', function () {
      var name = r.dataset.name;
      selected = (selected && selected.name === name) ? null : { name: name, value: Number(r.dataset.value) };
      render();
    });
  });

  ask.addEventListener('click', function () {
    if (!selected) return;
    var text = '请解释所选地区的销售表现：' + selected.name + '，销售额 ' + selected.value +
      ' 万元。三地区对比：华东 120 万元、华南 80 万元、西部 50 万元（单位：万元）。请说明该地区这一业绩的可能原因与后续建议。';
    if (window.dshWidget && typeof window.dshWidget.sendPrompt === 'function') {
      window.dshWidget.sendPrompt(text);
    }
  });

  render();
})();
</script>
