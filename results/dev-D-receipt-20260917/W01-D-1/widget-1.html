:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>

  .bs-btn.primary{background:var(--dsw-alias-button-primary-fill,#3b6cf0);border-color:transparent;color:var(--dsw-alias-label-primary-inverted,#fff)}

<div class="bs-wrap">
  <div class="bs-head">
    <span class="bs-title">二分查找 · 逐步演示</span>
    <span class="bs-sub">有序数组，索引 0–7</span>
    <span class="bs-target">目标 = 23</span>
  </div>

  <div class="bs-array" id="bs-array" role="group"
       aria-label="有序数组，索引 0 到 7 依次为 2、5、8、12、16、23、38、56。搜索目标 23。"></div>

  <div class="bs-legend">
    <span class="bs-pill mid">mid</span><span>本轮比较的位置</span>
    <span class="bs-pill">low</span><span class="bs-pill">high</span><span>候选区间的两个边界</span>
    <span class="bs-swatch"></span><span>斜纹 = 本轮被排除的区间</span>
  </div>

  <div class="bs-stats">
    <div class="bs-stat"><div class="k">轮次</div><div class="v" id="bs-round">—</div></div>
    <div class="bs-stat"><div class="k">比较次数</div><div class="v" id="bs-cmp">0</div></div>
    <div class="bs-stat"><div class="k">low</div><div class="v" id="bs-low">0</div></div>
    <div class="bs-stat"><div class="k">mid</div><div class="v brand" id="bs-mid">—</div></div>
    <div class="bs-stat"><div class="k">high</div><div class="v" id="bs-high">7</div></div>
    <div class="bs-stat"><div class="k">arr[mid]</div><div class="v" id="bs-midval">—</div></div>
    <div class="bs-stat"><div class="k">判定</div><div class="v" id="bs-verdict">—</div></div>
    <div class="bs-stat"><div class="k">已排除</div><div class="v" id="bs-excl">无</div></div>
  </div>

  <div class="bs-note" id="bs-note" role="status" aria-live="polite"></div>

  <div class="bs-ctrls">
    <button class="bs-btn primary" id="bs-next" type="button">下一步</button>
    <button class="bs-btn" id="bs-reset" type="button">重置</button>
  </div>
</div>

<script>
(function () {
  var arr = [2, 5, 8, 12, 16, 23, 38, 56];
  var stages = [
    {
      round: 1, low: 0, high: 7, mid: 3,
      discard: [0, 1, 2, 3], eliminated: [], settled: [],
      verdict: '12 < 23',
      note: 'low=0、high=7 → mid = ⌊(0+7)/2⌋ = 3，arr[3] = 12。因为 12 < 23，目标只可能在更大的那一半：把左半边 [0…3]（含 mid 自己）整体排除，下一轮 low 移到 4。'
    },
    {
      round: 2, low: 4, high: 7, mid: 5,
      discard: [], eliminated: [0, 1, 2, 3], settled: [6, 7],
      verdict: '23 = 23 ✓',
      note: 'low=4、high=7 → mid = ⌊(4+7)/2⌋ = 5，arr[5] = 23 正好等于目标，查找成功，总共只比较了 2 次。候选区间里剩下的 [6…7] 已经用不到了（虚线标出）。'
    }
  ];
  var READY_NOTE = '数组是升序的，所以二分查找每轮只看中间位置 arr[mid]：一次比较就能丢掉一半候选。点击「下一步」开始第 1 轮。';

  var step = -1;
  var arrayEl = document.getElementById('bs-array');
  var noteEl = document.getElementById('bs-note');
  var nextBtn = document.getElementById('bs-next');
  var resetBtn = document.getElementById('bs-reset');
  var out = {
    round: document.getElementById('bs-round'),
    cmp: document.getElementById('bs-cmp'),
    low: document.getElementById('bs-low'),
    mid: document.getElementById('bs-mid'),
    high: document.getElementById('bs-high'),
    midval: document.getElementById('bs-midval'),
    verdict: document.getElementById('bs-verdict'),
    excl: document.getElementById('bs-excl')
  };

  function fmtSet(list) {
    if (!list || !list.length) return '无';
    var parts = [], i = 0;
    while (i < list.length) {
      var start = list[i], end = start;
      while (i + 1 < list.length && list[i + 1] === end + 1) { i++; end = list[i]; }
      parts.push(start === end ? '[' + start + ']' : '[' + start + '…' + end + ']');
      i++;
    }
    return parts.join('、');
  }

  arrayEl.innerHTML = '';
  var cols = [];
  arr.forEach(function (v, i) {
    var col = document.createElement('div'); col.className = 'bs-col';
    var idx = document.createElement('div'); idx.className = 'bs-idx'; idx.textContent = i;
    var cell = document.createElement('div'); cell.className = 'bs-cell';
    var val = document.createElement('span'); val.className = 'bs-val'; val.textContent = v;
    cell.appendChild(val);
    var ptr = document.createElement('div'); ptr.className = 'bs-ptr';
    var slots = {};
    ['low', 'mid', 'high'].forEach(function (role) {
      var s = document.createElement('div'); s.className = 'bs-slot';
      slots[role] = s; ptr.appendChild(s);
    });
    col.appendChild(idx); col.appendChild(cell); col.appendChild(ptr);
    arrayEl.appendChild(col);
    cols.push({ cell: cell, slots: slots });
  });

  function render() {
    var s = step >= 0 ? stages[step] : null;
    var low = s ? s.low : 0;
    var high = s ? s.high : arr.length - 1;
    var mid = s ? s.mid : null;
    var discard = s ? s.discard : [];
    var eliminated = s ? s.eliminated : [];
    var settled = s ? s.settled : [];

    arr.forEach(function (v, i) {
      var c = cols[i], cls = 'bs-cell';
      if (discard.indexOf(i) >= 0) cls += ' discarded';
      else if (eliminated.indexOf(i) >= 0) cls += ' eliminated';
      else if (settled.indexOf(i) >= 0) cls += ' settled';
      else if (i >= low && i <= high) cls += ' in-window';
      if (mid !== null && i === mid) cls += ' is-mid';
      c.cell.className = cls;

      ['low', 'mid', 'high'].forEach(function (role) {
        var slot = c.slots[role];
        slot.className = 'bs-slot';
        slot.textContent = '';
        var at = role === 'low' ? low : (role === 'mid' ? mid : high);
        if (at === i) {
          var p = document.createElement('span');
          p.className = 'bs-pill' + (role === 'mid' ? ' mid' : '');
          p.textContent = role;
          slot.appendChild(p);
        }
      });
    });

    out.round.textContent = s ? (s.round + ' / ' + stages.length) : '未开始';
    out.cmp.textContent = step + 1;
    out.low.textContent = low;
    out.mid.textContent = mid === null ? '—' : mid;
    out.high.textContent = high;
    out.midval.textContent = mid === null ? '—' : arr[mid];
    out.verdict.textContent = s ? s.verdict : '—';
    out.excl.textContent = fmtSet(eliminated);

    noteEl.textContent = s ? s.note : READY_NOTE;

    if (step >= stages.length - 1) {
      nextBtn.disabled = true;
      nextBtn.textContent = '查找完成';
    } else {
      nextBtn.disabled = false;
      nextBtn.textContent = '下一步';
    }
  }

  nextBtn.addEventListener('click', function () {
    if (step < stages.length - 1) { step++; render(); }
  });
  resetBtn.addEventListener('click', function () { step = -1; render(); });

  render();
})();
</script></body></html>
