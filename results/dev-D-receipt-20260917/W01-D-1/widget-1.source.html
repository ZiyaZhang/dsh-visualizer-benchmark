<style>
  .bs-wrap{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--dsw-alias-bg-base,#fff);color:var(--dsw-alias-label-primary,#1a1a1a);border:1px solid var(--dsw-alias-border-l1,#e3e5ea);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:13px;max-width:720px;box-sizing:border-box}
  .bs-wrap *{box-sizing:border-box}
  .bs-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
  .bs-title{font-size:13px;font-weight:650;letter-spacing:.01em}
  .bs-sub{font-size:11.5px;color:var(--dsw-alias-label-tertiary,#8a8f99)}
  .bs-target{margin-left:auto;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--dsw-alias-bg-layer-2,#f2f4f8);border:1px solid var(--dsw-alias-border-l1,#e3e5ea);font-variant-numeric:tabular-nums}
  .bs-array{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
  .bs-col{display:flex;flex-direction:column;gap:4px;min-width:0}
  .bs-idx{text-align:center;font-size:10px;color:var(--dsw-alias-label-tertiary,#8a8f99);font-variant-numeric:tabular-nums}
  .bs-cell{display:flex;align-items:center;justify-content:center;height:46px;border-radius:9px;border:1px solid var(--dsw-alias-border-l1,#e3e5ea);background:var(--dsw-alias-bg-layer-1,#fafbfc);font-size:clamp(13px,3.6vw,19px);font-weight:650;font-variant-numeric:tabular-nums;transition:background .18s ease,border-color .18s ease,opacity .18s ease,box-shadow .18s ease}
  .bs-cell.in-window{background:var(--dsw-alias-bg-layer-2,#eef1f6);border-color:var(--dsw-alias-border-l2,#cfd4dd)}
  .bs-cell.is-mid{box-shadow:inset 0 0 0 2px var(--dsw-alias-brand-primary,#3b6cf0)}
  .bs-cell.discarded{opacity:.6;background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--dsw-alias-border-l1,#e3e5ea) 4px 5px)}
  .bs-cell.discarded .bs-val{text-decoration:line-through}
  .bs-cell.eliminated{opacity:.34}
  .bs-cell.eliminated .bs-val{text-decoration:line-through}
  .bs-cell.settled{opacity:.5;border-style:dashed}
  .bs-ptr{display:flex;flex-direction:column;gap:2px}
  .bs-slot{height:18px;display:flex;align-items:center;justify-content:center;min-width:0}
  .bs-pill{font-size:10px;line-height:1;padding:3px 5px;border-radius:6px;border:1px solid var(--dsw-alias-border-l2,#cfd4dd);background:var(--dsw-alias-bg-layer-1,#fff);color:var(--dsw-alias-label-primary,#1a1a1a);white-space:nowrap;font-variant-numeric:tabular-nums}
  .bs-pill.mid{background:var(--dsw-alias-button-primary-fill,#3b6cf0);color:var(--dsw-alias-label-primary-inverted,#fff);border-color:transparent}
  .bs-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:11px;color:var(--dsw-alias-label-secondary,#4a4f57)}
  .bs-legend .bs-pill{margin-right:2px}
  .bs-swatch{width:14px;height:14px;border-radius:4px;border:1px solid var(--dsw-alias-border-l1,#e3e5ea);background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--dsw-alias-border-l1,#e3e5ea) 4px 5px)}
  .bs-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:7px}
  .bs-stat{background:var(--dsw-alias-bg-layer-1,#fafbfc);border:1px solid var(--dsw-alias-border-l1,#e3e5ea);border-radius:9px;padding:6px 8px;min-width:0}
  .bs-stat .k{font-size:10px;color:var(--dsw-alias-label-tertiary,#8a8f99);white-space:nowrap}
  .bs-stat .v{margin-top:2px;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .bs-stat .v.brand{color:var(--dsw-alias-brand-primary,#3b6cf0)}
  .bs-note{font-size:12.5px;line-height:1.6;color:var(--dsw-alias-label-secondary,#4a4f57);background:var(--dsw-alias-bg-layer-2,#f4f6fa);border-radius:10px;padding:10px 12px;min-height:64px}
  .bs-ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bs-btn{font-family:inherit;font-size:13px;font-weight:600;padding:8px 18px;border-radius:9px;cursor:pointer;border:1px solid var(--dsw-alias-border-l2,#cfd4dd);background:var(--dsw-alias-bg-layer-1,#fff);color:var(--dsw-alias-label-primary,#1a1a1a)}
  .bs-btn.primary{background:var(--dsw-alias-button-primary-fill,#3b6cf0);border-color:transparent;color:var(--dsw-alias-label-primary-inverted,#fff)}
  .bs-btn:disabled{opacity:.45;cursor:default}
  @media (prefers-reduced-motion: reduce){.bs-cell{transition:none}}
</style>

<div class="bs-wrap">
  <div class="bs-head">
    <span class="bs-title">二分查找 · 逐步演示</span>
    <span class="bs-sub">有序数组，索引 0–7</span>
    <span class="bs-target">目标 = 23</span>
  </div>

  <div class="bs-array" id="bs-array" role="group"
       aria-label="有序数组，索引 0 到 7 依次为 2、5、8、12、16、23、38、56。搜索目标 23。"></div>

  <div class="bs-legend">
    <span class="bs-pill mid">mid</span><span>本轮比较的位置</span>
    <span class="bs-pill">low</span><span class="bs-pill">high</span><span>候选区间的两个边界</span>
    <span class="bs-swatch"></span><span>斜纹 = 本轮被排除的区间</span>
  </div>

  <div class="bs-stats">
    <div class="bs-stat"><div class="k">轮次</div><div class="v" id="bs-round">—</div></div>
    <div class="bs-stat"><div class="k">比较次数</div><div class="v" id="bs-cmp">0</div></div>
    <div class="bs-stat"><div class="k">low</div><div class="v" id="bs-low">0</div></div>
    <div class="bs-stat"><div class="k">mid</div><div class="v brand" id="bs-mid">—</div></div>
    <div class="bs-stat"><div class="k">high</div><div class="v" id="bs-high">7</div></div>
    <div class="bs-stat"><div class="k">arr[mid]</div><div class="v" id="bs-midval">—</div></div>
    <div class="bs-stat"><div class="k">判定</div><div class="v" id="bs-verdict">—</div></div>
    <div class="bs-stat"><div class="k">已排除</div><div class="v" id="bs-excl">无</div></div>
  </div>

  <div class="bs-note" id="bs-note" role="status" aria-live="polite"></div>

  <div class="bs-ctrls">
    <button class="bs-btn primary" id="bs-next" type="button">下一步</button>
    <button class="bs-btn" id="bs-reset" type="button">重置</button>
  </div>
</div>

<script>
(function () {
  var arr = [2, 5, 8, 12, 16, 23, 38, 56];
  var stages = [
    {
      round: 1, low: 0, high: 7, mid: 3,
      discard: [0, 1, 2, 3], eliminated: [], settled: [],
      verdict: '12 < 23',
      note: 'low=0、high=7 → mid = ⌊(0+7)/2⌋ = 3，arr[3] = 12。因为 12 < 23，目标只可能在更大的那一半：把左半边 [0…3]（含 mid 自己）整体排除，下一轮 low 移到 4。'
    },
    {
      round: 2, low: 4, high: 7, mid: 5,
      discard: [], eliminated: [0, 1, 2, 3], settled: [6, 7],
      verdict: '23 = 23 ✓',
      note: 'low=4、high=7 → mid = ⌊(4+7)/2⌋ = 5，arr[5] = 23 正好等于目标，查找成功，总共只比较了 2 次。候选区间里剩下的 [6…7] 已经用不到了（虚线标出）。'
    }
  ];
  var READY_NOTE = '数组是升序的，所以二分查找每轮只看中间位置 arr[mid]：一次比较就能丢掉一半候选。点击「下一步」开始第 1 轮。';

  var step = -1;
  var arrayEl = document.getElementById('bs-array');
  var noteEl = document.getElementById('bs-note');
  var nextBtn = document.getElementById('bs-next');
  var resetBtn = document.getElementById('bs-reset');
  var out = {
    round: document.getElementById('bs-round'),
    cmp: document.getElementById('bs-cmp'),
    low: document.getElementById('bs-low'),
    mid: document.getElementById('bs-mid'),
    high: document.getElementById('bs-high'),
    midval: document.getElementById('bs-midval'),
    verdict: document.getElementById('bs-verdict'),
    excl: document.getElementById('bs-excl')
  };

  function fmtSet(list) {
    if (!list || !list.length) return '无';
    var parts = [], i = 0;
    while (i < list.length) {
      var start = list[i], end = start;
      while (i + 1 < list.length && list[i + 1] === end + 1) { i++; end = list[i]; }
      parts.push(start === end ? '[' + start + ']' : '[' + start + '…' + end + ']');
      i++;
    }
    return parts.join('、');
  }

  arrayEl.innerHTML = '';
  var cols = [];
  arr.forEach(function (v, i) {
    var col = document.createElement('div'); col.className = 'bs-col';
    var idx = document.createElement('div'); idx.className = 'bs-idx'; idx.textContent = i;
    var cell = document.createElement('div'); cell.className = 'bs-cell';
    var val = document.createElement('span'); val.className = 'bs-val'; val.textContent = v;
    cell.appendChild(val);
    var ptr = document.createElement('div'); ptr.className = 'bs-ptr';
    var slots = {};
    ['low', 'mid', 'high'].forEach(function (role) {
      var s = document.createElement('div'); s.className = 'bs-slot';
      slots[role] = s; ptr.appendChild(s);
    });
    col.appendChild(idx); col.appendChild(cell); col.appendChild(ptr);
    arrayEl.appendChild(col);
    cols.push({ cell: cell, slots: slots });
  });

  function render() {
    var s = step >= 0 ? stages[step] : null;
    var low = s ? s.low : 0;
    var high = s ? s.high : arr.length - 1;
    var mid = s ? s.mid : null;
    var discard = s ? s.discard : [];
    var eliminated = s ? s.eliminated : [];
    var settled = s ? s.settled : [];

    arr.forEach(function (v, i) {
      var c = cols[i], cls = 'bs-cell';
      if (discard.indexOf(i) >= 0) cls += ' discarded';
      else if (eliminated.indexOf(i) >= 0) cls += ' eliminated';
      else if (settled.indexOf(i) >= 0) cls += ' settled';
      else if (i >= low && i <= high) cls += ' in-window';
      if (mid !== null && i === mid) cls += ' is-mid';
      c.cell.className = cls;

      ['low', 'mid', 'high'].forEach(function (role) {
        var slot = c.slots[role];
        slot.className = 'bs-slot';
        slot.textContent = '';
        var at = role === 'low' ? low : (role === 'mid' ? mid : high);
        if (at === i) {
          var p = document.createElement('span');
          p.className = 'bs-pill' + (role === 'mid' ? ' mid' : '');
          p.textContent = role;
          slot.appendChild(p);
        }
      });
    });

    out.round.textContent = s ? (s.round + ' / ' + stages.length) : '未开始';
    out.cmp.textContent = step + 1;
    out.low.textContent = low;
    out.mid.textContent = mid === null ? '—' : mid;
    out.high.textContent = high;
    out.midval.textContent = mid === null ? '—' : arr[mid];
    out.verdict.textContent = s ? s.verdict : '—';
    out.excl.textContent = fmtSet(eliminated);

    noteEl.textContent = s ? s.note : READY_NOTE;

    if (step >= stages.length - 1) {
      nextBtn.disabled = true;
      nextBtn.textContent = '查找完成';
    } else {
      nextBtn.disabled = false;
      nextBtn.textContent = '下一步';
    }
  }

  nextBtn.addEventListener('click', function () {
    if (step < stages.length - 1) { step++; render(); }
  });
  resetBtn.addEventListener('click', function () { step = -1; render(); });

  render();
})();
</script>
