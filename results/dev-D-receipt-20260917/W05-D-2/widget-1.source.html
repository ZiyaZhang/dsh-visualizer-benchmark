<style>
  .qty-card{
    --qty-accent: var(--dsw-alias-brand-primary, #3b82f6);
    background: var(--dsw-alias-bg-layer-1, #fff);
    border: 1px solid var(--dsw-alias-border-l1, #e5e7eb);
    border-radius: 14px;
    padding: 16px 18px 14px;
    max-width: 340px;
    font-family: inherit;
    color: var(--dsw-alias-label-primary, #111827);
  }
  .qty-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  .qty-title{font-size:13px;font-weight:600;letter-spacing:.02em}
  .qty-range{font-size:12px;color:var(--dsw-alias-label-tertiary,#6b7280);font-variant-numeric:tabular-nums}
  .qty-row{display:flex;align-items:center;gap:12px;min-width:0}
  .qty-btn{
    flex:0 0 auto;width:44px;height:44px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;line-height:1;font-weight:500;
    border:1px solid var(--dsw-alias-border-l2,#d1d5db);
    background:var(--dsw-alias-bg-layer-2,#f9fafb);
    color:var(--dsw-alias-label-primary,#111827);
    cursor:pointer;user-select:none;
    transition:background .12s ease, border-color .12s ease, transform .06s ease, opacity .12s ease;
  }
  .qty-btn:hover:not(:disabled){background:var(--dsw-alias-interactive-bg-hover,rgba(0,0,0,.05))}
  .qty-btn:active:not(:disabled){background:var(--dsw-alias-interactive-bg-active,rgba(0,0,0,.09));transform:translateY(1px)}
  .qty-btn:disabled{
    opacity:.38;cursor:not-allowed;
    background:var(--dsw-alias-bg-layer-2,#f9fafb);
    color:var(--dsw-alias-label-tertiary,#9ca3af);
  }
  .qty-value{
    flex:1 1 auto;min-width:0;text-align:center;
    font-size:34px;font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums;
    padding:2px 0;
    transition:color .15s ease;
  }
  .qty-value.is-min,.qty-value.is-max{color:var(--qty-accent)}
  .qty-scale{display:flex;gap:6px;margin-top:14px}
  .qty-cell{
    flex:1 1 0;min-width:0;height:8px;border-radius:4px;
    background:var(--dsw-alias-bg-layer-2,#eee);
    border:1px solid var(--dsw-alias-border-l1,#e5e7eb);
    transition:background .15s ease,border-color .15s ease;
  }
  .qty-cell.on{background:var(--qty-accent);border-color:var(--qty-accent)}
  .qty-foot{
    display:flex;justify-content:space-between;gap:8px;margin-top:8px;
    font-size:11px;color:var(--dsw-alias-label-tertiary,#6b7280);
    font-variant-numeric:tabular-nums;
  }
  .qty-hint{margin-top:10px;font-size:11.5px;color:var(--dsw-alias-label-secondary,#4b5563);min-height:15px}
  @media (max-width:260px){ .qty-value{font-size:26px} .qty-btn{width:38px;height:38px} }
</style>

<div class="qty-card" id="qty-card" role="group" aria-labelledby="qty-title">
  <div class="qty-head">
    <span class="qty-title" id="qty-title">数量</span>
    <span class="qty-range">可选 0 – 5</span>
  </div>

  <div class="qty-row">
    <button class="qty-btn" id="qty-minus" type="button" aria-label="减少数量">−</button>
    <output class="qty-value" id="qty-value" for="qty-minus qty-plus" aria-live="polite">2</output>
    <button class="qty-btn" id="qty-plus" type="button" aria-label="增加数量">+</button>
  </div>

  <div class="qty-scale" id="qty-scale" aria-hidden="true">
    <span class="qty-cell"></span><span class="qty-cell"></span><span class="qty-cell"></span>
    <span class="qty-cell"></span><span class="qty-cell"></span><span class="qty-cell"></span>
  </div>
  <div class="qty-foot"><span>0</span><span>5</span></div>

  <div class="qty-hint" id="qty-hint">&nbsp;</div>
</div>

<script>
(function () {
  const MIN = 0, MAX = 5;
  let value = 2;

  const card   = document.getElementById('qty-card');
  const minus  = document.getElementById('qty-minus');
  const plus   = document.getElementById('qty-plus');
  const out    = document.getElementById('qty-value');
  const cells  = Array.prototype.slice.call(document.querySelectorAll('#qty-scale .qty-cell'));
  const hint   = document.getElementById('qty-hint');

  function render() {
    out.textContent = String(value);
    out.classList.toggle('is-min', value === MIN);
    out.classList.toggle('is-max', value === MAX);

    minus.disabled = value <= MIN;
    plus.disabled  = value >= MAX;

    cells.forEach(function (c, i) { c.classList.toggle('on', i < value); });

    if (value === MIN)      hint.textContent = '已到下限，减少按钮已禁用';
    else if (value === MAX) hint.textContent = '已到上限，增加按钮已禁用';
    else                    hint.textContent = '还可增加 ' + (MAX - value) + '，还可减少 ' + (value - MIN);
  }

  function step(delta) {
    const next = Math.min(MAX, Math.max(MIN, value + delta));
    if (next === value) return;
    value = next;
    render();
  }

  minus.addEventListener('click', function () { step(-1); });
  plus.addEventListener('click', function () { step(1); });

  card.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown')  { e.preventDefault(); step(-1); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   { e.preventDefault(); step(1); }
  });

  render();
})();
</script>
