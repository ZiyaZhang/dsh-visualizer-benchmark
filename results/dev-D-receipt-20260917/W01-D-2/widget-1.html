:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});

        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });

})();</script><div class="bs-wrap">
<style>

  .bs-swatch.mid{background:var(--bs-brand);border-color:transparent}

  <div class="bs-head">
    <div class="bs-title">二分查找 · 目标 <b>23</b></div>
    <div class="bs-round" id="bs-round">第 0 / 2 轮</div>
  </div>

  <div class="bs-array" id="bs-array" role="img" aria-label="有序数组 2,5,8,12,16,23,38,56，索引 0 到 7"></div>

  <div class="bs-readout">
    <div class="bs-main" id="bs-main" aria-live="polite">初始区间：low = 0，high = 7，尚未取 mid。</div>
    <div class="bs-sub" id="bs-sub">8 个元素，最多需要 ⌈log₂8⌉ = 3 次比较。点击“下一步”开始第 1 轮。</div>
  </div>

  <div class="bs-legend">
    <span><i class="bs-swatch" style="background:var(--dsw-alias-interactive-bg-hover,#eef2fb)"></i>当前搜索区间</span>
    <span><i class="bs-swatch hatch"></i>已排除</span>
    <span><i class="bs-swatch mid"></i>mid（本轮中间位置）</span>
    <span><i class="bs-swatch found"></i>命中目标</span>
  </div>

  <div class="bs-controls">
    <button type="button" id="bs-next">下一步</button>
    <button type="button" id="bs-reset">重置</button>
    <span class="bs-hint">mid = ⌊(low + high) / 2⌋</span>
  </div>
</div>
<script>
(function(){
  var data = [2,5,8,12,16,23,38,56];
  var target = 23;
  var rounds = [];
  (function(){
    var lo = 0, hi = data.length - 1;
    while (lo <= hi) {
      var mid = Math.floor((lo + hi) / 2), v = data[mid];
      if (v === target) { rounds.push({low:lo, high:hi, mid:mid, val:v, found:true, from:null, to:null, newLow:lo, newHigh:hi, excluded:null}); break; }
      if (v < target) { rounds.push({low:lo, high:hi, mid:mid, val:v, found:false, from:lo, to:mid, newLow:mid+1, newHigh:hi, excluded:[lo,mid]}); lo = mid + 1; }
      else { rounds.push({low:lo, high:hi, mid:mid, val:v, found:false, from:mid, to:hi, newLow:lo, newHigh:mid-1, excluded:[mid,hi]}); hi = mid - 1; }
    }
  })();

  var step = 0;
  var arrayEl = document.getElementById('bs-array');
  var mainEl = document.getElementById('bs-main');
  var subEl = document.getElementById('bs-sub');
  var roundEl = document.getElementById('bs-round');
  var nextBtn = document.getElementById('bs-next');
  var resetBtn = document.getElementById('bs-reset');
  var cells = [], tags = [], bars = [];

  data.forEach(function(v, i){
    var col = document.createElement('div'); col.className = 'bs-col';
    var tag = document.createElement('div'); tag.className = 'bs-tags';
    var cell = document.createElement('div'); cell.className = 'bs-cell'; cell.textContent = String(v);
    var bar = document.createElement('div'); bar.className = 'bs-bar';
    var idx = document.createElement('div'); idx.className = 'bs-idx'; idx.textContent = String(i);
    col.appendChild(tag); col.appendChild(cell); col.appendChild(bar); col.appendChild(idx);
    arrayEl.appendChild(col);
    tags.push(tag); cells.push(cell); bars.push(bar);
  });

  function chip(text, kind){
    var el = document.createElement('span');
    el.className = 'bs-tag ' + kind;
    el.textContent = text;
    return el;
  }

  function render(){
    var excluded = data.map(function(){ return false; });
    for (var i = 0; i < step; i++){
      var ex = rounds[i].excluded;
      if (ex) for (var k = ex[0]; k <= ex[1]; k++) excluded[k] = true;
    }
    var last = step > 0 ? rounds[step - 1] : null;
    var low = last ? last.low : 0;
    var high = last ? last.high : data.length - 1;
    var mid = last ? last.mid : -1;
    var found = last ? last.found : false;
    var excludedCount = excluded.filter(Boolean).length;

    for (var j = 0; j < data.length; j++){
      var c = cells[j];
      c.className = 'bs-cell';
      c.textContent = String(data[j]);
      if (excluded[j]) c.classList.add('excluded');
      else if (j >= low && j <= high) c.classList.add('in-range');
      if (j === mid){
        if (found) c.classList.add('found');
        else c.classList.add('is-mid');
      }
      bars[j].className = 'bs-bar' + (excluded[j] ? ' hit' : '');
      tags[j].innerHTML = '';
      if (j === low) tags[j].appendChild(chip('low', 'low'));
      if (j === mid) tags[j].appendChild(chip('mid', 'mid'));
      if (j === high) tags[j].appendChild(chip('high', 'high'));
    }

    arrayEl.setAttribute('aria-label',
      '有序数组 ' + data.join(',') + '。当前 low=' + low + '，high=' + high +
      (mid >= 0 ? '，mid=' + mid + '（值 ' + data[mid] + '）' : '') +
      '，已排除 ' + excludedCount + ' 个元素。');

    if (step === 0){
      mainEl.textContent = '初始区间：low = 0，high = 7，尚未取 mid。';
      subEl.textContent = '8 个元素，最多需要 ⌈log₂8⌉ = 3 次比较。点击“下一步”开始第 1 轮。';
    } else if (found){
      mainEl.textContent = '第 ' + step + ' 轮：low = ' + low + '，high = ' + high + ' → mid = ⌊(' + low + '+' + high + ')/2⌋ = ' + mid +
        '，a[' + mid + '] = ' + data[mid] + ' = 目标 23。命中！';
      subEl.textContent = '共比较 ' + step + ' 轮就找到目标（8 个元素逐个查最坏要 8 次），已排除 ' + excludedCount + ' 个元素。';
    } else {
      var isLeft = data[mid] < target;
      mainEl.textContent = '第 ' + step + ' 轮：low = ' + low + '，high = ' + high + ' → mid = ⌊(' + low + '+' + high + ')/2⌋ = ' + mid +
        '，a[' + mid + '] = ' + data[mid] + '。' + data[mid] + (isLeft ? ' < ' : ' > ') + target +
        '，目标在' + (isLeft ? '右' : '左') + '半区 → 排除下标 [' + last.from + '..' + last.to + ']。';
      subEl.textContent = '新区间 low = ' + last.newLow + '，high = ' + last.newHigh +
        '（还剩 ' + (last.newHigh - last.newLow + 1) + ' 个元素，已排除 ' + excludedCount + ' 个）。';
    }

    roundEl.textContent = '第 ' + step + ' / ' + rounds.length + ' 轮';
    nextBtn.disabled = step >= rounds.length;
    nextBtn.textContent = step >= rounds.length ? '已结束' : '下一步';
    resetBtn.disabled = step === 0;
  }

  nextBtn.addEventListener('click', function(){
    if (step < rounds.length){ step += 1; render(); }
  });
  resetBtn.addEventListener('click', function(){
    step = 0; render();
  });

  render();
})();
</script></body></html>
