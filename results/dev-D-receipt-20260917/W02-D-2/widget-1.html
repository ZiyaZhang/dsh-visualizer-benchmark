<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><div class="hc">
<style>
.hc{--hc-line:var(--dsw-alias-border-l1,#e5e7eb);border:1px solid var(--hc-line);border-radius:12px;padding:14px 14px 12px;background:var(--dsw-alias-bg-layer-1,#fff);color:var(--dsw-alias-label-primary,#111827);font-family:inherit;font-size:13px;line-height:1.45}
.hc-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.hc-title{font-weight:600;font-size:14px}
.hc-sub{color:var(--dsw-alias-label-secondary,#4b5563);font-size:12px}
.hc-step{font-variant-numeric:tabular-nums;color:var(--dsw-alias-label-secondary,#4b5563);white-space:nowrap}
.hc-step b{color:var(--dsw-alias-label-primary,#111827)}
.hc svg{display:block;width:100%;height:auto;overflow:visible}
.hc-bar{transition:y .22s ease,height .22s ease,fill .22s ease,opacity .22s ease}
.hc-dot{transition:fill .22s ease}
.hc-readouts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px}
.hc-card{min-width:0;border:1px solid var(--hc-line);border-radius:9px;padding:6px 8px;background:var(--dsw-alias-bg-layer-2,#f9fafb)}
.hc-name{font-size:11px;color:var(--dsw-alias-label-secondary,#4b5563);display:flex;gap:4px;align-items:center}
.hc-tag{font-size:9.5px;border:1px solid var(--hc-line);border-radius:999px;padding:0 5px;color:var(--dsw-alias-label-tertiary,#6b7280)}
.hc-val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px;white-space:nowrap}
.hc-unit{font-size:11px;font-weight:400;color:var(--dsw-alias-label-secondary,#4b5563);margin-left:2px}
.hc-prev{font-size:11px;color:var(--dsw-alias-label-tertiary,#6b7280);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px}
.hc-btn{font:inherit;font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer}
.hc-primary{background:var(--dsw-alias-button-primary-fill,#2563eb);color:var(--dsw-alias-label-primary-inverted,#fff);border:1px solid transparent}
.hc-primary:hover{filter:brightness(1.07)}
.hc-formula{margin-left:auto;color:var(--dsw-alias-label-secondary,#4b5563);font-size:12px;font-variant-numeric:tabular-nums}
.hc-note{margin-top:8px;font-size:11.5px;color:var(--dsw-alias-label-tertiary,#6b7280)}
@media (max-width:560px){.hc-readouts{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}.hc-formula{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){.hc-bar,.hc-dot{transition:none!important}}
</style>

<div class="hc-head">
  <div>
    <div class="hc-title">一维杆热传导 · 5 节点离散示意</div>
    <div class="hc-sub">两端固定 100 °C / 0 °C，中间 3 个节点初值 0 °C；同步（Jacobi）更新，α = 0.25</div>
  </div>
  <div class="hc-step">已迭代 <b id="hc-n" aria-live="polite">0</b> 步</div>
</div>

<svg id="hc-svg" viewBox="0 0 660 300" role="img" aria-label="5 节点一维杆的离散温度分布：节点 1 与节点 5 为固定边界 100 摄氏度与 0 摄氏度，中间三个节点随迭代逐步升温，柱高与颜色表示温度"></svg>

<div class="hc-readouts" id="hc-readouts"></div>

<div class="hc-controls">
  <button id="hc-next" class="hc-btn hc-primary" type="button">单步 →</button>
  <button id="hc-reset" class="hc-btn" type="button">重置</button>
  <span class="hc-formula">T<sub>i</sub><sup>n+1</sup> = T<sub>i</sub><sup>n</sup> + 0.25·(T<sub>i−1</sub><sup>n</sup> − 2T<sub>i</sub><sup>n</sup> + T<sub>i+1</sub><sup>n</sup>)</span>
</div>

<div class="hc-note">离散示意：这里只有 5 个节点，用显式有限差分近似一维杆，柱高与颜色只代表这 5 个节点的温度（不是连续杆的真实温度场）。α = DΔt/Δx² = 0.25 ≤ 0.5，迭代稳定。两端是边界条件，不参与更新；中间每个节点都只读取<b>上一时刻</b>的邻居值。</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var X=[70,200,330,460,590];
  var BASE=270, MAXH=170, ALPHA=0.25, LEFT=100, RIGHT=0;
  var svg=document.getElementById('hc-svg');
  var readouts=document.getElementById('hc-readouts');
  var stepEl=document.getElementById('hc-n');
  var nextBtn=document.getElementById('hc-next');
  var resetBtn=document.getElementById('hc-reset');
  if(!svg||!readouts||!stepEl||!nextBtn||!resetBtn) return;

  function el(name,attrs){var e=document.createElementNS(NS,name);for(var k in attrs){e.setAttribute(k,attrs[k]);}return e;}
  function dom(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

  // 坐标网格
  [100,75,50,25,0].forEach(function(v){
    var y=BASE-v/100*MAXH;
    svg.appendChild(el('line',{x1:56,x2:608,y1:y,y2:y,stroke:'var(--dsw-alias-border-l1,#e5e7eb)','stroke-width':1,'stroke-dasharray':v===0?'':'3 5'}));
    var t=el('text',{x:50,y:y+3.5,'text-anchor':'end','font-size':10,fill:'var(--dsw-alias-label-tertiary,#6b7280)'});
    t.textContent=v;
    svg.appendChild(t);
  });

  // 离散杆
  svg.appendChild(el('rect',{x:52,y:28,width:556,height:18,rx:9,fill:'var(--dsw-alias-bg-layer-2,#f3f4f6)',stroke:'var(--dsw-alias-border-l2,#d1d5db)','stroke-width':1}));
  svg.appendChild(el('text',{x:52,y:19,'font-size':10,fill:'var(--dsw-alias-label-tertiary,#6b7280)'})).textContent='离散杆 · 5 个节点';

  // 温度剖面折线（先画，位于柱之上、节点之下）
  var line=el('polyline',{fill:'none',stroke:'var(--dsw-alias-brand-primary,#2563eb)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round',opacity:.5});
  svg.appendChild(line);

  var bars=[],dots=[],tops=[],valEl=[],prevEl=[];
  for(var i=0;i<5;i++){
    var fixed=(i===0||i===4);
    var bar=el('rect',{x:X[i]-30,y:BASE,width:60,height:0,rx:6,fill:'#3884ff','class':'hc-bar'});
    svg.appendChild(bar); bars.push(bar);

    var dot=el('circle',{cx:X[i],cy:37,r:14,fill:'#3884ff',stroke:fixed?'var(--dsw-alias-label-primary,#111827)':'var(--dsw-alias-bg-base,#fff)','stroke-width':fixed?2.5:2,'class':'hc-dot'});
    svg.appendChild(dot); dots.push(dot);

    var top=el('text',{x:X[i],y:BASE,'text-anchor':'middle','font-size':12,'font-weight':600,fill:'var(--dsw-alias-label-primary,#111827)',style:'font-variant-numeric:tabular-nums'});
    svg.appendChild(top); tops.push(top);

    var lab=el('text',{x:X[i],y:291,'text-anchor':'middle','font-size':11,fill:'var(--dsw-alias-label-secondary,#4b5563)'});
    lab.textContent='N'+(i+1)+(fixed?'（固定）':'');
    svg.appendChild(lab);

    var card=dom('div','hc-card');
    card.appendChild(dom('div','hc-name','N'+(i+1)+(fixed?'<span class="hc-tag">固定</span>':'')));
    var val=dom('div','hc-val','—');
    var pv=dom('div','hc-prev','上一步 —');
    card.appendChild(val); card.appendChild(pv);
    readouts.appendChild(card);
    valEl.push(val); prevEl.push(pv);
  }

  var state=[100,0,0,0,0], prev=null, n=0;

  function color(T){
    var t=Math.max(0,Math.min(1,T/100));
    return 'rgb('+Math.round(56+(239-56)*t)+','+Math.round(132+(68-132)*t)+','+Math.round(255+(68-255)*t)+')';
  }

  function render(){
    var pts=[];
    for(var i=0;i<5;i++){
      var T=state[i], h=T/100*MAXH, top=BASE-h, hh=Math.max(h,2);
      bars[i].setAttribute('y',BASE-hh);
      bars[i].setAttribute('height',hh);
      bars[i].setAttribute('fill',color(T));
      bars[i].setAttribute('opacity',T<0.005?0.35:0.9);
      dots[i].setAttribute('fill',color(T));
      tops[i].setAttribute('y',top-9);
      tops[i].textContent=T.toFixed(2);
      pts.push(X[i].toFixed(1)+','+top.toFixed(1));
      valEl[i].innerHTML=T.toFixed(2)+'<span class="hc-unit">°C</span>';
      prevEl[i].textContent=prev?('上一步 '+prev[i].toFixed(2)+' °C'):'上一步 —';
    }
    line.setAttribute('points',pts.join(' '));
    stepEl.textContent=String(n);
  }

  nextBtn.addEventListener('click',function(){
    var old=state;                 // 上一时刻的全部温度
    var next=old.slice();          // 同步：先算完再整体替换
    for(var i=1;i<4;i++){
      next[i]=old[i]+ALPHA*(old[i-1]-2*old[i]+old[i+1]);
    }
    next[0]=LEFT; next[4]=RIGHT;   // 边界固定
    prev=old; state=next; n++;
    render();
  });

  resetBtn.addEventListener('click',function(){
    state=[100,0,0,0,0]; prev=null; n=0; render();
  });

  render();
})();
</script>
</div></body></html>
