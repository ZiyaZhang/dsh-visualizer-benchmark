<!-- 一维热传导显式差分演示：5 节点，两端固定，中间 3 节点同步更新 -->
<div class="hc-wrap">
  <div class="hc-head">
    <div class="hc-title">一维热传导 · 离散显式差分示意</div>
    <div class="hc-sub">杆离散为 <b>5 个节点</b>；两端固定 <b>100 °C / 0 °C</b>，中间 3 节点初值 <b>0 °C</b>；扩散系数 α = <b>0.25</b>，用 <b>上一时刻</b>的相邻温度同步更新。</div>
  </div>

  <div class="hc-rod-outer">
    <div class="hc-ends">
      <span class="hc-end-tag" id="tagL">左端 100 °C（固定）</span>
      <span class="hc-end-tag" id="tagR">右端 0 °C（固定）</span>
    </div>
    <canvas id="rod" width="760" height="120" role="img"
      aria-label="杆上 5 个节点的温度色带：左端恒为 100 摄氏度，右端恒为 0 摄氏度，中间 3 个节点随步数升温。"></canvas>
    <div class="hc-axis">
      <span>x₁</span><span>x₂</span><span>x₃</span><span>x₄</span><span>x₅</span>
    </div>
  </div>

  <div class="hc-curve-box">
    <canvas id="curve" width="760" height="200" role="img"
      aria-label="节点温度随步数变化的折线图，纵轴 0 到 100 摄氏度。"></canvas>
  </div>

  <div class="hc-controls">
    <div class="hc-row">
      <button id="step" class="hc-btn hc-primary" type="button">单步 ▶</button>
      <button id="reset" class="hc-btn" type="button">重置</button>
      <button id="auto" class="hc-btn" type="button" aria-pressed="false">自动播放</button>
      <span class="hc-stepbox">步数 <b id="stepVal" class="hc-num">0</b></span>
    </div>
    <div class="hc-row hc-row-slider">
      <label for="alpha">扩散系数 α</label>
      <input id="alpha" type="range" min="0.05" max="0.5" step="0.05" value="0.25">
      <output id="alphaVal" class="hc-num" for="alpha">0.25</output>
      <span class="hc-stab" id="stab">稳定（α ≤ 0.5）</span>
    </div>
  </div>

  <table class="hc-table">
    <caption class="hc-cap">各节点温度（°C）</caption>
    <thead>
      <tr><th scope="col">节点</th><th scope="col">x₁ 左端</th><th scope="col">x₂</th><th scope="col">x₃</th><th scope="col">x₄</th><th scope="col">x₅ 右端</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">当前温度</th>
        <td class="hc-num" id="c1">100.00</td><td class="hc-num" id="c2">0.00</td><td class="hc-num" id="c3">0.00</td><td class="hc-num" id="c4">0.00</td><td class="hc-num" id="c5">0.00</td></tr>
      <tr><th scope="row">上一时刻</th>
        <td class="hc-num hc-dim" id="p1">—</td><td class="hc-num hc-dim" id="p2">—</td><td class="hc-num hc-dim" id="p3">—</td><td class="hc-num hc-dim" id="p4">—</td><td class="hc-num hc-dim" id="p5">—</td></tr>
      <tr><th scope="row">本步增量</th>
        <td class="hc-num hc-dim" id="d1">—</td><td class="hc-num" id="d2">—</td><td class="hc-num" id="d3">—</td><td class="hc-num" id="d4">—</td><td class="hc-num hc-dim" id="d5">—</td></tr>
    </tbody>
  </table>

  <div class="hc-note" id="note">
    点击「单步 ▶」开始：中间 3 个节点按 <span class="hc-mono">T<sub>i</sub>* = T<sub>i</sub> + α (T<sub>i−1</sub> + T<sub>i+1</sub> − 2T<sub>i</sub>)</span> 同时更新，两端不参与更新。
  </div>
</div>

<style>
  .hc-wrap{
    --hc-cool:#3b6fd4; --hc-warm:#e0483c; --hc-mid:#e9c46a;
    font-family:inherit; color:var(--dsw-alias-label-primary);
    background:var(--dsw-alias-bg-layer-1); border:1px solid var(--dsw-alias-border-l1);
    border-radius:14px; padding:16px 16px 12px; max-width:820px; min-width:0;
    display:flex; flex-direction:column; gap:12px; box-sizing:border-box;
  }
  .hc-head{display:flex;flex-direction:column;gap:4px}
  .hc-title{font-weight:650;font-size:15px}
  .hc-sub{font-size:12.5px;line-height:1.55;color:var(--dsw-alias-label-secondary)}
  .hc-sub b{color:var(--dsw-alias-label-primary)}
  .hc-rod-outer{display:flex;flex-direction:column;gap:6px;min-width:0}
  .hc-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dsw-alias-label-tertiary)}
  .hc-end-tag.hc-hot{color:var(--hc-warm)}
  .hc-end-tag.hc-cold{color:var(--hc-cool)}
  #rod{width:100%;height:auto;display:block;border-radius:10px}
  .hc-axis{display:grid;grid-template-columns:repeat(5,1fr);font-size:11px;color:var(--dsw-alias-label-tertiary);text-align:center}
  .hc-curve-box{background:var(--dsw-alias-bg-layer-2);border:1px solid var(--dsw-alias-border-l1);border-radius:10px;padding:4px}
  #curve{width:100%;height:auto;display:block}
  .hc-controls{display:flex;flex-direction:column;gap:8px}
  .hc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px}
  .hc-btn{font:inherit;font-size:12.5px;padding:6px 14px;border-radius:8px;cursor:pointer;
    border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary)}
  .hc-btn:hover{background:var(--dsw-alias-interactive-bg-hover)}
  .hc-btn:active{background:var(--dsw-alias-interactive-bg-active)}
  .hc-primary{background:var(--dsw-alias-button-primary-fill);color:var(--dsw-alias-label-primary-inverted);border-color:transparent;font-weight:600}
  .hc-btn[aria-pressed="true"]{border-color:var(--dsw-alias-brand-primary);color:var(--dsw-alias-brand-primary)}
  .hc-stepbox{margin-left:auto;color:var(--dsw-alias-label-secondary)}
  .hc-row-slider{gap:10px}
  .hc-row-slider input[type=range]{flex:1 1 160px;min-width:120px;max-width:280px}
  .hc-num{font-variant-numeric:tabular-nums}
  .hc-stab{font-size:11.5px;color:var(--hc-cool)}
  .hc-stab.hc-warn{color:var(--dsw-alias-state-error-primary)}
  .hc-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .hc-cap{text-align:left;font-size:11.5px;color:var(--dsw-alias-label-tertiary);padding-bottom:4px}
  .hc-table th,.hc-table td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--dsw-alias-border-l1)}
  .hc-table thead th{font-weight:600;color:var(--dsw-alias-label-secondary);font-size:11.5px}
  .hc-table tbody th[scope=row]{text-align:left;font-weight:500;color:var(--dsw-alias-label-secondary);white-space:nowrap}
  .hc-table td{text-align:right}
  .hc-dim{color:var(--dsw-alias-label-tertiary)}
  #d2,#d3,#d4{color:var(--hc-warm)}
  .hc-note{font-size:12px;line-height:1.55;color:var(--dsw-alias-label-secondary);
    background:var(--dsw-alias-bg-layer-2);border:1px solid var(--dsw-alias-border-l1);border-radius:10px;padding:8px 10px}
  .hc-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--dsw-alias-label-primary)}
  @media (max-width:560px){
    .hc-table{font-size:11.5px}
    .hc-table th,.hc-table td{padding:4px 3px}
    .hc-stepbox{margin-left:0;flex-basis:100%}
  }
</style>

<script>
(function(){
  // ===== 模型：一维热传导显式差分（离散示意，非解析解） =====
  var N = 5;                      // 节点数
  var FIXED = {0: 100, 4: 0};     // 两端固定温度 °C
  var alpha = 0.25;               // 扩散系数
  var T = [100, 0, 0, 0, 0];      // 当前温度
  var prev = [100, 0, 0, 0, 0];   // 上一时刻温度
  var step = 0;
  var history = [T.slice()];      // 用于折线图

  var rod = document.getElementById('rod');
  var curve = document.getElementById('curve');
  var ctx = rod.getContext('2d');
  var cctx = curve.getContext('2d');
  var DPR = window.devicePixelRatio || 1;

  function setup(cv, ctx, w, h){
    cv.width = w * DPR; cv.height = h * DPR;
    cv.style.height = h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function setupAll(){ setup(rod, ctx, 760, 120); setup(curve, cctx, 760, 200); }
  setupAll();

  function cssVar(name, fb){
    var v = getComputedStyle(document.querySelector('.hc-wrap')).getPropertyValue(name);
    return (v && v.trim()) || fb;
  }
  // 温度 -> 颜色（蓝 0°C → 红 100°C）
  function tempColor(t){
    var f = Math.max(0, Math.min(1, t/100));
    var stops = [[59,111,212],[110,150,215],[233,196,106],[224,110,74],[224,72,60]];
    var p = f * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(p)), g = p - i;
    var a = stops[i], b = stops[i+1];
    return 'rgb(' + Math.round(a[0]+(b[0]-a[0])*g) + ',' +
                    Math.round(a[1]+(b[1]-a[1])*g) + ',' +
                    Math.round(a[2]+(b[2]-a[2])*g) + ')';
  }
  function fmt(t){ return (Math.round(t*100)/100).toFixed(2); }
  function fmtDelta(d){ var s = (d>=0?'+':''); return s + (Math.round(d*100)/100).toFixed(2); }

  function drawRod(){
    var w = 760, h = 120, pad = 26, barH = 46, y = (h - barH)/2;
    var n = N, segW = (w - 2*pad) / n;
    ctx.clearRect(0,0,w,h);
    var border = cssVar('--dsw-alias-border-l1', '#d0d5dd');
    var txt = cssVar('--dsw-alias-label-secondary', '#667085');
    var txtStrong = cssVar('--dsw-alias-label-primary', '#101828');

    for (var i=0;i<n;i++){
      var x = pad + i*segW;
      ctx.fillStyle = tempColor(T[i]);
      ctx.fillRect(x, y, segW + 0.5, barH);
      // 内部分隔线：体现「离散节点段」
      if (i>0){
        ctx.strokeStyle = 'rgba(255,255,255,.45)';
        ctx.setLineDash([3,3]); ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x, y+barH); ctx.stroke();
        ctx.setLineDash([]);
      }
      // 节点圆点：节点位于段中心
      ctx.beginPath();
      ctx.arc(x + segW/2, y + barH/2, 5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.5; ctx.stroke();
      // 温度数值
      ctx.font = '600 13px ui-monospace,SFMono-Regular,Menlo,monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = (T[i] > 55 && i !== 4) || i === 0 ? '#fff' : '#fff';
      ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 3;
      ctx.fillText(T[i].toFixed(1) + '°', x + segW/2, y + barH + 4 + 16);
      ctx.shadowBlur = 0;
      // 固定端标记
      if (i === 0 || i === 4){
        ctx.font = '600 10px system-ui,sans-serif';
        ctx.fillStyle = 'rgba(0,0,0,.55)';
        ctx.fillText('固定', x + segW/2, y - 8);
      }
    }
    // 外框
    ctx.strokeStyle = border; ctx.lineWidth = 1;
    ctx.strokeRect(pad + 0.5, y + 0.5, w - 2*pad - 1, barH - 1);
  }

  function drawCurve(){
    var w = 760, h = 200, L = 46, R = 14, Tp = 16, B = 30;
    var pw = w - L - R, ph = h - Tp - B;
    cctx.clearRect(0,0,w,h);
    var grid = cssVar('--dsw-alias-border-l1', '#e4e7ec');
    var lab = cssVar('--dsw-alias-label-tertiary', '#98a2b3');

    // 坐标轴与网格
    cctx.font = '10.5px ui-monospace,Menlo,monospace';
    cctx.textAlign = 'right'; cctx.textBaseline = 'middle';
    for (var v=0; v<=100; v+=25){
      var yy = Tp + ph - (v/100)*ph;
      cctx.strokeStyle = grid; cctx.beginPath();
      cctx.moveTo(L, yy+0.5); cctx.lineTo(w-R, yy+0.5); cctx.stroke();
      cctx.fillStyle = lab; cctx.fillText(v + '°', L - 6, yy);
    }
    cctx.strokeStyle = cssVar('--dsw-alias-border-l2', '#d0d5dd');
    cctx.beginPath(); cctx.moveTo(L+0.5, Tp); cctx.lineTo(L+0.5, Tp+ph); cctx.stroke();
    cctx.textAlign = 'left'; cctx.textBaseline = 'alphabetic';
    cctx.fillStyle = lab;
    cctx.fillText('步数 →', L, h - 10);
    cctx.fillText('节点温度随步数变化（折线为离散点的连线）', L + 58, h - 10);

    // x 轴映射：至少留 12 步宽度
    var maxStep = Math.max(12, history.length - 1);
    function X(s){ return L + (maxStep ? (s/maxStep)*pw : 0); }
    function Y(t){ return Tp + ph - (Math.max(0,Math.min(100,t))/100)*ph; }

    // 各节点曲线
    for (var i=0;i<N;i++){
      var col = (i===0) ? '#e0483c' : (i===4) ? '#3b6fd4' : tempColor([0,60,100,75][i-1]);
      cctx.strokeStyle = col; cctx.lineWidth = (i===0||i===4) ? 1.6 : 2;
      cctx.setLineDash((i===0||i===4) ? [5,4] : []);
      cctx.beginPath();
      for (var s=0;s<history.length;s++){
        var x = X(s), y = Y(history[s][i]);
        if (s===0) cctx.moveTo(x,y); else cctx.lineTo(x,y);
      }
      cctx.stroke(); cctx.setLineDash([]);
      // 末端圆点，强调离散步
      if (history.length){
        cctx.beginPath();
        cctx.arc(X(history.length-1), Y(T[history.length-1][i]), 2.6, 0, Math.PI*2);
        cctx.fillStyle = col; cctx.fill();
      }
    }
  }

  // SVG 图例（用 DOM 生成，避免额外 canvas 交互）
  function updateLegend(){}

  function render(){
    // 数值表
    for (var i=0;i<N;i++){
      document.getElementById('c'+(i+1)).textContent = fmt(T[i]);
      var p = (step === 0) ? '—' : fmt(prev[i]);
      document.getElementById('p'+(i+1)).textContent = p;
      var d = (step === 0) ? '—' : fmtDelta(T[i]-prev[i]);
      document.getElementById('d'+(i+1)).textContent = d;
    }
    document.getElementById('stepVal').textContent = step;
    document.getElementById('alphaVal').textContent = alpha.toFixed(2);
    var stab = document.getElementById('stab');
    var stable = alpha <= 0.5;
    stab.textContent = stable ? '稳定（α ≤ 0.5）' : '可能不稳定（α > 0.5）';
    stab.classList.toggle('hc-warn', !stable);
    drawRod(); drawCurve();
  }

  function doStep(){
    var old = T.slice();          // 以「上一时刻」快照同步更新，避免就地覆盖
    var next = T.slice();
    for (var i=1;i<N-1;i++){
      next[i] = old[i] + alpha * (old[i-1] + old[i+1] - 2*old[i]);
    }
    // 两端保持固定
    next[0] = FIXED[0]; next[N-1] = FIXED[N-1];
    prev = old; T = next; step++;
    history.push(T.slice());
    if (history.length > 400) history.shift();  // 有界
    render();
  }

  function doReset(){
    stopAuto();
    T = [100,0,0,0,0]; prev = [100,0,0,0,0]; step = 0;
    history = [T.slice()];
    render();
  }

  // ===== 自动播放（有界：最多 60 步后停止） =====
  var timer = null, autoBtn = document.getElementById('auto');
  function stopAuto(){
    if (timer){ clearInterval(timer); timer = null; }
    autoBtn.setAttribute('aria-pressed','false');
    autoBtn.textContent = '自动播放';
  }
  function startAuto(){
    timer = setInterval(function(){
      if (step >= 60){ stopAuto(); return; }
      doStep();
    }, 380);
    autoBtn.setAttribute('aria-pressed','true');
    autoBtn.textContent = '暂停 ❚❚';
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      // 尊重减弱动效：改为一次推进若干步、不连续动画
      clearInterval(timer);
      timer = setInterval(function(){
        if (step >= 60){ stopAuto(); return; }
        doStep();
      }, 900);
    }
  }
  autoBtn.addEventListener('click', function(){
    if (timer) stopAuto(); else startAuto();
  });
  document.getElementById('step').addEventListener('click', function(){
    stopAuto(); doStep();
  });
  document.getElementById('reset').addEventListener('click', doReset);
  document.getElementById('alpha').addEventListener('input', function(e){
    alpha = parseFloat(e.target.value);
    render();
  });

  // 窗口缩放后按需重设分辨率
  var rt = null;
  window.addEventListener('resize', function(){
    if (rt) clearTimeout(rt);
    rt = setTimeout(function(){ setupAll(); render(); }, 150);
  });

  // 固定端标签着色
  document.getElementById('tagL').classList.add('hc-hot');
  document.getElementById('tagR').classList.add('hc-cold');

  render();
})();
</script>
