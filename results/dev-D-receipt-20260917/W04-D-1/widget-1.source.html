<style>
  .vz-fig{box-sizing:border-box;width:100%;max-width:640px;background:var(--dsw-alias-bg-base);border:1px solid var(--dsw-alias-border-l1);border-radius:12px;padding:16px 16px 12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--dsw-alias-label-primary)}
  .vz-fig *{box-sizing:border-box}
  .vz-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:14px}
  .vz-head h3{margin:0;font-size:15px;font-weight:650;line-height:1.3}
  .vz-unit{font-size:12px;color:var(--dsw-alias-label-tertiary)}
  .vz-items{margin:0;padding:0;list-style:none}
  .vz-item + .vz-item{margin-top:14px}
  .vz-name{font-size:14px;font-weight:550;line-height:1.4;margin-bottom:6px;overflow-wrap:anywhere}
  .vz-track{position:relative;height:20px;display:flex;align-items:center;background:var(--dsw-alias-bg-layer-2);border-radius:5px}
  .vz-grid{position:absolute;inset:0;border-radius:5px;background-image:linear-gradient(to right,var(--dsw-alias-border-l1) 1px,transparent 1px);background-size:25% 100%;pointer-events:none}
  .vz-bar{position:relative;z-index:1;height:20px;border-radius:5px;background:var(--dsw-alias-brand-primary);min-width:3px}
  .vz-val{position:absolute;z-index:2;top:50%;transform:translate(9px,-50%);font-size:13px;font-weight:650;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--dsw-alias-label-primary)}
  .vz-val--inside{transform:translate(-9px,-50%);color:var(--dsw-alias-label-primary-inverted)}
  .vz-axis{position:relative;height:15px;margin-top:6px;font-size:11px;color:var(--dsw-alias-label-tertiary);font-variant-numeric:tabular-nums}
  .vz-axis span{position:absolute;top:0;transform:translateX(-50%)}
  .vz-axis span:first-child{transform:none}
  .vz-axis span:last-child{transform:translateX(-100%)}
  @media (max-width:380px){.vz-name{font-size:13.5px}.vz-val{font-size:12.5px}}
</style>
<figure class="vz-fig" style="margin:0">
  <div class="vz-head">
    <h3>四个功能的使用次数</h3>
    <span class="vz-unit">单位：次 · 横轴 0–300</span>
  </div>
  <div role="img" aria-label="横向条形图，单位次数，刻度 0 到 300：长文档的跨章节证据追溯 120 次；多轮对话中的上下文恢复 80 次；插件热更新后继续当前任务 45 次；直接生成一个简短答案 300 次。">
    <ul class="vz-items">
      <li class="vz-item">
        <div class="vz-name">长文档的跨章节证据追溯</div>
        <div class="vz-track">
          <div class="vz-grid"></div>
          <div class="vz-bar" style="width:40%"></div>
          <span class="vz-val" style="left:40%">120 次</span>
        </div>
      </li>
      <li class="vz-item">
        <div class="vz-name">多轮对话中的上下文恢复</div>
        <div class="vz-track">
          <div class="vz-grid"></div>
          <div class="vz-bar" style="width:26.7%"></div>
          <span class="vz-val" style="left:26.7%">80 次</span>
        </div>
      </li>
      <li class="vz-item">
        <div class="vz-name">插件热更新后继续当前任务</div>
        <div class="vz-track">
          <div class="vz-grid"></div>
          <div class="vz-bar" style="width:15%"></div>
          <span class="vz-val" style="left:15%">45 次</span>
        </div>
      </li>
      <li class="vz-item">
        <div class="vz-name">直接生成一个简短答案</div>
        <div class="vz-track">
          <div class="vz-grid"></div>
          <div class="vz-bar" style="width:100%"></div>
          <span class="vz-val vz-val--inside" style="right:0">300 次</span>
        </div>
      </li>
    </ul>
    <div class="vz-axis" aria-hidden="true">
      <span>0</span><span style="left:50%">150</span><span style="left:100%">300</span>
    </div>
  </div>
</figure>
