<svg viewBox="0 0 760 448" role="img" aria-labelledby="netUsersTitle netUsersDesc" style="width:100%;height:auto;display:block;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="netUsersTitle">每月净新增用户对比图</title>
  <desc id="netUsersDesc">1月120人，2月0人，3月数据缺失，4月-30人，5月80人。零值用基线上的空心圆表示，缺失数据用斜纹带加问号表示，负值用零线以下的红色柱表示。</desc>
  <defs>
    <pattern id="missHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef1f5"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#aab3bf" stroke-width="2.4"/>
    </pattern>
    <pattern id="negStripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-width="2.4" opacity="0.45"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="760" height="448" rx="12" fill="var(--dsw-alias-bg-layer-1,#ffffff)" stroke="var(--dsw-alias-border-l1,#e6e8ec)"/>

  <text x="96" y="34" font-size="18" font-weight="600" fill="var(--dsw-alias-label-primary,#1f2328)">每月净新增用户（人）</text>
  <text x="96" y="55" font-size="11.5" fill="var(--dsw-alias-label-secondary,#5b6470)">1–5 月 · 单位：人</text>

  <rect x="96" y="252.6" width="600" height="76.4" fill="#d64545" fill-opacity="0.05"/>

  <g stroke="var(--dsw-alias-border-l1,#e6e8ec)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="96" y1="96" x2="696" y2="96"/>
    <line x1="96" y1="148" x2="696" y2="148"/>
    <line x1="96" y1="200" x2="696" y2="200"/>
  </g>
  <line x1="96" y1="76" x2="96" y2="329" stroke="var(--dsw-alias-border-l2,#c3c9d2)" stroke-width="1"/>
  <line x1="96" y1="252" x2="696" y2="252" stroke="#8a93a0" stroke-width="1.3"/>

  <g font-size="11.5" fill="var(--dsw-alias-label-tertiary,#8a93a0)" text-anchor="end">
    <text x="88" y="100">120</text>
    <text x="88" y="152">80</text>
    <text x="88" y="204">40</text>
    <text x="88" y="256">0</text>
  </g>

  <rect x="128" y="96" width="56" height="156" rx="2" fill="#1a9c6b"/>
  <rect x="608" y="148" width="56" height="104" rx="2" fill="#1a9c6b"/>
  <rect x="488" y="252" width="56" height="39" fill="#d64545"/>
  <rect x="488" y="252" width="56" height="39" fill="url(#negStripes)"/>

  <rect x="368" y="76" width="56" height="176" rx="2" fill="url(#missHatch)" stroke="#9aa4b2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="396" y="158" font-size="30" font-weight="600" text-anchor="middle" fill="#8a93a0">?</text>
  <text x="396" y="188" font-size="11.5" text-anchor="middle" fill="#6b7480">缺失</text>

  <circle cx="276" cy="252" r="6" fill="var(--dsw-alias-bg-layer-1,#ffffff)" stroke="#5b6470" stroke-width="2"/>

  <g text-anchor="middle" font-weight="700" font-size="15">
    <text x="156" y="86" fill="#147a54">120</text>
    <text x="636" y="138" fill="#147a54">80</text>
    <text x="516" y="312" fill="#b62f2f">-30</text>
    <text x="276" y="234" fill="#5b6470">0</text>
  </g>
  <text x="552" y="272" font-size="10.5" fill="#b62f2f">净流失</text>

  <g text-anchor="middle" font-size="10.5" fill="var(--dsw-alias-label-secondary,#5b6470)">
    <text x="276" y="276">有数据 · 值为 0</text>
    <text x="396" y="276">无数据 · 不等于 0</text>
  </g>

  <g text-anchor="middle" font-size="13" fill="var(--dsw-alias-label-primary,#1f2328)">
    <text x="156" y="352">1月</text>
    <text x="276" y="352">2月</text>
    <text x="396" y="352">3月</text>
    <text x="516" y="352">4月</text>
    <text x="636" y="352">5月</text>
  </g>

  <g font-size="12" fill="var(--dsw-alias-label-secondary,#5b6470)">
    <rect x="96" y="376" width="14" height="14" rx="3" fill="#1a9c6b"/>
    <text x="118" y="388">正值 = 净新增</text>
    <rect x="404" y="376" width="14" height="14" rx="3" fill="#d64545"/>
    <rect x="404" y="376" width="14" height="14" rx="3" fill="url(#negStripes)"/>
    <text x="426" y="388">负值 = 净流失</text>

    <circle cx="103" cy="407" r="6" fill="var(--dsw-alias-bg-layer-1,#ffffff)" stroke="#5b6470" stroke-width="2"/>
    <text x="118" y="412">0 = 有数据，值恰为零</text>
    <rect x="404" y="400" width="14" height="14" rx="3" fill="url(#missHatch)" stroke="#9aa4b2" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="426" y="412">缺失 = 无数据，不等于 0</text>
  </g>
</svg>
