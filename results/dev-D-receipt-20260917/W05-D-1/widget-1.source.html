<style>
  .qty-card{
    --fg:var(--dsw-alias-label-primary,#1f2328);
    --fg2:var(--dsw-alias-label-secondary,#5b6470);
    --line:var(--dsw-alias-border-l1,#d8dce3);
    --brand:var(--dsw-alias-brand-primary,#3b6fe0);
    --layer:var(--dsw-alias-bg-layer-1,#ffffff);
    box-sizing:border-box;max-width:340px;margin:0 auto;padding:16px 16px 14px;
    background:var(--dsw-alias-bg-layer-2,#f6f7f9);border:1px solid var(--line);
    border-radius:14px;color:var(--fg);font-family:inherit;
  }
  .qty-card *{box-sizing:border-box}
  .qty-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .qty-title{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--fg2)}
  .qty-reset{
    border:1px solid var(--line);background:transparent;color:var(--fg2);
    font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;
  }
  .qty-reset:hover{background:var(--dsw-alias-interactive-bg-hover,rgba(0,0,0,.045))}
  .qty-row{display:flex;align-items:center;justify-content:center;gap:14px}
  .qty-btn{
    width:52px;height:52px;flex:0 0 auto;border-radius:13px;border:1px solid var(--line);
    background:var(--layer);color:var(--fg);font-size:26px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
    transition:background .12s ease,transform .06s ease,opacity .12s ease;
  }
  .qty-btn:hover:not(:disabled){background:var(--dsw-alias-interactive-bg-hover,rgba(0,0,0,.05))}
  .qty-btn:active:not(:disabled){background:var(--dsw-alias-interactive-bg-active,rgba(0,0,0,.09));transform:scale(.95)}
  .qty-btn:disabled{opacity:.35;cursor:not-allowed}
  .qty-value{
    min-width:3ch;text-align:center;font-size:40px;font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  }
  .qty-track{display:flex;gap:6px;margin:16px 0 4px}
  .qty-pip{flex:1 1 0;height:8px;border-radius:4px;background:var(--line);transition:background .12s ease}
  .qty-pip.on{background:var(--brand)}
  .qty-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums}
  .qty-hint{margin:10px 0 0;font-size:12px;color:var(--fg2);min-height:1.2em;text-align:center}
</style>
<div class="qty-card" role="group" aria-label="数量选择器，范围 0 到 5">
  <div class="qty-head">
    <span class="qty-title">数量</span>
    <button id="qty-reset" class="qty-reset" type="button">重置</button>
  </div>
  <div class="qty-row">
    <button id="qty-minus" class="qty-btn" type="button" aria-label="减少一个">−</button>
    <output id="qty-value" class="qty-value" aria-live="polite" aria-label="当前数量">2</output>
    <button id="qty-plus" class="qty-btn" type="button" aria-label="增加一个">+</button>
  </div>
  <div id="qty-track" class="qty-track" role="img" aria-label="当前数量在 0 到 5 之间的位置"></div>
  <div class="qty-scale"><span>0</span><span>5</span></div>
  <p id="qty-hint" class="qty-hint">可加 3 次 · 可减 2 次</p>
</div>
<script>
(function () {
  var MIN = 0, MAX = 5, START = 2;
  var value = START;

  var minus = document.getElementById('qty-minus');
  var plus = document.getElementById('qty-plus');
  var display = document.getElementById('qty-value');
  var hint = document.getElementById('qty-hint');
  var track = document.getElementById('qty-track');
  var reset = document.getElementById('qty-reset');

  var pips = [];
  for (var i = MIN; i <= MAX; i++) {
    var pip = document.createElement('span');
    pip.className = 'qty-pip';
    track.appendChild(pip);
    pips.push(pip);
  }

  function render() {
    display.textContent = String(value);
    minus.disabled = value <= MIN;
    plus.disabled = value >= MAX;
    for (var i = 0; i < pips.length; i++) {
      pips[i].classList.toggle('on', i < value);
    }
    if (value >= MAX) hint.textContent = '已达上限 5，加号已禁用';
    else if (value <= MIN) hint.textContent = '已达下限 0，减号已禁用';
    else hint.textContent = '可加 ' + (MAX - value) + ' 次 · 可减 ' + (value - MIN) + ' 次';
  }

  minus.addEventListener('click', function () {
    if (value > MIN) { value -= 1; render(); }
  });
  plus.addEventListener('click', function () {
    if (value < MAX) { value += 1; render(); }
  });
  reset.addEventListener('click', function () {
    value = START;
    render();
  });

  render();
})();
</script>
