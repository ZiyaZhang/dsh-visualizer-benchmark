:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .tcp{--bg:#0f1522;--panel:#161f30;--panel2:#1c2739;--line:#2a3752;--ink:#e8edf7;--dim:#93a3bd;--cy:#38bdf8;--gr:#34d399;--am:#fbbf24;--rd:#fb7185;

<div class="tcp">
  <div class="top">
    <div class="title">TCP 三次握手 · 分步演示</div>
    <div class="steps">
      <button class="chip on" data-s="0">① SYN</button>
      <button class="chip" data-s="1">② SYN + ACK</button>
      <button class="chip" data-s="2">③ ACK</button>
    </div>
  </div>

  <div class="main">
    <div class="panel">
      <svg viewBox="0 0 640 400" role="img" aria-label="TCP 三次握手时序图">
        <text x="92" y="22" text-anchor="middle" class="num" fill="#38bdf8">客户端</text>
        <text x="552" y="22" text-anchor="middle" class="num" fill="#34d399">服务端</text>

        <line x1="92" y1="40" x2="92" y2="368" class="life" opacity="0"/>
        <rect x="46" y="8" width="92" height="26" rx="6" fill="none" stroke="none"/>
        <circle cx="92" cy="51" r="11" class="actor"/>
        <text x="92" y="55" text-anchor="middle" font-size="11" fill="#e8edf7">C</text>
        <text x="92" y="80" text-anchor="middle" font-size="10.5" fill="#93a3bd">socket</text>
        <line x1="552" y1="40" x2="552" y2="368" class="life" opacity="0"/>
        <circle cx="552" cy="51" r="11" fill="#16233a" stroke="#2f6b52"/>
        <text x="552" y="55" text-anchor="middle" font-size="11" fill="#c4f5de">S</text>
        <text x="552" y="80" text-anchor="middle" font-size="10.5" fill="#93a3bd">listen 80</text>

        <line x1="92" y1="92" x2="92" y2="368" class="lifeline"/>
        <line x1="552" y1="92" x2="552" y2="368" class="lifeline"/>

        <!-- ① SYN -->
        <g class="act actA">
          <line x1="92" y1="110" x2="552" y2="110" class="track"/>
          <polygon class="head" points="552,110 544,105 544,115"/>
          <rect class="box" x="196" y="94" width="252" height="32" rx="7"/>
          <text x="322" y="109" class="boxlabel">SYN · seq = x</text>
          <text x="322" y="121" class="boxesub">我想建连，请从 x 开始编号</text>
          <text x="322" y="147" text-anchor="middle" font-size="10.5" fill="#93a3bd">“我能发，你能收吗？”</text>
        </g>

        <!-- ② SYN + ACK -->
        <g class="act actB">
          <line x1="552" y1="188" x2="92" y2="188" class="track"/>
          <polygon class="head" points="92,188 100,183 100,193"/>
          <rect class="box" x="174" y="172" width="296" height="32" rx="7"/>
          <text x="322" y="187" class="boxlabel">SYN + ACK · seq = y, ack = x + 1</text>
          <text x="322" y="199" class="boxesub">收到你的 x，我也从 y 开始</text>
          <text x="322" y="225" text-anchor="middle" font-size="10.5" fill="#93a3bd">“我能收，也能发；双向通道对上了”</text>
        </g>

        <!-- ③ ACK -->
        <g class="act actC" id="m3">
          <line x1="92" y1="266" x2="552" y2="266" class="track"/>
          <polygon class="head" points="552,266 544,261 544,271"/>
          <rect class="box" x="196" y="250" width="252" height="32" rx="7"/>
          <text x="322" y="265" class="boxlabel">ACK · ack = y + 1</text>
          <text x="322" y="277" class="boxesub">收到你的 y，服务端请进入建立态</text>
          <text x="322" y="303" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">✔ 握手完成，双方 ESTABLISHED</text>
        </g>

        <text class="fnote" id="fnote" x="552" y="240" text-anchor="end">✘ 这个 ACK 丢了：服务端不知道，你还在傻等数据</text>

        <line x1="92" y1="342" x2="552" y2="342" stroke="#2a3752" stroke-width="1"/>
        <g font-size="11" text-anchor="middle" fill="#93a3bd">
          <text x="112" y="362" text-anchor="start">状态：CLOSED → SYN_SENT → ESTABLISHED</text>
          <text x="532" y="362" text-anchor="end">LISTEN → SYN_RCVD → ESTABLISHED</text>
        </g>
      </svg>
      <div class="cap">点击上方 ①②③ 或“下一步”逐帧看：每帧都同时消耗掉一个“未确认”的疑问。</div>
    </div>

    <div class="side">
      <div class="panel">
        <div class="steptitle" id="ttl">① 客户端 → 服务端：SYN（seq = x）</div>
        <div class="desc" id="dsc"></div>
        <div class="mono" id="num"></div>
      </div>

      <div class="panel">
        <div class="states">
          <div class="st">
            <div class="who"><span>客户端</span><span class="badge" id="bC">CLOSED</span></div>
            <div class="val" id="sC">尚未建连</div>
          </div>
          <div class="st">
            <div class="who"><span>服务端</span><span class="badge g" id="bS">LISTEN</span></div>
            <div class="val" id="sS">等你开口</div>
          </div>
        </div>
      </div>

      <div class="why">
        <h4>这一帧解决了什么</h4>
        <ul id="why"></ul>
        <button class="failbtn" id="fbtn">⚠ 看看“只握两次”会怎样</button>
        <div class="failbox" id="fbox">
          两次握手后服务端就自认已建连，于是它必须为这次连接<b>预留资源</b>。若你早先那个 SYN 在网络里堵了很久才到，
          服务端会为一个<b>你早已放弃</b>的连接分配并保持状态、甚至把它当成新业务请求 —— 资源被白占，还可能重复处理。
          有了第三次 ACK，服务端才知道这次握手“确实是你现在要的”。
        </div>
      </div>
    </div>
  </div>

  <div class="bar">
    <button class="nav" id="prev">← 上一步</button>
    <button class="nav" id="next">下一步 →</button>
    <button class="nav pri" id="play">▶ 自动播放</button>
  </div>
</div>
<script>
(function(){
  var root = document.currentScript.closest('.tcp');
  var q = function(s){ return root.querySelector(s); };
  var chips = [].slice.call(root.querySelectorAll('.chip'));
  var groups = {A: root.querySelector('.actA'), B: root.querySelector('.actB'), C: root.querySelector('#m3')};
  var fnote = q('#fnote');

  var data = [
    {
      klass:'actA',
      t:'① 客户端 → 服务端：SYN（seq = x）',
      d:'客户端主动发起，选一个初始序号 x 放进 SYN 报文，意思是“我想建连，我发出的数据从 x 开始编号”。发完进入 SYN_SENT —— 此刻它还不知道服务端是否在线、是否愿意接受。',
      n:'本帧不确定性：服务端收到了吗？愿意连吗？',
      w:['客户端表达“我要建连”，并声明自己的初始序号','服务端由此获得：对方的通信能力（能收到才是问题，见第②帧）','尚未解决的问题——“我这个请求有效吗”'],
      c:['SYN_SENT','已发出请求，等待对端回应'],
      s:['LISTEN','等待连接请求']
    },
    {
      klass:'actB',
      t:'② 服务端 → 客户端：SYN + ACK（seq = y, ack = x + 1）',
      d:'服务端用自己的 SYN（seq = y）回应，同时用 ack = x + 1 确认收到对方的 x。一个报文同时干两件事：确认你的序号，并声明我自己的序号。',
      n:'本帧不确定性：客户端收到了吗？服务端的通道可信吗？',
      w:['服务端确认收到 x —— 客户端的能力已被证实','服务端声明自己的初始序号 y','但服务端仍不知道：这个 SYN 是现在发的，还是早先滞留的旧包'],
      c:['SYN_SENT','仍等待，不过已看到服务端的 y'],
      s:['SYN_RCVD','已回 SYN+ACK，等最后确认']
    },
    {
      klass:'actC',
      t:'③ 客户端 → 服务端：ACK（ack = y + 1）',
      d:'客户端确认收到 y。这个 ACK 的特别之处：它是对“服务端 SYN”的确认，而不是对数据的确认。它让双方都确认了对方的存在与能力 —— 三次之后，两个方向各自“发出/收到”都验证过了。',
      n:'本帧不确定性：没有了 —— 双方都已被对方确认',
      w:['确认服务端的 y，服务端的能力被证实','服务端由此确认：这个连接是客户端“当前”真正想要的','双方同时 ESTABLISHED，全双工通道正式可用'],
      c:['ESTABLISHED','双向已确认，可收发数据'],
      s:['ESTABLISHED','双向已确认，可收发数据']
    }
  ];

  var i = 0, timer = null;

  function render(st){
    var d = data[st];
    var names = features[d.klass];
    for (var k in groups){
      if (groups[k]) groups[k].classList.toggle('show', names.indexOf(k) >= 0);
    }
    chips.forEach(function(c, idx){ c.classList.toggle('on', idx === st); });
    q('#ttl').textContent = d.t;
    q('#dsc').textContent = d.d;
    q('#num').textContent = d.n;
    q('#why').innerHTML = d.w.map(function(x){ return '<li>' + x + '</li>'; }).join('');
    setSt('C', d.c, 'bC', 'sC');
    setSt('S', d.s, 'bS', 'sS');
  }
  var features = {actA:['A'], actB:['A','B'], actC:['A','B','C']};

  function setSt(who, arr, bid, sid){
    q('#' + bid).textContent = arr[0];
    q('#' + sid).textContent = arr[1];
  }

  function go(st){
    i = Math.max(0, Math.min(2, st));
    render(i);
  }

  chips.forEach(function(c){
    c.addEventListener('click', function(){ stopPlay(); go(parseInt(c.dataset.s, 10)); });
  });
  q('#next').addEventListener('click', function(){ stopPlay(); go(i + 1); });
  q('#prev').addEventListener('click', function(){ stopPlay(); go(i - 1); });

  function stopPlay(){ if (timer){ clearInterval(timer); timer = null; q('#play').textContent = '▶ 自动播放'; } }
  q('#play').addEventListener('click', function(){
    if (timer){ stopPlay(); return; }
    q('#play').textContent = '⏸ 暂停';
    if (i === 2) go(0);
    timer = setInterval(function(){
      if (i >= 2){ stopPlay(); return; }
      go(i + 1);
    }, 1500);
  });

  q('#fbtn').addEventListener('click', function(){
    var f = q('#fbox'), b = q('#fbtn'), on = f.classList.toggle('on');
    b.classList.toggle('on', on);
    fnote.classList.toggle('on', on);
    b.textContent = on ? '✓ 已切到“两次握手”的视角' : '⚠ 看看“只握两次”会怎样';
  });

  render(0);
})();
</script></body></html>
