<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}:where(body){padding:0}:where(body>svg){width:100%;height:auto}</style></head><body><svg viewBox="0 0 440 392" width="100%" role="img" aria-labelledby="barTitle barDesc" style="display:block;max-width:560px;margin:0 auto;font-family:system-ui,-apple-system,'PingFang SC','Noto Sans SC',sans-serif">
  <title id="barTitle">四个功能的使用次数对比</title>
  <desc id="barDesc">横向条形图：长文档的跨章节证据追溯 120 次，多轮对话中的上下文恢复 80 次，插件热更新后继续当前任务 45 次，直接生成一个简短答案 300 次。最高为直接生成一个简短答案 300 次，最低为插件热更新后继续当前任务 45 次。</desc>

  <text x="20" y="26" font-size="15" font-weight="700" fill="var(--dsw-alias-label-primary)">四个功能的使用次数对比</text>
  <text x="20" y="47" font-size="11.5" fill="var(--dsw-alias-label-tertiary)">单位：次（统计周期内）</text>

  <!-- 网格线 -->
  <g stroke="var(--dsw-alias-border-l1)" stroke-width="1">
    <line x1="16" y1="92" x2="16" y2="312"/>
    <line x1="76" y1="92" x2="76" y2="312"/>
    <line x1="136" y1="92" x2="136" y2="312"/>
    <line x1="196" y1="92" x2="196" y2="312"/>
    <line x1="256" y1="92" x2="256" y2="312"/>
    <line x1="316" y1="92" x2="316" y2="312"/>
  </g>
  <text x="76" y="84" font-size="10" text-anchor="middle" fill="var(--dsw-alias-label-tertiary)">100</text>
  <text x="136" y="84" font-size="10" text-anchor="middle" fill="var(--dsw-alias-label-tertiary)">200</text>
  <text x="196" y="84" font-size="10" text-anchor="middle" fill="var(--dsw-alias-label-tertiary)">300</text>
  <text x="256" y="84" font-size="10" text-anchor="middle" fill="var(--dsw-alias-label-tertiary)">400</text>
  <text x="316" y="84" font-size="10" text-anchor="middle" fill="var(--dsw-alias-label-tertiary)">500</text>

  <!-- 条：插件热更新后继续当前任务 45 -->
  <text x="16" y="96" font-size="11.5" fill="var(--dsw-alias-label-secondary)">插件热更新后继续当前任务</text>
  <rect x="16" y="102" width="25.2" height="18" rx="4" fill="var(--dsw-alias-brand-primary)"/>
  <text x="49.2" y="116" font-size="12" font-weight="700" fill="var(--dsw-alias-label-primary)">45</text>

  <!-- 条：多轮对话中的上下文恢复 80 -->
  <text x="16" y="152" font-size="11.5" fill="var(--dsw-alias-label-secondary)">多轮对话中的上下文恢复</text>
  <rect x="16" y="158" width="44.8" height="18" rx="4" fill="var(--dsw-alias-brand-primary)"/>
  <text x="68.8" y="172" font-size="12" font-weight="700" fill="var(--dsw-alias-label-primary)">80</text>

  <!-- 条：长文档的跨章节证据追溯 120 -->
  <text x="16" y="208" font-size="11.5" fill="var(--dsw-alias-label-secondary)">长文档的跨章节证据追溯</text>
  <rect x="16" y="214" width="67.2" height="18" rx="4" fill="var(--dsw-alias-brand-primary)"/>
  <text x="91.2" y="228" font-size="12" font-weight="700" fill="var(--dsw-alias-label-primary)">120</text>

  <!-- 条：直接生成一个简短答案 300 -->
  <text x="16" y="264" font-size="11.5" fill="var(--dsw-alias-label-secondary)">直接生成一个简短答案</text>
  <rect x="16" y="270" width="168" height="18" rx="4" fill="var(--dsw-alias-brand-primary)"/>
  <text x="192" y="284" font-size="12" font-weight="700" fill="var(--dsw-alias-label-primary)">300</text>

  <line x1="16" y1="312" x2="412" y2="312" stroke="var(--dsw-alias-border-l2)" stroke-width="1"/>
  <text x="16" y="332" font-size="11" fill="var(--dsw-alias-label-tertiary)">按使用次数从少到多排列 · 横轴从 0 开始</text>
</svg></body></html>
