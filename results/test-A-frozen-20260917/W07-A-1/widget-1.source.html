<style>
  #eb-wrap{--eb-line:var(--dsw-alias-border-l1,#d9d9e3);--eb-card:var(--dsw-alias-bg-layer-1,#fff);--eb-card2:var(--dsw-alias-bg-layer-2,#f6f7f9);--eb-ink:var(--dsw-alias-label-primary,#1c1c22);--eb-ink2:var(--dsw-alias-label-secondary,#55555f);--eb-ink3:var(--dsw-alias-label-tertiary,#8a8a95);--eb-err:var(--dsw-alias-state-error-primary,#d4380d);--eb-brand:var(--dsw-alias-brand-primary,#2f6fed);
    font-family:inherit;color:var(--eb-ink);background:var(--eb-card);border:1px solid var(--eb-line);border-radius:12px;padding:14px 16px 12px;max-width:660px;box-sizing:border-box}
  #eb-wrap *{box-sizing:border-box}
  .eb-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
  .eb-title{font-size:14px;font-weight:600}
  .eb-sub{font-size:12px;color:var(--eb-ink3);font-variant-numeric:tabular-nums}
  .eb-settings{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:6px 0 10px;min-height:22px}
  .eb-setlab{font-size:11px}
  .eb-track{position:relative;height:110px;background:var(--eb-card2);border:1px solid var(--eb-line);border-radius:10px;overflow:hidden}
  .eb-seg{position:absolute;top:29px;height:3px;background:var(--eb-line);border-radius:2px}
  .eb-seg.eb-active{background:var(--eb-brand)}
  .eb-node{position:absolute;top:18px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--eb-card);border:2px solid var(--eb-line);color:var(--eb-ink3);font-size:11px;line-height:20px;text-align:center;font-weight:600}
  .eb-node.eb-pending{background:var(--eb-card);color:var(--eb-ink3)}
  .eb-node.eb-fail{border-color:var(--eb-err);color:var(--eb-err)}
  .eb-node.eb-ok{border-color:var(--eb-brand);background:var(--eb-brand);color:var(--dsw-alias-label-primary-inverted,#fff)}
  .eb-node.eb-current{outline:3px solid var(--dsw-alias-interactive-bg-active,rgba(47,111,237,.22));outline-offset:1px}
  .eb-note{position:absolute;top:52px;margin-left:-30px;width:60px;text-align:center;font-size:11px;color:var(--eb-ink2);font-variant-numeric:tabular-nums}
  .eb-note.eb-fail{color:var(--eb-err)}
  .eb-note.eb-ok{color:var(--eb-brand);font-weight:600}
  .eb-wlab{position:absolute;top:62px;margin-left:-40px;width:80px;text-align:center;font-size:11px;color:var(--eb-ink3);font-variant-numeric:tabular-nums}
  .eb-wlab.eb-fail{color:var(--eb-err)}
  .eb-wlab.eb-ok{color:var(--eb-brand);font-weight:600}
  .eb-wsub{position:absolute;top:78px;margin-left:-44px;width:88px;text-align:center;font-size:10px;color:var(--eb-ink3);font-variant-numeric:tabular-nums}
  .eb-wbar{position:absolute;top:33px;height:5px;border-radius:3px;background:var(--eb-brand);opacity:.85;width:0}
  .eb-axis{position:absolute;left:10px;right:10px;top:96px;height:1px;background:var(--eb-line)}
  .eb-clock{position:absolute;left:10px;top:99px;font-size:10px;color:var(--eb-ink3);font-variant-numeric:tabular-nums}
  .eb-warn{font-size:11px;color:var(--eb-err);min-height:16px;margin:6px 0 0}
  .eb-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin-top:8px}
  .eb-card{border:1px solid var(--eb-line);border-radius:9px;padding:7px 9px;background:var(--eb-card);min-width:0}
  .eb-k{font-size:11px;color:var(--eb-ink3)}
  .eb-v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eb-v.eb-calm{font-weight:500;font-size:13px}
  .eb-v.eb-fail{color:var(--eb-err)}
  .eb-pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--eb-line);color:var(--eb-ink2);vertical-align:1px}
  .eb-pill.eb-fail{border-color:var(--eb-err);color:var(--eb-err)}
  .eb-pill.eb-ok{border-color:var(--eb-brand);color:#fff;background:var(--eb-brand)}
  .eb-ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  .eb-ctrl button{min-width:110px}
</style>
<div id="eb-wrap">
  <div class="eb-head">
    <div class="eb-title">指数退避演示（示意，不实际发网络请求）</div>
    <div class="eb-sub">最多 4 次请求 · 第 3 次成功即停止</div>
  </div>

  <div class="eb-settings">
    <label class="eb-setlab" for="eb-scale">等待推进速度</label>
    <select id="eb-scale" aria-label="等待推进速度">
      <option value="600" selected>快（1 秒等待 ≈ 0.6 秒）</option>
      <option value="1000">实时（1 秒 ≈ 1 秒）</option>
      <option value="200">极快（1 秒等待 ≈ 0.2 秒）</option>
    </select>
    <label class="eb-setlab" style="display:flex;align-items:center;gap:5px">
      <input type="checkbox" id="eb-live"> 实时走秒
    </label>
    <button type="button" id="eb-auto">自动播放</button>
  </div>

  <div class="eb-track" id="eb-track" role="img" aria-label="请求时间线：请求 1 失败，等待 1 秒；请求 2 失败，等待 2 秒；请求 3 成功并停止"></div>
  <div class="eb-warn" id="eb-warn"></div>

  <div class="eb-stats">
    <div class="eb-card">
      <div class="eb-k">累计等待</div>
      <div class="eb-v" id="eb-total">0.0 秒</div>
    </div>
    <div class="eb-card">
      <div class="eb-k">下一次等待</div>
      <div class="eb-v" id="eb-next">—</div>
    </div>
    <div class="eb-card">
      <div class="eb-k">当前时刻 t</div>
      <div class="eb-v" id="eb-now">0.0 秒</div>
    </div>
    <div class="eb-card">
      <div class="eb-k">状态</div>
      <div class="eb-v eb-calm" id="eb-phase">未开始</div>
    </div>
  </div>

  <div class="eb-ctrl">
    <button type="button" id="eb-step">下一步</button>
    <button type="button" id="eb-reset">重置</button>
  </div>
</div>
<script>
(function () {
  var K = ['1', '2', '3', '4'];
  var CFG = {
    '1': { planned: 1, res: 'fail' },
    '2': { planned: 2, res: 'fail' },
    '3': { planned: null, res: 'ok' },
    '4': { planned: null, res: null }
  };
  // 时间线布局（每 1 秒 = 70px，按真实比例，所以 2 秒的等待是 1 秒的两倍长）
  var X0 = 44, W1 = 76, WP = 70, WW = 60, TOTAL_W = 3 * W1 + 2 * WP + WW;
  var span = function (i) {
    var x = X0, k, s, sw = [0, 0];
    for (var m = 1; m <= i; m++) {
      k = K[m - 1]; s = CFG[k].planned;
      sw[0] = x; x += W1;
      if (s) { x += s * WP; sw[1] = x; }
      if (m === i) return { a: sw[0], b: sw[1] };
    }
    return { a: X0, b: X0 };
  };
  var nodeX = function (i) { return span(i).b; };

  var track = document.getElementById('eb-track');
  var els = {
    warn: document.getElementById('eb-warn'), total: document.getElementById('eb-total'),
    next: document.getElementById('eb-next'), now: document.getElementById('eb-now'),
    phase: document.getElementById('eb-phase'), step: document.getElementById('eb-step'),
    reset: document.getElementById('eb-reset'), auto: document.getElementById('eb-auto'),
    scale: document.getElementById('eb-scale'), live: document.getElementById('eb-live')
  };
  var nodes = {}, dirs = {}, notes = {}, wlabs = {}, wsubs = {}, bars = {}, segs = [], clock, svgNote;
  var st;

  function div(cls, txt) { var d = document.createElement('div'); d.className = cls; if (txt != null) d.textContent = txt; return d; }
  function build() {
    track.innerHTML = ''; nodes = {}; dirs = {}; notes = {}; wlabs = {}; wsubs = {}; bars = {}; segs = [];
    var over = TOTAL_W + 16 - track.clientWidth;
    if (over > 0) { track.style.height = (110 + over) + 'px'; svgNote = div('eb-warn', ''); track.appendChild(svgNote); } else { track.style.height = '110px'; svgNote = null; }
    K.forEach(function (k, idx) {
      var i = idx + 1;
      var d = div('eb-node eb-pending', k);
      d.style.left = nodeX(i) + 'px'; track.appendChild(d); nodes[k] = d;
      var note = div('eb-note', '待定'); note.style.left = nodeX(i) + 'px'; track.appendChild(note); notes[k] = note;
      if (i <= 3) {
        var dir = div('eb-wlab', ''); dir.style.left = nodeX(i) + 'px'; track.appendChild(dir); dirs[k] = dir;
      }
      if (CFG[k].planned) {
        var sw = span(i), mid = (sw.a + sw.b) / 2;
        var seg = div('eb-seg'); seg.style.left = sw.a + 'px'; seg.style.width = (sw.b - sw.a) + 'px'; track.appendChild(seg); segs.push(seg);
        var bar = div('eb-wbar'); bar.style.left = (sw.a + 1) + 'px'; track.appendChild(bar); bars[k] = { el: bar, a: sw.a + 1, w: Math.max(sw.b - sw.a - 2, 1) };
        var wl = div('eb-wlab', '等待 ' + CFG[k].planned + ' 秒'); wl.style.left = mid + 'px'; wl.style.visibility = 'hidden'; track.appendChild(wl); wlabs[k] = wl;
        var ws = div('eb-wsub', ''); ws.style.left = mid + 'px'; ws.style.visibility = 'hidden'; track.appendChild(ws); wsubs[k] = ws;
      }
    });
    clock = div('eb-clock', ''); track.appendChild(clock);
  }

  function setLive() {
    var on = els.live.checked, k = els.scale.value;
    if (on && k < 1000) els.scale.value = '1000';
    els.scale.disabled = on;
  }

  function render() {
    var n = st.n, phase = st.phase, done = st.done, acc = st.acc, t = st.t;
    K.forEach(function (k, idx) {
      var i = idx + 1, cfg = CFG[k], nd = nodes[k], nt = notes[k], dir = dirs[k];
      var cls = 'eb-node ';
      if (done >= i) cls += cfg.res === 'ok' ? 'eb-ok' : (cfg.res === 'fail' ? 'eb-fail' : 'eb-pending');
      else cls += 'eb-pending';
      if (!st.done_all && i === n) cls += ' eb-current';
      nd.className = cls;
      if (done >= i) {
        nt.textContent = cfg.res === 'ok' ? '成功' : (cfg.res === 'fail' ? '失败' : '未使用');
        nt.className = 'eb-note ' + (cfg.res === 'ok' ? 'eb-ok' : (cfg.res === 'fail' ? 'eb-fail' : ''));
        nt.style.left = nodeX(i) + 'px';
        if (dir) {
          if (cfg.res === 'ok') { dir.textContent = '成功 → 停止'; dir.className = 'eb-wlab eb-ok'; }
          else if (i === 4) { dir.textContent = '仍失败 → 放弃'; dir.className = 'eb-wlab eb-fail'; }
          else { dir.textContent = ''; dir.className = 'eb-wlab'; }
        }
      } else if (i === n && phase === 'attempt') {
        nt.textContent = '进行中'; nt.className = 'eb-note'; nt.style.left = nodeX(i) + 'px';
        if (dir) { dir.textContent = cfg.res === 'ok' ? '成功即停止' : '预计失败'; dir.className = 'eb-wlab'; }
      } else {
        nt.textContent = '待定'; nt.className = 'eb-note'; nt.style.left = nodeX(i) + 'px';
        if (dir) { dir.textContent = ''; dir.className = 'eb-wlab'; }
      }
      if (cfg.planned) {
        var vis = (done >= i || (i === n && (phase === 'attempt' || (phase === 'done' && !st.done_all))));
        wlabs[k].style.visibility = vis ? 'visible' : 'hidden';
        var elapsed = st.wacc[k] || 0;
        var showSec = (phase === 'wait' && i === n) ? st.t : elapsed;
        wsubs[k].textContent = vis ? (showSec.toFixed(1) + ' / ' + cfg.planned + ' 秒') : '';
        wsubs[k].style.visibility = vis ? 'visible' : 'hidden';
        if (cfg.res === 'ok') { wlabs[k].className = 'eb-wlab eb-ok'; wsubs[k].className = 'eb-wsub eb-ok'; }
        else if (cfg.res === 'fail') { wlabs[k].className = 'eb-wlab eb-fail'; wsubs[k].className = 'eb-wsub'; }
        var p = Math.max(0, Math.min(1, showSec / cfg.planned));
        bars[k].el.style.width = (bars[k].w * p) + 'px';
      }
    });

    els.total.textContent = acc.toFixed(1) + ' 秒';
    els.now.textContent = t.toFixed(1) + ' 秒';
    clock.textContent = 't = ' + t.toFixed(1) + ' 秒';

    var nextTxt, phaseTxt;
    if (st.done_all) {
      nextTxt = '无（已停止）';
      phaseTxt = st.stopped === 'ok' ? '完成：请求 3 成功，按计划停止' : '放弃：已达最大次数 4';
    } else if (phase === 'wait') {
      var s = CFG[K[n - 1]].planned;
      nextTxt = (s - st.t).toFixed(1) + ' 秒（共 ' + s + ' 秒）';
      phaseTxt = '等待中：第 ' + s + ' 次退避 ' + s + ' 秒';
    } else if (phase === 'attempt') {
      nextTxt = CFG[K[n - 1]].planned ? '1.0 秒（共 1 秒）' : '—';
      phaseTxt = '请求 ' + n + ' 进行中（' + (n === 1 ? '首次' : '第 ' + n + ' 次尝试') + '）';
    } else {
      nextTxt = '—'; phaseTxt = '未开始';
    }
    els.next.textContent = nextTxt;
    els.phase.textContent = phaseTxt;
    els.step.disabled = st.busy || st.done_all;
    els.step.textContent = st.done_all ? '已结束' : (phase === 'wait' ? '推进等待' : '下一步');
    els.auto.textContent = st.playing ? '暂停' : '自动播放';
    els.auto.disabled = st.busy && !st.playing;
    els.scale.disabled = els.live.checked || st.busy || st.playing;
    els.warn.textContent = (nodes['3'] && nodeX(3) - WW / 2 < 0) ? '窄屏提示：时间线从右向左卷动，最新节点始终可见' : '';
  }

  function startAttempt() {
    var k = K[st.n - 1], cfg = CFG[k];
    st.phase = 'attempt'; st.t_att = cfg.res === 'ok' ? 0.4 : 0.2; st.t = 0;
    st.last = null;
    els.warn.textContent = '';
    render();
    if (els.live.checked) { st.startWall = performance.now(); loop(); }
    else {
      st.timer = setTimeout(function () {
        st.last = cfg.res; st.acc += st.t_att; st.t = st.t_att; st.done = st.n;
        st.phase = 'attempt'; delete st.wacc[k];
        st.timer = setTimeout(finishAttempt, 360);
      }, cfg.res === 'ok' ? 400 : 200);
    }
  }

  function finishAttempt() {
    var k = K[st.n - 1], cfg = CFG[k];
    if (cfg.res === 'ok') {
      st.done_all = true; st.stopped = 'ok'; st.phase = 'done'; st.busy = false; render(); maybePlay(); return;
    }
    if (st.n === 4) {
      st.done_all = true; st.stopped = 'fail'; st.phase = 'done'; st.busy = false; render(); maybePlay(); return;
    }
    st.phase = 'wait'; st.wt = 0; st.t = 0; st.wacc[k] = 0;
    render();
    st.lastTs = performance.now();
    loop();
  }

  function loop() {
    if (st.raf) cancelAnimationFrame(st.raf);
    var perSec = parseFloat(els.scale.value) || 600;
    function frame(ts) {
      var f = Math.min(0.12, (ts - st.lastTs) / 1000); st.lastTs = ts;
      var step = f * (1000 / perSec);
      if (st.phase === 'attempt') {
        st.t += step * 0.6;
        if (st.t >= st.t_att) { st.last = CFG[K[st.n - 1]].res; st.acc += st.t_att; st.t = st.t_att; st.done = st.n; render(); finishAttempt(); return; }
        render();
      } else if (st.phase === 'wait') {
        st.t += step;
        var s = CFG[K[st.n - 1]].planned;
        st.wacc[K[st.n - 1]] = Math.min(st.t, s);
        if (st.t >= s) { st.acc += s; st.t = s; render(); st.n++; startAttempt(); return; }
        render();
      }
      st.raf = requestAnimationFrame(frame);
    }
    st.raf = requestAnimationFrame(frame);
  }

  function maybePlay() {
    if (st.done_all) { st.playing = false; render(); return; }
    if (st.playing) st.timer = setTimeout(function () { st.busy = true; render(); startAttempt(); }, 420);
    else render();
  }

  function reset() {
    if (st) { clearTimeout(st.timer); if (st.raf) cancelAnimationFrame(st.raf); }
    var live = els.live.checked, scale = els.scale.value;
    st = { n: 1, done: 0, acc: 0, t: 0, phase: 'idle', done_all: false, stopped: null, busy: false, playing: false, last: null, wacc: {}, raf: 0, timer: 0, lastTs: performance.now() };
    els.live.checked = live; els.scale.value = scale;
    render();
  }

  els.step.addEventListener('click', function () {
    if (st.busy || st.done_all) return;
    if (st.phase === 'wait') {  // 跳过剩余等待，立即推进
      if (st.raf) cancelAnimationFrame(st.raf);
      var s = CFG[K[st.n - 1]].planned;
      st.acc += s - st.t; st.t = s; st.wacc[K[st.n - 1]] = s; st.n++;
      startAttempt();
      return;
    }
    st.busy = true; st.playing = false; render(); startAttempt();
  });
  els.reset.addEventListener('click', reset);
  els.auto.addEventListener('click', function () {
    if (st.done_all) return;
    st.playing = !st.playing;
    if (st.playing && !st.busy) { st.busy = true; render(); startAttempt(); }
    else if (!st.playing && st.phase === 'wait') { st.busy = true; render(); }
    else render();
  });
  els.live.addEventListener('change', setLive);
  els.scale.addEventListener('change', setLive);
  window.addEventListener('resize', function () { var wasIdle = !st.busy; render(); });

  build(); setLive(); reset();
})();
</script>
