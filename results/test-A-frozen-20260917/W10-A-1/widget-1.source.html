<style>
  .flow{
    --brand: var(--dsw-alias-brand-primary, #4f6bed);
    --ink: var(--dsw-alias-label-primary, #1f2329);
    --ink2: var(--dsw-alias-label-secondary, #5b6470);
    --ink3: var(--dsw-alias-label-tertiary, #8a929c);
    --line: var(--dsw-alias-border-l1, #e2e5e9);
    --bg2: var(--dsw-alias-bg-layer-2, #ffffff);
    --model: #7b5cd6;
    --host: var(--brand);
    --web: #0f9d8f;
    --ok: #16a34a;
    --err: var(--dsw-alias-state-error-primary, #d92d20);
  }
  .flow{ margin:0; }
  .flow svg{ width:100%; height:auto; display:block; }
  .flow text{ font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .flow .lane-name{ font-size:13px; font-weight:600; }
  .flow .lane-sub{ font-size:10px; fill:var(--ink2); }
  .flow .nt{ font-size:12.5px; font-weight:600; fill:var(--ink); }
  .flow .ns{ font-size:10.5px; fill:var(--ink2); }
  .flow .el{ font-size:10.5px; fill:var(--ink3); }
  .flow .eok{ font-size:10.5px; fill:var(--ok); }
  .flow .eerr{ font-size:10.5px; fill:var(--err); }
  .flow .node{ fill:var(--bg2); stroke-width:1.5; }
  .flow .tint{ stroke:none; opacity:.09; }
  .flow .ln{ fill:none; stroke-width:2; }
  .flow .ln-brand{ stroke:var(--brand); }
  .flow .ln-ok{ stroke:var(--ok); }
  .flow .ln-err{ stroke:var(--err); stroke-dasharray:6 5; }
  .flow .lg{ font-size:11px; fill:var(--ink2); }
</style>
<figure class="flow">
<svg viewBox="0 0 960 960" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">模型、Host、Web 三方协作的源码卡片流程图</title>
  <desc id="flowDesc">模型提交源码，Host 校验并记录版本、生成卡片，Web 沙箱隔离渲染；渲染成功后由用户操作卡片。若运行报错，Web 采集日志请求修复，Host 从日志取得当前源码并请求模型修复，模型返回新源码后由 Host 更新原卡片，Web 重新隔离渲染。校验失败时 Host 驳回，模型修正后重新提交。</desc>
  <defs>
    <marker id="mk-brand" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" viewBox="0 0 11 11" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="var(--brand)"/></marker>
    <marker id="mk-ok" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" viewBox="0 0 11 11" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="var(--ok)"/></marker>
    <marker id="mk-err" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" viewBox="0 0 11 11" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="var(--err)"/></marker>
  </defs>

  <!-- 泳道 -->
  <rect x="24" y="66" width="230" height="818" rx="14" fill="var(--model)" fill-opacity=".045" stroke="var(--line)" stroke-dasharray="4 4"/>
  <rect x="274" y="66" width="340" height="818" rx="14" fill="var(--host)" fill-opacity=".045" stroke="var(--line)" stroke-dasharray="4 4"/>
  <rect x="634" y="66" width="250" height="818" rx="14" fill="var(--web)" fill-opacity=".045" stroke="var(--line)" stroke-dasharray="4 4"/>

  <rect x="24" y="18" width="230" height="40" rx="10" fill="var(--model)" fill-opacity=".15"/>
  <text class="lane-name" x="139" y="35" text-anchor="middle" fill="var(--model)">模型</text>
  <text class="lane-sub" x="139" y="50" text-anchor="middle">产出源码 · 按请求修复</text>

  <rect x="274" y="18" width="340" height="40" rx="10" fill="var(--host)" fill-opacity=".15"/>
  <text class="lane-name" x="444" y="35" text-anchor="middle" fill="var(--host)">Host</text>
  <text class="lane-sub" x="444" y="50" text-anchor="middle">校验 · 记录版本 · 建卡 / 更新 · 调度修复</text>

  <rect x="634" y="18" width="250" height="40" rx="10" fill="var(--web)" fill-opacity=".15"/>
  <text class="lane-name" x="759" y="35" text-anchor="middle" fill="var(--web)">Web</text>
  <text class="lane-sub" x="759" y="50" text-anchor="middle">隔离渲染 · 运行 · 采集日志</text>

  <!-- 节点：模型 -->
  <rect class="tint" x="38" y="84" width="202" height="58" rx="12" fill="var(--model)"/>
  <rect class="node" x="38" y="84" width="202" height="58" rx="12" stroke="var(--model)"/>
  <text class="nt" x="139" y="108" text-anchor="middle">① 生成并提交源码</text>
  <text class="ns" x="139" y="126" text-anchor="middle">卡片源码 + 版本号</text>

  <rect class="tint" x="38" y="188" width="202" height="58" rx="12" fill="var(--err)"/>
  <rect class="node" x="38" y="188" width="202" height="58" rx="12" stroke="var(--err)"/>
  <text class="nt" x="139" y="212" text-anchor="middle">②b 修正后重新提交</text>
  <text class="ns" x="139" y="230" text-anchor="middle">校验失败分支</text>

  <rect class="tint" x="38" y="708" width="202" height="58" rx="12" fill="var(--model)"/>
  <rect class="node" x="38" y="708" width="202" height="58" rx="12" stroke="var(--model)"/>
  <text class="nt" x="139" y="732" text-anchor="middle">⑦ 修复并返回新源码</text>
  <text class="ns" x="139" y="750" text-anchor="middle">基于当前源码改动</text>

  <!-- 节点：Host -->
  <rect class="tint" x="288" y="84" width="312" height="58" rx="12" fill="var(--host)"/>
  <rect class="node" x="288" y="84" width="312" height="58" rx="12" stroke="var(--host)"/>
  <text class="nt" x="444" y="108" text-anchor="middle">② 校验源码并记录</text>
  <text class="ns" x="444" y="126" text-anchor="middle">语法 / 安全限制检查，写入日志</text>

  <rect class="tint" x="288" y="188" width="312" height="58" rx="12" fill="var(--host)"/>
  <rect class="node" x="288" y="188" width="312" height="58" rx="12" stroke="var(--host)"/>
  <text class="nt" x="444" y="212" text-anchor="middle">②a 校验通过 → 记录并建卡</text>
  <text class="ns" x="444" y="230" text-anchor="middle">留存源码版本，生成原卡片</text>

  <rect class="tint" x="288" y="604" width="312" height="58" rx="12" fill="var(--err)"/>
  <rect class="node" x="288" y="604" width="312" height="58" rx="12" stroke="var(--err)"/>
  <text class="nt" x="444" y="628" text-anchor="middle">⑥ 从日志取得当前源码</text>
  <text class="ns" x="444" y="646" text-anchor="middle">携带日志向模型请求修复</text>

  <rect class="tint" x="288" y="812" width="312" height="58" rx="12" fill="var(--err)"/>
  <rect class="node" x="288" y="812" width="312" height="58" rx="12" stroke="var(--err)"/>
  <text class="nt" x="444" y="836" text-anchor="middle">⑧ 更新原卡片</text>
  <text class="ns" x="444" y="854" text-anchor="middle">写入新源码 + 新版本号</text>

  <!-- 节点：Web -->
  <rect class="tint" x="648" y="292" width="222" height="58" rx="12" fill="var(--web)"/>
  <rect class="node" x="648" y="292" width="222" height="58" rx="12" stroke="var(--web)"/>
  <text class="nt" x="759" y="316" text-anchor="middle">③ 沙箱隔离渲染</text>
  <text class="ns" x="759" y="334" text-anchor="middle">iframe 受限运行卡片</text>

  <rect class="tint" x="648" y="396" width="222" height="58" rx="12" fill="var(--ok)"/>
  <rect class="node" x="648" y="396" width="222" height="58" rx="12" stroke="var(--ok)"/>
  <text class="nt" x="759" y="420" text-anchor="middle">④ 渲染成功</text>
  <text class="ns" x="759" y="438" text-anchor="middle">用户操作卡片：点击 / 输入</text>

  <rect class="tint" x="648" y="500" width="222" height="58" rx="12" fill="var(--err)"/>
  <rect class="node" x="648" y="500" width="222" height="58" rx="12" stroke="var(--err)"/>
  <text class="nt" x="759" y="524" text-anchor="middle">⑤ 运行报错</text>
  <text class="ns" x="759" y="542" text-anchor="middle">采集日志 → 请求修复</text>

  <rect class="tint" x="648" y="812" width="222" height="58" rx="12" fill="var(--err)"/>
  <rect class="node" x="648" y="812" width="222" height="58" rx="12" stroke="var(--err)"/>
  <text class="nt" x="759" y="836" text-anchor="middle">⑨ 原卡片重新渲染</text>
  <text class="ns" x="759" y="854" text-anchor="middle">回到 ③ 隔离环境</text>

  <!-- 连线 -->
  <path class="ln ln-brand" d="M240 113 H288" marker-end="url(#mk-brand)"/>
  <text class="el" x="264" y="104" text-anchor="middle">源码</text>

  <path class="ln ln-ok" d="M444 142 V188" marker-end="url(#mk-ok)"/>
  <text class="eok" x="452" y="168">✓ 校验通过</text>

  <path class="ln ln-err" d="M288 137 H264 V217 H240" marker-end="url(#mk-err)"/>
  <text class="eerr" x="258" y="178" text-anchor="end">✗ 校验失败</text>
  <path class="ln ln-err" d="M139 188 V146" marker-end="url(#mk-err)"/>
  <text class="eerr" x="148" y="172">重新提交</text>

  <path class="ln ln-brand" d="M444 246 V268 H690 V292" marker-end="url(#mk-brand)"/>
  <text class="el" x="560" y="260" text-anchor="middle">通过校验后下发渲染</text>

  <path class="ln ln-ok" d="M759 350 V396" marker-end="url(#mk-ok)"/>
  <text class="eok" x="768" y="378">✓ 执行成功</text>

  <path class="ln ln-err" d="M648 335 H624 V529 H648" marker-end="url(#mk-err)"/>
  <text class="eerr" x="618" y="400" text-anchor="end">✗ 运行报错</text>

  <path class="ln ln-err" d="M759 558 V633 H600" marker-end="url(#mk-err)"/>
  <text class="eerr" x="676" y="625" text-anchor="middle">修复请求 + 日志</text>

  <path class="ln ln-err" d="M444 662 V737 H240" marker-end="url(#mk-err)"/>
  <text class="eerr" x="350" y="729" text-anchor="middle">请求修复</text>

  <path class="ln ln-err" d="M139 766 V841 H288" marker-end="url(#mk-err)"/>
  <text class="eerr" x="210" y="833" text-anchor="middle">返回新源码</text>

  <path class="ln ln-brand" d="M600 841 H648" marker-end="url(#mk-brand)"/>
  <text class="el" x="624" y="833" text-anchor="middle">已更新</text>

  <path class="ln ln-err" d="M870 841 H928 V321 H870" marker-end="url(#mk-err)"/>
  <text class="eerr" x="943" y="581" text-anchor="middle" transform="rotate(-90 943 581)">⑩ 修复完成后重新渲染</text>

  <!-- 图例 -->
  <path class="ln ln-brand" d="M38 915 H78"/>
  <text class="lg" x="86" y="919">主流程：提交 → 校验记录 → 渲染</text>
  <path class="ln ln-ok" d="M300 915 H340"/>
  <text class="lg" x="348" y="919">成功分支：用户操作卡片</text>
  <path class="ln ln-err" d="M560 915 H600"/>
  <text class="lg" x="608" y="919">失败分支 / 修复回路</text>
</svg>
</figure>
