<style>
  .cw2{--cw-miss:#e0813a;--cw-hit:#3a9d8f;
      color:var(--dsw-alias-label-primary);
      font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--dsw-alias-bg-layer-1);border:1px solid var(--dsw-alias-border-l1);
      border-radius:12px;padding:14px 16px 12px;max-width:640px;min-width:0}
  .cw2 *{box-sizing:border-box}
  .cw2-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .cw2-title{font-weight:600;font-size:14px}
  .cw2-title small{color:var(--dsw-alias-label-tertiary);font-weight:400;font-size:12px;margin-left:6px}
  .cw2-cost{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dsw-alias-label-secondary);white-space:nowrap}
  .cw2-cost b{font-size:22px;color:var(--dsw-alias-label-primary);font-weight:650}
  .cw2-stage{margin:8px 0 0}
  .cw2-stage svg{display:block;width:100%;height:auto}
  .cw2-rowhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dsw-alias-label-tertiary);margin-top:6px}
  .cw2-slider{width:100%;margin:10px 0 0;display:block}
  .cw2-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--dsw-alias-label-tertiary);font-variant-numeric:tabular-nums}
  .cw2-presets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .cw2-presets span{font-size:12px;color:var(--dsw-alias-label-tertiary)}
  .cw2-presets button{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;cursor:pointer;
      border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary)}
  .cw2-presets button:hover{background:var(--dsw-alias-interactive-bg-hover)}
  .cw2-presets button[aria-pressed="true"]{background:var(--dsw-alias-button-primary-fill);border-color:var(--dsw-alias-button-primary-fill);color:var(--dsw-alias-label-primary-inverted)}
  .cw2-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dsw-alias-label-secondary)}
  .cw2-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .cw2-note{margin-top:8px;font-size:12px;color:var(--dsw-alias-label-tertiary)}
  .cw2-tip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--dsw-alias-border-l1)}
  .cw2-tip div{font-size:11px;color:var(--dsw-alias-label-tertiary)}
  .cw2-tip b{display:block;font-size:13px;color:var(--dsw-alias-label-secondary);font-variant-numeric:tabular-nums;font-weight:500}
  @media (max-width:420px){.cw2-tip{grid-template-columns:1fr}}
</style>
<div class="cw2" id="cw2-root">
  <div class="cw2-top">
    <div class="cw2-title">缓存命中率的成本示意<small>总输入 1000 token</small></div>
    <div class="cw2-cost">示意成本合计 <b id="cw2-cost">1.000</b> 单位 <span id="cw2-pctlabel">（命中 0%）</span></div>
  </div>

  <div class="cw2-stage">
    <svg viewBox="0 0 480 152" role="img" aria-labelledby="cw2-svgtitle cw2-svgdesc">
      <title id="cw2-svgtitle">命中率对输入 token 构成与示意成本的影响</title>
      <desc id="cw2-svgdesc">上方一条为 token 构成，下方一条为成本的构成，拖动命中率时两者同步变化；下方浅色边框表示全部未命中时的 1.000 单位。</desc>
      <text x="0" y="11" fill="currentColor" opacity="0.55" font-size="11">输入 token 构成（共 1000）</text>
      <text x="480" y="11" text-anchor="end" fill="currentColor" opacity="0.55" font-size="11" id="cw2-tok-split">未命中 1000 · 命中 0</text>
      <clipPath id="cw2-clip1"><rect x="0" y="17" width="480" height="34" rx="5"/></clipPath>
      <clipPath id="cw2-clip2"><rect x="0" y="88" width="480" height="34" rx="5"/></clipPath>
      <g>
        <rect x="0" y="17" width="480" height="34" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.18"/>
        <rect x="0" y="17" width="480" height="34" rx="5" fill="var(--cw-miss)" clip-path="url(#cw2-clip1)"/>
        <rect id="cw2-tok-hit" x="480" y="17" width="0" height="34" fill="var(--cw-hit)" clip-path="url(#cw2-clip1)"/>
      </g>
      <text x="0" y="82" fill="currentColor" opacity="0.55" font-size="11">示意成本构成（未命中 1 单位 / 1000 token，命中 0.1 单位 / 1000 token）</text>
      <rect x="0" y="88" width="480" height="34" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.18"/>
      <text x="0" y="144" fill="currentColor" opacity="0.55" font-size="11">整条 = 全部未命中时的 1.000 单位，绿色段越宽，总成本越低</text>
    </svg>
  </div>
  <div class="cw2-rowhead"><span id="cw2-bar-line">未命中 1000 token · 命中 0 token</span><span id="cw2-bar-cost">成本 1.000 单位</span></div>

  <input class="cw2-slider" id="cw2-slider" type="range" min="0" max="100" step="1" value="0"
         aria-label="缓存命中率" aria-describedby="cw2-result">
  <div class="cw2-scale"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
  <div class="cw2-presets">
    <span>快速选择</span>
    <button type="button" data-v="0" aria-pressed="true">0%</button>
    <button type="button" data-v="50" aria-pressed="false">50%</button>
    <button type="button" data-v="100" aria-pressed="false">100%</button>
  </div>

  <div class="cw2-legend">
    <span><i style="background:var(--cw-miss)"></i>未命中 · 1.0 单位 / 1000 token</span>
    <span><i style="background:var(--cw-hit)"></i>命中 · 0.1 单位 / 1000 token</span>
  </div>
  <div class="cw2-note" id="cw2-result">当前命中率 0%，示意成本 1.000 单位，是全部未命中时的 100%。</div>
  <div class="cw2-tip">
    <div>0% 命中<b id="cw2-t0">1.000 单位</b></div>
    <div>50% 命中<b id="cw2-t50">0.550 单位</b></div>
    <div>100% 命中<b id="cw2-t100">0.100 单位</b></div>
  </div>
</div>
<script>
(function(){
  var root=document.getElementById('cw2-root');
  var slider=document.getElementById('cw2-slider');
  var costEl=document.getElementById('cw2-cost');
  var pctEl=document.getElementById('cw2-pctlabel');
  var tokHit=document.getElementById('cw2-tok-hit');
  var tokSplit=document.getElementById('cw2-tok-split');
  var barLine=document.getElementById('cw2-bar-line');
  var barCost=document.getElementById('cw2-bar-cost');
  var res=document.getElementById('cw2-result');
  var buttons=Array.prototype.slice.call(root.querySelectorAll('.cw2-presets button'));

  var W=480, MISS='#e0813a', HIT='#3a9d8f', MAXC=1.0;
  var NS='http://www.w3.org/2000/svg';
  var svg=root.querySelector('svg');
  var costFrame=svg.querySelector('rect[stroke-opacity="0.18"][y="88"]');
  var missRect=svg.querySelector('rect[clip-path="url(#cw2-clip1)"]');

  function mkCostRect(fill, after){
    var r=document.createElementNS(NS,'rect');
    r.setAttribute('y','88'); r.setAttribute('height','34');
    r.setAttribute('fill',fill);
    r.setAttribute('clip-path','url(#cw2-clip2)');
    if(after){ svg.insertBefore(r, after); } else { svg.appendChild(r); }
    return r;
  }
  var costMiss=mkCostRect(MISS, costFrame);
  var costHitRect=mkCostRect(HIT, costFrame);

  function fmt(n){return n.toFixed(3);}

  function render(h){
    var hitTokens=10*h, missTokens=1000-hitTokens;
    var missCost=missTokens/1000, hitCost=hitTokens/1000*0.1;
    var total=missCost+hitCost;

    tokHit.setAttribute('x', (W*missTokens/1000).toFixed(2));
    tokHit.setAttribute('width', (W*hitTokens/1000).toFixed(2));

    var wMiss=W*missCost/MAXC, wHit=W*hitCost/MAXC;
    costMiss.setAttribute('x','0'); costMiss.setAttribute('width', wMiss.toFixed(2));
    costHitRect.setAttribute('x', wMiss.toFixed(2)); costHitRect.setAttribute('width', wHit.toFixed(2));

    costEl.textContent=fmt(total);
    pctEl.textContent='（命中 '+h+'%）';
    tokSplit.textContent='未命中 '+missTokens+' · 命中 '+hitTokens;
    barLine.textContent='未命中 '+missTokens+' token · 命中 '+hitTokens+' token';
    barCost.textContent='成本 '+fmt(total)+' 单位';
    res.textContent='当前命中率 '+h+'%，示意成本 '+fmt(total)+' 单位，是全部未命中时的 '
      + Math.round(total/MAXC*100) + '%。';
    slider.setAttribute('aria-valuetext', h+'%，示意成本 '+fmt(total)+' 单位');

    slider.value=String(h);
    buttons.forEach(function(b){
      b.setAttribute('aria-pressed', String(Number(b.dataset.v)===h));
    });
  }

  slider.addEventListener('input', function(){render(Number(slider.value));});
  buttons.forEach(function(b){
    b.addEventListener('click', function(){render(Number(b.dataset.v));});
  });
  render(0);
})();
</script>
