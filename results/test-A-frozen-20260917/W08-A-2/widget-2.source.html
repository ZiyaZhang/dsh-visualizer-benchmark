<style>
  .cw{--cw-miss:#e0813a;--cw-hit:#3a9d8f;
      color:var(--dsw-alias-label-primary);
      font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--dsw-alias-bg-layer-1);border:1px solid var(--dsw-alias-border-l1);
      border-radius:12px;padding:14px 16px 12px;max-width:640px;min-width:0}
  .cw *{box-sizing:border-box}
  .cw-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .cw-title{font-weight:600;font-size:14px}
  .cw-title small{color:var(--dsw-alias-label-tertiary);font-weight:400;font-size:12px;margin-left:6px}
  .cw-cost{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dsw-alias-label-secondary);white-space:nowrap}
  .cw-cost b{font-size:22px;color:var(--dsw-alias-label-primary);font-weight:650}
  .cw-stage{margin:8px 0 0}
  .cw-stage svg{display:block;width:100%;height:auto}
  .cw-rowhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dsw-alias-label-tertiary);margin-top:6px}
  .cw-slider{width:100%;margin:10px 0 0;display:block}
  .cw-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--dsw-alias-label-tertiary);font-variant-numeric:tabular-nums}
  .cw-presets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .cw-presets span{font-size:12px;color:var(--dsw-alias-label-tertiary)}
  .cw-presets button{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;cursor:pointer;
      border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary)}
  .cw-presets button:hover{background:var(--dsw-alias-interactive-bg-hover)}
  .cw-presets button[aria-pressed="true"]{background:var(--dsw-alias-button-primary-fill);border-color:var(--dsw-alias-button-primary-fill);color:var(--dsw-alias-label-primary-inverted)}
  .cw-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dsw-alias-label-secondary)}
  .cw-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .cw-note{margin-top:8px;font-size:12px;color:var(--dsw-alias-label-tertiary)}
  .cw-tip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--dsw-alias-border-l1)}
  .cw-tip div{font-size:11px;color:var(--dsw-alias-label-tertiary)}
  .cw-tip b{display:block;font-size:13px;color:var(--dsw-alias-label-secondary);font-variant-numeric:tabular-nums;font-weight:500}
  @media (max-width:420px){.cw-tip{grid-template-columns:1fr}}
</style>
<div class="cw" id="cw-root">
  <div class="cw-top">
    <div class="cw-title">缓存命中率的成本示意<small>总输入 1000 token</small></div>
    <div class="cw-cost">示意成本合计 <b id="cw-cost">1.000</b> 单位 <span id="cw-pctlabel">（命中 0%）</span></div>
  </div>

  <div class="cw-stage">
    <svg viewBox="0 0 480 152" role="img" aria-labelledby="cw-svgtitle cw-svgdesc">
      <title id="cw-svgtitle">命中率对输入 token 构成与示意成本的影响</title>
      <desc id="cw-svgdesc">上方一条为 token 构成，下方一条为成本的构成，拖动命中率时两者同步变化；下方浅色边框表示全部未命中时的 1.000 单位。</desc>
      <text x="0" y="11" fill="currentColor" opacity="0.55" font-size="11">输入 token 构成（共 1000）</text>
      <text x="480" y="11" text-anchor="end" fill="currentColor" opacity="0.55" font-size="11" id="cw-tok-split">未命中 1000 · 命中 0</text>
      <clipPath id="cw-clip1"><rect x="0" y="17" width="480" height="34" rx="5"/></clipPath>
      <clipPath id="cw-clip2"><rect x="0" y="88" width="480" height="34" rx="5"/></clipPath>
      <g>
        <rect x="0" y="17" width="480" height="34" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.18"/>
        <rect x="0" y="17" width="480" height="34" rx="5" fill="var(--cw-miss)" clip-path="url(#cw-clip1)"/>
        <rect id="cw-tok-hit" x="480" y="17" width="0" height="34" fill="var(--cw-hit)" clip-path="url(#cw-clip1)"/>
      </g>

      <text x="0" y="82" fill="currentColor" opacity="0.55" font-size="11">示意成本构成（未命中 1 单位 / 1000 token，命中 0.1 单位 / 1000 token）</text>
      <g>
        <rect x="0" y="88" width="480" height="34" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.18"/>
      </g>

      <text x="0" y="144" fill="currentColor" opacity="0.55" font-size="11">整条 = 全部未命中时的 1.000 单位，灰绿段越宽越省</text>
    </svg>
  </div>
  <div class="cw-rowhead"><span id="cw-bar-line">未命中 1000 token · 命中 0 token</span><span id="cw-bar-cost">成本 1.000 单位</span></div>

  <input class="cw-slider" id="cw-slider" type="range" min="0" max="100" step="1" value="0"
         aria-label="缓存命中率" aria-describedby="cw-result">
  <div class="cw-scale"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
  <div class="cw-presets">
    <span>快速选择</span>
    <button type="button" data-v="0" aria-pressed="true">0%</button>
    <button type="button" data-v="50" aria-pressed="false">50%</button>
    <button type="button" data-v="100" aria-pressed="false">100%</button>
  </div>

  <div class="cw-legend">
    <span><i style="background:var(--cw-miss)"></i>未命中 · 1.0 单位 / 1000 token</span>
    <span><i style="background:var(--cw-hit)"></i>命中 · 0.1 单位 / 1000 token</span>
  </div>
  <div class="cw-note" id="cw-result">当前命中率 0%，示意成本 1.000 单位，是全部未命中时的 100%。</div>
  <div class="cw-tip">
    <div>0% 命中<b id="cw-t0">1.000 单位</b></div>
    <div>50% 命中<b id="cw-t50">0.550 单位</b></div>
    <div>100% 命中<b id="cw-t100">0.100 单位</b></div>
  </div>
</div>
<script>
(function(){
  var root=document.getElementById('cw-root');
  var slider=document.getElementById('cw-slider');
  var costEl=document.getElementById('cw-cost');
  var pctEl=document.getElementById('cw-pctlabel');
  var tokHit=document.getElementById('cw-tok-hit');
  var tokSplit=document.getElementById('cw-tok-split');
  var barLine=document.getElementById('cw-bar-line');
  var barCost=document.getElementById('cw-bar-cost');
  var res=document.getElementById('cw-result');
  var buttons=Array.prototype.slice.call(root.querySelectorAll('.cw-presets button'));

  var W=480, MISS='#e0813a', HIT='#3a9d8f', MAXC=1.0;
  var NS='http://www.w3.org/2000/svg';
  var costLayer=root.querySelector('#cw-clip2').parentNode;

  function mkRect(fill){
    var r=document.createElementNS(NS,'rect');
    r.setAttribute('y','88'); r.setAttribute('height','34');
    r.setAttribute('fill',fill);
    r.setAttribute('clip-path','url(#cw-clip2)');
    costLayer.appendChild(r);
    return r;
  }
  var costMiss=mkRect(MISS), costHitRect=mkRect(HIT);

  function fmt(n){return n.toFixed(3);}

  function render(h){
    var hitTokens=10*h, missTokens=1000-hitTokens;
    var missCost=missTokens/1000, hitCost=hitTokens/1000*0.1;
    var total=missCost+hitCost;

    tokHit.setAttribute('x', (W*missTokens/1000).toFixed(2));
    tokHit.setAttribute('width', (W*hitTokens/1000).toFixed(2));

    var wMiss=W*missCost/MAXC, wHit=W*hitCost/MAXC;
    costMiss.setAttribute('x','0'); costMiss.setAttribute('width', wMiss.toFixed(2));
    costHitRect.setAttribute('x', wMiss.toFixed(2)); costHitRect.setAttribute('width', wHit.toFixed(2));

    costEl.textContent=fmt(total);
    pctEl.textContent='（命中 '+h+'%）';
    tokSplit.textContent='未命中 '+missTokens+' · 命中 '+hitTokens;
    barLine.textContent='未命中 '+missTokens+' token · 命中 '+hitTokens+' token';
    barCost.textContent='成本 '+fmt(total)+' 单位';
    res.textContent='当前命中率 '+h+'%，示意成本 '+fmt(total)+' 单位，是全部未命中时的 '
      + Math.round(total/MAXC*100) + '%。';

    slider.value=String(h);
    buttons.forEach(function(b){
      b.setAttribute('aria-pressed', String(Number(b.dataset.v)===h));
    });
  }

  slider.addEventListener('input', function(){render(Number(slider.value));});
  buttons.forEach(function(b){
    b.addEventListener('click', function(){render(Number(b.dataset.v));});
  });
  render(0);
})();
</script>
