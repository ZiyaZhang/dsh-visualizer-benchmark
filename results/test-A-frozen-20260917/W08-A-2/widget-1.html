<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .cw{--cw-miss:#e0813a;--cw-hit:#3a9d8f;--cw-track:#8a8a8a;
      color:var(--dsw-alias-label-primary);
      font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--dsw-alias-bg-layer-1);border:1px solid var(--dsw-alias-border-l1);
      border-radius:12px;padding:14px 16px 12px;max-width:640px;min-width:0}
  .cw *{box-sizing:border-box}
  .cw-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .cw-title{font-weight:600;font-size:14px}
  .cw-title small{color:var(--dsw-alias-label-tertiary);font-weight:400;font-size:12px;margin-left:6px}
  .cw-cost{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dsw-alias-label-secondary);white-space:nowrap}
  .cw-cost b{font-size:22px;color:var(--dsw-alias-label-primary);font-weight:650}
  .cw-stage{margin:10px 0 0}
  .cw-stage svg{display:block;width:100%;height:auto}
  .cw-rowhead{display:flex;justify-content:space-between;font-size:12px;color:var(--dsw-alias-label-tertiary);margin-top:8px}
  .cw-base{margin-top:6px}
  .cw-slider{width:100%;margin:2px 0 0;display:block}
  .cw-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--dsw-alias-label-tertiary);font-variant-numeric:tabular-nums}
  .cw-presets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .cw-presets span{font-size:12px;color:var(--dsw-alias-label-tertiary)}
  .cw-presets button{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;cursor:pointer;
      border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary)}
  .cw-presets button:hover{background:var(--dsw-alias-interactive-bg-hover)}
  .cw-presets button[aria-pressed="true"]{background:var(--dsw-alias-button-primary-fill);border-color:var(--dsw-alias-button-primary-fill);color:var(--dsw-alias-label-primary-inverted)}
  .cw-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dsw-alias-label-secondary)}
  .cw-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .cw-note{margin-top:8px;font-size:12px;color:var(--dsw-alias-label-tertiary)}
  .cw-tip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--dsw-alias-border-l1)}
  .cw-tip div{font-size:11px;color:var(--dsw-alias-label-tertiary)}
  .cw-tip b{display:block;font-size:13px;color:var(--dsw-alias-label-secondary);font-variant-numeric:tabular-nums;font-weight:500}
  @media (max-width:420px){.cw-tip{grid-template-columns:1fr}}
</style>
<div class="cw" id="cw-root">
  <div class="cw-top">
    <div class="cw-title">缓存命中率的成本示意<small>总输入 1000 token</small></div>
    <div class="cw-cost">示意成本合计 <b id="cw-cost">1.000</b> 单位 <span id="cw-pctlabel">（命中 0%）</span></div>
  </div>

  <div class="cw-stage">
    <svg viewBox="0 0 480 150" role="img" aria-labelledby="cw-svgtitle cw-svgdesc">
      <title id="cw-svgtitle">命中率对输入 token 构成与示意成本的影响</title>
      <desc id="cw-svgdesc">上方一条为 token 构成，下方一条为成本构成，拖动的命中率同时改变两者，右侧标出 0%、50%、100% 三个成本值。</desc>
      <text x="0" y="12" fill="currentColor" opacity="0.55" font-size="11">输入 token 构成（共 1000）</text>
      <text x="480" y="12" text-anchor="end" fill="currentColor" opacity="0.55" font-size="11" id="cw-tok-split">未命中 1000 · 命中 0</text>
      <g>
        <rect x="0" y="18" width="480" height="34" rx="5" fill="none" stroke="currentColor" opacity="0.18"/>
        <rect id="cw-tok-hit" x="0" y="18" width="0" height="34" rx="5" fill="var(--cw-hit)"/>
        <clipPath id="cw-clip1"><rect x="0" y="18" width="480" height="34" rx="5"/></clipPath>
      </g>

      <text x="0" y="82" fill="currentColor" opacity="0.55" font-size="11">示意成本构成（未命中 1 / 1000 token，命中 0.1 / 1000 token）</text>
      <g>
        <rect x="0" y="88" width="480" height="34" rx="5" fill="none" stroke="currentColor" opacity="0.18"/>
        <clipPath id="cw-clip2"><rect x="0" y="88" width="480" height="34" rx="5"/></clipPath>
      </g>

      <text x="0" y="144" fill="currentColor" opacity="0.55" font-size="11">浅色边框 = 全部未命中时的 1.000 单位</text>
      <g font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">
        <text x="0" y="144" text-anchor="start" id="cw-mk0x"></text>
      </g>
    </svg>
  </div>
  <div class="cw-rowhead"><span id="cw-bar-line">未命中 1000 token · 命中 0 token</span><span id="cw-bar-cost">成本 1.000 单位</span></div>

  <input class="cw-base cw-slider" id="cw-slider" type="range" min="0" max="100" step="1" value="0"
         aria-label="缓存命中率" aria-describedby="cw-result">
  <div class="cw-scale"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
  <div class="cw-presets">
    <span>快速选择</span>
    <button type="button" data-v="0" aria-pressed="true">0%</button>
    <button type="button" data-v="50" aria-pressed="false">50%</button>
    <button type="button" data-v="100" aria-pressed="false">100%</button>
  </div>

  <div class="cw-legend">
    <span><i style="background:var(--cw-miss)"></i>未命中 · 1.0 单位 / 1000 token</span>
    <span><i style="background:var(--cw-hit)"></i>命中 · 0.1 单位 / 1000 token</span>
  </div>
  <div class="cw-note" id="cw-result">当前命中率 0%，示意成本 1.000 单位，是全部未命中时的 100%。</div>
  <div class="cw-tip">
    <div>0% 命中<b id="cw-t0">1.000 单位</b></div>
    <div>50% 命中<b id="cw-t50">0.550 单位</b></div>
    <div>100% 命中<b id="cw-t100">0.100 单位</b></div>
  </div>
</div>
<script>
(function(){
  var root=document.getElementById('cw-root');
  var svg=root.querySelector('svg');
  var slider=document.getElementById('cw-slider');
  var costEl=document.getElementById('cw-cost');
  var pctEl=document.getElementById('cw-pctlabel');
  var tokHit=document.getElementById('cw-tok-hit');
  var tokSplit=document.getElementById('cw-tok-split');
  var barLine=document.getElementById('cw-bar-line');
  var barCost=document.getElementById('cw-bar-cost');
  var res=document.getElementById('cw-result');
  var buttons=Array.prototype.slice.call(root.querySelectorAll('.cw-presets button'));

  var W=480, MISS=[224,129,58], HIT=[58,157,143], MAXC=1.0;
  var NS='http://www.w3.org/2000/svg';
  var costHit=document.getElementById('cw-clip2');
  var costMiss=document.createElementNS(NS,'rect');
  costMiss.setAttribute('y','88'); costMiss.setAttribute('height','34');
  costMiss.setAttribute('fill','rgb('+MISS.join(',')+')');
  costMiss.setAttribute('clip-path','url(#cw-clip2)');
  var costHitRect=document.createElementNS(NS,'rect');
  costHitRect.setAttribute('y','88'); costHitRect.setAttribute('height','34');
  costHitRect.setAttribute('fill','rgb('+HIT.join(',')+')');
  costHitRect.setAttribute('clip-path','url(#cw-clip2)');
  var g2=costHit.parentNode;
  g2.appendChild(costMiss); g2.appendChild(costHitRect);
  tokHit.setAttribute('clip-path','url(#cw-clip1)');

  function fmt(n){return n.toFixed(3);}
  function render(h){
    var hitTokens=10*h, missTokens=1000-hitTokens;
    var missCost=missTokens/1000, hitCost=hitTokens/1000*0.1;
    var total=missCost+hitCost;
    // token bar: miss first, then hit
    tokHit.setAttribute('x', missTokens/W*W/1000*1000*0); // keep simple below
    tokHit.setAttribute('x', 480*missTokens/1000);
    tokHit.setAttribute('width', 480*hitTokens/1000);
    // cost bar: miss segment then hit segment, scale = 1.0 unit -> 480px
    var wMiss=480*missCost/MAXC, wHit=480*hitCost/MAXC;
    costMiss.setAttribute('x','0'); costMiss.setAttribute('width', wMiss.toFixed(2));
    costHitRect.setAttribute('x', wMiss.toFixed(2)); costHitRect.setAttribute('width', wHit.toFixed(2));
    costEl.textContent=fmt(total);
    pctEl.textContent='（命中 '+h+'%）';
    tokSplit.textContent='未命中 '+missTokens+' · 命中 '+hitTokens;
    barLine.textContent='未命中 '+missTokens+' token · 命中 '+hitTokens+' token';
    barCost.textContent='成本 '+fmt(total)+' 单位';
    res.textContent='当前命中率 '+h+'%，示意成本 '+fmt(total)+' 单位，是全部未命中时的 '
      + Math.round(total/MAXC*100) + '%。';
    slider.value=String(h);
    buttons.forEach(function(b){b.setAttribute('aria-pressed', String(Number(b.dataset.v)===h));});
  }
  slider.addEventListener('input', function(){render(Number(slider.value));});
  buttons.forEach(function(b){
    b.addEventListener('click', function(){render(Number(b.dataset.v));});
  });
  render(0);
})();
</script></body></html>
