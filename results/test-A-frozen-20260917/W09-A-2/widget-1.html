<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}:where(body){padding:0}:where(body>svg){width:100%;height:auto}</style></head><body><svg viewBox="0 0 760 420" width="100%" role="img" aria-label="1月至6月净新增用户折线趋势图，最高为3月160人，最低为4月-20人">
  <style>
    .bg { fill: #ffffff; }
    .grid { stroke: #e6e9ef; stroke-width: 1; }
    .axis { stroke: #c3c9d4; stroke-width: 1.2; }
    .tick { fill: #7a8494; font: 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
    .lbl { fill: #2b3340; font: 13px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
    .val { fill: #2b3340; font: 600 12.5px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
    .title { fill: #1b2230; font: 600 17px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
    .sub { fill: #7a8494; font: 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
    .line { fill: none; stroke: #3b6ef5; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3b6ef5; }
    .hi { fill: #12a150; }
    .lo { fill: #e0483d; }
    .zero { stroke: #9aa3b2; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .bubble-hi { fill: #12a150; fill-opacity: .12; stroke: #12a150; stroke-width: 1.4; }
    .bubble-lo { fill: #e0483d; fill-opacity: .12; stroke: #e0483d; stroke-width: 1.4; }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="420" rx="12"/>

  <text class="title" x="24" y="34">净新增用户 · 近 6 个月</text>
  <text class="sub" x="24" y="55">单位：人　（数据源：monthly.csv）</text>

  <!-- legend -->
  <circle cx="530" cy="30" r="5" class="hi"/><text class="sub" x="542" y="34">最高</text>
  <circle cx="596" cy="30" r="5" class="lo"/><text class="sub" x="608" y="34">最低</text>

  <!-- plot area: x 80..716, y: value 160 -> 90 ; value -20 -> 330 -->
  <!-- mapping: y = 90 + (160 - v) * (240/180) = 90 + (160-v)*1.333... -->
  <!-- zero line: v=0 -> y = 90 + 160*1.3333 = 303.33 -->

  <!-- gridlines -->
  <g class="grid">
    <line x1="80" y1="90"  x2="716" y2="90"/>
    <line x1="80" y1="143.3" x2="716" y2="143.3"/>
    <line x1="80" y1="196.7" x2="716" y2="196.7"/>
    <line x1="80" y1="250"  x2="716" y2="250"/>
  </g>
  <text class="tick" x="72" y="94"  text-anchor="end">160</text>
  <text class="tick" x="72" y="147" text-anchor="end">120</text>
  <text class="tick" x="72" y="201" text-anchor="end">80</text>
  <text class="tick" x="72" y="254" text-anchor="end">40</text>
  <text class="tick" x="72" y="307" text-anchor="end">0</text>
  <text class="tick" x="72" y="363" text-anchor="end">-40</text>
  <line class="grid" x1="80" y1="356.7" x2="716" y2="356.7"/>

  <!-- zero reference -->
  <line class="zero" x1="80" y1="303.3" x2="716" y2="303.3"/>
  <text class="tick" x="720" y="307">0 基线</text>

  <!-- axes -->
  <line class="axis" x1="80" y1="90" x2="80" y2="356.7"/>
  <line class="axis" x1="80" y1="303.3" x2="716" y2="303.3"/>

  <!-- points: x = 133, 240, 347, 454, 561, 668 -->
  <!-- values: 120->249.3 ; 80->196.7 ; 160->90 ; -20->330 ; 0->303.3 ; 100->170 -->

  <!-- highlight bubbles -->
  <circle class="bubble-hi" cx="347" cy="90" r="16"/>
  <circle class="bubble-lo" cx="454" cy="330" r="16"/>

  <!-- line -->
  <polyline class="line" points="133,249.3 240,196.7 347,90 454,330 561,303.3 668,170"/>

  <!-- dots -->
  <g class="dot">
    <circle cx="133" cy="249.3" r="4.5"/>
    <circle cx="240" cy="196.7" r="4.5"/>
    <circle cx="561" cy="303.3" r="4.5"/>
    <circle cx="668" cy="170" r="4.5"/>
  </g>
  <circle class="hi" cx="347" cy="90" r="6.5"/>
  <circle class="lo" cx="454" cy="330" r="6.5"/>

  <!-- value labels -->
  <text class="val" x="133" y="238" text-anchor="middle">120</text>
  <text class="val" x="240" y="185" text-anchor="middle">80</text>
  <text class="val" x="347" y="72" text-anchor="middle" fill="#12a150">160 ▲ 最高</text>
  <text class="val" x="454" y="356" text-anchor="middle" fill="#e0483d">-20 ▼ 最低</text>
  <text class="val" x="561" y="292" text-anchor="middle">0</text>
  <text class="val" x="668" y="159" text-anchor="middle">100</text>

  <!-- x labels -->
  <g class="lbl" text-anchor="middle">
    <text x="133" y="382">1月</text>
    <text x="240" y="382">2月</text>
    <text x="347" y="382" font-weight="600">3月</text>
    <text x="454" y="382" font-weight="600">4月</text>
    <text x="561" y="382">5月</text>
    <text x="668" y="382">6月</text>
  </g>
</svg></body></html>
