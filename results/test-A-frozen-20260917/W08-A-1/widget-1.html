<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><div class="cw">
<style>
.cw{--miss:#e8734a;--hit:#3f9d8f;--track:var(--dsw-alias-bg-layer-2,#f2f3f5);
  font-family:inherit;color:var(--dsw-alias-label-primary,#1b1d21);max-width:680px;
  border:1px solid var(--dsw-alias-border-l1,#e3e5e8);border-radius:14px;padding:16px 16px 14px;
  background:var(--dsw-alias-bg-base,#fff);display:grid;gap:14px;container-type:inline-size}
.cw *{box-sizing:border-box}
.cw-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cw-title{font-size:15px;font-weight:650;margin:0}
.cw-sub{font-size:12px;color:var(--dsw-alias-label-secondary,#6b7280)}
.cw-panel{display:grid;gap:10px;border:1px solid var(--dsw-alias-border-l1,#e3e5e8);border-radius:11px;
  padding:12px;background:var(--dsw-alias-bg-layer-1,#fafbfc)}
.cw-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cw-label{font-size:12.5px;color:var(--dsw-alias-label-secondary,#6b7280)}
.cw-presets{display:flex;gap:6px}
.cw-presets button{font:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--dsw-alias-border-l2,#d3d6db);background:var(--dsw-alias-bg-layer-1,#fff);
  color:var(--dsw-alias-label-primary,#1b1d21);font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}
.cw-presets button:hover{background:var(--dsw-alias-interactive-bg-hover,rgba(0,0,0,.05))}
.cw-presets button[aria-pressed="true"]{background:var(--dsw-alias-button-primary-fill,#1b1d21);
  border-color:var(--dsw-alias-button-primary-fill,#1b1d21);color:var(--dsw-alias-label-primary-inverted,#fff)}
.cw-range{width:100%;margin:0;accent-color:var(--dsw-alias-brand-primary,#3f9d8f)}
.cw-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--dsw-alias-label-tertiary,#9aa1ab)}
.cw-stack{display:flex;height:52px;border-radius:9px;overflow:hidden;border:1px solid var(--dsw-alias-border-l1,#e3e5e8)}
.cw-seg{position:relative;transition:width .18s ease}
.cw-seg.miss{background:repeating-linear-gradient(135deg,var(--miss) 0 7px,#e08159 7px 14px)}
.cw-seg.hit{background:repeating-linear-gradient(135deg,var(--hit) 0 7px,#4daf9f 7px 14px)}
.cw-seg span{position:absolute;top:50%;transform:translateY(-50%);font-size:11.5px;color:#fff;font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.cw-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dsw-alias-label-secondary,#6b7280)}
.cw-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cw-legend .m{background:repeating-linear-gradient(135deg,var(--miss) 0 4px,#e08159 4px 8px)}
.cw-legend .h{background:repeating-linear-gradient(135deg,var(--hit) 0 4px,#4daf9f 4px 8px)}
.cw-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.cw-card{border:1px solid var(--dsw-alias-border-l1,#e3e5e8);border-radius:11px;padding:10px 12px;
  background:var(--dsw-alias-bg-layer-1,#fafbfc);min-width:0}
.cw-card .k{font-size:11.5px;color:var(--dsw-alias-label-secondary,#6b7280);display:flex;align-items:center;gap:5px}
.cw-card .k i{width:9px;height:9px;border-radius:2px;display:inline-block}
.cw-card .v{font-size:22px;font-weight:660;font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.01em}
.cw-card .u{font-size:11.5px;color:var(--dsw-alias-label-tertiary,#9aa1ab);font-weight:400;margin-left:3px}
.cw-card.total{border-color:var(--dsw-alias-brand-primary,#3f9d8f);border-width:1.5px}
.cw-gauge{position:relative;height:34px;margin-top:2px}
.cw-gtrack{position:absolute;inset:9px 0 auto;height:12px;border-radius:6px;background:var(--track,#f2f3f5);
  border:1px solid var(--dsw-alias-border-l1,#e3e5e8)}
.cw-gfill{position:absolute;left:0;top:9px;height:12px;border-radius:6px 3px 3px 6px;
  background:linear-gradient(90deg,var(--dsw-alias-brand-primary,#3f9d8f),#e8734a);transition:width .18s ease}
.cw-mk{position:absolute;top:2px;height:22px;width:0;border-left:1px dashed var(--dsw-alias-border-l2,#c4c8ce)}
.cw-mk b{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:500;
  color:var(--dsw-alias-label-tertiary,#9aa1ab);white-space:nowrap;font-variant-numeric:tabular-nums}
.cw-gcap{display:flex;justify-content:space-between;font-size:11px;color:var(--dsw-alias-label-tertiary,#9aa1ab);margin-top:2px}
.cw-note{font-size:12px;color:var(--dsw-alias-label-secondary,#6b7280);
  border-top:1px dashed var(--dsw-alias-border-l1,#e3e5e8);padding-top:9px;line-height:1.5}
.cw-note b{color:var(--dsw-alias-label-primary,#1b1d21);font-variant-numeric:tabular-nums}
.cw-save{color:var(--dsw-alias-brand-primary,#3f9d8f);font-weight:600;font-variant-numeric:tabular-nums}
@container (max-width:430px){.cw-card .v{font-size:19px}.cw-stack{height:46px}}
</style>

<div class="cw-head">
  <h3 class="cw-title">缓存命中率 → 成本构成</h3>
  <div class="cw-sub">总输入固定 1000 token · 单位仅为示意</div>
</div>

<div class="cw-panel">
  <div class="cw-row">
    <span class="cw-label">拖动设置命中率</span>
    <div class="cw-presets" role="group" aria-label="命中率快捷选择">
      <button type="button" data-p="0" aria-pressed="true">0%</button>
      <button type="button" data-p="50" aria-pressed="false">50%</button>
      <button type="button" data-p="100" aria-pressed="false">100%</button>
    </div>
  </div>
  <input class="cw-range" id="cwRange" type="range" min="0" max="100" step="5" value="0"
         aria-label="缓存命中率" aria-describedby="cwStack">
  <div class="cw-ends"><span>0% 全未命中</span><span>50%</span><span>100% 全命中</span></div>

  <div class="cw-stack" id="cwStack" role="img" aria-label="1000 token 中命中与未命中的构成">
    <div class="cw-seg miss" id="cwSegMiss" style="width:100%"><span id="cwSegMissTxt" style="left:8px">未命中 1000</span></div>
    <div class="cw-seg hit" id="cwSegHit" style="width:0"></div>
  </div>
  <div class="cw-legend">
    <span><i class="m"></i>未命中 token · 1 单位 / 1000 token</span>
    <span><i class="h"></i>命中 token · 0.1 单位 / 1000 token</span>
  </div>
</div>

<div class="cw-cards">
  <div class="cw-card">
    <div class="k"><i style="background:var(--miss)"></i>未命中</div>
    <div class="v" id="cwMissTok">1000<span class="u">token</span></div>
  </div>
  <div class="cw-card">
    <div class="k"><i style="background:var(--hit)"></i>命中</div>
    <div class="v" id="cwHitTok">0<span class="u">token</span></div>
  </div>
  <div class="cw-card total">
    <div class="k">总成本（示意）</div>
    <div class="v" id="cwCost">1.00<span class="u">单位</span></div>
  </div>
</div>

<div class="cw-panel" style="gap:6px">
  <div class="cw-label">总成本刻度（对比 0% 与 100% 两端）</div>
  <div class="cw-gauge">
    <div class="cw-gtrack"></div>
    <div class="cw-gfill" id="cwFill" style="width:100%"></div>
    <div class="cw-mk" style="left:100%"><b>0% · 1.00</b></div>
    <div class="cw-mk" style="left:10%"><b>100% · 0.10</b></div>
  </div>
  <div class="cw-gcap"><span>0.10 单位</span><span>1.00 单位</span></div>
</div>

<div class="cw-note" id="cwNote">
  全部未命中：1000 × 1/1000 = <b>1.00</b> 单位。命中只按 0.1 计价，每提升一格命中率都在削减成本。
</div>
</div>

<script>
(function(){
  var r=document.getElementById('cwRange');
  var segMiss=document.getElementById('cwSegMiss'),segHit=document.getElementById('cwSegHit'),
      segMissTxt=document.getElementById('cwSegMissTxt');
  var missTok=document.getElementById('cwMissTok'),hitTok=document.getElementById('cwHitTok'),
      cost=document.getElementById('cwCost'),fill=document.getElementById('cwFill'),note=document.getElementById('cwNote');
  var btns=Array.prototype.slice.call(document.querySelectorAll('.cw-presets button'));

  function fmtTok(n){return String(Math.round(n));}
  function fmtCost(u){return u.toFixed(2);}

  function render(pct){
    var hit=1000*pct/100, miss=1000-hit;
    var hitUnits=hit/1000*0.1, missUnits=miss/1000*1;
    var total=hitUnits+missUnits;

    segMiss.style.width=(100-pct)+'%';
    segHit.style.width=pct+'%';

    // 段内文字：放得下就居中，放不下就把未命中标签挪到左侧
    if(pct>=34){segMissTxt.style.left='50%';segMissTxt.style.transform='translate(-50%,-50%)';}
    else{segMissTxt.style.left='8px';segMissTxt.style.transform='translateY(-50%)';}
    segMissTxt.textContent=(miss>0&&pct<34)?('未命中 '+fmtTok(miss)):'未命中 '+fmtTok(miss);
    if(miss<=0){segMissTxt.style.display='none';}else{segMissTxt.style.display='';}
    if(segHit.firstChild){segHit.removeChild(segHit.firstChild);}
    if(pct>0){
      var s=document.createElement('span');
      s.style.left=(pct>=34?'50%':'8px');
      s.style.transform=(pct>=34?'translate(-50%,-50%)':'translateY(-50%)');
      s.textContent=(pct>=34?'命中 '+fmtTok(hit):'命中 '+fmtTok(hit));
      segHit.appendChild(s);
    }

    missTok.innerHTML=fmtTok(miss)+'<span class="u">token</span>';
    hitTok.innerHTML=fmtTok(hit)+'<span class="u">token</span>';
    cost.innerHTML=fmtCost(total)+'<span class="u">单位</span>';
    fill.style.width=(total*100)+'%';

    btns.forEach(function(b){b.setAttribute('aria-pressed',Number(b.dataset.p)===pct?'true':'false');});

    var saved=1-total;
    if(pct===0){
      note.innerHTML='全部未命中：1000 × 1/1000 = <b>1.00</b> 单位。命中只按 0.1 计价，每提升一格命中率都在削减成本。';
    }else if(pct===100){
      note.innerHTML='全部命中：1000 × 0.1/1000 = <b>0.10</b> 单位，是 0% 时的 <b>10%</b>。<span class="cw-save">省下 0.90 单位</span>。';
    }else{
      note.innerHTML='构成：未命中 <b>'+fmtTok(miss)+'</b> × 1/1000 + 命中 <b>'+fmtTok(hit)+'</b> × 0.1/1000 = <b>'+fmtCost(total)+'</b> 单位，'+
        '相比 0% 的 1.00 单位<span class="cw-save">省下 '+fmtCost(saved)+' 单位（-'+Math.round(saved*100)+'%）</span>。';
    }
    r.setAttribute('aria-valuetext',pct+'% 命中，总成本 '+fmtCost(total)+' 单位');
  }

  r.addEventListener('input',function(){render(Number(r.value));});
  btns.forEach(function(b){
    b.addEventListener('click',function(){r.value=b.dataset.p;render(Number(b.dataset.p));});
  });
  render(Number(r.value));
})();
</script>
</div></body></html>
