:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>

<script>
(function(){
  var w=document.querySelector('.cmp-wrap');if(!w)return;
  var S=[
    {name:'首页信息流',need:'列表 + 作者 + 点赞态 + 广告',window:1000,
     r:['/feed?limit=20|370|90|2800|','/users/:id（作者，批量缺）|120|260|1400|','/posts/:id/likes（逐条）|110|300|600|','/ads/config|60|20|300'],
     rc:'轮数 = 400×3 = 1200ms（串行水瀑布）；列表里 20 条要 N+1 拼接，容易过取字段。',
     g:['feed {...}（一次声明全部）|250|1900'],
     gc:'服务端要为同一查询写 resolver 聚合；限流与复杂度上限必须配上，否则一个恶意深层查询能打穿数据库。',
     tip:'首页是典型「跨资源聚合」屏。REST 要么多端点串行，要么专门开 BFF 聚合端点；GraphQL 在这里省的是往返次数和客户端拼装逻辑。',
     pick:'gql', tag:'本屏倾向 · GraphQL'},
    {name:'商品详情',need:'商品 + 库存 + 评价 + 促销',window:1000,
     r:['/products/:id|210|1800|','/inventory/:sku|80|120|','/reviews?pid=|240|2400|','/promotions?pid=|90|160|'],
     rc:'如果这四个端点各自独立发（客户端无法并行），总时长 = 210+80+240+90 = 620ms；真实可用并发能压到 ~240ms，但顺序依赖会把它拉长。',
     g:['query ProductPage|240|2500'],
     gc:'GraphQL 一次拿全，但要防止「万能详情查询」：字段数量要以复杂度计分限流，热门商品缓存要落到 resolver 或 CDN。',
     tip:'详情页字段多、来源多，GraphQL 的「按需取字段」对弱网与低端机最友好；代价是后端要有一套聚合与限流机制。',
     pick:'gql', tag:'本屏倾向 · GraphQL'},
    {name:'消息/会话',need:'会话列表 + 成员 + 未读数',window:1000,
     r:['/conversations|160|900|','/conversations/:id/members|90|240|','/conversations/:id/read|70|80|'],
     rc:'三个端点语义清楚、缓存粒度正好对应资源，客户端按 Tab 切换时还能命中缓存。',
     g:['query Inbox|280|640'],
     gc:'GraphQL 的收益主要是省一次往返；但即时通讯更多靠 WebSocket/推送，查询层的收益会被削弱。',
     tip:'这类数据天然是「资源 + 列表」，REST 的 URL 就是缓存键，CDN/HTTP 缓存与分页游标都直接可用；GraphQL 反而要自建缓存失效。',
     pick:'rest', tag:'本屏倾向 · REST'},
    {name:'设置/个人资料',need:'单表读取，字段固定',window:1000,
     r:['/me|120|300|'],
     rc:'一个端点一个资源，没有过取问题，缓存、鉴权、监控都最省事。',
     g:['query Me|150|280'],
     gc:'GraphQL 引入 schema、resolver、复杂度限制，但在「单表读」上收益接近零，是典型的过度设计。',
     tip:'如果小程序的接口大多长这样，上 GraphQL 的运维成本换不回来；先把 REST 的分页、错误码、缓存头做扎实。',
     pick:'rest', tag:'本屏倾向 · REST'}
  ];
  var root=document.documentElement;
  var css=getComputedStyle(root);
  function v(nm,fb){var x=css.getPropertyValue(nm).trim();return x||fb}
  var COL={rest:v('--dsw-alias-label-primary','#d98a2b'),gql:v('--dsw-alias-label-primary','#7c5cff')};
  var line=v('--dsw-alias-border-l1','rgba(127,127,127,.25)');
  var ink3=v('--dsw-alias-label-tertiary','rgba(127,127,127,.8)');

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function maxMs(reqs){var m=0;reqs.forEach(function(r){m=Math.max(m,r.start+r.ms)});return m}

  function renderRows(el,reqs,color){
    el.innerHTML=reqs.map(function(r){
      var end=r.start+r.ms, L=(r.start/1000*100).toFixed(2), W=Math.max(r.ms/1000*100,3).toFixed(2);
      return '<div class="row">'+
        '<span class="rname" title="'+esc(r.name)+'">'+esc(r.name)+'</span>'+
        '<span class="rtrack" role="presentation"><span class="rbar" style="left:'+L+'%;width:'+W+'%;background:'+color+'"></span></span>'+
        '<span class="rn" title="调用次数">'+r.n+'×</span>'+
        '<span class="rms" title="结束时间">'+end+'ms</span></div>';
    }).join('');
  }
  function parse(list){return list.map(function(s){var p=s.split('|');return {name:p[0],ms:+p[1],start:+p[2],n:+(p[3]||1)}})}
  function sumMs(reqs){var e=0;reqs.forEach(function(r){e=Math.max(e,r.start+r.ms)});return e}
  function payload(reqs){return reqs.reduce(function(a,r){return a+r.n*r.ms*3},0)>>>0}

  function costCard(el,rest){
    el.innerHTML=rest
      ? '后端成本：<b>低到中</b>。端点即契约，用 OpenAPI/文档就能冻结；缺点是页面一变就要新端点（或开 BFF）。'
      : '后端成本：<b>中到高</b>。schema、resolver、N+1 与复杂度限流都得有；好处是字段级演进不用发版。';
  }

  function update(i){
    var s=S[i];
    var rr=parse(s.r), gg=parse(s.g);
    var rv=document.getElementById('rowsR'), gv=document.getElementById('rowsG');
    renderRows(rv,rr,line);renderRows(gv,gg,line);
    // color: use theme primary for bars is risky against bg; use explicit palette
    renderRows(rv,rr,'#d98a2b');renderRows(gv,gg,'#7c5cff');

    var rEnd=sumMs(rr), gEnd=sumMs(gg);
    var rN=rr.reduce(function(a,r){return a+r.n},0);
    document.getElementById('totR').innerHTML=
      '<span class="kv">场景</span> '+esc(s.need)+
      ' <span class="kv">· 往返</span> <b>'+rN+'</b>'+
      ' <span class="kv">· 完成</span> <b>'+rEnd+'ms</b>'+
      ' <span class="kv">· 传输量级</span> <b>'+payload(rr)+'B</b>';
    document.getElementById('totG').innerHTML=
      '<span class="kv">场景</span> '+esc(s.need)+
      ' <span class="kv">· 往返</span> <b>1</b>'+
      ' <span class="kv">· 完成</span> <b>'+gEnd+'ms</b>'+
      ' <span class="kv">· 传输量级</span> <b>'+payload(gg)+'B</b>';
    document.getElementById('costR').innerHTML=esc(s.rc);
    document.getElementById('costG').innerHTML=esc(s.gc);
    costCard(document.getElementById('costR'),true);
    document.getElementById('costR').innerHTML=esc(s.rc)+'<br><br>'+document.getElementById('costR').innerHTML;
    costCard(document.getElementById('costG'),false);
    document.getElementById('costG').innerHTML=esc(s.gc)+'<br><br>'+document.getElementById('costG').innerHTML;

    document.getElementById('vTag').textContent=s.tag;
    document.getElementById('vTxt').textContent=s.tip;
