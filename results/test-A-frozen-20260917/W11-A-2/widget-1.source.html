<style>
  .fw { --fw-gap: 14px; max-width: 460px; min-width: 0; font-size: 14px; line-height: 1.5; color: var(--dsw-alias-label-primary); }
  .fw *, .fw *::before, .fw *::after { box-sizing: border-box; }
  .fw-cap { margin: 0 0 8px; font-size: 12px; letter-spacing: .02em; color: var(--dsw-alias-label-tertiary); }
  .fw-wrap { padding: 18px; border-radius: 16px; background: var(--dsw-alias-bg-layer-2); border: 1px dashed var(--dsw-alias-border-l1); min-width: 0; }
  .fw-card { background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l1); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.10); overflow: hidden; min-width: 0; }
  .fw-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); }
  .fw-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .fw-sub { margin: 2px 0 0; font-size: 12px; color: var(--dsw-alias-label-secondary); }
  .fw-body { display: grid; gap: var(--fw-gap); padding: 16px; }
  .fw-field { min-width: 0; }
  .fw-field > label, .fw-field > legend, .fw-legend { display: block; margin: 0 0 6px; padding: 0; font-size: 12px; font-weight: 600; color: var(--dsw-alias-label-secondary); }
  .fw-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .fw-opts input { position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; pointer-events: none; }
  .fw-opts label { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; font-size: 13px; color: var(--dsw-alias-label-secondary); background: var(--dsw-alias-bg-base); border: 1px solid var(--dsw-alias-border-l2); border-radius: 999px; cursor: pointer; user-select: none; }
  .fw-opts label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--dsw-alias-border-l2); flex: none; }
  .fw-opts input:checked + label { color: var(--dsw-alias-label-primary); font-weight: 600; border-color: var(--dsw-alias-brand-primary); background: var(--dsw-alias-interactive-bg-hover); }
  .fw-opts input:checked + label::before { border-color: var(--dsw-alias-brand-primary); background: var(--dsw-alias-brand-primary); }
  .fw-opts input:focus-visible + label { outline: 2px solid var(--dsw-alias-brand-primary); outline-offset: 2px; }
  .fw-opts label:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .fw-input { display: block; width: 100%; min-width: 0; padding: 8px 11px; font: inherit; font-size: 13px; color: var(--dsw-alias-label-primary); background: var(--dsw-alias-bg-base); border: 1px solid var(--dsw-alias-border-l2); border-radius: 8px; }
  .fw-input:focus-visible { outline: 2px solid var(--dsw-alias-brand-primary); outline-offset: 1px; border-color: var(--dsw-alias-brand-primary); }
  .fw-hint { margin: 6px 0 0; font-size: 12px; color: var(--dsw-alias-label-tertiary); }
  .fw-hint[hidden] { display: none; }
  .fw-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-base); }
  .fw-btn { font: inherit; font-size: 13px; padding: 8px 18px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .fw-ghost { color: var(--dsw-alias-label-primary); background: transparent; border-color: var(--dsw-alias-border-l2); }
  .fw-ghost:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .fw-primary { font-weight: 600; color: var(--dsw-alias-label-primary-inverted); background: var(--dsw-alias-button-primary-fill); }
  .fw-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .fw-primary:disabled { opacity: .45; cursor: not-allowed; }
  .fw-stale { margin: 10px 0 0; font-size: 12px; color: var(--dsw-alias-state-error-primary); }
  .fw-stale[hidden] { display: none; }
  .fw-summary { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l1); border-left: 3px solid var(--dsw-alias-brand-primary); }
  .fw-summary[hidden] { display: none; }
  .fw-summary-text { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .fw-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; margin: 0; }
  .fw-kv > div { display: flex; gap: 8px; min-width: 0; }
  .fw-kv dt { flex: none; font-size: 12px; color: var(--dsw-alias-label-secondary); }
  .fw-kv dd { margin: 0; font-size: 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  @media (max-width: 380px) { .fw-kv { grid-template-columns: minmax(0, 1fr); } }
</style>

<div class="fw" id="fw-root">
  <p class="fw-cap">交互原型 · 筛选弹窗</p>
  <div class="fw-wrap">
    <div class="fw-card" role="group" aria-labelledby="fw-title">
      <div class="fw-head">
        <h3 id="fw-title">筛选</h3>
        <p class="fw-sub">按状态与负责人缩小结果范围</p>
      </div>

      <div class="fw-body">
        <fieldset class="fw-field" style="border:0; margin:0; padding:0; min-width:0;">
          <legend class="fw-legend">状态</legend>
          <div class="fw-opts">
            <input type="radio" id="fw-s1" name="fw-status" value="进行中" checked>
            <label for="fw-s1">进行中</label>
            <input type="radio" id="fw-s2" name="fw-status" value="已完成">
            <label for="fw-s2">已完成</label>
          </div>
        </fieldset>

        <div class="fw-field">
          <label for="fw-owner">负责人</label>
          <input class="fw-input" id="fw-owner" type="text" placeholder="请输入负责人姓名" autocomplete="off" spellcheck="false" aria-describedby="fw-hint">
          <p class="fw-hint" id="fw-hint">负责人为必填项，填写后才能应用</p>
        </div>
      </div>

      <div class="fw-foot">
        <button type="button" class="fw-btn fw-ghost" id="fw-reset">重置</button>
        <button type="button" class="fw-btn fw-primary" id="fw-apply" disabled>应用</button>
      </div>
    </div>

    <p class="fw-stale" id="fw-stale" hidden>筛选条件已变更，请重新应用</p>

    <section class="fw-summary" id="fw-summary" aria-live="polite" hidden>
      <p class="fw-summary-text" id="fw-summary-text"></p>
      <dl class="fw-kv">
        <div><dt>状态</dt><dd id="fw-sum-status">—</dd></div>
        <div><dt>负责人</dt><dd id="fw-sum-owner">—</dd></div>
      </dl>
    </section>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById('fw-root');
  if (!root) return;
  var owner = document.getElementById('fw-owner');
  var apply = document.getElementById('fw-apply');
  var reset = document.getElementById('fw-reset');
  var hint = document.getElementById('fw-hint');
  var stale = document.getElementById('fw-stale');
  var summary = document.getElementById('fw-summary');
  var sumText = document.getElementById('fw-summary-text');
  var sumStatus = document.getElementById('fw-sum-status');
  var sumOwner = document.getElementById('fw-sum-owner');

  var applied = null; // { status, owner } | null

  function currentStatus() {
    var r = root.querySelector('input[name="fw-status"]:checked');
    return r ? r.value : '';
  }

  function sync() {
    var o = owner.value.trim();
    apply.disabled = o === '';
    hint.hidden = o !== '';
    stale.hidden = !(applied && (applied.owner !== o || applied.status !== currentStatus()));
  }

  function render() {
    if (!applied) {
      summary.hidden = true;
      return;
    }
    summary.hidden = false;
    sumStatus.textContent = applied.status;
    sumOwner.textContent = applied.owner;
    sumText.textContent = '已应用筛选：状态「' + applied.status + '」，负责人「' + applied.owner + '」';
  }

  apply.addEventListener('click', function () {
    var o = owner.value.trim();
    if (o === '') return;
    applied = { status: currentStatus(), owner: o };
    render();
    sync();
  });

  reset.addEventListener('click', function () {
    owner.value = '';
    root.querySelector('input[name="fw-status"][value="进行中"]').checked = true;
    applied = null;
    render();
    sync();
    owner.focus();
  });

  root.addEventListener('input', sync);
  root.addEventListener('change', sync);

  owner.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !apply.disabled) {
      e.preventDefault();
      apply.click();
    }
  });

  sync();
  render();
})();
</script>
