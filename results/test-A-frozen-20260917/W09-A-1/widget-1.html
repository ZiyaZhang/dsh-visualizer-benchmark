<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}:where(body){padding:0}:where(body>svg){width:100%;height:auto}</style></head><body><svg viewBox="0 0 720 420" width="100%" role="img" aria-labelledby="chartTitle chartDesc" xmlns="http://www.w3.org/2000/svg">
  <title id="chartTitle">净新增用户月度趋势（1月至6月）</title>
  <desc id="chartDesc">折线图：1月120人，2月80人，3月160人（最高），4月-20人（最低），5月0人，6月100人。</desc>
  <style>
    .axis { font-size: 12px; fill: var(--dsw-alias-label-tertiary, #8a8f98); }
    .tick { stroke: var(--dsw-alias-border-l1, #e3e5e8); stroke-width: 1; }
    .zero { stroke: var(--dsw-alias-border-l2, #c9ccd1); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .val  { font-size: 13px; fill: var(--dsw-alias-label-secondary, #5b6068); text-anchor: middle; }
    .mark { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .mon  { font-size: 13px; fill: var(--dsw-alias-label-secondary, #5b6068); text-anchor: middle; }
    .line { fill: none; stroke: var(--dsw-alias-brand-primary, #3b82f6); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <!-- 负值区域 -->
  <rect x="64" y="313.1" width="624" height="58.9" fill="var(--dsw-alias-state-error-primary, #e5484d)" opacity="0.06"/>

  <!-- 网格 -->
  <line class="tick" x1="64" y1="77.5"  x2="688" y2="77.5"/>
  <line class="tick" x1="64" y1="136.4" x2="688" y2="136.4"/>
  <line class="tick" x1="64" y1="195.3" x2="688" y2="195.3"/>
  <line class="tick" x1="64" y1="254.2" x2="688" y2="254.2"/>
  <line class="tick" x1="64" y1="372"   x2="688" y2="372"/>
  <line class="zero" x1="64" y1="313.1" x2="688" y2="313.1"/>

  <!-- Y 轴刻度 -->
  <text class="axis" x="54" y="81.5"  text-anchor="end">160</text>
  <text class="axis" x="54" y="140.4" text-anchor="end">120</text>
  <text class="axis" x="54" y="199.3" text-anchor="end">80</text>
  <text class="axis" x="54" y="258.2" text-anchor="end">40</text>
  <text class="axis" x="54" y="317.1" text-anchor="end" style="fill:var(--dsw-alias-label-secondary,#5b6068);font-weight:600">0</text>
  <text class="axis" x="54" y="376"   text-anchor="end">-40</text>
  <text class="axis" x="64" y="30" text-anchor="start">单位：人</text>

  <!-- 折线 -->
  <path class="line" d="M64,136.4 L189,195.3 L314,77.5 L438,342.5 L563,313.1 L688,165.8"/>

  <!-- 数据点 -->
  <circle cx="64"  cy="136.4" r="4" fill="var(--dsw-alias-brand-primary, #3b82f6)"/>
  <circle cx="189" cy="195.3" r="4" fill="var(--dsw-alias-brand-primary, #3b82f6)"/>
  <circle cx="563" cy="313.1" r="4" fill="var(--dsw-alias-brand-primary, #3b82f6)"/>
  <circle cx="688" cy="165.8" r="4" fill="var(--dsw-alias-brand-primary, #3b82f6)"/>

  <!-- 最高点 -->
  <circle cx="314" cy="77.5" r="6.5" fill="var(--dsw-alias-brand-primary, #3b82f6)" stroke="var(--dsw-alias-bg-base, #fff)" stroke-width="2"/>
  <text class="mark" x="314" y="60" style="fill:var(--dsw-alias-brand-primary, #3b82f6)">最高 160</text>

  <!-- 最低点 -->
  <circle cx="438" cy="342.5" r="6.5" fill="var(--dsw-alias-state-error-primary, #e5484d)" stroke="var(--dsw-alias-bg-base, #fff)" stroke-width="2"/>
  <text class="mark" x="438" y="366" style="fill:var(--dsw-alias-state-error-primary, #e5484d)">最低 -20</text>

  <!-- 其余数值 -->
  <text class="val" x="64"  y="126.4">120</text>
  <text class="val" x="189" y="185.3">80</text>
  <text class="val" x="563" y="303">0</text>
  <text class="val" x="688" y="155.8">100</text>

  <!-- X 轴月份 -->
  <text class="mon" x="64"  y="394">1月</text>
  <text class="mon" x="189" y="394">2月</text>
  <text class="mon" x="314" y="394">3月</text>
  <text class="mon" x="438" y="394">4月</text>
  <text class="mon" x="563" y="394">5月</text>
  <text class="mon" x="688" y="394">6月</text>
</svg></body></html>
