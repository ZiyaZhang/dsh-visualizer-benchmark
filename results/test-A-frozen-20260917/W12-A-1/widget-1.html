<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .viz-wrap{font-family:inherit;color:var(--dsw-alias-label-primary,#111);background:var(--dsw-alias-bg-base,transparent);border:1px solid var(--dsw-alias-border-l1,rgba(0,0,0,.12));border-radius:12px;padding:14px 16px 12px;max-width:600px;box-sizing:border-box}
  .viz-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:4px}
  .viz-title{font-size:14px;font-weight:600}
  .viz-sub{font-size:12px;color:var(--dsw-alias-label-tertiary,#6b7280)}
  #chart{display:block;width:100%;height:auto}
  .barwrap{cursor:pointer;outline:none}
  .barwrap .bar{fill:var(--dsw-alias-brand-primary,#2563eb);fill-opacity:.32;transition:fill-opacity .15s ease}
  .barwrap:hover .bar{fill-opacity:.58}
  .barwrap:focus-visible .bar{fill-opacity:.58}
  .barwrap.sel .bar{fill-opacity:1}
  .barwrap .sel-ring{fill:none;stroke:var(--dsw-alias-brand-primary,#2563eb);stroke-width:2;opacity:0;transition:opacity .15s ease}
  .barwrap.sel .sel-ring{opacity:1}
  .val{font-size:11px;font-variant-numeric:tabular-nums;fill:var(--dsw-alias-label-secondary,#4b5563)}
  .val.sel{fill:var(--dsw-alias-brand-primary,#2563eb);font-weight:700}
  .tick{font-size:11px;font-variant-numeric:tabular-nums;fill:var(--dsw-alias-label-tertiary,#6b7280)}
  .grid{stroke:var(--dsw-alias-border-l1,rgba(0,0,0,.1));stroke-width:1}
  .axis-title{font-size:11px;fill:var(--dsw-alias-label-tertiary,#6b7280)}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:10px}
  .readout{font-size:13px;min-width:0;flex:1 1 180px}
  .readout b{font-variant-numeric:tabular-nums}
  #analyze{background:var(--dsw-alias-button-primary-fill,#2563eb);color:var(--dsw-alias-label-primary-inverted,#fff);border:1px solid transparent;border-radius:8px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  #analyze:disabled{opacity:.45;cursor:not-allowed}

</style>
<div class="viz-wrap">
  <div class="viz-head">
    <span class="viz-title">7 天错误率</span>
    <span class="viz-sub">单位：%　点击柱子选中某一天</span>
  </div>
  <svg id="chart" viewBox="0 0 520 248" role="group" aria-label="7天错误率柱状图，可选择某一天"></svg>
  <div class="row">
    <div class="readout" id="readout" aria-live="polite">未选择日期</div>
    <button id="analyze" type="button" disabled>分析所选日期</button>
  </div>
  <div class="hint" id="hint">选中某一天后，点击“分析所选日期”会把这天的日期与错误率发给我做进一步分析。</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script>
(function(){
  var data=[{day:1,rate:0.4},{day:2,rate:0.5},{day:3,rate:0.3},{day:4,rate:2.8},{day:5,rate:0.6},{day:6,rate:0.5},{day:7,rate:0.4}];
  var readout=document.getElementById("readout");
  var hint=document.getElementById("hint");
  var btn=document.getElementById("analyze");
  var selected=null;

  var svg=d3.select("#chart");
  var W=520,H=248,m={top:28,right:16,bottom:36,left:44};
  var iw=W-m.left-m.right, ih=H-m.top-m.bottom;
  var g=svg.append("g").attr("transform","translate("+m.left+","+m.top+")");
  var x=d3.scaleBand().domain(data.map(function(d){return d.day;})).range([0,iw]).paddingInner(0.4).paddingOuter(0.25);
  var y=d3.scaleLinear().domain([0,3]).range([ih,0]);
  var ticks=[0,1,2,3];

  var grid=g.append("g");
  ticks.forEach(function(t){
    grid.append("line").attr("class","grid").attr("x1",0).attr("x2",iw).attr("y1",y(t)).attr("y2",y(t));
    grid.append("text").attr("class","tick").attr("x",-8).attr("y",y(t)).attr("dy","0.32em").attr("text-anchor","end").text(t);
  });
  grid.append("text").attr("class","axis-title").attr("x",-36).attr("y",-10).text("错误率 %");

  var wraps=g.append("g").selectAll("g").data(data).join("g")
    .attr("class","barwrap")
    .attr("role","button")
    .attr("tabindex",0)
    .attr("aria-pressed","false")
    .attr("aria-label",function(d){return "第"+d.day+"天，错误率 "+d.rate.toFixed(1)+"%";})
    .attr("transform",function(d){return "translate("+x(d.day)+",0)";});

  wraps.append("rect").attr("class","bar")
    .attr("x",0).attr("y",function(d){return y(d.rate);})
    .attr("width",x.bandwidth()).attr("height",function(d){return ih-y(d.rate);})
    .attr("rx",4);

  wraps.append("rect").attr("class","sel-ring")
    .attr("x",-3).attr("y",function(d){return y(d.rate)-3;})
    .attr("width",x.bandwidth()+6).attr("height",function(d){return ih-y(d.rate)+3;})
    .attr("rx",6);

  wraps.append("rect").attr("class","hit")
    .attr("x",-6).attr("y",0).attr("width",x.bandwidth()+12).attr("height",ih)
    .attr("fill","transparent");

  var labels=wraps.append("text").attr("class","val")
    .attr("x",x.bandwidth()/2).attr("y",function(d){return y(d.rate)-7;})
    .attr("text-anchor","middle")
    .text(function(d){return d.rate.toFixed(1)+"%";});

  g.append("g").selectAll("text").data(data).join("text")
    .attr("class","tick")
    .attr("x",function(d){return x(d.day)+x.bandwidth()/2;})
    .attr("y",ih+16)
    .attr("text-anchor","middle")
    .text(function(d){return "第"+d.day+"天";});

  function find(day){for(var i=0;i<data.length;i++){if(data[i].day===day){return data[i];}}return null;}

  function select(day){
    selected=day;
    wraps.classed("sel",function(d){return d.day===day;})
         .attr("aria-pressed",function(d){return d.day===day?"true":"false";});
    labels.classed("sel",function(d){return d.day===day;});
    var d=find(day);
    if(d){
      readout.innerHTML="已选择：第 <b>"+d.day+"</b> 天 · 错误率 <b>"+d.rate.toFixed(1)+"%</b>";
      hint.textContent="点击“分析所选日期”，我会收到：第 "+d.day+" 天，错误率 "+d.rate.toFixed(1)+"%。";
    }else{
      readout.textContent="未选择日期";
      hint.textContent="选中某一天后，点击“分析所选日期”会把这天的日期与错误率发给我做进一步分析。";
    }
    btn.disabled = !d;
  }

  wraps.on("click",function(event,d){
    select(selected===d.day?null:d.day);
  });
  wraps.on("keydown",function(event,d){
    if(event.key==="Enter"||event.key===" "||event.key==="Spacebar"){
      event.preventDefault();
      select(selected===d.day?null:d.day);
    }
  });

  btn.addEventListener("click",function(){
    var d=find(selected);
    if(!d){return;}
    var msg="我选择的日期是第 "+d.day+" 天，错误率 "+d.rate.toFixed(1)+"%。请分析这一天错误率明显偏高的原因，并给出排查建议。";
    if(window.dshWidget&&typeof window.dshWidget.sendPrompt==="function"){
      window.dshWidget.sendPrompt(msg);
      hint.textContent="已发送：第 "+d.day+" 天，错误率 "+d.rate.toFixed(1)+"%。";
    }else{
      hint.textContent="当前环境无法发送追问。";
    }
  });

  select(null);
})();
</script></body></html>
