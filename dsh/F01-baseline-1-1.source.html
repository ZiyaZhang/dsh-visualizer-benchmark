<style>
  .rsc{font:inherit;color:var(--dsw-alias-label-primary,#1b1f24);background:var(--dsw-alias-bg-layer-1,#fff);border:1px solid var(--dsw-alias-border-l1,#e3e6ea);border-radius:12px;padding:14px 16px;display:grid;gap:12px;box-sizing:border-box}
  .rsc *{box-sizing:border-box}
  .rsc{--rsc-grid:color-mix(in srgb,var(--dsw-alias-border-l2,#c9ced6) 75%,transparent)}
  .rsc-head{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
  .rsc-title{font-weight:650;font-size:15px}
  .rsc-sub{font-size:12px;color:var(--dsw-alias-label-tertiary,#6b7280);font-variant-numeric:tabular-nums}
  .rsc-rows{display:grid;gap:6px;min-width:0}
  .rsc-row{display:grid;grid-template-columns:4.6em minmax(0,1fr) 6.9em;align-items:center;gap:10px;width:100%;background:none;border:1px solid transparent;border-radius:9px;padding:6px 8px;cursor:pointer;text-align:left;color:inherit;font:inherit}
  .rsc-row:hover{background:var(--dsw-alias-interactive-bg-hover,rgba(0,0,0,.05))}
  .rsc-row:focus-visible{outline:2px solid var(--dsw-alias-brand-primary,#4a7dff);outline-offset:1px}
  .rsc-row[aria-pressed="true"]{border-color:var(--dsw-alias-brand-primary,#4a7dff);background:var(--dsw-alias-interactive-bg-active,rgba(74,125,255,.1))}
  .rsc-name{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;white-space:nowrap;min-width:0}
  .rsc-dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--c)}
  .rsc-track{position:relative;min-width:0;height:22px;border-left:1px solid var(--rsc-grid);border-right:1px solid var(--rsc-grid);background-image:linear-gradient(to right,var(--rsc-grid) 1px,transparent 1px);background-size:33.3333% 100%}
  .rsc-fill{position:absolute;top:0;bottom:0;left:0;width:var(--w);border-radius:3px;background:var(--c)}
  .rsc-row[aria-pressed="true"] .rsc-fill{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
  .rsc-val{text-align:right;font-size:13px;color:var(--dsw-alias-label-secondary,#4b5563);white-space:nowrap;font-variant-numeric:tabular-nums}
  .rsc-num{font-weight:650;color:var(--dsw-alias-label-primary,#1b1f24)}
  .rsc-axis{display:grid;grid-template-columns:4.6em minmax(0,1fr) 6.9em;gap:10px}
  .rsc-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dsw-alias-label-tertiary,#6b7280);font-variant-numeric:tabular-nums;padding:0 1px}
  .rsc-unit{font-size:11px;color:var(--dsw-alias-label-tertiary,#6b7280)}
  .rsc-detail{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border-top:1px solid var(--dsw-alias-border-l1,#e3e6ea);padding-top:11px}
  .rsc-status{margin:0;font-size:12.5px;line-height:1.5;color:var(--dsw-alias-label-secondary,#4b5563);font-variant-numeric:tabular-nums;flex:1 1 15em;min-width:0}
  .rsc-status.is-err{color:var(--dsw-alias-state-error-primary,#c0392b)}
  .rsc-chip{display:inline-block;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--dsw-alias-brand-primary,#4a7dff) 16%,transparent);color:var(--dsw-alias-label-primary,#1b1f24);font-weight:650}
  .rsc-btn{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid var(--dsw-alias-button-primary-fill,#4a7dff);background:var(--dsw-alias-button-primary-fill,#4a7dff);color:var(--dsw-alias-label-primary-inverted,#fff);cursor:pointer;white-space:nowrap}
  .rsc-btn:hover:not(:disabled){filter:brightness(1.07)}
  .rsc-btn:disabled{opacity:.45;cursor:not-allowed}
  @media (max-width:390px){.rsc-row,.rsc-axis{grid-template-columns:4em minmax(0,1fr) 5.6em;gap:8px}.rsc-val{font-size:12px}}
</style>
<div class="rsc">
  <div class="rsc-head">
    <span class="rsc-title">地区销售额对比</span>
    <span class="rsc-sub">单位：万元 · 三地区合计 250 万元</span>
  </div>

  <div class="rsc-rows" id="rscRows" role="group" aria-label="地区销售额，点击选择一个地区（仅本地选中）"></div>

  <div class="rsc-axis" aria-hidden="true">
    <span></span>
    <div class="rsc-ticks"><span>0</span><span>40</span><span>80</span><span>120</span></div>
    <span class="rsc-unit" style="text-align:right">万元</span>
  </div>

  <div class="rsc-detail">
    <p class="rsc-status" id="rscStatus" role="status" aria-live="polite"></p>
    <button type="button" class="rsc-btn" id="rscAsk" disabled>解释所选地区</button>
  </div>
</div>
<script>
(function () {
  var host = document.getElementById('rscRows');
  var statusEl = document.getElementById('rscStatus');
  var askBtn = document.getElementById('rscAsk');
  if (!host || !statusEl || !askBtn) return;

  var REGIONS = [
    { name: '华东', value: 120, color: 'var(--dsw-alias-brand-primary, #4a7dff)' },
    { name: '华南', value: 80, color: '#2fa98c' },
    { name: '西部', value: 50, color: '#d98a2b' }
  ];
  var MAX = 120;
  var TOTAL = REGIONS.reduce(function (s, r) { return s + r.value; }, 0);
  var pct = function (v) { return (v / TOTAL * 100).toFixed(1) + '%'; };
  var selected = null;
  var lastSent = null;
  var buttons = [];

  REGIONS.forEach(function (r) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'rsc-row';
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', r.name + '，销售额 ' + r.value + ' 万元');

    var name = document.createElement('span');
    name.className = 'rsc-name';
    var dot = document.createElement('span');
    dot.className = 'rsc-dot';
    dot.style.setProperty('--c', r.color);
    name.appendChild(dot);
    name.appendChild(document.createTextNode(r.name));

    var track = document.createElement('span');
    track.className = 'rsc-track';
    var fill = document.createElement('span');
    fill.className = 'rsc-fill';
    fill.style.setProperty('--c', r.color);
    fill.style.setProperty('--w', (r.value / MAX * 100) + '%');
    track.appendChild(fill);

    var val = document.createElement('span');
    val.className = 'rsc-val';
    var num = document.createElement('span');
    num.className = 'rsc-num';
    num.textContent = String(r.value);
    val.appendChild(num);
    val.appendChild(document.createTextNode(' 万元'));

    b.appendChild(name);
    b.appendChild(track);
    b.appendChild(val);

    b.addEventListener('click', function () { select(r, b); });
    host.appendChild(b);
    buttons.push({ el: b, data: r });
  });

  function render() {
    buttons.forEach(function (item) {
      item.el.setAttribute('aria-pressed', selected && selected.name === item.data.name ? 'true' : 'false');
    });
    if (!selected) {
      statusEl.className = 'rsc-status';
      statusEl.textContent = '点击任一地区查看占比（只在本地选中）；确认后点“解释所选地区”才会向模型追问。';
      askBtn.disabled = true;
      askBtn.textContent = '解释所选地区';
      return;
    }
    statusEl.className = 'rsc-status';
    statusEl.innerHTML = '已选：<span class="rsc-chip">' + selected.name + '</span> · ' +
      selected.value + ' 万元 · 占合计 ' + pct(selected.value) +
      (lastSent === selected.name ? '（已发送追问）' : '');
    askBtn.disabled = lastSent === selected.name;
    askBtn.textContent = lastSent === selected.name ? '已发送追问' : '解释所选地区';
  }

  function select(r, el) {
    selected = r;
    lastSent = null;
    render();
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  }

  askBtn.addEventListener('click', function () {
    if (!selected) return;
    var text = '请解释所选地区的销售表现：' + selected.name + ' ' + selected.value +
      ' 万元（华东 120 万元、华南 80 万元、西部 50 万元，合计 ' + TOTAL + ' 万元，占 ' + pct(selected.value) +
      '）。请分析可能的原因，并给出可执行的改进建议。';
    var ok = false;
    try {
      if (window.dshWidget && typeof window.dshWidget.sendPrompt === 'function') {
        window.dshWidget.sendPrompt(text);
        ok = true;
      }
    } catch (e) { ok = false; }
    if (ok) {
      lastSent = selected.name;
      render();
    } else {
      statusEl.className = 'rsc-status is-err';
      statusEl.textContent = '追问未发送：当前环境不支持向模型发送消息。';
    }
  });

  render();
})();
</script>
