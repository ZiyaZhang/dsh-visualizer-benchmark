<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .bs-root{--cell:44px;font-family:inherit;color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-1);border:1px solid var(--dsw-alias-border-l1);border-radius:12px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;max-width:560px}
  .bs-head{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;min-width:0}
  .bs-title{font-size:.82rem;font-weight:600;color:var(--dsw-alias-label-secondary)}
  .bs-target{font-size:.8rem;font-variant-numeric:tabular-nums;background:var(--dsw-alias-bg-layer-2);border:1px solid var(--dsw-alias-border-l2);border-radius:999px;padding:2px 10px;white-space:nowrap}
  .bs-array{display:flex;justify-content:center;gap:5px;padding:2px 0 4px;overflow-x:auto}
  .bs-col{display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto}
  .bs-cell{width:var(--cell);height:var(--cell);border-radius:9px;background:var(--dsw-alias-bg-layer-2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:opacity .18s,background .18s,border-color .18s,transform .18s}
  .bs-val{font-size:.72rem;font-weight:600;line-height:1.1}
  .bs-idx{font-size:.6rem;color:var(--dsw-alias-label-tertiary);font-variant-numeric:tabular-nums;margin-top:1px}
  .bs-col.out .bs-cell{opacity:.28;border-style:dashed;border-color:var(--dsw-alias-border-l2)}
  .bs-col.active .bs-cell{border-color:var(--dsw-alias-border-l2)}
  .bs-col.mid .bs-cell{border-color:var(--dsw-alias-brand-primary);background:var(--dsw-alias-interactive-bg-active);transform:translateY(-2px)}
  .bs-col.found .bs-cell{border-color:var(--dsw-alias-brand-primary);background:var(--dsw-alias-button-primary-fill)}
  .bs-col.found .bs-val,.bs-col.found .bs-idx{color:var(--dsw-alias-label-primary-inverted)}
  .bs-ptr{height:1.05rem;font-size:.62rem;font-weight:700;line-height:1.05rem;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:1px}
  .bs-ptr span{background:var(--dsw-alias-bg-layer-2);border-radius:4px;padding:0 3px}
  .bs-ptr span.p-low,.bs-ptr span.p-high{color:var(--dsw-alias-label-secondary)}
  .bs-ptr span.p-mid{color:var(--dsw-alias-label-primary)}
  .bs-status{font-size:.82rem;line-height:1.5;background:var(--dsw-alias-bg-layer-2);border:1px solid var(--dsw-alias-border-l1);border-radius:9px;padding:8px 11px;font-variant-numeric:tabular-nums}
  .bs-status b{color:var(--dsw-alias-brand-primary)}
  .bs-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bs-count{font-size:.75rem;color:var(--dsw-alias-label-tertiary);font-variant-numeric:tabular-nums;margin-right:auto}
  .bs-btn{font:inherit;font-size:.8rem;padding:6px 14px;border-radius:8px;border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-primary);cursor:pointer}
  .bs-btn.primary{background:var(--dsw-alias-button-primary-fill);color:var(--dsw-alias-label-primary-inverted);border-color:transparent}
  .bs-btn:disabled{opacity:.45;cursor:not-allowed}
</style>
<div class="bs-root">
  <div class="bs-head">
    <div class="bs-title">二分查找 · 有序数组</div>
    <div class="bs-target">目标值 23</div>
  </div>
  <div class="bs-array" id="bs-array" role="img" aria-label="有序数组 2 5 8 12 16 23 38 56，索引 0 到 7"></div>
  <div class="bs-status" id="bs-status" aria-live="polite"></div>
  <div class="bs-foot">
    <div class="bs-count" id="bs-count">第 0 / 3 轮比较</div>
    <button class="bs-btn primary" id="bs-next">下一步</button>
    <button class="bs-btn" id="bs-reset">重置</button>
  </div>
</div>
<script>
(function(){
  var arr=[2,5,8,12,16,23,38,56];
  var steps=[
    {low:0,high:7,mid:null,found:false,msg:'初始区间 [0, 7]：在 8 个元素中找 <b>23</b>。点击“下一步”开始比较。'},
    {low:0,high:7,mid:3,found:false,msg:'mid = ⌊(0+7)/2⌋ = <b>3</b> → 值 12。12 &lt; 23，说明目标只在右半边 → 排除左半 [0, 3]。'},
    {low:4,high:7,mid:null,found:false,msg:'新区间 [4, 7]，只剩 4 个元素。再取中：mid = ⌊(4+7)/2⌋ = 5。'},
    {low:4,high:7,mid:5,found:true,msg:'mid = <b>5</b> → 值 23。23 == 23，命中！'},
    {low:4,high:7,mid:5,found:true,msg:'找到 23，位于索引 <b>5</b>，共比较 2 轮（不是 8 次）。若第 3 步是 23 &gt; mid 值，则继续把 low 移到 mid+1。'}
  ];
  var i=0;
  var arrayEl=document.getElementById('bs-array');
  var statusEl=document.getElementById('bs-status');
  var countEl=document.getElementById('bs-count');
  var nextBtn=document.getElementById('bs-next');
  var resetBtn=document.getElementById('bs-reset');
  var cols=arr.map(function(v,idx){
    var col=document.createElement('div');
    col.className='bs-col';
    var cell=document.createElement('div');
    cell.className='bs-cell';
    var val=document.createElement('div');
    val.className='bs-val';
    val.textContent=v;
    var ix=document.createElement('div');
    ix.className='bs-idx';
    ix.textContent=idx;
    cell.appendChild(val);cell.appendChild(ix);
    var ptr=document.createElement('div');
    ptr.className='bs-ptr';
    col.appendChild(cell);col.appendChild(ptr);
    arrayEl.appendChild(col);
    return {col:col,ptr:ptr};
  });
  function render(){
    var s=steps[i];
    cols.forEach(function(c,idx){
      c.col.classList.remove('out','active','mid','found');
      c.ptr.textContent='';
      var inRange=s.mid===null ? (idx>=s.low&&idx<=s.high) : (idx>=s.low&&idx<=s.high);
      if(!inRange) c.col.classList.add('out');
      else if(idx<s.low||idx>s.high) c.col.classList.add('out');
      else c.col.classList.add('active');
      if(i>=2 && idx<s.low) c.col.classList.add('out');
      if(i>=2 && idx>s.high) c.col.classList.add('out');
      if(s.mid===idx){
        c.ptr.textContent='';
        c.col.classList.add(s.found?'found':'mid');
      }
      var tags=[];
      if(idx===s.low) tags.push(['L','p-low']);
      if(idx===s.high) tags.push(['H','p-high']);
      if(s.mid===idx) tags.push([s.found?'✓':'M','p-mid']);
      tags.forEach(function(t){
        var sp=document.createElement('span');
        sp.className=t[1];
        sp.textContent=t[0];
        c.ptr.appendChild(sp);
      });
    });
    statusEl.innerHTML=s.msg;
    countEl.textContent='第 '+(i<=3?(s.mid===null?Math.max(i-1,0):Math.max(i-1,0)):2)+' / 3 轮比较';
    nextBtn.disabled=(i>=steps.length-1);
    nextBtn.textContent=(i>=steps.length-1)?'已完成':'下一步';
  }
  nextBtn.addEventListener('click',function(){ if(i<steps.length-1){i++;render();} });
  resetBtn.addEventListener('click',function(){ i=0; render(); });
  render();
})();
</script></body></html>
