<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-label="Sales bar chart: A equals 3, B equals 5">
  <title>Sales</title>
  <desc>Static bar chart with two bars: A = 3 and B = 5.</desc>

  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>

  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Sales</text>

  <!-- gridlines and y-axis ticks -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="60.0" x2="440" y2="60.0"/>
    <line x1="80" y1="98.3" x2="440" y2="98.3"/>
    <line x1="80" y1="136.7" x2="440" y2="136.7"/>
    <line x1="80" y1="175.0" x2="440" y2="175.0"/>
    <line x1="80" y1="213.3" x2="440" y2="213.3"/>
    <line x1="80" y1="251.7" x2="440" y2="251.7"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">
    <text x="68" y="64.5">6</text>
    <text x="68" y="102.8">5</text>
    <text x="68" y="141.2">4</text>
    <text x="68" y="179.5">3</text>
    <text x="68" y="217.8">2</text>
    <text x="68" y="256.2">1</text>
    <text x="68" y="294.5">0</text>
  </g>

  <!-- axes -->
  <line x1="80" y1="290" x2="440" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="290" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- bars: A = 3, B = 5 -->
  <rect x="125" y="175.0" width="90" height="115.0" fill="#4f7cff" rx="3"/>
  <rect x="305" y="98.3" width="90" height="191.7" fill="#22b8a6" rx="3"/>

  <!-- value labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">
    <text x="170" y="165">3</text>
    <text x="350" y="88">5</text>
  </g>

  <!-- category labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#374151">
    <text x="170" y="314">A</text>
    <text x="350" y="314">B</text>
  </g>
</svg>
