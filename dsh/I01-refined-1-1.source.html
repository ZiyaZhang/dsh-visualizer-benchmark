<div class="bs" id="bs-demo">
  <style>
    #bs-demo{
      --low:#2563eb; --high:#9333ea; --mid:var(--dsw-alias-brand-primary,#6366f1); --ok:#16a34a;
      --line:var(--dsw-alias-border-l1,#d9dce4);
      --line2:var(--dsw-alias-border-l2,#e7e9ef);
      --fg:var(--dsw-alias-label-primary,#171a20);
      --fg2:var(--dsw-alias-label-secondary,#5a6272);
      --fg3:var(--dsw-alias-label-tertiary,#8c95a6);
      --layer:var(--dsw-alias-bg-layer-1,transparent);
      --layer2:var(--dsw-alias-bg-layer-2,#f4f6fa);
      box-sizing:border-box;
      container-type:inline-size;
      display:flex;flex-direction:column;gap:12px;
      padding:14px;border:1px solid var(--line);border-radius:14px;
      background:var(--layer);color:var(--fg);
      font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      font-size:14px;line-height:1.5;
    }
    #bs-demo *{box-sizing:border-box}
    #bs-demo .bs-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
    #bs-demo .bs-title{margin:0;font-size:14.5px;font-weight:650}
    #bs-demo .bs-title b{color:var(--mid)}
    #bs-demo .bs-meta{display:flex;flex-wrap:wrap;gap:6px}
    #bs-demo .bs-chip{font-size:11.5px;color:var(--fg2);background:var(--layer2);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
    #bs-demo .bs-chip b{color:var(--fg);font-weight:650}

    #bs-demo .bs-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
    #bs-demo .bs-cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
    #bs-demo .bs-ptrs{display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:2px;width:100%;min-height:36px;padding-bottom:2px}
    #bs-demo .p{font-size:10px;font-weight:700;line-height:1;padding:2.5px 4px;border-radius:5px;color:#fff;letter-spacing:.02em}
    #bs-demo .p-low{background:var(--low)}
    #bs-demo .p-mid{background:var(--mid)}
    #bs-demo .p-high{background:var(--high)}
    #bs-demo .bs-box{position:relative;width:100%;aspect-ratio:1/0.9;display:grid;place-items:center;
      border:1.5px solid var(--line);border-radius:10px;background:var(--layer2);
      transition:background .2s,border-color .2s,opacity .2s,box-shadow .2s,transform .2s}
    #bs-demo .bs-val{font-size:clamp(13px,3.2cqw,18px);font-weight:650;font-variant-numeric:tabular-nums}
    #bs-demo .bs-idx{font-size:10px;color:var(--fg3);font-variant-numeric:tabular-nums}
    #bs-demo .bs-cell.cand .bs-box{border-color:color-mix(in srgb,var(--mid) 42%,var(--line));background:color-mix(in srgb,var(--mid) 8%,var(--layer2))}
    #bs-demo .bs-cell.excluded .bs-box{opacity:.4;border-style:dashed;background:transparent}
    #bs-demo .bs-cell.excluded .bs-val{text-decoration:line-through;text-decoration-thickness:1.5px}
    #bs-demo .bs-cell.mid .bs-box{border:2px solid var(--mid);background:color-mix(in srgb,var(--mid) 16%,var(--layer2));box-shadow:0 0 0 3px color-mix(in srgb,var(--mid) 20%,transparent);transform:translateY(-1px)}
    #bs-demo .bs-cell.found .bs-box{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--layer2));box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 24%,transparent)}
    #bs-demo .bs-cell.found .bs-box::after{content:"✓";position:absolute;top:-7px;right:-6px;width:17px;height:17px;border-radius:50%;
      background:var(--ok);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}

    #bs-demo .bs-bar-block{display:flex;flex-direction:column;gap:4px}
    #bs-demo .bs-bar-cap{font-size:11px;color:var(--fg3)}
    #bs-demo .bs-bar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;height:9px}
    #bs-demo .bs-seg{border-radius:4px;background:var(--line2);transition:background .2s,box-shadow .2s}
    #bs-demo .bs-seg.cand{background:color-mix(in srgb,var(--mid) 62%,transparent)}
    #bs-demo .bs-seg.excl{background:repeating-linear-gradient(115deg,var(--line) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--line2)}
    #bs-demo .bs-seg.is-mid{box-shadow:0 0 0 2px color-mix(in srgb,var(--mid) 45%,transparent)}

    #bs-demo .bs-note{margin:0;min-height:44px;padding:9px 11px;border-radius:10px;background:var(--layer2);
      border:1px solid var(--line2);color:var(--fg2);font-size:13.5px}
    #bs-demo .bs-note b{color:var(--fg);font-variant-numeric:tabular-nums}
    #bs-demo .bs-note.ok{background:color-mix(in srgb,var(--ok) 12%,var(--layer2));border-color:color-mix(in srgb,var(--ok) 38%,var(--line2));color:var(--fg)}

    #bs-demo .bs-actions{display:flex;flex-wrap:wrap;gap:8px}
    #bs-demo .bs-btn{font:inherit;font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer;
      border:1px solid var(--line);background:var(--layer);color:var(--fg);transition:background .15s,border-color .15s}
    #bs-demo .bs-btn:hover{background:var(--dsw-alias-interactive-bg-hover,var(--layer2))}
    #bs-demo .bs-btn.bs-primary{background:var(--dsw-alias-button-primary-fill,var(--mid));color:var(--dsw-alias-label-primary-inverted,#fff);border-color:transparent}
    #bs-demo .bs-btn:disabled{opacity:.45;cursor:not-allowed}
    #bs-demo .bs-btn:focus-visible{outline:2px solid var(--mid);outline-offset:2px}

    #bs-demo .bs-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--fg2)}
    #bs-demo .bs-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
    #bs-demo .sw-cand{background:color-mix(in srgb,var(--mid) 30%,var(--layer2));border:1px solid color-mix(in srgb,var(--mid) 45%,var(--line))}
    #bs-demo .sw-mid{background:var(--mid)}
    #bs-demo .sw-excl{background:repeating-linear-gradient(115deg,var(--line) 0 3px,transparent 3px 6px);border:1px solid var(--line2)}
    #bs-demo .sw-ok{background:var(--ok)}
    #bs-demo .bs-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
    @media (prefers-reduced-motion:reduce){#bs-demo *{transition:none!important}}
  </style>

  <div class="bs-head">
    <p class="bs-title">二分查找：在 8 个有序数中找 <b>23</b></p>
    <div class="bs-meta">
      <span class="bs-chip">第 <b class="bs-stepNo">1</b> / <b class="bs-stepTotal">3</b> 步</span>
      <span class="bs-chip">比较 <b class="bs-cmp">0</b> 次</span>
      <span class="bs-chip">候选区间 <b class="bs-range">[0, 7]</b></span>
    </div>
  </div>

  <div class="bs-grid" role="img" aria-label="有序数组，等待第一步"></div>

  <div class="bs-bar-block">
    <span class="bs-bar-cap">下一步候选区间（斜纹＝已排除）</span>
    <div class="bs-bar" aria-hidden="true"></div>
  </div>

  <p class="bs-note"></p>

  <div class="bs-actions">
    <button class="bs-btn bs-primary bs-next" type="button">下一步</button>
    <button class="bs-btn bs-reset" type="button">重置</button>
  </div>

  <div class="bs-legend">
    <span><i class="sw-cand"></i>候选元素</span>
    <span><i class="sw-mid"></i>本轮 mid（中点）</span>
    <span><i class="sw-excl"></i>已排除</span>
    <span><i class="sw-ok"></i>命中</span>
  </div>

  <p class="bs-sr" aria-live="polite"></p>
</div>
<script>
(function(){
  var root = document.getElementById('bs-demo');
  if (!root) return;

  var ARR = [2,5,8,12,16,23,38,56];
  var TARGET = 23;

  function buildSteps(a, t){
    var out=[], low=0, high=a.length-1, excluded=[];
    out.push({kind:'init', low:low, high:high, mid:null, excluded:[], live:[low,high], comparisons:0});
    while (low <= high){
      var mid = Math.floor((low + high) / 2);
      var v = a[mid];
      var cmp = out[out.length-1].comparisons + 1;
      var ex = excluded.slice();
      if (v === t){
        out.push({kind:'found', low:low, high:high, mid:mid, excluded:ex, live:[mid,mid], comparisons:cmp});
        return out;
      }
      if (v < t){
        for (var i=low; i<=mid; i++) ex.push(i);
        out.push({kind:'right', low:low, high:high, mid:mid, excluded:ex, live:[mid+1,high], comparisons:cmp});
        low = mid + 1;
      } else {
        for (var j=mid; j<=high; j++) ex.push(j);
        out.push({kind:'left', low:low, high:high, mid:mid, excluded:ex, live:[low,mid-1], comparisons:cmp});
        high = mid - 1;
      }
      excluded = ex;
    }
    out.push({kind:'notfound', low:low, high:high, mid:null, excluded:excluded, live:[low,high], comparisons:cmp});
    return out;
  }

  var steps = buildSteps(ARR, TARGET);
  var pos = 0;

  var grid    = root.querySelector('.bs-grid');
  var bar     = root.querySelector('.bs-bar');
  var note    = root.querySelector('.bs-note');
  var nextBtn = root.querySelector('.bs-next');
  var resetBtn= root.querySelector('.bs-reset');
  var stepNo  = root.querySelector('.bs-stepNo');
  var stepTot = root.querySelector('.bs-stepTotal');
  var cmpEl   = root.querySelector('.bs-cmp');
  var rangeEl = root.querySelector('.bs-range');
  var live    = root.querySelector('.bs-sr');

  var cells = ARR.map(function(v,i){
    var cell=document.createElement('div'); cell.className='bs-cell';
    var ptrs=document.createElement('div'); ptrs.className='bs-ptrs';
    var box =document.createElement('div'); box.className='bs-box';
    var val =document.createElement('span'); val.className='bs-val'; val.textContent=v;
    var idx =document.createElement('div'); idx.className='bs-idx'; idx.textContent=i;
    box.appendChild(val); cell.appendChild(ptrs); cell.appendChild(box); cell.appendChild(idx);
    grid.appendChild(cell);
    return {cell:cell, ptrs:ptrs};
  });

  var segs = ARR.map(function(v,i){
    var s=document.createElement('div'); s.className='bs-seg'; s.title='下标 '+i+'：'+v;
    bar.appendChild(s); return s;
  });

  function badge(kind){
    var b=document.createElement('span');
    b.className='p p-'+kind;
    b.textContent=kind;
    return b;
  }

  function noteFor(s){
    if (s.kind === 'init'){
      return '初始区间 ['+s.low+', '+s.high+']。二分查找总是先看中点：一次比较就能排除一半的元素。';
    }
    var v = ARR[s.mid];
    if (s.kind === 'found'){
      return 'mid = \u230a('+s.low+'+'+s.high+')\u00f72\u230b = <b>'+s.mid+'</b>，arr['+s.mid+'] = <b>'+v+'</b> = '+TARGET+' \u2192 <b>命中！</b>共 <b>'+s.comparisons+'</b> 次比较；逐个查找需要 6 次。';
    }
    var cmpTxt = (s.kind === 'right') ? (v+' &lt; '+TARGET) : (v+' &gt; '+TARGET);
    var dir    = (s.kind === 'right') ? '右' : '左';
    var excl   = (s.kind === 'right') ? ('['+s.low+', '+s.mid+']') : ('['+s.mid+', '+s.high+']');
    return 'mid = \u230a('+s.low+'+'+s.high+')\u00f72\u230b = <b>'+s.mid+'</b>，arr['+s.mid+'] = <b>'+v+'</b>；'+cmpTxt+' \u2192 目标在'+dir+'半边：排除 '+excl+'，新区间 ['+s.live[0]+', '+s.live[1]+']。';
  }

  function render(){
    var s = steps[pos];
    var excl = s.excluded || [];
    var found = (s.kind === 'found');

    cells.forEach(function(c, i){
      c.ptrs.textContent = '';
      var showMid = (s.mid !== null) && (i === s.mid);
      var showLow = (s.kind !== 'init') && (i === s.low);
      var showHigh= (s.kind !== 'init') && (i === s.high);
      if (s.kind === 'init'){ showLow = (i === s.low); showHigh = (i === s.high); }
      if (showLow)  c.ptrs.appendChild(badge('low'));
      if (showMid)  c.ptrs.appendChild(badge('mid'));
      if (showHigh) c.ptrs.appendChild(badge('high'));

      var isExcl = excl.indexOf(i) !== -1;
      var inLive = (i >= s.live[0]) && (i <= s.live[1]);
      c.cell.classList.toggle('mid', showMid);
      c.cell.classList.toggle('found', found && showMid);
      c.cell.classList.toggle('excluded', isExcl && !showMid);
      c.cell.classList.toggle('cand', inLive && !isExcl && !showMid);
    });

    segs.forEach(function(seg, i){
      var isExcl = excl.indexOf(i) !== -1;
      var inLive = (i >= s.live[0]) && (i <= s.live[1]);
      seg.className = 'bs-seg' + (isExcl ? ' excl' : (inLive ? ' cand' : '')) + ((s.mid === i) ? ' is-mid' : '');
    });

    stepNo.textContent = pos + 1;
    stepTot.textContent = steps.length;
    cmpEl.textContent = s.comparisons;
    rangeEl.textContent = '[' + s.live[0] + ', ' + s.live[1] + ']';

    note.innerHTML = noteFor(s);
    note.classList.toggle('ok', found);

    nextBtn.disabled = (pos >= steps.length - 1);
    nextBtn.textContent = nextBtn.disabled ? '已完成' : '下一步';

    grid.setAttribute('aria-label', '数组 ' + ARR.join(', ') +
      '；当前候选区间下标 ' + s.live[0] + ' 到 ' + s.live[1] +
      (s.mid !== null ? '，本轮中点下标 ' + s.mid + ' 值为 ' + ARR[s.mid] : ''));
    live.textContent = '第 ' + (pos + 1) + ' 步，共 ' + steps.length + ' 步。' + note.textContent;
  }

  nextBtn.addEventListener('click', function(){
    if (pos < steps.length - 1){ pos += 1; render(); }
  });
  resetBtn.addEventListener('click', function(){
    pos = 0; render();
  });

  render();
})();
</script>
