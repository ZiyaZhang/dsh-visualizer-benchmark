<div class="bs-wrap">
  <style>
    .bs-wrap{--cell:22px;--bs-mut:#8a93a6;--bs-mut-dim:#b9c0ce;--bs-line:rgba(0,0,0,.08);--bs-rng:rgba(0,0,0,.045);
      font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--dsw-alias-label-primary);
      background:var(--dsw-alias-bg-base);border:1px solid var(--dsw-alias-border-l1);border-radius:14px;padding:14px 16px;max-width:860px}
    .bs-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 10px;margin-bottom:10px}
    .bs-title{font-size:15px;font-weight:650}
    .bs-target{font-size:13px;color:var(--dsw-alias-label-secondary)}
    .bs-target b{font-variant-numeric:tabular-nums;color:var(--dsw-alias-brand-primary)}
    .bs-stage{overflow-x:auto;min-width:0}
    .bs-svg{display:block;width:100%;min-width:620px;height:auto}
    .bs-cell{fill:var(--dsw-alias-bg-layer-1);transition:fill .18s ease,opacity .25s ease}
    .bs-cell.excluded{fill:var(--bs-rng);opacity:.6}
    .bs-cell.mid{fill:color-mix(in srgb,var(--dsw-alias-brand-primary) 24%,var(--dsw-alias-bg-layer-1))}
    .bs-cell.found{fill:color-mix(in srgb,var(--dsw-alias-brand-primary) 34%,var(--dsw-alias-bg-layer-1))}
    .bs-rect{fill:none;stroke:var(--dsw-alias-border-l1)}
    .bs-range{fill:var(--bs-rng);transition:opacity .25s ease}
    .bs-guide{stroke:var(--dsw-alias-border-l2);stroke-width:1;stroke-dasharray:2 3}
    .bs-val{font:650 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--dsw-alias-label-primary);text-anchor:middle}
    .bs-idx{font:11px/1 ui-monospace,Menlo,monospace;fill:var(--dsw-alias-label-tertiary);text-anchor:middle;font-variant-numeric:tabular-nums}
    .bs-p{font:700 12.5px/1 ui-monospace,Menlo,monospace;text-anchor:middle;font-variant-numeric:tabular-nums}
    .bs-ptr{transition:transform .28s cubic-bezier(.4,0,.2,1)}
    .bs-note{margin-top:8px;font-size:13px;min-height:20px;color:var(--dsw-alias-label-secondary)}
    .bs-note b{color:var(--dsw-alias-label-primary)}
    .bs-chip{display:inline-block;font:650 12.5px/1.6 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;
      background:var(--dsw-alias-bg-layer-2);border:1px solid var(--dsw-alias-border-l1);border-radius:7px;padding:2px 8px;margin:0 2px 4px 0}
    .bs-cmp{margin-left:6px;color:var(--dsw-alias-state-error-primary)}
    .bs-hint{margin-top:12px;font-size:12.5px;color:var(--dsw-alias-label-secondary);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
    .bs-kv{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
    .bs-sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--dsw-alias-border-l2)}
    .bs-sw.a{background:color-mix(in srgb,var(--dsw-alias-brand-primary) 40%,var(--dsw-alias-bg-layer-1))}
    .bs-sw.b{background:var(--bs-rng)}
    .bs-read{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .bs-btns{display:flex;gap:10px;margin-top:12px}
    .bs-btns button{border-radius:9px;padding:7px 16px;font-size:13.5px;cursor:pointer}
    .bs-btns button:disabled{cursor:default;opacity:.45}
  </style>

  <div class="bs-head">
    <div class="bs-title">二分查找 · 每轮排除一半</div>
    <div class="bs-target">有序数组&nbsp;[2, 5, 8, 12, 16, 23, 38, 56]&nbsp;→ 目标 <b>23</b></div>
  </div>

  <div class="bs-stage" id="bs-stage">
    <svg class="bs-svg" viewBox="0 0 800 152" role="img" aria-labelledby="bs-title-el bs-desc-el">
      <title id="bs-title-el">二分查找过程示意</title>
      <desc id="bs-desc-el">在升序数组 2、5、8、12、16、23、38、56 中查找 23，逐轮显示 low、mid、high 指针与被排除的区间。</desc>
      <g id="bs-array"></g>
    </svg>
  </div>

  <div class="bs-note" id="bs-note"></div>
  <p class="bs-read" aria-live="polite" id="bs-live"></p>
  <div class="bs-hint">
    <span class="bs-kv"><span class="bs-sw a"></span>本轮 mid</span>
    <span class="bs-kv"><span class="bs-sw b"></span>已排除（不可能含 23）</span>
    <span class="bs-kv">共 3 轮 · 3 次比较即可锁定</span>
  </div>
  <div class="bs-btns">
    <button type="button" id="bs-next">下一步</button>
    <button type="button" id="bs-reset">重置</button>
  </div>
</div>

<script>
(function(){
  var A=[2,5,8,12,16,23,38,56], TARGET=23, W=800;
  var CW=82, GAP=12, X0=22, TOP=64, CH=52, N=A.length;
  var SVGNS="http://www.w3.org/2000/svg";
  var reduced=false;
  try{ reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

  var stage=document.getElementById("bs-stage");
  var live=document.getElementById("bs-live");
  var noteEl=document.getElementById("bs-note");
  var nextBtn=document.getElementById("bs-next");
  var resetBtn=document.getElementById("bs-reset");

  var C=[], val=[];

  (function build(){
    var arr=document.getElementById("bs-array");
    function el(t,a){ var e=document.createElementNS(SVGNS,t); for(var k in a) e.setAttribute(k,a[k]); return e; }
    for(var i=0;i<N;i++){
      var x=X0+i*(CW+GAP), cxp=x+CW/2;
      var g=el("g",{});
      // 排除区底色
      g.appendChild(el("rect",{class:"bs-range",x:x,y:TOP,width:CW,height:CH,rx:10,opacity:0}));
      // 单元格
      g.appendChild(el("rect",{class:"bs-cell",x:x,y:TOP,width:CW,height:CH,rx:10,"data-i":i}));
      g.appendChild(el("rect",{class:"bs-rect",x:x,y:TOP,width:CW,height:CH,rx:10}));
      var t=el("text",{class:"bs-val",x:cxp,y:TOP+CH/2+1,"dominant-baseline":"middle"}); t.textContent=A[i]; g.appendChild(t);
      var ix=el("text",{class:"bs-idx",x:cxp,y:TOP+CH+18}); ix.textContent=i; g.appendChild(ix);
      // 指针
      var gd=el("line",{class:"bs-guide",x1:cxp,x2:cxp,y1:22,y2:TOP-2,opacity:0}); g.appendChild(gd);
      var pg=el("g",{class:"bs-ptr",opacity:0});
      pg.appendChild(el("line",{x1:cxp,x2:cxp,y1:22,y2:31,stroke:"currentColor","stroke-width":1.5}));
      pg.appendChild(el("path",{d:"M "+(cxp-5)+" 31 L "+(cxp+5)+" 31 L "+cxp+" 38 Z",fill:"currentColor"}));
      var tx=el("text",{class:"bs-p",x:cxp,y:17,fill:"currentColor"}); tx.textContent="low";
      pg.appendChild(tx); g.appendChild(pg);
      arr.appendChild(g);
      C.push({fill:g.querySelector(".bs-cell"),range:g.querySelector(".bs-range"),guide:gd,ptr:pg,label:tx,val:t,idx:ix});
    }
    val=[{low:0,high:N-1,s:-1,cmp:-1,msg:"初始区间是整条数组，low=0，high=7。取中间位置准备比较。"}];
    function mk(l,h,s,cmp,msg){ return {low:l,high:h,s:s,cmp:cmp,msg:msg}; }
    var M=1;
    while(val[val.length-1].s<0){
      var st=val[val.length-1], l=st.low, h=st.high, m=(l+h)>>1;
      if(A[m]===TARGET){ val.push(mk(l,h,m,0,"第"+M+"轮：mid 落在下标 "+m+"，A["+m+"] = "+A[m]+"，正好等于目标 23 —— 命中，查找结束。")); break; }
      if(A[m]<TARGET) val.push(mk(m+1,h,m,-1,"第"+M+"轮：mid 在下标 "+m+"，A["+m+"] = "+A[m]+" < 23，目标只可能在右边 —— 排除左半区间，low 提到 mid+1 = "+(m+1)+"。"));
      else val.push(mk(l,m-1,m,1,"第"+M+"轮：mid 在下标 "+m+"，A["+m+"] = "+A[m]+" > 23，目标只可能在左边 —— 排除右半区间，high 降到 mid-1 = "+(m-1)+"。"));
      M++;
    }
  })();

  var idx=0;

  function setPtr(c,key,p){
    if(!p){ c.ptr.setAttribute("opacity",0); c.guide.setAttribute("opacity",0); return; }
    var x=X0+p*(CW+GAP)+CW/2;
    c.ptr.setAttribute("transform","translate("+(x-CW/2)+",0)");
    c.ptr.setAttribute("opacity",1);
    c.ptr.style.color = key==="mid" ? "var(--dsw-alias-brand-primary)" : "var(--dsw-alias-label-primary)";
    c.label.textContent=key;
    c.guide.setAttribute("transform","translate("+(x-CW/2)+",0)");
    c.guide.setAttribute("opacity",1);
  }

  function render(){
    var st=val[idx];
    for(var i=0;i<N;i++){
      var c=C[i], inRange = i>=st.low && i<=st.high;
      c.fill.setAttribute("class","bs-cell"+(inRange?"":" excluded")+(st.s>=0&&i===st.s?(st.cmp===0?" found":" mid"):""));
      c.range.setAttribute("opacity", inRange?0:1);
      c.val.style.opacity = inRange?1:.55;
      c.idx.style.opacity = inRange?1:.55;
      var keys=[];
      if(i===st.low) keys.push("low");
      if(i===st.high) keys.push("high");
      if(i===st.s) keys.push("mid");
      var p = keys.length? i : null;
      var key = keys.length===1 ? keys[0] : keys[keys.length-1];
      setPtr(c,key,p);
      if(!p){ c.ptr.setAttribute("opacity",0); c.guide.setAttribute("opacity",0); }
    }
    var html='<span class="bs-chip">第 '+idx+' / '+(val.length-1)+' 轮</span>'
      +'<span class="bs-chip">low = '+st.low+'</span>'
      +'<span class="bs-chip">high = '+st.high+'</span>'
      +(st.s>=0?'<span class="bs-chip">mid = '+st.s+'（A['+st.s+'] = '+A[st.s]+'）</span>':'')
      +(st.cmp>0?'<span class="bs-cmp">A[mid] &gt; 23，往左找</span>':st.cmp<0?'<span class="bs-cmp">A[mid] &lt; 23，往右找</span>':st.cmp===0?'<span class="bs-cmp" style="color:var(--dsw-alias-brand-primary)">A[mid] = 23，命中</span>':'');
    html+='<div style="margin-top:2px">'+st.msg+'</div>';
    noteEl.innerHTML=html;
    if(live) live.textContent=st.msg;
    nextBtn.disabled = idx>=val.length-1;
    nextBtn.textContent = idx>=val.length-1 ? "已结束" : "下一步";
    if(idx>0) stage.scrollLeft = Math.max(0,(X0+st.low*(CW+GAP))-60);
  }

  function go(d){ if(idx+d>=0 && idx+d<val.length) idx+=d; render(); }
  nextBtn.addEventListener("click",function(){ go(1); });
  resetBtn.addEventListener("click",function(){ idx=0; stage.scrollLeft=0; render(); });
  render();
})();
</script>
</div>
