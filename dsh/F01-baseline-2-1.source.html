<style>
.rsc{--rsc-bar:var(--dsw-alias-brand-primary,#2563eb);box-sizing:border-box;font:inherit;color:var(--dsw-alias-label-primary,#111827);background:var(--dsw-alias-bg-layer-1,#fff);border:1px solid var(--dsw-alias-border-l1,#e5e7eb);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-width:560px}
.rsc *,.rsc *::before{box-sizing:border-box}
.rsc-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rsc-title{margin:0;font-size:14px;font-weight:600}
.rsc-total{font-size:12px;color:var(--dsw-alias-label-secondary,#6b7280);font-variant-numeric:tabular-nums}
.rsc-rows{display:flex;flex-direction:column;gap:6px}
.rsc-row{display:grid;grid-template-columns:3.4em minmax(0,1fr) 5.4em 2.8em;align-items:center;gap:8px;width:100%;padding:7px 9px;border:1px solid transparent;border-radius:9px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background-color .15s ease,border-color .15s ease}
.rsc-row:hover{background:var(--dsw-alias-interactive-bg-hover,rgba(37,99,235,.07))}
.rsc-row[aria-pressed="true"]{background:var(--dsw-alias-interactive-bg-active,rgba(37,99,235,.12));border-color:var(--rsc-bar)}
.rsc-name{font-size:13px;font-weight:600;white-space:nowrap}
.rsc-track{height:14px;border-radius:7px;background:var(--dsw-alias-bg-layer-2,#f3f4f6);overflow:hidden;min-width:0}
.rsc-bar{display:block;height:100%;border-radius:7px;background:var(--rsc-bar);opacity:.5;transition:opacity .15s ease}
.rsc-row[aria-pressed="true"] .rsc-bar{opacity:1}
.rsc-val{font-size:13px;font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rsc-pct{font-size:12px;color:var(--dsw-alias-label-tertiary,#9ca3af);text-align:right;font-variant-numeric:tabular-nums}
.rsc-detail{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:9px;background:var(--dsw-alias-bg-layer-2,#f3f4f6);font-size:13px}
.rsc-detail b{font-variant-numeric:tabular-nums}
.rsc-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rsc-explain{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid transparent;background:var(--dsw-alias-button-primary-fill,#2563eb);color:var(--dsw-alias-label-primary-inverted,#fff);cursor:pointer}
.rsc-explain:disabled{opacity:.45;cursor:not-allowed}
.rsc-hint{font-size:12px;color:var(--dsw-alias-label-tertiary,#9ca3af)}
@media (prefers-reduced-motion: reduce){.rsc-row,.rsc-bar{transition:none}}
@media (max-width:420px){.rsc-row{grid-template-columns:3.2em minmax(0,1fr) 5em}.rsc-pct{display:none}}
</style>

<div class="rsc" id="rscRoot">
  <div class="rsc-head">
    <h3 class="rsc-title">地区销售对比</h3>
    <span class="rsc-total">合计 250 万元 · 按销售额排序</span>
  </div>

  <div class="rsc-rows" role="group" aria-label="点击地区进行本地选中（不会发送消息）">
    <button type="button" class="rsc-row" data-region="华东" data-value="120" data-pct="48" aria-pressed="false">
      <span class="rsc-name">华东</span>
      <span class="rsc-track"><span class="rsc-bar" style="width:100%"></span></span>
      <span class="rsc-val">120 万元</span>
      <span class="rsc-pct">48%</span>
    </button>
    <button type="button" class="rsc-row" data-region="华南" data-value="80" data-pct="32" aria-pressed="false">
      <span class="rsc-name">华南</span>
      <span class="rsc-track"><span class="rsc-bar" style="width:66.7%"></span></span>
      <span class="rsc-val">80 万元</span>
      <span class="rsc-pct">32%</span>
    </button>
    <button type="button" class="rsc-row" data-region="西部" data-value="50" data-pct="20" aria-pressed="false">
      <span class="rsc-name">西部</span>
      <span class="rsc-track"><span class="rsc-bar" style="width:41.7%"></span></span>
      <span class="rsc-val">50 万元</span>
      <span class="rsc-pct">20%</span>
    </button>
  </div>

  <div class="rsc-detail" aria-live="polite">
    <span class="rsc-hint">当前选择</span>
    <span class="rsc-detail-value">未选择（点击上方任一地区）</span>
  </div>

  <div class="rsc-actions">
    <button type="button" class="rsc-explain" id="rscExplain" disabled>解释所选地区</button>
    <span class="rsc-hint" id="rscStatus">选中地区只在本图内生效；点“解释所选地区”才会向你追问。</span>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById('rscRoot');
  if (!root) return;
  var rows = [].slice.call(root.querySelectorAll('.rsc-row'));
  var detailValue = root.querySelector('.rsc-detail-value');
  var explain = root.getElementById ? root.getElementById('rscExplain') : document.getElementById('rscExplain');
  var status = document.getElementById('rscStatus');
  var selected = null;

  function render() {
    rows.forEach(function (row) {
      var on = selected && row.dataset.region === selected.region;
      row.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (selected) {
      detailValue.innerHTML = '<b>' + selected.region + '</b> · <b>' + selected.value + ' 万元</b> · 占比 ' + selected.pct + '%';
      explain.disabled = false;
    } else {
      detailValue.textContent = '未选择（点击上方任一地区）';
      explain.disabled = true;
    }
  }

  function resetSendState() {
    status.textContent = '选中地区只在本图内生效；点“解释所选地区”才会向你追问。';
  }

  rows.forEach(function (row) {
    row.addEventListener('click', function () {
      var r = row.dataset.region;
      // 纯本地选中：再次点击同一地区可取消选择，不发送任何消息
      selected = (selected && selected.region === r) ? null : {
        region: r,
        value: row.dataset.value,
        pct: row.dataset.pct
      };
      resetSendState();
      render();
    });
  });

  explain.addEventListener('click', function () {
    if (!selected) return;
    var text = '请解释所选地区：' + selected.region + '（销售额 ' + selected.value + ' 万元，占全部 250 万元的 ' + selected.pct + '%）。请说明可能的原因和值得关注的点。';
    var sent = false;
    try {
      if (window.dshWidget && typeof window.dshWidget.sendPrompt === 'function') {
        window.dshWidget.sendPrompt(text);
        sent = true;
      }
    } catch (e) {
      sent = false;
    }
    status.textContent = sent
      ? '已发送追问：' + selected.region + ' · ' + selected.value + ' 万元 — 等待回复。'
      : '无法发送追问，请重试。';
  });

  render();
})();
</script>
