<style>
.bs-card{
  --bs-mid: var(--dsw-alias-brand-primary, #4f46e5);
  --bs-low: #0e7490;
  --bs-high: #b45309;
  --bs-ok: #15803d;
  container-type: inline-size;
  display: grid;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--dsw-alias-border-l1, #e5e7eb);
  border-radius: 14px;
  background: var(--dsw-alias-bg-layer-1, #ffffff);
  color: var(--dsw-alias-label-primary, #111827);
  font-size: 14px;
  line-height: 1.5;
}
.bs-card *{ box-sizing: border-box; }
.bs-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
.bs-title{ font-weight:700; font-size: 16px; font-size: clamp(14px, 3cqw, 17px); }
.bs-target{ color: var(--bs-mid); }
.bs-sub{ font-size: 12px; font-size: clamp(11px, 2.1cqw, 13px); color: var(--dsw-alias-label-secondary, #4b5563); margin-top:2px; }
.bs-round{ font-size: 12px; font-size: clamp(11px, 2.1cqw, 13px); font-weight:600; color: var(--dsw-alias-label-secondary,#4b5563);
  background: var(--dsw-alias-bg-layer-2,#f3f4f6); border-radius:999px; padding:3px 10px; white-space:nowrap; }
.bs-grid{ display:grid; column-gap:5px; row-gap:3px; align-items:end; }
.bs-band{ grid-row:1; height:20px; display:flex; align-items:center; justify-content:center; border-radius:8px;
  font-size: 11px; font-size: clamp(9px,1.8cqw,12px); font-variant-numeric: tabular-nums;
  color: var(--dsw-alias-label-secondary,#4b5563);
  background: var(--dsw-alias-bg-layer-2,#eef2ff);
  background: color-mix(in srgb, var(--bs-mid) 14%, transparent);
  border:1px solid var(--dsw-alias-border-l1,#c7d2fe);
  border-color: color-mix(in srgb, var(--bs-mid) 38%, transparent);
  transition: background .25s ease, border-color .25s ease;
}
.bs-band.done{
  background: color-mix(in srgb, var(--bs-ok) 16%, transparent);
  border-color: color-mix(in srgb, var(--bs-ok) 45%, transparent);
}
.bs-ptr, .bs-ptr-mid{ display:flex; justify-content:center; align-items:flex-end; gap:3px; flex-wrap:wrap; min-height:21px; }
.bs-ptr-mid{ align-items:flex-start; }
.bs-cellbox{ position:relative; height:44px; height: clamp(34px, 8cqw, 46px); display:flex; align-items:center; justify-content:center;
  border-radius:9px; font-weight:700; font-variant-numeric: tabular-nums;
  font-size: 15px; font-size: clamp(12px,2.7cqw,17px);
  background: var(--dsw-alias-bg-layer-2,#f3f4f6);
  border:1.5px solid var(--dsw-alias-border-l1,#e5e7eb);
  transition: background .25s ease, border-color .25s ease, opacity .25s ease, color .25s ease;
}
.bs-cellbox.in-range{
  background: color-mix(in srgb, var(--bs-mid) 8%, transparent);
  border-color: color-mix(in srgb, var(--bs-mid) 32%, transparent);
}
.bs-cellbox.excluded{ opacity:.34; border-style:dashed; background: var(--dsw-alias-bg-layer-2,#f3f4f6); }
.bs-cellbox.mid{ border:2px solid var(--bs-mid); background: color-mix(in srgb, var(--bs-mid) 20%, transparent); }
.bs-cellbox.found{ border:2px solid var(--bs-ok); background: color-mix(in srgb, var(--bs-ok) 22%, transparent); }
.bs-cellbox.found::after{ content:"✓"; position:absolute; top:-7px; right:-6px; width:17px; height:17px; border-radius:50%;
  background: var(--bs-ok); color:#fff; font-size:11px; line-height:17px; text-align:center; }
.bs-idx{ text-align:center; font-size: 10px; font-size: clamp(9px,1.8cqw,11px); color: var(--dsw-alias-label-tertiary,#9ca3af); font-variant-numeric: tabular-nums; }
.bs-chip{ display:inline-flex; align-items:center; border-radius:999px; padding:1px 6px; font-weight:700; line-height:1.5;
  white-space:nowrap; border:1px solid transparent; font-size: 10px; font-size: clamp(9px,1.8cqw,11px); }
.bs-chip.low{ color: var(--bs-low); border-color: color-mix(in srgb, var(--bs-low) 45%, transparent); background: color-mix(in srgb, var(--bs-low) 12%, transparent); }
.bs-chip.high{ color: var(--bs-high); border-color: color-mix(in srgb, var(--bs-high) 45%, transparent); background: color-mix(in srgb, var(--bs-high) 12%, transparent); }
.bs-chip.mid{ color: var(--dsw-alias-label-primary-inverted,#fff); background: var(--bs-mid); }
.bs-chip.mid.found{ background: var(--bs-ok); }
.bs-status{ margin:0; padding:8px 11px; border-radius:9px; border-left:3px solid var(--bs-mid);
  background: var(--dsw-alias-bg-layer-2,#f3f4f6); font-size: 13px; font-size: clamp(12px,2.2cqw,14px); line-height:1.6; }
.bs-status.ok{ border-left-color: var(--bs-ok); }
.bs-stats{ display:flex; flex-wrap:wrap; gap:7px; }
.bs-stat{ flex:1 1 92px; min-width:0; padding:6px 9px; border-radius:9px;
  background: var(--dsw-alias-bg-layer-2,#f3f4f6); border:1px solid var(--dsw-alias-border-l1,#e5e7eb); }
.bs-stat span{ display:block; font-size: 10px; font-size: clamp(9px,1.8cqw,11px); color: var(--dsw-alias-label-secondary,#4b5563);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bs-stat b{ display:block; font-size: 16px; font-size: clamp(13px,2.8cqw,18px); font-variant-numeric: tabular-nums; }
.bs-stat i{ display:block; font-style:normal; font-size: 10px; font-size: clamp(9px,1.8cqw,11px);
  color: var(--dsw-alias-label-tertiary,#9ca3af); font-variant-numeric: tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bs-controls{ display:flex; gap:8px; flex-wrap:wrap; }
.bs-controls button{ border-radius:9px; padding:7px 15px; font-size:13px; font-weight:600; cursor:pointer; }
.bs-primary{ border:1px solid transparent; background: var(--dsw-alias-button-primary-fill, var(--dsw-alias-brand-primary,#4f46e5)); color: var(--dsw-alias-label-primary-inverted,#fff); }
.bs-sec{ border:1px solid var(--dsw-alias-border-l2,#d1d5db); background: transparent; color: inherit; }
.bs-controls button:hover:not(:disabled){ filter: brightness(1.05); }
.bs-controls button:disabled{ opacity:.4; cursor:not-allowed; }
.bs-hist-title{ font-size: 11px; font-size: clamp(10px,1.9cqw,12px); font-weight:700; color: var(--dsw-alias-label-secondary,#4b5563); margin-bottom:5px; }
.bs-history{ list-style:none; margin:0; padding:0; display:grid; gap:5px; }
.bs-history li{ font-size: 12px; font-size: clamp(10px,2cqw,12.5px); font-variant-numeric: tabular-nums; padding:6px 9px;
  border-radius:8px; border-left:3px solid var(--bs-mid); background: var(--dsw-alias-bg-layer-2,#f3f4f6); }
.bs-history li.done{ border-left-color: var(--bs-ok); }
.bs-empty{ font-size: 12px; font-size: clamp(10px,2cqw,12.5px); color: var(--dsw-alias-label-tertiary,#9ca3af); }
@media (prefers-reduced-motion: reduce){ .bs-card *{ transition:none !important; } }
</style>

<div class="bs-card">
  <div class="bs-head">
    <div>
      <div class="bs-title">二分查找 · 目标 <span class="bs-target">23</span></div>
      <div class="bs-sub">有序数组 [2, 5, 8, 12, 16, 23, 38, 56] · 8 个元素 · 方框下方数字是索引</div>
    </div>
    <div class="bs-round" id="bsRound">未开始</div>
  </div>

  <div class="bs-grid" id="bsGrid" role="img" aria-label="二分查找过程示意"></div>

  <p class="bs-status" id="bsStatus" aria-live="polite"></p>

  <div class="bs-stats">
    <div class="bs-stat"><span>low（左边界）</span><b id="stLow">0</b><i id="stLowSub">a[0] = 2</i></div>
    <div class="bs-stat"><span>mid（中点）</span><b id="stMid">—</b><i id="stMidSub">a[mid] = —</i></div>
    <div class="bs-stat"><span>high（右边界）</span><b id="stHigh">7</b><i id="stHighSub">a[7] = 56</i></div>
    <div class="bs-stat"><span>本轮比较</span><b id="stCmp">—</b><i id="stCmpSub">等待开始</i></div>
    <div class="bs-stat"><span>已排除区间</span><b id="stExcl">无</b><i id="stExclSub">剩 8 个候选</i></div>
  </div>

  <div class="bs-controls">
    <button class="bs-primary" id="bsNext" type="button">下一步</button>
    <button class="bs-sec" id="bsPrev" type="button">上一步</button>
    <button class="bs-sec" id="bsReset" type="button">重置</button>
  </div>

  <div>
    <div class="bs-hist-title">比较历史</div>
    <ul class="bs-history" id="bsHistory"></ul>
    <div class="bs-empty" id="bsEmpty">还没有比较 —— 点「下一步」开始第 1 轮。</div>
  </div>
</div>

<script>
(function(){
  var A = [2, 5, 8, 12, 16, 23, 38, 56];
  var T = 23;

  var STEPS = [
    {
      low: 0, high: 7, mid: null, excluded: [], found: null, after: null,
      cmp: '—', cmpSub: '等待开始',
      status: '候选区间是索引 0–7，覆盖整个数组。点「下一步」计算 mid = ⌊(0 + 7) ÷ 2⌋ = 3。'
    },
    {
      low: 0, high: 7, mid: 3, excluded: [[0, 3]], found: null, after: [4, 7],
      cmp: '12 < 23', cmpSub: '目标在右半区',
      status: 'a[3] = 12 比目标 23 小 → 目标只可能出现在右半区。于是排除索引 0–3（含 mid 自己），区间收缩为 [4, 7]。'
    },
    {
      low: 4, high: 7, mid: 5, excluded: [[0, 3]], found: 5, after: null,
      cmp: '23 = 23', cmpSub: '命中，返回索引 5',
      status: 'mid = ⌊(4 + 7) ÷ 2⌋ = 5，a[5] = 23 与目标相等 → 命中，返回索引 5。8 个元素总共只比较了 2 次。'
    }
  ];

  var step = 0;
  var TOTAL = STEPS.length - 1;

  var grid = document.getElementById('bsGrid');
  var historyEl = document.getElementById('bsHistory');
  var emptyEl = document.getElementById('bsEmpty');
  var statusEl = document.getElementById('bsStatus');
  var roundEl = document.getElementById('bsRound');
  var btnNext = document.getElementById('bsNext');
  var btnPrev = document.getElementById('bsPrev');
  var btnReset = document.getElementById('bsReset');
  var stLow = document.getElementById('stLow'), stLowSub = document.getElementById('stLowSub');
  var stMid = document.getElementById('stMid'), stMidSub = document.getElementById('stMidSub');
  var stHigh = document.getElementById('stHigh'), stHighSub = document.getElementById('stHighSub');
  var stCmp = document.getElementById('stCmp'), stCmpSub = document.getElementById('stCmpSub');
  var stExcl = document.getElementById('stExcl'), stExclSub = document.getElementById('stExclSub');

  grid.style.gridTemplateColumns = 'repeat(' + A.length + ', minmax(0, 1fr))';

  var band = document.createElement('div');
  band.className = 'bs-band';
  grid.appendChild(band);

  var ptrTop = [], ptrMid = [], boxes = [];

  A.forEach(function(v, i){
    var col = String(i + 1);

    var pt = document.createElement('div');
    pt.className = 'bs-ptr';
    pt.style.gridRow = '2';
    pt.style.gridColumn = col;
    grid.appendChild(pt);
    ptrTop.push(pt);

    var box = document.createElement('div');
    box.className = 'bs-cellbox';
    box.textContent = String(v);
    box.style.gridRow = '3';
    box.style.gridColumn = col;
    grid.appendChild(box);
    boxes.push(box);

    var pm = document.createElement('div');
    pm.className = 'bs-ptr-mid';
    pm.style.gridRow = '4';
    pm.style.gridColumn = col;
    grid.appendChild(pm);
    ptrMid.push(pm);

    var ix = document.createElement('div');
    ix.className = 'bs-idx';
    ix.textContent = String(i);
    ix.style.gridRow = '5';
    ix.style.gridColumn = col;
    grid.appendChild(ix);
  });

  function rangeLabel(ranges){
    if (!ranges || !ranges.length) return '无';
    return ranges.map(function(r){
      return r[0] === r[1] ? String(r[0]) : r[0] + ' – ' + r[1];
    }).join('、');
  }

  function inRanges(i, ranges){
    return ranges.some(function(r){ return i >= r[0] && i <= r[1]; });
  }

  function chip(text, cls){
    var el = document.createElement('span');
    el.className = 'bs-chip ' + cls;
    el.textContent = text;
    return el;
  }

  function render(){
    var s = STEPS[step];

    band.style.gridColumn = (s.low + 1) + ' / ' + (s.high + 2);
    band.textContent = '[' + s.low + ', ' + s.high + ']';
    band.classList.toggle('done', s.found !== null);

    for (var i = 0; i < A.length; i++){
      var isExcluded = inRanges(i, s.excluded);
      var inRange = i >= s.low && i <= s.high && !isExcluded;
      var box = boxes[i];
      box.classList.toggle('excluded', isExcluded);
      box.classList.toggle('in-range', inRange);
      box.classList.toggle('mid', s.mid === i && !isExcluded);
      box.classList.toggle('found', s.found === i);
    }

    ptrTop.forEach(function(el){ el.innerHTML = ''; });
    ptrMid.forEach(function(el){ el.innerHTML = ''; });
    ptrTop[s.low].appendChild(chip('low', 'low'));
    ptrTop[s.high].appendChild(chip('high', 'high'));
    if (s.mid !== null){
      var hit = s.found === s.mid;
      ptrMid[s.mid].appendChild(chip(hit ? 'mid ✓' : 'mid', hit ? 'mid found' : 'mid'));
    }

    stLow.textContent = String(s.low);
    stLowSub.textContent = 'a[' + s.low + '] = ' + A[s.low];
    stHigh.textContent = String(s.high);
    stHighSub.textContent = 'a[' + s.high + '] = ' + A[s.high];
    if (s.mid === null){
      stMid.textContent = '—';
      stMidSub.textContent = 'a[mid] = —';
    } else {
      stMid.textContent = String(s.mid);
      stMidSub.textContent = 'a[' + s.mid + '] = ' + A[s.mid];
    }
    stCmp.textContent = s.cmp;
    stCmpSub.textContent = s.cmpSub;
    stExcl.textContent = rangeLabel(s.excluded);
    stExclSub.textContent = '剩 ' + (s.high - s.low + 1) + ' 个候选';

    if (step === 0){
      roundEl.textContent = '未开始 · 最多 ' + TOTAL + ' 轮';
    } else if (s.found !== null){
      roundEl.textContent = '第 ' + step + ' / ' + TOTAL + ' 轮 · 命中';
    } else {
      roundEl.textContent = '第 ' + step + ' / ' + TOTAL + ' 轮';
    }

    statusEl.textContent = s.status;
    statusEl.classList.toggle('ok', s.found !== null);

    historyEl.innerHTML = '';
    for (var k = 1; k <= step; k++){
      var p = STEPS[k];
      var li = document.createElement('li');
      var base = '第 ' + k + ' 轮 · low=' + p.low + ' · mid=' + p.mid + ' · high=' + p.high;
      if (p.found !== null){
        li.className = 'done';
        li.textContent = base + ' · a[' + p.mid + '] = ' + A[p.mid] + ' = ' + T + ' → 命中，返回索引 ' + p.found;
      } else {
        li.textContent = base + ' · a[' + p.mid + '] = ' + A[p.mid] + (A[p.mid] < T ? ' < ' : ' > ') + T +
          ' → 排除 ' + rangeLabel(p.excluded) + '，新区间 [' + p.after[0] + ', ' + p.after[1] + ']';
      }
      historyEl.appendChild(li);
    }
    emptyEl.style.display = step > 0 ? 'none' : 'block';

    btnNext.disabled = step >= TOTAL;
    btnPrev.disabled = step === 0;
    btnReset.disabled = step === 0;

    grid.setAttribute('aria-label',
      '数组 [' + A.join(', ') + ']，目标 23。' +
      (s.mid === null
        ? '当前候选区间索引 ' + s.low + ' 到 ' + s.high + '。'
        : '本轮 low=' + s.low + '，mid=' + s.mid + '，high=' + s.high + '，a[mid]=' + A[s.mid] + '。') +
      s.status);
  }

  btnNext.addEventListener('click', function(){ if (step < TOTAL){ step++; render(); } });
  btnPrev.addEventListener('click', function(){ if (step > 0){ step--; render(); } });
  btnReset.addEventListener('click', function(){ step = 0; render(); });

  render();
})();
</script>
