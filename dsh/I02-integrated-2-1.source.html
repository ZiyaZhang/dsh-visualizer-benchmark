<style>
  .hc-root{font-size:13px;color:var(--dsw-alias-label-primary,#111);display:flex;flex-direction:column;gap:12px;min-width:0;--hc-hot:#e5484d;--hc-cold:#3b82f6}
  .hc-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .hc-meta{font-size:12px;color:var(--dsw-alias-label-secondary,#52525b);font-variant-numeric:tabular-nums}
  .hc-ctl{display:flex;gap:8px;flex-wrap:wrap}
  .hc-eq{font-variant-numeric:tabular-nums;background:var(--dsw-alias-bg-layer-2,#f4f4f5);border:1px solid var(--dsw-alias-border-l1,#e4e4e7);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap;font-size:12px}
  .hc-eq b{font-weight:600}
  .hc-rod{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end;min-width:0}
  .hc-col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .hc-val{font-variant-numeric:tabular-nums;font-weight:600;font-size:11px;white-space:nowrap}
  .hc-track{width:100%;height:110px;border:1px solid var(--dsw-alias-border-l1,#e4e4e7);border-radius:6px;background:var(--dsw-alias-bg-layer-2,#fafafa);display:flex;align-items:flex-end;overflow:hidden}
  .hc-fill{width:100%;height:0%;border-radius:5px 5px 0 0;background:#d4d4d8;transition:height .25s ease,background-color .25s ease}
  .hc-pos{font-size:11px;color:var(--dsw-alias-label-secondary,#52525b)}
  .hc-tag{font-size:10px;padding:1px 5px;border-radius:999px;border:1px dashed var(--dsw-alias-border-l2,#a1a1aa);color:var(--dsw-alias-label-tertiary,#71717a);white-space:nowrap}
  .hc-tag.free{border-style:solid;border-color:transparent;background:var(--dsw-alias-interactive-bg-hover,#f4f4f5);color:var(--dsw-alias-label-secondary,#52525b)}
  .hc-delta{font-size:11px;font-variant-numeric:tabular-nums;color:var(--dsw-alias-label-secondary,#52525b);min-height:14px;white-space:nowrap}
  .hc-scale{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dsw-alias-label-tertiary,#71717a);font-variant-numeric:tabular-nums}
  .hc-note{font-size:11px;line-height:1.5;color:var(--dsw-alias-label-tertiary,#71717a)}
  @media (prefers-reduced-motion: reduce){.hc-fill{transition:none}}
</style>
<div class="hc-root">
  <div class="hc-bar">
    <div class="hc-meta" aria-live="polite">第 <span id="hc-n">0</span> 步 · 扩散系数 α = 0.25 · 节点数 5</div>
    <div class="hc-ctl">
      <button type="button" id="hc-step">单步</button>
      <button type="button" id="hc-reset">重置</button>
    </div>
  </div>
  <div class="hc-eq"><b>同步更新（全部节点都用上一步的温度）：</b> T<sub>i</sub><sup>n+1</sup> = T<sub>i</sub><sup>n</sup> + 0.25·(T<sub>i−1</sub><sup>n</sup> − 2T<sub>i</sub><sup>n</sup> + T<sub>i+1</sub><sup>n</sup>)，两端固定不参与计算</div>
  <div class="hc-rod" role="img" aria-label="一维杆上 5 个节点的温度柱状图；左右端点分别固定为 100 和 0 摄氏度，中间 3 个节点随步数升温">
    <div class="hc-col"><div class="hc-val" id="hc-val-0">100.00 °C</div><div class="hc-track"><div class="hc-fill" id="hc-fill-0"></div></div><div class="hc-pos">x₀</div><div class="hc-tag">固定 100</div><div class="hc-delta" id="hc-delta-0">—</div></div>
    <div class="hc-col"><div class="hc-val" id="hc-val-1">0.00 °C</div><div class="hc-track"><div class="hc-fill" id="hc-fill-1"></div></div><div class="hc-pos">x₁</div><div class="hc-tag free">自由</div><div class="hc-delta" id="hc-delta-1">—</div></div>
    <div class="hc-col"><div class="hc-val" id="hc-val-2">0.00 °C</div><div class="hc-track"><div class="hc-fill" id="hc-fill-2"></div></div><div class="hc-pos">x₂</div><div class="hc-tag free">自由</div><div class="hc-delta" id="hc-delta-2">—</div></div>
    <div class="hc-col"><div class="hc-val" id="hc-val-3">0.00 °C</div><div class="hc-track"><div class="hc-fill" id="hc-fill-3"></div></div><div class="hc-pos">x₃</div><div class="hc-tag free">自由</div><div class="hc-delta" id="hc-delta-3">—</div></div>
    <div class="hc-col"><div class="hc-val" id="hc-val-4">0.00 °C</div><div class="hc-track"><div class="hc-fill" id="hc-fill-4"></div></div><div class="hc-pos">x₄</div><div class="hc-tag">固定 0</div><div class="hc-delta" id="hc-delta-4">—</div></div>
  </div>
  <div class="hc-scale"><span>0 °C</span><span>柱高 ∝ 温度 · Δ = 本步相对上一步的变化</span><span>100 °C</span></div>
  <div class="hc-note">离散示意：整根杆只保留这 5 个节点，节点之间没有内部结构；温度只在节点上取值，热扩散完全由上面的差分式在相邻节点间逐步传递。</div>
</div>
<script>
(function(){
  var A = 0.25, N = 5, T0 = [100, 0, 0, 0, 0];
  var T = T0.slice(), prev = null, step = 0, els = [];
  for (var i = 0; i < N; i++) {
    els.push({
      val: document.getElementById('hc-val-' + i),
      fill: document.getElementById('hc-fill-' + i),
      delta: document.getElementById('hc-delta-' + i)
    });
  }
  var nEl = document.getElementById('hc-n');

  function color(v){
    var t = Math.max(0, Math.min(1, v / 100));
    return 'hsl(' + (210 - 200 * t).toFixed(0) + ' ' + (68 + 18 * t).toFixed(0) + '% ' + (56 - 6 * t).toFixed(0) + '%)';
  }
  function render(){
    for (var i = 0; i < N; i++){
      var v = T[i], e = els[i];
      e.val.textContent = v.toFixed(2) + ' °C';
      e.fill.style.height = Math.max(0, Math.min(100, v)) + '%';
      e.fill.style.backgroundColor = color(v);
      if (i === 0 || i === N - 1){
        e.delta.textContent = '—';
        e.delta.style.color = 'var(--dsw-alias-label-secondary,#52525b)';
      } else if (prev === null){
        e.delta.textContent = '—';
        e.delta.style.color = 'var(--dsw-alias-label-secondary,#52525b)';
      } else {
        var d = v - prev[i];
        e.delta.textContent = 'Δ ' + (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(2);
        e.delta.style.color = d > 0 ? 'var(--hc-hot)' : (d < 0 ? 'var(--hc-cold)' : 'var(--dsw-alias-label-secondary,#52525b)');
      }
    }
    nEl.textContent = step;
  }
  document.getElementById('hc-step').addEventListener('click', function(){
    var nxt = T.slice();
    for (var i = 1; i < N - 1; i++){ nxt[i] = T[i] + A * (T[i-1] - 2 * T[i] + T[i+1]); }
    prev = T.slice();
    T = nxt;
    step += 1;
    render();
  });
  document.getElementById('hc-reset').addEventListener('click', function(){
    T = T0.slice(); prev = null; step = 0; render();
  });
  render();
})();
</script>
