<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Bar chart of sales: A = 3, B = 5">
  <title>Sales</title>
  <desc>Static bar chart. Category A has value 3; category B has value 5.</desc>

  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>

  <text x="200" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Sales</text>

  <!-- gridlines and y-axis ticks -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="60" y1="240" x2="360" y2="240"/>
    <line x1="60" y1="204" x2="360" y2="204"/>
    <line x1="60" y1="168" x2="360" y2="168"/>
    <line x1="60" y1="132" x2="360" y2="132"/>
    <line x1="60" y1="96"  x2="360" y2="96"/>
    <line x1="60" y1="60"  x2="360" y2="60"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">
    <text x="52" y="244">0</text>
    <text x="52" y="208">1</text>
    <text x="52" y="172">2</text>
    <text x="52" y="136">3</text>
    <text x="52" y="100">4</text>
    <text x="52" y="64">5</text>
  </g>

  <!-- axes -->
  <line x1="60" y1="240" x2="360" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="60" y1="60"  x2="60"  y2="240" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- A = 3 -->
  <rect x="105" y="132" width="70" height="108" rx="2" fill="#2563eb"/>
  <text x="140" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">3</text>

  <!-- B = 5 -->
  <rect x="245" y="60" width="70" height="180" rx="2" fill="#f59e0b"/>
  <text x="280" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">5</text>

  <!-- x-axis labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#374151" text-anchor="middle">
    <text x="140" y="262">A</text>
    <text x="280" y="262">B</text>
  </g>
</svg>
