<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'"><!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>订购数量</title>
<main>
  <h1>订购数量</h1>
  <p>
    <button id="decrease" type="button">减少</button>
    <span id="quantity">2</span>
    <button id="increase" type="button">增加</button>
  </p>
</main>
<script>
  var MIN = 0;
  var MAX = 5;
  var quantity = 2;

  var quantityEl = document.querySelector("#quantity");
  var decreaseBtn = document.querySelector("#decrease");
  var increaseBtn = document.querySelector("#increase");

  function render() {
    quantityEl.textContent = quantity;
    decreaseBtn.disabled = quantity <= MIN;
    increaseBtn.disabled = quantity >= MAX;
  }

  decreaseBtn.addEventListener("click", function () {
    if (quantity > MIN) {
      quantity -= 1;
      render();
    }
  });

  increaseBtn.addEventListener("click", function () {
    if (quantity < MAX) {
      quantity += 1;
      render();
    }
  });

  render();
</script>
</html>
