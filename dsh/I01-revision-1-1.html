  <div class="bs-head">

  <script>
  (function(){
    var ARR=[2,5,8,12,16,23,38,56];

    var DEFAULT=23;
    var root=document.getElementById('bsRoot');
    var elArray=document.getElementById('bsArray');
    var elStatus=document.getElementById('bsStatus');
    var elHistory=document.getElementById('bsHistory');
    var elRound=document.getElementById('bsRound');
    var elLow=document.getElementById('bsLow');
    var elMid=document.getElementById('bsMid');
    var elHigh=document.getElementById('bsHigh');
    var elRange=document.getElementById('bsRange');
    var elTarget=document.getElementById('bsTarget');

    var btnPrev=document.getElementById('bsPrev');

    var state={target:DEFAULT,cursor:0,steps:[],result:'found'};

    function build(target){

        mid=Math.floor((low+high)/2);

          steps.push({low:low,high:high,mid:mid,val:val,kind:'found',excl:null,newLow:low,newHigh:high});
          break;
        } else if(val<target){
          steps.push({low:low,high:high,mid:mid,val:val,kind:'right',excl:[low,mid],newLow:mid+1,newHigh:high});
          low=mid+1;
        } else {
          steps.push({low:low,high:high,mid:mid,val:val,kind:'left',excl:[mid,high],newLow:low,newHigh:mid-1});
          high=mid-1;
        }
      }
      state.steps=steps;
      state.result=(steps.length&&steps[steps.length-1].kind==='found')?'found':'notfound';
    }

    function mergedRanges(set){
      var idx=Array.from(set).sort(function(a,b){return a-b;}),out=[],i;
      for(i=0;i<idx.length;i++){
        if(out.length&&idx[i]===out[out.length-1][1]+1)out[out.length-1][1]=idx[i];
        else out.push([idx[i],idx[i]]);
      }
      return out;
    }
    function rangeText(set){
      var r=mergedRanges(set);
      if(!r.length)return '无';
      return r.map(function(x){return '['+x[0]+'–'+x[1]+']';}).join('、');
    }

      var low=0,high=ARR.length-1,mid=null,cur=null;
      if(c>0){cur=steps[c-1];low=cur.low;high=cur.high;mid=cur.mid;}
      var excl={};
      for(i=0;i<c;i++){
        var e=steps[i].excl;
        if(e){for(k=e[0];k<=e[1];k++)excl[k]=true;}
      }
      var foundIdx=(cur&&cur.kind==='found')?cur.mid:-1;

      elArray.innerHTML='';
      for(i=0;i<ARR.length;i++){
        var col=document.createElement('div');col.className='bs-col';
        var ptrs=document.createElement('div');ptrs.className='bs-ptrs';
        var badges=[];
        if(i===low)badges.push(['low',false]);
        if(mid!==null&&i===mid)badges.push(['mid',true]);
        if(i===high)badges.push(['high',false]);
        for(j=0;j<badges.length;j++){
          var pill=document.createElement('span');
          pill.className='bs-pill'+(badges[j][1]?' is-mid':'');
          pill.textContent=badges[j][0];
          pill.title=badges[j][0]+' = '+i;
          ptrs.appendChild(pill);
        }
        col.appendChild(ptrs);

        var cell=document.createElement('div');
        cell.className='bs-cell';
        if(c===0||(low<=high&&i>=low&&i<=high))cell.classList.add('is-active');
        if(excl[i])cell.classList.add('is-excluded');
        if(mid!==null&&i===mid)cell.classList.add('is-mid');
        if(i===foundIdx)cell.classList.add('is-found');
        cell.textContent=ARR[i];
        cell.title='下标 '+i+'，值 '+ARR[i];

      elRound.textContent=c+'/'+steps.length;

      elMid.textContent=(mid===null?'–':mid);
      elHigh.textContent=high;

                '，新区间 low='+s.newLow+'、high='+s.newHigh+'。';
        } else {
          concl=s.val+' &gt; '+state.target+' → 目标只可能在<b>左半边</b>，排除下标 '+s.excl[0]+'–'+s.excl[1]+
                '，新区间 low='+s.newLow+'、high='+s.newHigh+'。';
        }
        html='<div class="bs-line">第 '+c+' / '+steps.length+' 轮：low='+s.low+'、high='+s.high+
             ' → mid=⌊('+s.low+'+'+s.high+')/2⌋='+s.mid+'，比较 arr['+s.mid+']='+s.val+'。</div>'+
             '<div class="bs-line">'+concl+'</div>';
        if(c===steps.length){
          if(state.result==='found'){
            html+='<div class="bs-line bs-done">查找结束：共比较 '+c+' 次，找到 '+state.target+'。</div>';
          } else {
            html+='<div class="bs-line bs-done">此时 low='+s.newLow+' &gt; high='+s.newHigh+
                  '，区间为空 → '+state.target+' 不在数组中。查找结束：共比较 '+c+' 次。</div>';
          }
        }

      }

      elHistory.innerHTML='';
      if(c===0){
        elHistory.innerHTML='<div class="bs-dim">比较记录会显示在这里。</div>';
      }

        var st=steps[j];

        var dot=document.createElement('span');

        row.appendChild(dot);
        var txt=document.createElement('span');
        var tail=(st.kind==='found')
          ? ('= '+state.target+' ✓ 命中')
          : (st.kind==='right'
              ? ('&lt; '+state.target+' → 排除 '+st.excl[0]+'–'+st.excl[1])
              : ('&gt; '+state.target+' → 排除 '+st.excl[0]+'–'+st.excl[1]));
        txt.innerHTML='第 '+(j+1)+' 轮 · low='+st.low+' mid='+st.mid+' high='+st.high+
                      ' · arr['+st.mid+']='+st.val+' '+tail;
        row.appendChild(txt);
        elHistory.appendChild(row);
      }

      btnPrev.disabled=(c===0);
      btnNext.disabled=(c>=steps.length);
    }

    function buildChips(){
      elChips.innerHTML='';
      var lab=document.createElement('span');

        });
        elChips.appendChild(b);

    }
    function syncChips(){

    }

    btnNext.addEventListener('click',function(){step(1);});
    btnPrev.addEventListener('click',function(){step(-1);});
    btnReset.addEventListener('click',function(){
      state.target=DEFAULT;state.cursor=0;build(DEFAULT);syncChips();render();
    });
    root.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight'){e.preventDefault();step(1);}
      else if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
    });

    build(DEFAULT);
    buildChips();
    render();
  })();
  </script>
</div></body></html>
