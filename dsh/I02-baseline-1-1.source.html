<style>
  .hc{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--dsw-alias-label-primary,#1f2328);line-height:1.45;}
  .hc-note{margin:0;font-size:12px;color:var(--dsw-alias-label-secondary,#57606a);}
  .hc-note b{color:var(--dsw-alias-label-primary,#1f2328);}
  .hc-plot{background:var(--dsw-alias-bg-layer-1,#f6f8fa);border:1px solid var(--dsw-alias-border-l1,#d0d7de);border-radius:10px;padding:4px 6px 0;min-width:0;}
  .hc-plot svg{display:block;width:100%;height:auto;}
  .hc-plot .grid{stroke:var(--dsw-alias-border-l2,#eaeef2);stroke-width:1;}
  .hc-plot .axis{stroke:var(--dsw-alias-border-l1,#d0d7de);stroke-width:1;}
  .hc-plot text{fill:var(--dsw-alias-label-tertiary,#6e7781);font-size:10px;}
  .hc-plot text.tick{font-variant-numeric:tabular-nums;}
  .hc-plot .cur{fill:none;stroke:var(--dsw-alias-brand-primary,#0969da);stroke-width:2.2;stroke-linejoin:round;}
  .hc-plot .prev{fill:none;stroke:var(--dsw-alias-label-tertiary,#8c959f);stroke-width:1.4;stroke-dasharray:4 3;}
  .hc-plot .dot{stroke:var(--dsw-alias-bg-base,#fff);stroke-width:1.5;}
  .hc-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--dsw-alias-label-secondary,#57606a);padding:6px 2px 2px;}
  .hc-legend span{display:inline-flex;align-items:center;gap:5px;}
  .hc-swatch{display:inline-block;width:20px;height:3px;border-radius:2px;background:var(--dsw-alias-brand-primary,#0969da);}
  .hc-swatch.dash{background:repeating-linear-gradient(90deg,var(--dsw-alias-label-tertiary,#8c959f) 0 4px,transparent 4px 7px);}
  .hc-nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;min-width:0;}
  .hc-node{position:relative;background:var(--dsw-alias-bg-layer-1,#f6f8fa);border:1px solid var(--dsw-alias-border-l1,#d0d7de);border-radius:9px;padding:7px 4px 6px;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0;overflow:hidden;}
  .hc-chip{position:absolute;inset:0 0 auto 0;height:3px;transition:background-color .25s ease;}
  .hc-idx{font-size:11px;color:var(--dsw-alias-label-secondary,#57606a);}
  .hc-val{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;white-space:nowrap;}
  .hc-unit{font-size:10px;font-weight:400;color:var(--dsw-alias-label-tertiary,#6e7781);margin-left:2px;}
  .hc-sub{font-size:10px;font-variant-numeric:tabular-nums;color:var(--dsw-alias-label-tertiary,#6e7781);white-space:nowrap;}
  .hc-sub.fix{color:var(--dsw-alias-brand-primary,#0969da);}
  .hc-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .hc-controls button{font-size:13px;padding:5px 14px;border-radius:7px;cursor:pointer;}
  .hc-controls button.primary{background:var(--dsw-alias-button-primary-fill,#0969da);color:var(--dsw-alias-label-primary-inverted,#fff);border:1px solid transparent;}
  .hc-stat{font-size:12px;color:var(--dsw-alias-label-secondary,#57606a);font-variant-numeric:tabular-nums;}
  .hc-stat b{color:var(--dsw-alias-label-primary,#1f2328);}
  .hc-eq{margin:0;font-size:12px;color:var(--dsw-alias-label-secondary,#57606a);}
  .hc-eq code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--dsw-alias-bg-layer-2,#eff2f5);border-radius:4px;padding:1px 4px;}
  @media (prefers-reduced-motion: reduce){.hc *{transition:none !important;}}
</style>

<div class="hc">
  <p class="hc-note"><b>这是离散示意，不是连续解析解。</b>把杆离散成 5 个节点（间距 Δx），温度只定义在这 5 个点上；图中的连线只是相邻节点的直线连接。</p>

  <div class="hc-plot">
    <svg id="hcSvg" viewBox="0 0 440 198" role="img" aria-label="5 节点温度分布曲线，横轴为节点位置 0 到 4，纵轴为温度 0 到 100 摄氏度"></svg>
    <div class="hc-legend">
      <span><i class="hc-swatch"></i>当前步 n 的节点温度</span>
      <span><i class="hc-swatch dash"></i>上一步 n−1</span>
      <span>节点 0、4 为固定边界</span>
    </div>
  </div>

  <div class="hc-nodes" id="hcNodes"></div>

  <div class="hc-controls">
    <button id="hcStep" class="primary" type="button">单步 (n+1)</button>
    <button id="hcReset" type="button">重置</button>
    <span class="hc-stat">步数 n = <b id="hcN">0</b></span>
    <span class="hc-stat">α = <b>0.25</b></span>
  </div>

  <p class="hc-stat" id="hcStatus" aria-live="polite">初始状态：T = [100, 0, 0, 0, 0] °C</p>

  <p class="hc-eq">同步更新式：<code>Tᵢⁿ⁺¹ = Tᵢⁿ + 0.25·(Tᵢ₋₁ⁿ + Tᵢ₊₁ⁿ − 2Tᵢⁿ)</code>　→　三个内部节点同一时刻都只用<b>上一时刻</b>的值计算，边界节点恒为 100 °C 与 0 °C。</p>
</div>

<script>
(function(){
  var N = 5, ALPHA = 0.25;
  var INIT = [100, 0, 0, 0, 0];
  var FIXED = [true, false, false, false, true];
  var T = INIT.slice();
  var prev = INIT.slice();
  var n = 0;

  var svg = document.getElementById('hcSvg');
  var nodesBox = document.getElementById('hcNodes');
  var nEl = document.getElementById('hcN');
  var statusEl = document.getElementById('hcStatus');

  function color(v){
    var t = Math.max(0, Math.min(1, v / 100));
    return 'hsl(' + (210 - 210 * t).toFixed(0) + ' 85% 52%)';
  }
  function fmt(v){ return v.toFixed(2); }

  // 建立节点读数卡片
  var cards = [];
  for (var i = 0; i < N; i++){
    var d = document.createElement('div');
    d.className = 'hc-node';
    d.innerHTML = '<div class="hc-chip"></div>' +
      '<div class="hc-idx">节点 ' + i + '</div>' +
      '<div class="hc-val"><span class="hc-num"></span><span class="hc-unit">°C</span></div>' +
      '<div class="hc-sub"></div>';
    nodesBox.appendChild(d);
    cards.push({ chip: d.querySelector('.hc-chip'), num: d.querySelector('.hc-num'), sub: d.querySelector('.hc-sub') });
  }

  function render(){
    var W = 440, H = 198, x0 = 48, x1 = 424, yTop = 18, yBot = 152;
    var X = function(i){ return x0 + i * (x1 - x0) / (N - 1); };
    var Y = function(v){ return yBot - (v / 100) * (yBot - yTop); };
    var g = '';

    [0, 25, 50, 75, 100].forEach(function(v){
      var y = Y(v);
      g += '<line class="grid" x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '"/>';
      g += '<text class="tick" x="' + (x0 - 7) + '" y="' + (y + 3.5) + '" text-anchor="end">' + v + '</text>';
    });
    g += '<line class="axis" x1="' + x0 + '" x2="' + x1 + '" y1="' + yBot + '" y2="' + yBot + '"/>';
    for (var i = 0; i < N; i++){
      g += '<line class="grid" x1="' + X(i) + '" x2="' + X(i) + '" y1="' + yTop + '" y2="' + yBot + '"/>';
      g += '<text class="tick" x="' + X(i) + '" y="' + (yBot + 15) + '" text-anchor="middle">' + i + '</text>';
    }
    g += '<text x="' + ((x0 + x1) / 2) + '" y="' + (H - 4) + '" text-anchor="middle">节点位置 i（以 Δx 为单位）</text>';
    g += '<text x="13" y="' + ((yTop + yBot) / 2) + '" text-anchor="middle" transform="rotate(-90 13 ' + ((yTop + yBot) / 2) + ')">温度 / °C</text>';

    var path = function(a){
      return a.map(function(v, k){
        return (k ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(v).toFixed(1);
      }).join(' ');
    };
    if (n > 0) g += '<path class="prev" d="' + path(prev) + '"/>';
    g += '<path class="cur" d="' + path(T) + '"/>';
    T.forEach(function(v, k){
      g += '<circle class="dot" cx="' + X(k) + '" cy="' + Y(v) + '" r="4.5" fill="' + color(v) + '"/>';
    });
    svg.innerHTML = g;

    var summary = [];
    T.forEach(function(v, k){
      var c = cards[k];
      c.chip.style.backgroundColor = color(v);
      c.num.textContent = fmt(v);
      if (FIXED[k]){
        c.sub.textContent = '固定边界';
        c.sub.className = 'hc-sub fix';
      } else if (n === 0){
        c.sub.textContent = '初始值';
        c.sub.className = 'hc-sub';
      } else {
        var d = v - prev[k], sign = d >= 0 ? '+' : '−';
        c.sub.textContent = 'Δ ' + sign + Math.abs(d).toFixed(2);
        c.sub.className = 'hc-sub';
      }
      summary.push(fmt(v));
    });
    nEl.textContent = n;
    var conv = T.slice(1, N - 1).every(function(v, k){ return Math.abs(v - (75 - k * 25)) < 5e-4; });
    statusEl.textContent = '第 ' + n + ' 步：T = [' + summary.join(', ') + '] °C' + (conv ? '　（已很接近线性稳态 100/75/50/25/0）' : '');
  }

  document.getElementById('hcStep').addEventListener('click', function(){
    prev = T.slice();
    var next = T.slice();
    for (var i = 1; i < N - 1; i++){
      next[i] = T[i] + ALPHA * (T[i - 1] + T[i + 1] - 2 * T[i]);
    }
    T = next;
    n += 1;
    render();
  });

  document.getElementById('hcReset').addEventListener('click', function(){
    T = INIT.slice();
    prev = INIT.slice();
    n = 0;
    render();
  });

  render();
})();
</script>
