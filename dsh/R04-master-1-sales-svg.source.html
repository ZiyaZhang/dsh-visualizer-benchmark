<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-label="Bar chart: A equals 3, B equals 5">
  <title>Sales: A = 3, B = 5</title>
  <desc>Static bar chart with two bars. Category A has value 3 and category B has value 5.</desc>

  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>

  <text x="240" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2933">Sales by Category</text>

  <!-- Y axis -->
  <line x1="60" y1="50" x2="60" y2="300" stroke="#1f2933" stroke-width="1.5"/>

  <!-- Gridlines and Y tick labels: 0..5 -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="end">
    <line x1="60" y1="300" x2="450" y2="300" stroke="#cbd2d9" stroke-width="1"/>
    <text x="52" y="304">0</text>
    <line x1="60" y1="250" x2="450" y2="250" stroke="#e4e7eb" stroke-width="1"/>
    <text x="52" y="254">1</text>
    <line x1="60" y1="200" x2="450" y2="200" stroke="#e4e7eb" stroke-width="1"/>
    <text x="52" y="204">2</text>
    <line x1="60" y1="150" x2="450" y2="150" stroke="#e4e7eb" stroke-width="1"/>
    <text x="52" y="154">3</text>
    <line x1="60" y1="100" x2="450" y2="100" stroke="#e4e7eb" stroke-width="1"/>
    <text x="52" y="104">4</text>
    <line x1="60" y1="50" x2="450" y2="50" stroke="#e4e7eb" stroke-width="1"/>
    <text x="52" y="54">5</text>
  </g>

  <!-- Bars: value 3 -> height 150 (y=150..300); value 5 -> height 250 (y=50..300) -->
  <rect x="112.5" y="150" width="90" height="150" fill="#3d7ea6"/>
  <rect x="307.5" y="50" width="90" height="250" fill="#d97742"/>

  <!-- Value labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2933">
    <text x="157.5" y="140">3</text>
    <text x="352.5" y="40">5</text>
  </g>

  <!-- Category labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2933">
    <text x="157.5" y="322">A</text>
    <text x="352.5" y="322">B</text>
  </g>
</svg>
