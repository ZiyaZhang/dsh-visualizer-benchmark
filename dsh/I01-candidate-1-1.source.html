<style>
  .bs-wrap{--acc:var(--dsw-alias-brand-primary,#3b82f6);font-family:inherit;color:var(--dsw-alias-label-primary,#111827);background:var(--dsw-alias-bg-layer-1,#fff);border:1px solid var(--dsw-alias-border-l1,rgba(0,0,0,.1));border-radius:14px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;max-width:720px;margin:0 auto}
  .bs-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .bs-title{font-size:15px;font-weight:650}
  .bs-sub{font-size:12px;color:var(--dsw-alias-label-secondary,#6b7280);font-variant-numeric:tabular-nums}
  .bs-quiet{font-size:12px;color:var(--dsw-alias-label-secondary,#6b7280);text-align:center}
  .bs-quiet code{background:var(--dsw-alias-bg-layer-2,rgba(0,0,0,.05));padding:1px 5px;border-radius:5px;font-size:11px}
  .bs-nums{display:flex;gap:6px;justify-content:center}
  .bs-nums .bs-n{width:52px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;color:var(--dsw-alias-label-tertiary,#9ca3af)}
  .bs-grid{display:grid;gap:6px;justify-content:center}
  .bs-cell{position:relative;min-width:0;height:56px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--dsw-alias-border-l1,rgba(0,0,0,.12));background:var(--dsw-alias-bg-layer-2,rgba(0,0,0,.03));font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;transition:opacity .18s ease,background .18s ease,border-color .18s ease,color .18s ease}
  .bs-cell.dropped{opacity:.32;text-decoration:line-through;text-decoration-thickness:1px;font-weight:500}
  .bs-cell.active{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
  .bs-cell.midc{background:var(--acc);border-color:var(--acc);color:var(--dsw-alias-label-primary-inverted,#fff)}
  .bs-cell.found{background:#16a34a;border-color:#16a34a;color:#fff;box-shadow:0 0 0 4px rgba(22,163,74,.22)}
  .bs-lbl{position:absolute;bottom:-19px;font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--dsw-alias-label-secondary,#6b7280)}
  .bs-lbl.low{left:5px}.bs-lbl.high{right:5px}.bs-lbl.mid{left:50%;transform:translateX(-50%);color:var(--acc)}
  .bs-stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .bs-stat{display:flex;flex-direction:column;gap:1px;min-width:78px;padding:6px 10px;border:1px solid var(--dsw-alias-border-l1,rgba(0,0,0,.1));border-radius:9px;background:var(--dsw-alias-bg-layer-2,rgba(0,0,0,.02))}
  .bs-stat small{font-size:10px;color:var(--dsw-alias-label-tertiary,#9ca3af)}
  .bs-stat b{font-size:15px;font-variant-numeric:tabular-nums}
  .bs-result{font-size:13px;line-height:1.5;padding:9px 11px;border-radius:9px;background:var(--dsw-alias-bg-layer-2,rgba(0,0,0,.04));border:1px solid transparent}
  .bs-result.hit{background:rgba(22,163,74,.12);border-color:rgba(22,163,74,.4)}
  .bs-result.miss{background:rgba(220,38,38,.1);border-color:rgba(220,38,38,.35)}
  .bs-ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bs-btn{appearance:none;border:1px solid transparent;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;background:var(--dsw-alias-button-primary-fill,var(--acc));color:var(--dsw-alias-label-primary-inverted,#fff)}
  .bs-btn.ghost{background:transparent;color:var(--dsw-alias-label-primary,#111827);border-color:var(--dsw-alias-border-l2,rgba(0,0,0,.2))}
  .bs-btn:hover{filter:brightness(1.06)}
  .bs-btn:disabled{opacity:.45;cursor:default;filter:none}
  .bs-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .bs-count{font-size:12px;color:var(--dsw-alias-label-tertiary,#9ca3af);margin-left:auto;font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion: reduce){.bs-cell{transition:none}}
</style>

<div class="bs-wrap">
  <div class="bs-head">
    <div class="bs-title">二分查找 · 在有序数组中找 <b>23</b></div>
    <div class="bs-sub" id="bsSub">数组长度 8</div>
  </div>

  <div class="bs-nums" id="bsNums" aria-hidden="true"></div>

  <div class="bs-stage">
    <div class="bs-grid" id="bsGrid" role="img" aria-labelledby="bsSub"></div>
  </div>

  <div class="bs-stats">
    <div class="bs-stat"><small>low</small><b id="bsLow">0</b></div>
    <div class="bs-stat"><small>mid</small><b id="bsMid">—</b></div>
    <div class="bs-stat"><small>high</small><b id="bsHigh">7</b></div>
    <div class="bs-stat"><small>剩余候选</small><b id="bsRemain">8</b></div>
  </div>

  <div class="bs-result" id="bsResult" role="status" aria-live="polite">点击「下一步」开始：先看整个数组。</div>

  <div class="bs-ctrls">
    <button class="bs-btn" id="bsStep" type="button">下一步 ▶</button>
    <button class="bs-btn ghost" id="bsReset" type="button">重置</button>
    <span class="bs-count" id="bsCount"></span>
  </div>
</div>

<script>
(function(){
  var A=[2,5,8,12,16,23,38,56], T=23;
  function lowb(a,t){var lo=0;while(lo<a.length&&a[lo]<t)lo++;return lo;}

  // 预先算出每一轮：范围 [lo,hi] 的两端取值（越界记 null）
  var rounds=[],lo=0,hi=A.length-1;
  while(lo<=hi){
    var mid=Math.floor((lo+hi)/2);
    rounds.push({lo:lo,hi:hi,mid:mid,leftVal:A[lo],rightVal:A[hi]});
    if(A[mid]===T) break;
    if(A[mid]<T) lo=mid+1; else hi=mid-1;
  }
  var end=rounds.length-1;

  var steps=[{kind:'start',lo:0,hi:A.length-1,mid:null,dropped:[]}];
  var dropL=[],dropR=[];
  var firstMid=rounds[0].mid;
  var lowIdx=(firstMid>=T)?lowb(A,T):0;
  var highIdx=(firstMid<T)?(A.length-1):(A.length-1);
  if(firstMid>=T) highIdx=Math.min(hi,highIdx); else highIdx=hi;
  if(firstMid<T){lowIdx=Math.max(lo,lowIdx);dropL=[];}
  steps[0].kind='drop';
  steps[0].dropped=[];

  var curLo=0,curHi=A.length-1,drop=[];
  if(firstMid<T){for(var i=0;i<=firstMid;i++)drop.push(i);curLo=firstMid+1;}
  else{for(var j=firstMid;j<A.length;j++)drop.push(j);curHi=firstMid-1;}
  steps[0].lo=curLo;steps[0].hi=curHi;steps[0].dropped=drop;
  var endLo=(A[firstMid]===T)?firstMid:curLo;
  var endHi=(A[firstMid]===T)?firstMid:curHi;

  var curLoB=A.length-1,curHiB=0;
  (function(){
    var l=0,h=A.length-1;
    for(var k=0;k<rounds.length;k++){
      var r=rounds[k],m=r.mid,d=[];
      if(A[m]===T){
        for(var i=0;i<l;i++)d.push(i);
        for(var i2=h+1;i2<A.length;i2++)d.push(i2);
        steps.push({kind:'found',lo:l,hi:h,mid:m,dropped:d});
        break;
      }
      if(A[m]<T){
        for(var p=l;p<=m;p++)d.push(p);
        l=m+1;
        steps.push({kind:'goRight',lo:l,hi:h,mid:m,dropped:drop.concat(d),round:k+1});
      }else{
        for(var q=m;q<=h;q++)d.push(q);
        h=m-1;
        steps.push({kind:'goLeft',lo:l,hi:h,mid:m,dropped:drop.concat(d),round:k+1});
      }
    }
  })();

  var idx=0, grid=document.getElementById('bsGrid'), nums=document.getElementById('bsNums');
  var elLow=document.getElementById('bsLow'),elMid=document.getElementById('bsMid'),elHigh=document.getElementById('bsHigh');
  var elRemain=document.getElementById('bsRemain'),elRes=document.getElementById('bsResult');
  var elStep=document.getElementById('bsStep'),elReset=document.getElementById('bsReset');
  var elCount=document.getElementById('bsCount'),elSub=document.getElementById('bsSub');

  for(var n=0;n<A.length;n++){
    var nd=document.createElement('div');nd.className='bs-n';nd.textContent=n;nums.appendChild(nd);
  }
  grid.style.gridTemplateColumns='repeat('+A.length+',minmax(0,1fr))';
  var cells=[];
  for(var c=0;c<A.length;c++){
    var cell=document.createElement('div');cell.className='bs-cell';
    var txt=document.createElement('span');txt.textContent=A[c];cell.appendChild(txt);
    grid.appendChild(cell);cells.push(cell);
  }

  function retag(cell,tag){
    var old=cell.querySelector('.bs-lbl');if(old)old.remove();
    if(!tag)return;
    var s=document.createElement('span');s.className='bs-lbl '+(tag==='mid'?'mid':tag);
    s.textContent=tag==='mid'?('mid · '+T+' 比 '+A[steps[idx].mid]):tag;
    cell.appendChild(s);
  }

  function render(){
    var s=steps[idx], total=steps.length-1;
    var found=s.kind==='found';
    cells.forEach(function(cell,i){
      cell.className='bs-cell';
      var drop=s.dropped.indexOf(i)>-1;
      if(drop)cell.classList.add('dropped');
      else if(i<s.lo||i>s.hi)cell.classList.add('dropped');
      if(!drop&&!found&&i>=s.lo&&i<=s.hi)cell.classList.add('active');
      if(s.mid===i)cell.classList.add(found?'found':'midc');
      retag(cell,null);
      if(s.mid===i)retag(cell,found?'found':'mid');
      else if(i===s.lo&&!found&&!cell.classList.contains('dropped'))retag(cell,'low');
      else if(i===s.hi&&!found&&!cell.classList.contains('dropped')&&s.hi!==s.lo)retag(cell,'high');
    });

    elLow.textContent=found?s.lo:s.lo;
    elMid.textContent=(s.mid===null?'—':s.mid);
    elHigh.textContent=s.hi;
    var remain=(s.lo<=s.hi)?(s.hi-s.lo+1):0;
    elRemain.textContent=found?1:Math.max(remain,0);
    elSub.textContent='数组长度 '+A.length+(idx>0?' · 第 '+(found?rounds.length:idx)+' 轮':'');
    elCount.textContent='步骤 '+idx+' / '+total;

    if(s.kind==='start'){
      elRes.className='bs-result';
      elRes.textContent='初始区间 [0, 7]，共 8 个候选。目标是 23。';
    }else if(s.kind==='found'){
      elRes.className='bs-result hit';
      elRes.textContent='找到 23：下标 '+s.mid+'（第 '+rounds.length+' 轮）。每轮把候选区间砍半，8 个元素最多只需 '+(Math.ceil(Math.log2(A.length+1)))+' 次比较。';
    }else if(s.kind==='goRight'){
      elRes.className='bs-result';
      elRes.textContent='第 '+(idx)+' 轮：下标 '+s.mid+' 的值 '+A[s.mid]+' < 23，目标在右半边 → 排除左半含 mid，low = mid + 1 = '+s.lo;
    }else{
      elRes.className='bs-result';
      elRes.textContent='第 '+(idx)+' 轮：下标 '+s.mid+' 的值 '+A[s.mid]+' > 23，目标在左半边 → 排除右半含 mid，high = mid − 1 = '+s.hi;
    }

    var last=idx>=steps.length-1;
    elStep.disabled=last;
    elStep.textContent=last?'已完成 ✓':'下一步 ▶';
    if(last&&!elRes.classList.contains('miss')){
      if(steps[steps.length-1].kind!=='found'){
        elRes.className='bs-result miss';
        elRes.textContent='区间为空仍未命中 → 23 不存在。';
      }
    }
  }

  elStep.addEventListener('click',function(){if(idx<steps.length-1){idx++;render();}});
  elReset.addEventListener('click',function(){idx=0;render();});
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k!=='Enter'&&k!==' '&&k!=='ArrowRight'&&k!=='Escape')return;
    var tag=(e.target&&e.target.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
    var focused=(document.activeElement===elReset);
    if(k==='Escape'){idx=0;render();e.preventDefault();return;}
    if(focused&&(k==='Enter'||k===' '))return; // 让重置按钮自己处理
    if(idx<steps.length-1){idx++;render();e.preventDefault();}
  });

  render();
})();
</script>
