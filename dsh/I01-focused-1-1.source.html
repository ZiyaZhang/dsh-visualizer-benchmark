<style>
  .bs{font-family:inherit;color:var(--dsw-alias-label-primary);max-width:680px}
  .bs-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .bs-title{font-size:15px;font-weight:600}
  .bs-sub{font-size:12px;color:var(--dsw-alias-label-secondary);margin-top:3px}
  .bs-round{font-size:12px;color:var(--dsw-alias-label-secondary);font-variant-numeric:tabular-nums;background:var(--dsw-alias-bg-layer-2,#f4f5f8);border:1px solid var(--dsw-alias-border-l1,#e3e5ea);border-radius:999px;padding:3px 10px;white-space:nowrap}
  .bs-track{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 4px}
  .bs-col{flex:1 1 0;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:5px}
  .bs-idx{font-size:11px;color:var(--dsw-alias-label-tertiary,#8a8f9c);font-variant-numeric:tabular-nums}
  .bs-cell{width:100%;height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;border:1.5px solid var(--dsw-alias-border-l2,#c9cdd6);border-radius:9px;background:var(--dsw-alias-bg-layer-1,#fff);transition:background .18s,color .18s,opacity .18s,border-color .18s,transform .18s}
  .bs-cell.in{border-color:var(--dsw-alias-brand-primary,#4f6bed);background:rgba(79,107,237,.10);background:color-mix(in srgb,var(--dsw-alias-brand-primary,#4f6bed) 12%,transparent)}
  .bs-cell.mid{background:var(--dsw-alias-brand-primary,#4f6bed);border-color:var(--dsw-alias-brand-primary,#4f6bed);color:var(--dsw-alias-label-primary-inverted,#fff);transform:translateY(-2px)}
  .bs-cell.ex{opacity:.32;text-decoration:line-through;background:var(--dsw-alias-bg-layer-2,#f4f5f8)}
  .bs-cell.found{background:#159a55;border-color:#159a55}
  .bs-marks{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:18px}
  .mk{font-size:10px;font-weight:700;padding:1px 5px;border-radius:6px;color:#fff}
  .mk.low{background:#7c5cff}.mk.mid{background:#e0761a}.mk.high{background:#1f9bb5}
  .bs-readout{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .bs-chip{font-size:12px;color:var(--dsw-alias-label-secondary);background:var(--dsw-alias-bg-layer-2,#f4f5f8);border:1px solid var(--dsw-alias-border-l1,#e3e5ea);border-radius:8px;padding:4px 9px;font-variant-numeric:tabular-nums}
  .bs-chip b{color:var(--dsw-alias-label-primary);font-size:13px}
  .bs-note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--dsw-alias-bg-layer-2,#f4f5f8);border-left:3px solid var(--dsw-alias-brand-primary,#4f6bed);font-size:13px;line-height:1.6;min-height:62px}
  .bs-note.ok{border-left-color:#159a55}
  .bs-log{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .bs-logline{font-size:12.5px;line-height:1.5;color:var(--dsw-alias-label-secondary);display:flex;gap:8px}
  .bs-logline b{color:var(--dsw-alias-label-primary);white-space:nowrap}
  .bs-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .bs-actions button{font-size:13px;padding:7px 16px;border-radius:9px;cursor:pointer}
  .bs-actions button:disabled{opacity:.5;cursor:default}
  @media (prefers-reduced-motion:reduce){.bs-cell{transition:none}}
</style>
<div class="bs">
  <div class="bs-head">
    <div>
      <div class="bs-title">二分查找：在升序数组中找 <span style="color:var(--dsw-alias-brand-primary,#4f6bed)">23</span></div>
      <div class="bs-sub">a = [2, 5, 8, 12, 16, 23, 38, 56]，下标 0–7</div>
    </div>
    <div class="bs-round" id="bs-round">第 0 / 3 步</div>
  </div>

  <div class="bs-track" id="bs-track" role="group" aria-label="数组元素与查找区间"></div>

  <div class="bs-readout">
    <span class="bs-chip">low <b id="bs-low">0</b></span>
    <span class="bs-chip">mid <b id="bs-mid">—</b></span>
    <span class="bs-chip">high <b id="bs-high">7</b></span>
    <span class="bs-chip">已排除 <b id="bs-ex">无</b></span>
  </div>

  <div class="bs-note" id="bs-note" aria-live="polite"></div>
  <div class="bs-log" id="bs-log" aria-label="各轮记录"></div>

  <div class="bs-actions">
    <button id="bs-next" type="button">下一步</button>
    <button id="bs-reset" type="button">重置</button>
  </div>
</div>
<script>
(function(){
  var arr=[2,5,8,12,16,23,38,56];
  var states=[
    {low:0,high:7,mid:null,excluded:[],found:false,
     note:'第 0 步：目标 23，当前查找范围是整个数组 [0, 7]。每一轮都先算 mid，再拿 a[mid] 和目标比较。',
     log:null},
    {low:0,high:7,mid:3,excluded:[],found:false,
     note:'第 1 轮：mid = ⌊(0 + 7) / 2⌋ = 3，a[3] = 12。因为 12 < 23，目标只可能在 mid 的右侧。',
     log:{t:'第 1 轮',d:'mid = 3，a[3] = 12 < 23 → 目标在右半边'}},
    {low:4,high:7,mid:null,excluded:[[0,3]],found:false,
     note:'排除左半区 [0, 3]（连 mid 一起排除，因为 a[3] 已确认不是目标）。新区间是 [4, 7]，还剩 4 个元素。',
     log:null},
    {low:4,high:7,mid:5,excluded:[[0,3]],found:true,
     note:'第 2 轮：mid = ⌊(4 + 7) / 2⌋ = 5，a[5] = 23 正好等于目标 → 命中，返回下标 5。8 个元素只比较了 2 次。',
     log:{t:'第 2 轮',d:'mid = 5，a[5] = 23 = 23 → 命中，返回下标 5'}}
  ];
  var step=0;
  var track=document.getElementById('bs-track');
  var note=document.getElementById('bs-note');
  var logBox=document.getElementById('bs-log');
  var nextBtn=document.getElementById('bs-next');
  var resetBtn=document.getElementById('bs-reset');

  arr.forEach(function(v,i){
    var col=document.createElement('div'); col.className='bs-col';
    var idx=document.createElement('div'); idx.className='bs-idx'; idx.textContent=i;
    var cell=document.createElement('div'); cell.className='bs-cell'; cell.id='bs-cell-'+i; cell.textContent=v;
    var marks=document.createElement('div'); marks.className='bs-marks'; marks.id='bs-mark-'+i;
    col.appendChild(idx); col.appendChild(cell); col.appendChild(marks);
    track.appendChild(col);
  });

  function fmt(r){return r[0]===r[1]?'['+r[0]+']':'['+r[0]+'–'+r[1]+']';}

  function render(){
    var s=states[step];
    document.getElementById('bs-low').textContent=s.low;
    document.getElementById('bs-high').textContent=s.high;
    document.getElementById('bs-mid').textContent=s.mid===null?'—':s.mid;
    document.getElementById('bs-ex').textContent=s.excluded.length?s.excluded.map(fmt).join('、'):'无';
    document.getElementById('bs-round').textContent='第 '+step+' / '+(states.length-1)+' 步';

    arr.forEach(function(v,i){
      var cell=document.getElementById('bs-cell-'+i);
      var mark=document.getElementById('bs-mark-'+i);
      var isEx=s.excluded.some(function(r){return i>=r[0]&&i<=r[1];});
      var isMid=s.mid===i;
      var inRange=i>=s.low&&i<=s.high;
      var cls='bs-cell';
      if(isEx) cls+=' ex';
      if(isMid) cls+=(s.found?' mid found':' mid');
      else if(inRange) cls+=' in';
      cell.className=cls;
      cell.setAttribute('aria-label','下标 '+i+'，值 '+v+(isEx?'，已排除':'')+(isMid?'，mid':'')+(inRange&&!isEx?'，在查找区间内':''));
      var m='';
      if(i===s.low) m+='<span class="mk low">low</span>';
      if(i===s.high) m+='<span class="mk high">high</span>';
      if(isMid) m+='<span class="mk mid">mid</span>';
      mark.innerHTML=m;
    });

    note.textContent=s.note;
    note.className='bs-note'+(s.found?' ok':'');

    logBox.innerHTML='';
    for(var k=0;k<=step;k++){
      var lg=states[k].log;
      if(!lg) continue;
      var line=document.createElement('div'); line.className='bs-logline';
      line.innerHTML='<b>'+lg.t+'</b><span>'+lg.d+'</span>';
      logBox.appendChild(line);
    }

    var done=step===states.length-1;
    nextBtn.disabled=done;
    nextBtn.textContent=done?'已结束（命中 23）':'下一步';
  }

  nextBtn.addEventListener('click',function(){ if(step<states.length-1){step++;render();} });
  resetBtn.addEventListener('click',function(){ step=0; render(); });
  render();
})();
</script>
