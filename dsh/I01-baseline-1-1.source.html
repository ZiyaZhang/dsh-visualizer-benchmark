<div class="bsv-root">
<style>
  .bsv-root{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--dsw-alias-border-l1);border-radius:12px;background:var(--dsw-alias-bg-layer-1);color:var(--dsw-alias-label-primary);font-family:inherit;font-size:14px}
  .bsv-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
  .bsv-h1{font-weight:650}
  .bsv-meta{font-size:12.5px;color:var(--dsw-alias-label-secondary);font-variant-numeric:tabular-nums}
  .bsv-meta b{color:var(--dsw-alias-label-primary);font-size:14px}
  .bsv-scroll{overflow-x:auto;padding:2px 0 6px}
  .bsv-grid{display:flex;gap:6px;min-width:min-content}
  .bsv-col{flex:1 1 0;min-width:42px;display:flex;flex-direction:column;align-items:center;gap:5px}
  .bsv-idx{font-size:11px;color:var(--dsw-alias-label-tertiary);font-variant-numeric:tabular-nums}
  .bsv-cell{width:100%;height:46px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--dsw-alias-border-l1);background:var(--dsw-alias-bg-layer-2);font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;transition:background-color .2s ease,color .2s ease,border-color .2s ease,opacity .2s ease,transform .2s ease}
  .bsv-cell.excl{opacity:.45;text-decoration:line-through;background-image:repeating-linear-gradient(45deg,transparent 0 4px,var(--dsw-alias-border-l1) 4px 8px)}
  .bsv-cell.mid{background:var(--dsw-alias-brand-primary);border-color:var(--dsw-alias-brand-primary);color:var(--dsw-alias-label-primary-inverted);transform:translateY(-2px)}
  .bsv-cell.found{background:var(--dsw-alias-brand-primary);border-color:var(--dsw-alias-brand-primary);color:var(--dsw-alias-label-primary-inverted);outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
  .bsv-badges{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:34px}
  .bsv-b{font-size:10px;line-height:15px;padding:0 6px;border-radius:999px;border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-secondary);white-space:nowrap}
  .bsv-b.mid,.bsv-b.found{background:var(--dsw-alias-brand-primary);border-color:transparent;color:var(--dsw-alias-label-primary-inverted);font-weight:600}
  .bsv-b.low,.bsv-b.high{border-style:dashed}
  .bsv-read{font-size:12.5px;color:var(--dsw-alias-label-secondary);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 14px}
  .bsv-read b{color:var(--dsw-alias-label-primary)}
  .bsv-status{font-size:13.5px;line-height:1.65;color:var(--dsw-alias-label-secondary);min-height:44px}
  .bsv-status b{color:var(--dsw-alias-label-primary);font-variant-numeric:tabular-nums}
  .bsv-cmp{display:inline-block;margin-top:4px;font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--dsw-alias-border-l1);background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-secondary);font-variant-numeric:tabular-nums}
  .bsv-ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bsv-ctrls button{font:inherit;font-size:13px;padding:6px 14px}
  .bsv-ctrls .bsv-next{font-weight:600}
  .bsv-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--dsw-alias-label-tertiary)}
  .bsv-log li{display:flex;gap:8px;align-items:baseline}
  .bsv-log li::before{content:"\2022";color:var(--dsw-alias-brand-primary)}
  .bsv-log:empty{display:none}
  @media (prefers-reduced-motion: reduce){.bsv-cell{transition:none}}
</style>

<div class="bsv-head">
  <div class="bsv-h1">二分查找 · 在有序数组中找 <span>23</span></div>
  <div class="bsv-meta">步骤 <b id="bsv-step">1</b>/4</div>
</div>

<div class="bsv-scroll">
  <div class="bsv-grid" id="bsv-grid" role="group" aria-label="有序数组 2,5,8,12,16,23,38,56，二分查找目标 23"></div>
</div>

<div class="bsv-read" id="bsv-read"></div>
<div class="bsv-status" id="bsv-status" aria-live="polite"></div>

<div class="bsv-ctrls">
  <button type="button" class="bsv-next" id="bsv-next">下一步</button>
  <button type="button" id="bsv-reset">重置</button>
</div>

<ul class="bsv-log" id="bsv-log"></ul>

<script>
(function(){
  var A=[2,5,8,12,16,23,38,56];
  var S=[
    {low:0,high:7,mid:-1,ex:[],t:'准备：候选区间是 <b>[0…7]</b>，包含全部 8 个元素。先看正中间。'},
    {low:0,high:7,mid:3,ex:[],cmp:'a[3] = 12 &lt; 23',t:'第 1 轮：mid = ⌊(0+7)/2⌋ = <b>3</b>，a[3] = <b>12</b>，比目标 23 小 → 目标只可能在右半边。',log:'第 1 轮：a[3] = 12 &lt; 23，保留右半边'},
    {low:4,high:7,mid:-1,ex:[0,1,2,3],t:'排除下标 <b>0…3</b>（连同 mid 一起丢掉），候选区间缩到 <b>[4…7]</b>。',log:'排除下标 0…3'},
    {low:4,high:7,mid:5,ex:[0,1,2,3],cmp:'a[5] = 23 = 23',found:true,t:'第 2 轮：mid = ⌊(4+7)/2⌋ = <b>5</b>，a[5] = <b>23</b>，正好等于目标 → 找到！',log:'第 2 轮：a[5] = 23 = 目标，命中'}
  ];
  var i=0;
  var grid=document.getElementById('bsv-grid'),
      stepEl=document.getElementById('bsv-step'),
      readEl=document.getElementById('bsv-read'),
      statusEl=document.getElementById('bsv-status'),
      logEl=document.getElementById('bsv-log'),
      nextBtn=document.getElementById('bsv-next'),
      resetBtn=document.getElementById('bsv-reset');
  var cols=[];
  A.forEach(function(v,idx){
    var col=document.createElement('div'); col.className='bsv-col';
    var idxEl=document.createElement('div'); idxEl.className='bsv-idx'; idxEl.textContent=idx;
    var cell=document.createElement('div'); cell.className='bsv-cell'; cell.textContent=v;
    var badges=document.createElement('div'); badges.className='bsv-badges';
    col.appendChild(idxEl); col.appendChild(cell); col.appendChild(badges);
    col.setAttribute('role','group');
    col.setAttribute('aria-label','下标 '+idx+'，值 '+v);
    grid.appendChild(col);
    cols.push({cell:cell,badges:badges,value:v});
  });
  function render(){
    var s=S[i];
    cols.forEach(function(c,idx){
      var cls='bsv-cell';
      if(s.ex.indexOf(idx)>-1) cls+=' excl';
      if(idx===s.mid) cls+= s.found?' found':' mid';
      c.cell.className=cls;
      var bd=[];
      if(s.found&&idx===s.mid){ bd.push(['found','\u2713 找到']); }
      else{
        if(idx===s.mid) bd.push(['mid','中 mid']);
        if(idx===s.low) bd.push(['low','低 low']);
        if(idx===s.high) bd.push(['high','高 high']);
      }
      c.badges.innerHTML=bd.map(function(b){return '<span class="bsv-b '+b[0]+'">'+b[1]+'</span>';}).join('');
    });
    stepEl.textContent=String(i+1);
    readEl.innerHTML='low = <b>'+s.low+'</b> · mid = <b>'+(s.mid<0?'—':s.mid)+'</b> · high = <b>'+s.high+'</b> · 候选 <b>'+(s.high-s.low+1)+'</b> 个';
    statusEl.innerHTML=s.t+(s.cmp?'<br><span class="bsv-cmp">比较 '+s.cmp+'</span>':'');
    logEl.innerHTML=S.slice(0,i+1).filter(function(x){return x.log;}).map(function(x){return '<li>'+x.log+'</li>';}).join('');
    var done=(i===S.length-1);
    nextBtn.disabled=done;
    nextBtn.textContent=done?'已完成':'下一步';
  }
  nextBtn.addEventListener('click',function(){ if(i<S.length-1){ i++; render(); } });
  resetBtn.addEventListener('click',function(){ i=0; render(); });
  render();
})();
</script>
</div>
