<div class="wrap">
  <style>
    .wrap{font-family:inherit;color:var(--dsw-alias-label-primary);max-width:560px;min-width:0}
    .head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
    .title{font-size:15px;font-weight:600}
    .hint{font-size:12px;color:var(--dsw-alias-label-tertiary)}
    .chart{margin:14px 0 4px;display:flex;flex-direction:column;gap:10px}
    .row{display:grid;grid-template-columns:minmax(52px,auto) 1fr minmax(84px,auto);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--dsw-alias-border-l1);background:var(--dsw-alias-bg-layer-1);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;min-width:0;transition:background .15s,border-color .15s}
    .row:hover{background:var(--dsw-alias-interactive-bg-hover)}
    .row[aria-pressed="true"]{border-color:var(--dsw-alias-brand-primary);background:var(--dsw-alias-interactive-bg-active)}
    .name{font-size:13px;font-weight:600;white-space:nowrap}
    .track{position:relative;height:16px;border-radius:8px;background:var(--dsw-alias-bg-layer-2);overflow:hidden;min-width:0}
    .bar{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;background:var(--dsw-alias-brand-primary);transition:width .35s ease}
    .row[aria-pressed="true"] .bar{background:var(--dsw-alias-brand-primary)}
    .row:not([aria-pressed="true"]) .bar{opacity:.55}
    .val{font-size:13px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
    .val b{font-weight:600}
    .val span{font-size:11px;color:var(--dsw-alias-label-tertiary);margin-left:2px}
    .foot{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
    .status{font-size:12px;color:var(--dsw-alias-label-secondary);min-height:18px;min-width:0}
    .status b{color:var(--dsw-alias-label-primary)}
    @media (prefers-reduced-motion: reduce){.bar{transition:none}}
  </style>

  <div class="head">
    <div class="title">地区销售对比 · 单位：万元</div>
    <div class="hint">点击地区可本地选中，不会自动提问</div>
  </div>

  <div class="chart" role="group" aria-label="地区销售对比，单位万元">
    <button class="row" type="button" data-name="华东" data-val="120" aria-pressed="false">
      <span class="name">华东</span>
      <span class="track"><span class="bar" style="width:100%"></span></span>
      <span class="val"><b>120</b><span>万元</span></span>
    </button>
    <button class="row" type="button" data-name="华南" data-val="80" aria-pressed="false">
      <span class="name">华南</span>
      <span class="track"><span class="bar" style="width:66.7%"></span></span>
      <span class="val"><b>80</b><span>万元</span></span>
    </button>
    <button class="row" type="button" data-name="西部" data-val="50" aria-pressed="false">
      <span class="name">西部</span>
      <span class="track"><span class="bar" style="width:41.7%"></span></span>
      <span class="val"><b>50</b><span>万元</span></span>
    </button>
  </div>

  <div class="foot">
    <div class="status" id="st" aria-live="polite">未选择地区</div>
    <button type="button" id="ask" disabled>解释所选地区</button>
  </div>

  <script>
    (function () {
      var root = document.currentScript.closest('.wrap');
      var rows = Array.prototype.slice.call(root.querySelectorAll('.row'));
      var status = root.querySelector('#st');
      var ask = root.querySelector('#ask');
      var sel = null;

      function render() {
        rows.forEach(function (r) {
          r.setAttribute('aria-pressed', sel && r.dataset.name === sel.name ? 'true' : 'false');
        });
        if (!sel) {
          status.textContent = '未选择地区';
          ask.disabled = true;
          ask.textContent = '解释所选地区';
        } else {
          status.innerHTML = '已选 <b>' + sel.name + '</b> · <b>' + sel.val + '</b> 万元';
          ask.disabled = false;
          ask.textContent = '解释所选地区：' + sel.name + '（' + sel.val + '万元）';
        }
      }

      rows.forEach(function (r) {
        r.addEventListener('click', function () {
          sel = { name: r.dataset.name, val: r.dataset.val };
          render();
        });
      });

      ask.addEventListener('click', function () {
        if (!sel) return;
        window.dshWidget.sendPrompt(
          '请解释所选地区的销售表现：地区＝' + sel.name + '，销售额＝' + sel.val +
          '万元。背景：华东120万元、华南80万元、西部50万元。请说明该地区在整体中的位置、可能的驱动与风险，以及下一步建议。'
        );
      });

      render();
    })();
  </script>
</div>
