<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .rs-wrap{font-family:inherit;color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-base);border:1px solid var(--dsw-alias-border-l1);border-radius:12px;padding:16px;max-width:640px;box-sizing:border-box}
  .rs-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .rs-title{font-size:15px;font-weight:600}
  .rs-sub{font-size:12px;color:var(--dsw-alias-label-tertiary)}
  .rs-rows{display:flex;flex-direction:column;gap:8px}
  .rs-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;min-width:0;padding:8px 10px;border:1px solid var(--dsw-alias-border-l1);border-radius:9px;background:var(--dsw-alias-bg-layer-1);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,background .15s}
  .rs-row:hover{background:var(--dsw-alias-interactive-bg-hover)}
  .rs-row[aria-pressed="true"]{border-color:var(--dsw-alias-brand-primary);background:var(--dsw-alias-interactive-bg-active)}
  .rs-row:focus-visible{outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
  .rs-name{font-size:13px;font-weight:600;white-space:nowrap}
  .rs-bar{position:relative;height:10px;min-width:0;border-radius:5px;background:var(--dsw-alias-bg-layer-2);overflow:hidden}
  .rs-fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--dsw-alias-brand-primary);opacity:.45}
  .rs-row[aria-pressed="true"] .rs-fill{opacity:1}
  .rs-val{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rs-val small{color:var(--dsw-alias-label-tertiary);font-size:11px;margin-left:2px}
  .rs-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--dsw-alias-border-l1)}
  .rs-readout{font-size:12px;color:var(--dsw-alias-label-secondary);flex:1 1 180px;min-width:0}
  .rs-readout b{color:var(--dsw-alias-label-primary);font-variant-numeric:tabular-nums}
  #rs-ask{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid transparent;background:var(--dsw-alias-button-primary-fill);color:var(--dsw-alias-label-primary-inverted);cursor:pointer}
  #rs-ask:disabled{opacity:.45;cursor:not-allowed}
  #rs-ask:focus-visible{outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
  @media (max-width:420px){.rs-row{grid-template-columns:auto 1fr}.rs-bar{grid-column:2}.rs-val{grid-column:2;justify-self:end}}
</style>
<div class="rs-wrap">
  <div class="rs-head">
    <span class="rs-title">地区销售对比（万元）</span>
    <span class="rs-sub">点击地区仅本地选中，不会提问</span>
  </div>

  <div class="rs-rows" id="rs-rows" role="group" aria-label="地区销售对比，点击选择一个地区">
    <button type="button" class="rs-row" data-region="华东" data-value="120" aria-pressed="false">
      <span class="rs-name">华东</span>
      <span class="rs-bar" aria-hidden="true"><span class="rs-fill" style="width:100%"></span></span>
      <span class="rs-val">120<small>万元</small></span>
    </button>
    <button type="button" class="rs-row" data-region="华南" data-value="80" aria-pressed="false">
      <span class="rs-name">华南</span>
      <span class="rs-bar" aria-hidden="true"><span class="rs-fill" style="width:66.7%"></span></span>
      <span class="rs-val">80<small>万元</small></span>
    </button>
    <button type="button" class="rs-row" data-region="西部" data-value="50" aria-pressed="false">
      <span class="rs-name">西部</span>
      <span class="rs-bar" aria-hidden="true"><span class="rs-fill" style="width:41.7%"></span></span>
      <span class="rs-val">50<small>万元</small></span>
    </button>
  </div>

  <div class="rs-foot">
    <span class="rs-readout" id="rs-readout" role="status" aria-live="polite">当前未选择地区</span>
    <button type="button" id="rs-ask" disabled>解释所选地区</button>
  </div>
</div>
<script>
(function () {
  var rows = Array.prototype.slice.call(document.querySelectorAll('#rs-rows .rs-row'));
  var readout = document.getElementById('rs-readout');
  var ask = document.getElementById('rs-ask');
  var selected = null;

  function render() {
    rows.forEach(function (row) {
      row.setAttribute('aria-pressed', row === selected ? 'true' : 'false');
    });
    if (selected) {
      readout.innerHTML = '已选中：<b>' + selected.dataset.region + '</b> · <b>' +
        selected.dataset.value + '</b> 万元（尚未提问）';
      ask.disabled = false;
    } else {
      readout.textContent = '当前未选择地区';
      ask.disabled = true;
    }
  }

  rows.forEach(function (row) {
    row.addEventListener('click', function () {
      selected = (selected === row) ? null : row;
      render();
    });
  });

  ask.addEventListener('click', function () {
    if (!selected) return;
    var region = selected.dataset.region;
    var value = selected.dataset.value;
    if (window.dshWidget && typeof window.dshWidget.sendPrompt === 'function') {
      window.dshWidget.sendPrompt('请解释地区销售对比中所选地区的情况：' + region +
        '销售额为 ' + value + ' 万元（对比：华东 120 万元、华南 80 万元、西部 50 万元）。' +
        '请分析该地区在三个地区中的位置、占比，并给出可能的原因与建议。');
    }
  });

  render();
})();
</script></body></html>
