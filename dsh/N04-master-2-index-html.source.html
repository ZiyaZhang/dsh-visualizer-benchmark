<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>订购数量</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  #quantity { font-size: 1.5rem; }
  button { font-size: 1rem; padding: 0.4rem 1rem; margin-right: 0.5rem; }
</style>
</head>
<body>
<main>
  <h1>订购数量</h1>
  <p id="quantity">2</p>
  <button id="decrease" type="button">减少</button>
  <button id="increase" type="button">增加</button>
</main>
<script>
  (function () {
    var MIN = 0;
    var MAX = 5;
    var quantity = 2;

    var quantityEl = document.getElementById('quantity');
    var decreaseBtn = document.getElementById('decrease');
    var increaseBtn = document.getElementById('increase');

    function render() {
      quantityEl.textContent = quantity;
      decreaseBtn.disabled = quantity <= MIN;
      increaseBtn.disabled = quantity >= MAX;
    }

    decreaseBtn.addEventListener('click', function () {
      quantity = Math.max(MIN, quantity - 1);
      render();
    });

    increaseBtn.addEventListener('click', function () {
      quantity = Math.min(MAX, quantity + 1);
      render();
    });

    render();
  })();
</script>
</body>
</html>
