<div class="rs-card">
<style>
.rs-card{font-family:inherit;color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-base);display:flex;flex-direction:column;gap:12px;max-width:560px;}
.rs-head{display:flex;flex-direction:column;gap:2px;}
.rs-title{font-size:14px;font-weight:600;}
.rs-sub{font-size:12px;color:var(--dsw-alias-label-secondary);line-height:1.5;}
.rs-rows{display:flex;flex-direction:column;gap:8px;}
.rs-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:9px 10px;font:inherit;color:inherit;text-align:left;background:var(--dsw-alias-bg-layer-1);border:1px solid var(--dsw-alias-border-l1);border-radius:9px;cursor:pointer;box-sizing:border-box;}
.rs-row:hover{background:var(--dsw-alias-interactive-bg-hover);}
.rs-row[aria-pressed="true"]{border-color:var(--dsw-alias-brand-primary);background:var(--dsw-alias-interactive-bg-active);}
.rs-name{font-size:13px;font-weight:600;}
.rs-track{display:block;height:12px;border-radius:6px;background:var(--dsw-alias-bg-layer-2);border:1px solid var(--dsw-alias-border-l1);overflow:hidden;min-width:0;}
.rs-fill{display:block;height:100%;background:var(--dsw-alias-brand-primary);opacity:.5;}
.rs-row[aria-pressed="true"] .rs-fill{opacity:1;}
.rs-val{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--dsw-alias-label-secondary);}
.rs-row[aria-pressed="true"] .rs-val{color:var(--dsw-alias-label-primary);font-weight:600;}
.rs-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--dsw-alias-label-tertiary);font-variant-numeric:tabular-nums;}
.rs-detail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 12px;background:var(--dsw-alias-bg-layer-2);border:1px solid var(--dsw-alias-border-l1);border-radius:9px;font-size:12px;}
.rs-detail dt{color:var(--dsw-alias-label-secondary);}
.rs-detail dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere;}
.rs-ask{align-self:flex-start;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--dsw-alias-label-primary-inverted);background:var(--dsw-alias-button-primary-fill);border:none;border-radius:8px;cursor:pointer;}
.rs-ask:disabled{opacity:.5;cursor:default;}
.rs-note{font-size:12px;color:var(--dsw-alias-label-secondary);min-height:1.4em;line-height:1.4;}
@media (max-width:380px){.rs-row{grid-template-columns:1fr auto;grid-template-areas:"name val" "bar bar";row-gap:6px;}.rs-name{grid-area:name;}.rs-val{grid-area:val;}.rs-track{grid-area:bar;}}
</style>
<div class="rs-head">
<div class="rs-title">地区销售对比（万元）</div>
<div class="rs-sub">三区合计 250 万元。点击地区只做本地选中；需要我解读时，再点“解释所选地区”。</div>
</div>
<div class="rs-rows" role="group" aria-label="地区销售额对比：华东 120 万元，华南 80 万元，西部 50 万元。点击以选中地区。">
<button type="button" class="rs-row" data-key="east" aria-pressed="false" aria-label="华东，120 万元">
<span class="rs-name">华东</span>
<span class="rs-track" aria-hidden="true"><span class="rs-fill" style="width:100%"></span></span>
<span class="rs-val">120 万元</span>
</button>
<button type="button" class="rs-row" data-key="south" aria-pressed="false" aria-label="华南，80 万元">
<span class="rs-name">华南</span>
<span class="rs-track" aria-hidden="true"><span class="rs-fill" style="width:66.7%"></span></span>
<span class="rs-val">80 万元</span>
</button>
<button type="button" class="rs-row" data-key="west" aria-pressed="false" aria-label="西部，50 万元">
<span class="rs-name">西部</span>
<span class="rs-track" aria-hidden="true"><span class="rs-fill" style="width:41.7%"></span></span>
<span class="rs-val">50 万元</span>
</button>
</div>
<div class="rs-axis" aria-hidden="true"><span>0</span><span>条形长度按最高地区 120 万元为满格</span></div>
<dl class="rs-detail" aria-live="polite">
<dt>所选地区</dt><dd id="rs-d-name">—</dd>
<dt>销售额</dt><dd id="rs-d-val">—</dd>
<dt>占三区合计</dt><dd id="rs-d-share">—</dd>
</dl>
<button type="button" class="rs-ask" id="rs-ask" disabled>解释所选地区</button>
<div class="rs-note" id="rs-note">尚未选中地区。</div>
</div>
<script>
(function () {
  var data = {
    east: { name: '华东', value: 120 },
    south: { name: '华南', value: 80 },
    west: { name: '西部', value: 50 }
  };
  var total = 250;
  var current = null;
  var rows = Array.prototype.slice.call(document.querySelectorAll('.rs-row'));
  var ask = document.getElementById('rs-ask');
  var dName = document.getElementById('rs-d-name');
  var dVal = document.getElementById('rs-d-val');
  var dShare = document.getElementById('rs-d-share');
  var note = document.getElementById('rs-note');

  function render() {
    if (!current) {
      dName.textContent = '—';
      dVal.textContent = '—';
      dShare.textContent = '—';
      ask.disabled = true;
      return;
    }
    var d = data[current];
    dName.textContent = d.name;
    dVal.textContent = d.value + ' 万元';
    dShare.textContent = (d.value / total * 100).toFixed(1) + '%';
    ask.disabled = false;
  }

  rows.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var key = btn.getAttribute('data-key');
      current = key;
      rows.forEach(function (b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      note.textContent = '已选中' + data[key].name + '（' + data[key].value + ' 万元），仅本地展示，未发起追问。';
      render();
    });
  });

  ask.addEventListener('click', function () {
    if (!current) return;
    var d = data[current];
    var pct = (d.value / total * 100).toFixed(1);
    var msg = '请解释所选地区：' + d.name + '，销售额 ' + d.value + ' 万元（占三区合计 ' + total + ' 万元的 ' + pct + '%）。请说明该数字的含义、可能的影响因素，并与另外两个地区做对比解读。';
    var sent = false;
    try {
      if (window.dshWidget && typeof window.dshWidget.sendPrompt === 'function') {
        window.dshWidget.sendPrompt(msg);
        sent = true;
      }
    } catch (e) {
      sent = false;
    }
    note.textContent = sent
      ? '已发起追问：' + d.name + ' · ' + d.value + ' 万元。'
      : '当前环境不支持自动追问，请手动发送：' + msg;
  });

  render();
})();
</script>
</div>
