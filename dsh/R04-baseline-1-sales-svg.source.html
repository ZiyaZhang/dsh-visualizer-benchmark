<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-label="Bar chart of sales: A equals 3, B equals 5">
  <title>Sales by category</title>
  <desc>Static bar chart with two bars: A is 3 and B is 5.</desc>

  <style>
    .axis { stroke: #334155; stroke-width: 1.5; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .tick { fill: #64748b; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cat  { fill: #1e293b; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .val  { fill: #0f172a; font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .barA { fill: #3b82f6; }
    .barB { fill: #f59e0b; }
  </style>

  <!-- Title -->
  <text x="200" y="26" text-anchor="middle" fill="#0f172a" style="font: 700 17px system-ui, -apple-system, 'Segoe UI', sans-serif;">Sales</text>

  <!-- Horizontal gridlines and y-axis tick labels (0-5) -->
  <g>
    <line class="grid" x1="60" y1="240" x2="370" y2="240"/>
    <line class="grid" x1="60" y1="200" x2="370" y2="200"/>
    <line class="grid" x1="60" y1="160" x2="370" y2="160"/>
    <line class="grid" x1="60" y1="120" x2="370" y2="120"/>
    <line class="grid" x1="60" y1="80"  x2="370" y2="80"/>
    <line class="grid" x1="60" y1="40"  x2="370" y2="40"/>
    <text class="tick" x="52" y="244" text-anchor="end">0</text>
    <text class="tick" x="52" y="204" text-anchor="end">1</text>
    <text class="tick" x="52" y="164" text-anchor="end">2</text>
    <text class="tick" x="52" y="124" text-anchor="end">3</text>
    <text class="tick" x="52" y="84"  text-anchor="end">4</text>
    <text class="tick" x="52" y="44"  text-anchor="end">5</text>
  </g>

  <!-- Bars: A = 3 (height 120), B = 5 (height 200); 40px per unit -->
  <rect class="barA" x="90"  y="120" width="80" height="120" rx="3"/>
  <rect class="barB" x="230" y="40"  width="80" height="200" rx="3"/>

  <!-- Value labels -->
  <text class="val" x="130" y="110">3</text>
  <text class="val" x="270" y="30">5</text>

  <!-- Axes -->
  <line class="axis" x1="60" y1="40" x2="60" y2="240"/>
  <line class="axis" x1="60" y1="240" x2="370" y2="240"/>

  <!-- Category labels -->
  <text class="cat" x="130" y="264">A</text>
  <text class="cat" x="270" y="264">B</text>
</svg>
