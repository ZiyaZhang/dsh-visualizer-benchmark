<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><div class="ht">
<style>
.ht{--ink:var(--dsw-alias-label-primary,#111);--sub:var(--dsw-alias-label-secondary,#666);--line:var(--dsw-alias-border-l1,#d8d8d8);--surf:var(--dsw-alias-bg-layer-1,#fff);--pop:var(--dsw-alias-bg-layer-2,#f4f4f6);
font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);max-width:720px;box-sizing:border-box}
.ht *{box-sizing:border-box}
.ht .card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px}
.ht .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ht .hd h3{margin:0;font-size:15px;font-weight:650}
.ht .hd .tag{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.ht .hd .note{font-size:12px;color:var(--sub)}
.ht svg{display:block;width:100%;height:auto}
.ht .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ht button{font:inherit;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--pop);color:var(--ink)}
.ht button.primary{background:var(--dsw-alias-button-primary-fill,var(--dsw-alias-brand-primary,#3b6ef5));color:var(--dsw-alias-label-primary-inverted,#fff);border-color:transparent;font-weight:600}
.ht button:hover:not(:disabled){border-color:var(--dsw-alias-border-l2,var(--line))}
.ht button:disabled{opacity:.45;cursor:default}
.ht .step{font-variant-numeric:tabular-nums;font-size:13px;color:var(--sub);margin-left:auto}
.ht .tbl{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
.ht .tbl th,.ht .tbl td{font-size:13px;padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
.ht .tbl th:first-child,.ht .tbl td:first-child{text-align:left;color:var(--sub);font-weight:500}
.ht .tbl thead th{color:var(--sub);font-weight:500;border-top:none}
.ht .tbl td.now{font-weight:700}
.ht .formula{margin-top:10px;font-size:12px;color:var(--sub);line-height:1.7}
.ht .formula code{background:var(--pop);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px}
</style>
<div class="card">
  <div class="hd">
    <h3>一维热传导 · 5 节点离散</h3>
    <span class="tag">显式差分示意</span>
    <span class="note">边界固定 100°C / 0°C，内部初值 0°C，r = 0.25</span>
  </div>

  <svg viewBox="0 0 640 320" role="img" aria-labelledby="htTitle htDesc">
    <title id="htTitle">一维热传导 5 节点离散演示</title>
    <desc id="htDesc">横向排列的 5 个节点，左端固定 100 摄氏度，右端固定 0 摄氏度，内部三个节点温度随迭代升高，柱高表示当前温度。</desc>
    <g id="htGrid" stroke="var(--line)"></g>
    <g id="htAxis"></g>
    <g id="htBars"></g>
    <line x1="22" y1="276" x2="618" y2="276" stroke="var(--dsw-alias-border-l2,#b9b9bd)" stroke-width="1.5"/>
    <text x="320" y="308" text-anchor="middle" font-size="12" fill="var(--sub)">节点 →（位置，从左到右）</text>
  </svg>

  <div class="ctl">
    <button id="htStep" class="primary" type="button">单步 ▸</button>
    <button id="htAuto" type="button">自动播放</button>
    <button id="htReset" type="button">重置</button>
    <span class="step" id="htStepLabel">第 0 步 / 共 20 步</span>
  </div>

  <table class="tbl">
    <thead><tr><th>状态</th><th>节点1（100°C 固定）</th><th>节点2</th><th>节点3</th><th>节点4</th><th>节点5（0°C 固定）</th></tr></thead>
    <tbody><tr id="htRow"><td>当前温度</td><td class="now">100.0</td><td class="now">0.0</td><td class="now">0.0</td><td class="now">0.0</td><td class="now">0.0</td></tr></tbody>
  </table>

  <p class="formula">每步同步更新：内部节点 <code>T'ᵢ = Tᵢ + r·(Tᵢ₋₁ − 2Tᵢ + Tᵢ₊₁)</code>，r = 0.25；两端为边界条件，不参与更新。数值为离散节点的近似解，不是连续杆的精确解。</p>
</div>
</div>
<script>
(function(){
  var host = document.currentScript.parentElement;
  var N = 5, R = 0.25, MAX = 20;
  var LEFT = 100, RIGHT = 0;
  var state, step, timer = null, moving = false;
  var x0 = 22, yBase = 276, yTop = 30, maxT = 100, W = 596, slot = W / N;
  var xs = [], y = [], xNodes = [];
  var ns = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent){
    var e = document.createElementNS(ns, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  var gGrid = host.querySelector("#htGrid");
  var gAxis = host.querySelector("#htAxis");
  var gBars = host.querySelector("#htBars");
  var btnStep = host.querySelector("#htStep");
  var btnAuto = host.querySelector("#htAuto");
  var btnReset = host.querySelector("#htReset");
  var stepLabel = host.querySelector("#htStepLabel");
  var cells = host.querySelectorAll("#htRow td.now");
  var cw = 46;
  var yFor = function(t){ return yBase - (t / maxT) * (yBase - yTop); };

  // 轴与网格
  [0,20,40,60,80,100].forEach(function(t){
    var yy = yFor(t);
    if (t > 0) el("line", {x1:x0, y1:yy, x2:x0+W, y2:yy, "stroke-dasharray":"3 5"}, gGrid);
    var lab = el("text", {x:x0-6, y:yy+4, "text-anchor":"end", "font-size":"11", fill:"var(--sub)"}, gAxis);
    lab.textContent = t;
  });
  var axTitle = el("text", {x:x0-6, y:yTop-12, "text-anchor":"end", "font-size":"11", fill:"var(--sub)"}, gAxis);
  axTitle.textContent = "°C";

  for (var i=0;i<N;i++){
    var cx = x0 + slot*i + slot/2;
    xNodes.push(cx);
    var solid = (i===0 || i===N-1);
    if (solid) el("rect", {x:cx-cw/2, y:yTop, width:cw, height:yBase-yTop, fill:"var(--pop)", stroke:"var(--line)"}, gBars);
    y.push(el("line", {x1:cx, y1:yBase, x2:cx, y2:yBase, stroke:"var(--line)", "stroke-width":1}, gBars));
    el("text", {x:cx, y:yBase+20, "text-anchor":"middle", "font-size":"12", "font-weight":"600", fill:"var(--ink)"}, gBars).textContent
      = "节点 " + (i+1) + (i===0 ? " · 固定 100" : i===N-1 ? " · 固定 0" : "");
    el("rect", {x:cx-cw/2, y:yBase, width:cw, height:0, rx:3, fill:"#2f6bd6"}, gBars);
  }

  function tempColor(t){
    var p = Math.max(0, Math.min(1, t/100));
    return "hsl(" + Math.round(210 - 210*p) + " 72% " + Math.round(48 + 6*p) + "%)";
  }
  function init(){ state = [100,0,0,0,0]; step = 0; render(); }
  function doStep(){
    var T = state.slice();
    var next = T.slice();
    for (var i=1;i<N-1;i++) next[i] = T[i] + R*(T[i-1] - 2*T[i] + T[i+1]);
    next[0] = LEFT; next[N-1] = RIGHT;
    state = next; step++;
    render();
  }
  function render(){
    for (var i=0;i<N;i++){
      var t = state[i];
      var yy = yFor(t);
      y[i].setAttribute("y2", yy);
      y[i].setAttribute("stroke-width", 3);
      y[i].setAttribute("stroke-linecap", "round");
      y[i].setAttribute("stroke", tempColor(t));
      var bar = y[i].nextSibling;
      bar.setAttribute("y", yy);
      bar.setAttribute("height", Math.max(0, yBase-yy));
      bar.setAttribute("fill", tempColor(t));
      bar.setAttribute("fill-opacity", (i===0||i===N-1) ? 0.85 : 0.95);
      cells[i].textContent = t.toFixed(1);
    }
    stepLabel.textContent = "第 " + step + " 步 / 共 " + MAX + " 步";
    btnStep.disabled = (step >= MAX);
    if (step >= MAX && timer){ stopAuto(); }
  }
  function startAuto(){
    moving = true;
    btnAuto.textContent = "暂停";
    timer = window.setInterval(function(){
      if (step >= MAX){ stopAuto(); return; }
      doStep();
    }, 420);
  }
  function stopAuto(){
    moving = false;
    btnAuto.textContent = "自动播放";
    if (timer){ window.clearInterval(timer); timer = null; }
  }
  btnStep.addEventListener("click", function(){ stopAuto(); doStep(); });
  btnAuto.addEventListener("click", function(){
    if (moving) { stopAuto(); return; }
    if (step >= MAX){ init(); }
    startAuto();
  });
  btnReset.addEventListener("click", function(){ stopAuto(); init(); });
  init();
})();
</script></body></html>
