<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><div class="wrap">
  <style>
    .wrap{--c1:#4f7cf7;--c2:#22a06b;--c3:#d98324;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--dsw-alias-label-primary,#1c1e21);background:var(--dsw-alias-bg-base,#fff);border:1px solid var(--dsw-alias-border-l1,#e3e5e8);border-radius:14px;padding:16px;max-width:640px;box-sizing:border-box}
    .wrap *{box-sizing:border-box}
    h3{margin:0 0 2px;font-size:15px;font-weight:650}
    .sub{margin:0 0 14px;font-size:12.5px;color:var(--dsw-alias-label-secondary,#5c6470)}
    .chart{display:grid;gap:8px;margin:0;padding:0;list-style:none}
    .row{display:grid;grid-template-columns:64px 1fr 88px;align-items:center;gap:10px;width:100%;min-width:0;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:background .15s,border-color .15s}
    .row:hover{background:var(--dsw-alias-interactive-bg-hover,rgba(0,0,0,.05))}
    .row:focus-visible{outline:2px solid var(--dsw-alias-brand-primary,#4f7cf7);outline-offset:1px}
    .row[aria-pressed="true"]{background:var(--dsw-alias-interactive-bg-active,rgba(79,124,247,.12));border-color:var(--dsw-alias-brand-primary,#4f7cf7)}
    .name{font-weight:600;font-size:13.5px;white-space:nowrap}
    .track{position:relative;height:22px;border-radius:6px;background:var(--dsw-alias-bg-layer-2,rgba(0,0,0,.05));overflow:hidden;min-width:0}
    .fill{position:absolute;inset:0 auto 0 0;border-radius:6px;opacity:.85;transition:width .3s ease,opacity .15s}
    .row[aria-pressed="true"] .fill{opacity:1}
    .row[data-r="华东"] .fill{background:var(--c1)}
    .row[data-r="华南"] .fill{background:var(--c2)}
    .row[data-r="西部"] .fill{background:var(--c3)}
    .val{font-variant-numeric:tabular-nums;text-align:right;font-weight:650;font-size:13.5px;white-space:nowrap}
    .row[aria-pressed="true"] .val::after{content:" ✓";color:var(--dsw-alias-brand-primary,#4f7cf7);font-weight:700}
    .foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--dsw-alias-border-l1,#e3e5e8)}
    .status{font-size:12.5px;color:var(--dsw-alias-label-secondary,#5c6470);min-width:0}
    .status b{color:var(--dsw-alias-label-primary,#1c1e21);font-variant-numeric:tabular-nums}
    button.ask{font:inherit;font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--dsw-alias-button-primary-fill,#4f7cf7);background:var(--dsw-alias-button-primary-fill,#4f7cf7);color:var(--dsw-alias-label-primary-inverted,#fff);cursor:pointer}
    button.ask:disabled{opacity:.45;cursor:not-allowed}
    button.ask:not(:disabled):hover{filter:brightness(1.06)}
    @media (max-width:420px){.row{grid-template-columns:52px 1fr 76px;gap:8px}.val{font-size:12.5px}}
  </style>

  <h3>地区销售对比</h3>
  <p class="sub" id="hint">点击某一行可选中该地区（仅本地高亮，不会向你追问）。</p>

  <ul class="chart" role="group" aria-label="地区销售额对比，单位万元">
    <li><button class="row" type="button" data-r="华东" data-v="120" aria-pressed="false">
      <span class="name">华东</span>
      <span class="track"><span class="fill" style="width:100%"></span></span>
      <span class="val">120 万元</span>
    </button></li>
    <li><button class="row" type="button" data-r="华南" data-v="80" aria-pressed="false">
      <span class="name">华南</span>
      <span class="track"><span class="fill" style="width:66.667%"></span></span>
      <span class="val">80 万元</span>
    </button></li>
    <li><button class="row" type="button" data-r="西部" data-v="50" aria-pressed="false">
      <span class="name">西部</span>
      <span class="track"><span class="fill" style="width:41.667%"></span></span>
      <span class="val">50 万元</span>
    </button></li>
  </ul>

  <div class="foot">
    <span class="status" id="status" aria-live="polite">尚未选择地区</span>
    <button class="ask" id="ask" type="button" disabled>解释所选地区</button>
  </div>

  <script>
    (function(){
      var rows=[].slice.call(document.querySelectorAll('.row'));
      var status=document.getElementById('status');
      var ask=document.getElementById('ask');
      var selected=null;
      function render(){
        rows.forEach(function(r){ r.setAttribute('aria-pressed', r.dataset.r===selected ? 'true':'false'); });
        if(selected){
          var row=rows.filter(function(r){return r.dataset.r===selected;})[0];
          status.innerHTML='已选中：<b>'+selected+' '+row.dataset.v+' 万元</b>';
          ask.disabled=false;
        }else{
          status.textContent='尚未选择地区';
          ask.disabled=true;
        }
      }
      rows.forEach(function(r){
        r.addEventListener('click',function(){
          selected = (selected===r.dataset.r) ? null : r.dataset.r;
          render();
        });
      });
      ask.addEventListener('click',function(){
        if(!selected) return;
        var row=rows.filter(function(r){return r.dataset.r===selected;})[0];
        var msg='请解释一下所选地区「'+selected+'」的销售额 '+row.dataset.v+' 万元，与其他地区相比说明了什么？';
        if(window.dshWidget && typeof window.dshWidget.sendPrompt==='function'){
          window.dshWidget.sendPrompt(msg);
        }
      });
      render();
    })();
  </script>
</div></body></html>
