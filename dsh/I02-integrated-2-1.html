<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}
:where(html){color-scheme:var(--dsh-widget-color-scheme,light)}
:where(html,body){margin:0;min-height:0;background:transparent;color:var(--dsw-alias-label-primary,#1f2329);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:where(body){padding:16px}
:where(svg){display:block;max-width:100%;height:auto}
:where(button,input,select,textarea){font:inherit;color:inherit}
:where(button){cursor:pointer;border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 10px;background:var(--dsw-alias-bg-layer-2,transparent)}
:where(button:not(:disabled):hover){background:var(--dsw-alias-interactive-bg-hover,transparent)}
:where(button:not(:disabled):active){background:var(--dsw-alias-interactive-bg-active,var(--dsw-alias-interactive-bg-hover,transparent))}
:where(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea){border:0.5px solid var(--dsw-alias-border-l2);border-radius:6px;padding:5px 8px;background:var(--dsw-alias-bg-layer-1,transparent)}
:where(button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible){outline:2px solid var(--dsw-alias-brand-primary);outline-offset:2px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.5}
:where(input[type="range"]){accent-color:var(--dsw-alias-brand-primary);margin:0;max-width:100%}
:where(table){width:100%;border-collapse:collapse}
:where(thead>tr:last-child,tbody>tr:not(:last-child)){border-bottom:0.5px solid var(--dsw-alias-border-l1)}
:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .hc-root{font-size:13px;color:var(--dsw-alias-label-primary,#111);display:flex;flex-direction:column;gap:12px;min-width:0;--hc-hot:#e5484d;--hc-cold:#3b82f6}
  .hc-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .hc-meta{font-size:12px;color:var(--dsw-alias-label-secondary,#52525b);font-variant-numeric:tabular-nums}
  .hc-ctl{display:flex;gap:8px;flex-wrap:wrap}
  .hc-eq{font-variant-numeric:tabular-nums;background:var(--dsw-alias-bg-layer-2,#f4f4f5);border:1px solid var(--dsw-alias-border-l1,#e4e4e7);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap;font-size:12px}
  .hc-eq b{font-weight:600}
  .hc-rod{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end;min-width:0}
  .hc-col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .hc-val{font-variant-numeric:tabular-nums;font-weight:600;font-size:11px;white-space:nowrap}
  .hc-track{width:100%;height:110px;border:1px solid var(--dsw-alias-border-l1,#e4e4e7);border-radius:6px;background:var(--dsw-alias-bg-layer-2,#fafafa);display:flex;align-items:flex-end;overflow:hidden}
  .hc-fill{width:100%;height:0%;border-radius:5px 5px 0 0;background:#d4d4d8;transition:height .25s ease,background-color .25s ease}
  .hc-pos{font-size:11px;color:var(--dsw-alias-label-secondary,#52525b)}
  .hc-tag{font-size:10px;padding:1px 5px;border-radius:999px;border:1px dashed var(--dsw-alias-border-l2,#a1a1aa);color:var(--dsw-alias-label-tertiary,#71717a);white-space:nowrap}
  .hc-tag.free{border-style:solid;border-color:transparent;background:var(--dsw-alias-interactive-bg-hover,#f4f4f5);color:var(--dsw-alias-label-secondary,#52525b)}
  .hc-delta{font-size:11px;font-variant-numeric:tabular-nums;color:var(--dsw-alias-label-secondary,#52525b);min-height:14px;white-space:nowrap}
  .hc-scale{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dsw-alias-label-tertiary,#71717a);font-variant-numeric:tabular-nums}
  .hc-note{font-size:11px;line-height:1.5;color:var(--dsw-alias-label-tertiary,#71717a)}
  @media (prefers-reduced-motion: reduce){.hc-fill{transition:none}}
</style>
<div class="hc-root">
  <div class="hc-bar">
    <div class="hc-meta" aria-live="polite">第 <span id="hc-n">0</span> 步 · 扩散系数 α = 0.25 · 节点数 5</div>
    <div class="hc-ctl">
      <button type="button" id="hc-step">单步</button>
      <button type="button" id="hc-reset">重置</button>
    </div>
  </div>
  <div class="hc-eq"><b>同步更新（全部节点都用上一步的温度）：</b> T<sub>i</sub><sup>n+1</sup> = T<sub>i</sub><sup>n</sup> + 0.25·(T<sub>i−1</sub><sup>n</sup> − 2T<sub>i</sub><sup>n</sup> + T<sub>i+1</sub><sup>n</sup>)，两端固定不参与计算</div>
  <div class="hc-rod" role="img" aria-label="一维杆上 5 个节点的温度柱状图；左右端点分别固定为 100 和 0 摄氏度，中间 3 个节点随步数升温">
    <div class="hc-col"><div class="hc-val" id="hc-val-0">100.00 °C</div><div class="hc-track"><div class="hc-fill" id="hc-fill-0"></div></div><div class="hc-pos">x₀</div><div class="hc-tag">固定 100</div><div class="hc-delta" id="hc-delta-0">—</div></div>
    <div class="hc-col"><div class="hc-val" id="hc-val-1">0.00 °C</div><div class="hc-track"><div class="hc-fill" id="hc-fill-1"></div></div><div class="hc-pos">x₁</div><div class="hc-tag free">自由</div><div class="hc-delta" id="hc-delta-1">—</div></div>
    <div class="hc-col"><div class="hc-val" id="hc-val-2">0.00 °C</div><div class="hc-track"><div class="hc-fill" id="hc-fill-2"></div></div><div class="hc-pos">x₂</div><div class="hc-tag free">自由</div><div class="hc-delta" id="hc-delta-2">—</div></div>
    <div class="hc-col"><div class="hc-val" id="hc-val-3">0.00 °C</div><div class="hc-track"><div class="hc-fill" id="hc-fill-3"></div></div><div class="hc-pos">x₃</div><div class="hc-tag free">自由</div><div class="hc-delta" id="hc-delta-3">—</div></div>
    <div class="hc-col"><div class="hc-val" id="hc-val-4">0.00 °C</div><div class="hc-track"><div class="hc-fill" id="hc-fill-4"></div></div><div class="hc-pos">x₄</div><div class="hc-tag">固定 0</div><div class="hc-delta" id="hc-delta-4">—</div></div>
  </div>
  <div class="hc-scale"><span>0 °C</span><span>柱高 ∝ 温度 · Δ = 本步相对上一步的变化</span><span>100 °C</span></div>
  <div class="hc-note">离散示意：整根杆只保留这 5 个节点，节点之间没有内部结构；温度只在节点上取值，热扩散完全由上面的差分式在相邻节点间逐步传递。</div>
</div>
<script>
(function(){
  var A = 0.25, N = 5, T0 = [100, 0, 0, 0, 0];
  var T = T0.slice(), prev = null, step = 0, els = [];
  for (var i = 0; i < N; i++) {
    els.push({
      val: document.getElementById('hc-val-' + i),
      fill: document.getElementById('hc-fill-' + i),
      delta: document.getElementById('hc-delta-' + i)
    });
  }
  var nEl = document.getElementById('hc-n');

  function color(v){
    var t = Math.max(0, Math.min(1, v / 100));
    return 'hsl(' + (210 - 200 * t).toFixed(0) + ' ' + (68 + 18 * t).toFixed(0) + '% ' + (56 - 6 * t).toFixed(0) + '%)';
  }
  function render(){
    for (var i = 0; i < N; i++){
      var v = T[i], e = els[i];
      e.val.textContent = v.toFixed(2) + ' °C';
      e.fill.style.height = Math.max(0, Math.min(100, v)) + '%';
      e.fill.style.backgroundColor = color(v);
      if (i === 0 || i === N - 1){
        e.delta.textContent = '—';
        e.delta.style.color = 'var(--dsw-alias-label-secondary,#52525b)';
      } else if (prev === null){
        e.delta.textContent = '—';
        e.delta.style.color = 'var(--dsw-alias-label-secondary,#52525b)';
      } else {
        var d = v - prev[i];
        e.delta.textContent = 'Δ ' + (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(2);
        e.delta.style.color = d > 0 ? 'var(--hc-hot)' : (d < 0 ? 'var(--hc-cold)' : 'var(--dsw-alias-label-secondary,#52525b)');
      }
    }
    nEl.textContent = step;
  }
  document.getElementById('hc-step').addEventListener('click', function(){
    var nxt = T.slice();
    for (var i = 1; i < N - 1; i++){ nxt[i] = T[i] + A * (T[i-1] - 2 * T[i] + T[i+1]); }
    prev = T.slice();
    T = nxt;
    step += 1;
    render();
  });
  document.getElementById('hc-reset').addEventListener('click', function(){
    T = T0.slice(); prev = null; step = 0; render();
  });
  render();
})();
</script></body></html>
