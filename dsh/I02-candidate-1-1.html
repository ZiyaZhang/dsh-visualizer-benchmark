<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'none'; worker-src 'none'; img-src data:; base-uri 'none'; form-action 'none';"><style>:root{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f4f5f7;--dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#d1d5db;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#606875;--dsw-alias-label-tertiary:#9299a3;--dsw-alias-label-primary-inverted:#ffffff;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-button-primary-fill:#4d6bfe;--dsw-alias-interactive-bg-hover:#eef1ff;--dsw-alias-interactive-bg-active:#e0e7ff;--dsw-alias-state-error-primary:#c43535}
:where(*){box-sizing:border-box}

:where(th,td){padding:5px 8px;text-align:start}</style></head><body><script>(function() {
  "use strict";
  const C = {"source":"dsh-widget"};
  const values = new Uint32Array(4);
  crypto.getRandomValues(values);
  const channel = Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
  const emit = parent.postMessage.bind(parent);
  const post = (type, payload) => emit({ ...C, channel, type, payload }, "*");
  let failed = null;
  const reportError = (message, type = "error") => {
    if (failed !== "resource_error") failed = type;
    const text = String(message);
    post(failed, { message: text.length > 1000 ? text.slice(0, 999) + "…" : text });
  };
  const api = Object.freeze({
    sendPrompt(text) { post("send_prompt", { text }); }
  });
  Object.defineProperty(window, "dshWidget", { value: api, writable: false, configurable: false });
  post("ready", {});
  document.currentScript?.remove();

  addEventListener("message", event => {
    const message = event.data;
    if (event.source !== parent || !message || message.source !== C.source) return;
    if (message.type === "theme" && message.payload && message.payload.tokens) {
      for (const [name, value] of Object.entries(message.payload.tokens)) {
        if (typeof name === "string" && typeof value === "string") {
          document.documentElement.style.setProperty(name, value);
        }
      }
    }
  });
  addEventListener("error", event => {
    const target = event.target;
    if (target && target !== window && String(target.tagName).toUpperCase() === "SCRIPT") {
      let source = typeof target.src === "string" ? target.src : "";
      try {
        const url = new URL(source);
        source = url.origin + url.pathname;
      } catch { /* An invalid script URL remains diagnostic text. */ }
      reportError("Widget script load failed: " + (source || "unknown script"), "resource_error");
      return;
    }
    reportError(event.message || "Widget script error");
  }, true);
  addEventListener("unhandledrejection", event => {
    reportError(event.reason && event.reason.message || event.reason || "Unhandled widget rejection");
  });
  addEventListener("DOMContentLoaded", () => {
    let lastHeight = 0;
    let pendingSize = false;
    let initialFrame = true;
    const reportSize = () => {
      if (pendingSize) return;
      pendingSize = true;
      requestAnimationFrame(() => {
        pendingSize = false;
        if (initialFrame) {
          initialFrame = false;
          if (!failed) post("rendered", {});
        }
        const height = Math.ceil(document.body.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        post("resize", { height });
      });
    };
    new ResizeObserver(reportSize).observe(document.body);
    reportSize();
  });
})();</script><style>
  .hc-root{--hc-cool:#dbeafe;--hc-warm:#dc2626;background:var(--dsw-alias-bg-base,#fff);color:var(--dsw-alias-label-primary,#111827);border:1px solid var(--dsw-alias-border-l1,#e5e7eb);border-radius:14px;padding:16px;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;min-width:0;box-sizing:border-box}

  .hc-btn:hover:not(:disabled){background:var(--dsw-alias-interactive-bg-hover,rgba(0,0,0,.05))}

  code.hc-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--dsw-alias-bg-layer-2,rgba(0,0,0,.04));padding:1px 5px;border-radius:5px;color:var(--dsw-alias-label-primary,#111827)}

<div class="hc-root" id="hcRoot" role="group" aria-label="一维热传导离散演示：5 个节点，两端固定 100°C 与 0°C，可按步更新中间节点温度">
  <div class="hc-head">
    <div class="hc-title">一维杆离散示意 · 5 个节点</div>
    <div class="hc-tag">离散模型 · 非真实连续杆</div>
  </div>

  <div class="hc-meta">
    <div><div class="hc-k">时间步 n</div><div class="hc-v" id="hcStep">0</div></div>
    <div><div class="hc-k">扩散系数 r</div><div class="hc-v">0.25</div></div>
    <div><div class="hc-k">中间节点温度 (节点2–4)</div><div class="hc-v" id="hcMid">0.0 / 0.0 / 0.0 °C</div></div>
    <div><div class="hc-k">状态</div><div class="hc-v" id="hcState">初始</div></div>
  </div>

  <div class="hc-grid">
    <div class="hc-panel">
      <div class="hc-rod" id="hcRod"></div>
    </div>
    <div class="hc-panel">
      <div class="hc-chart">
        <svg viewBox="0 0 320 190" role="img" aria-labelledby="hcChartTitle">
          <title id="hcChartTitle">各节点温度分布曲线：节点1为100°C，节点5为0°C，节点2至4随迭代升高</title>
          <g id="hcGrid"></g>
          <path id="hcFill" fill="none" stroke="none"></path>
          <path id="hcLine" fill="none" stroke="var(--dsw-alias-brand-primary,#2563eb)" stroke-width="2" stroke-linejoin="round"></path>
          <g id="hcPts"></g>
          <text class="hc-ax" x="8" y="14">°C</text>
          <text class="hc-ax" x="0" y="176" id="hcTag2" text-anchor="start">节点1</text>
          <text class="hc-ax" x="320" y="176" text-anchor="end">节点5</text>
        </svg>
      </div>
    </div>
  </div>

  <div class="hc-ctrl">
    <button class="hc-btn primary" id="hcStepBtn" type="button">单步 (n → n+1)</button>
    <button class="hc-btn" id="hcResetBtn" type="button">重置</button>
    <span class="hc-hint">也可按 → 或空格单步</span>
  </div>

  <div class="hc-foot">
    离散示意：杆被简化为 5 个节点（1 与 5 为固定边界的「虚拟」端点），每步同时用上一时刻的邻居求平均：
    <code class="hc-c">T[i] ← T[i] + r·(T[i−1] + T[i+1] − 2·T[i])</code>，本演示取 <code class="hc-c">r = 0.25</code>，故等价于 <code class="hc-c">T[i] ← 0.5·(T[i−1] + T[i+1])</code>。
  </div>
</div>

<script>
(function(){
  const root = document.getElementById('hcRoot');
  if(!root || root.dataset.ready === '1'){ return; }
  root.dataset.ready = '1';

  const FIXED = [100, null, null, null, 0];
  const r = 0.25;
  let T = FIXED.slice();
  let step = 0;

  const rod = document.getElementById('hcRod');
  const stepEl = document.getElementById('hcStep');
  const midEl = document.getElementById('hcMid');
  const stateEl = document.getElementById('hcState');
  const stepBtn = document.getElementById('hcStepBtn');
  const resetBtn = document.getElementById('hcResetBtn');
  const lineEl = document.getElementById('hcLine');
  const fillEl = document.getElementById('hcFill');
  const ptsEl = document.getElementById('hcPts');
  const gridG = document.getElementById('hcGrid');

  // 颜色：越热越红（冷→热由浅到深）
  function colorFor(t){
    const s = Math.max(0, Math.min(1, t/100));
    return 'hsl(' + (218 - 218*s) + ' 88% ' + (94 - 50*s) + '%)';
  }
  function darkText(t){ return t < 62; }

  // 建立 5 个节点卡片
  const cells = FIXED.map(function(v, i){
    const cell = document.createElement('div');
    cell.className = 'hc-cell';
    const node = document.createElement('div');
    node.className = 'hc-node';
    node.textContent = '节点' + (i+1);
    const temp = document.createElement('div');
    temp.className = 'hc-temp';
    const val = document.createElement('span');
    const unit = document.createElement('span');
    unit.className = 'hc-unit';
    unit.textContent = '°C';
    temp.appendChild(val); temp.appendChild(unit);
    const fix = document.createElement('span');
    fix.className = 'hc-fix';
    cell.appendChild(node); cell.appendChild(temp); cell.appendChild(fix);
    rod.appendChild(cell);
    return { cell: cell, val: val, fix: fix };
  });

  // 图表坐标：x 为节点位置，y 为温度
  const X0 = 36, X1 = 292, Y0 = 28, Y1 = 158;
  function px(i){ return X0 + (X1 - X0) * i / 4; }
  function py(t){ return Y1 - (Y1 - Y0) * (t / 100); }

  (function drawGrid(){
    [0, 25, 50, 75, 100].forEach(function(v){
      const y = py(v);
      const g = document.createElementNS('http://www.w3.org/2000/svg','line');
      g.setAttribute('x1', X0); g.setAttribute('x2', X1);
      g.setAttribute('y1', y); g.setAttribute('y2', y);
      g.setAttribute('class','hc-guide');
      gridG.appendChild(g);
      const lab = document.createElementNS('http://www.w3.org/2000/svg','text');
      lab.setAttribute('x', X0 - 6); lab.setAttribute('y', y + 3);
      lab.setAttribute('text-anchor','end'); lab.setAttribute('class','hc-ax');
      lab.textContent = v;
      gridG.appendChild(lab);
    });
  })();

  const dots = FIXED.map(function(){
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r', 3.6);
    c.setAttribute('stroke','var(--dsw-alias-bg-base,#fff)');
    c.setAttribute('stroke-width', 1.4);
    ptsEl.appendChild(c);
    return c;
  });

  const half = cells.length / 2;
  midEl.style.display = 'none';
  cells[0].cell.style.display = '';
  cells[1].cell.style.display = '';

  function settled(){
    return FIXED.every(function(v, i){ return v !== null || T[i] >= 49.999; });
  }

  function render(){
    cells.forEach(function(c, i){
      const t = T[i];
      const isFixed = FIXED[i] !== null;
      c.cell.style.backgroundColor = isFixed ? '#f3f4f6' : colorFor(t);
      c.cell.style.background = isFixed
        ? 'var(--dsw-alias-bg-layer-2,#f3f4f6)'
        : 'linear-gradient(180deg,' + colorFor(t) + ',' + colorFor(t) + ')';
      const dark = isFixed ? true : darkText(t);
      if(isFixed){
        c.cell.style.borderColor = 'var(--dsw-alias-border-l2,#d1d5db)';
      } else {
        c.cell.style.borderColor = 'transparent';
      }
      c.val.style.color = dark ? '#111827' : '#ffffff';
      c.fix.style.color = dark ? 'rgba(17,24,39,.55)' : 'rgba(255,255,255,.75)';
      c.val.textContent = t.toFixed(1);
      c.fix.textContent = isFixed ? '固定' : '';
    });

    const pts = T.map(function(t, i){ return [px(i), py(t)]; });
    let d = 'M ' + pts[0][0] + ' ' + pts[0][1];
    for(let i = 1; i < pts.length; i++){ d += ' L ' + pts[i][0] + ' ' + pts[i][1]; }
    lineEl.setAttribute('d', d);
    fillEl.setAttribute('d', d + ' L ' + X1 + ' ' + Y1 + ' L ' + X0 + ' ' + Y1 + ' Z');
    fillEl.setAttribute('fill', 'var(--dsw-alias-brand-primary,#2563eb)');
    fillEl.setAttribute('opacity', '0.09');

    dots.forEach(function(c, i){
      c.setAttribute('cx', px(i));
      c.setAttribute('cy', py(T[i]));
      c.setAttribute('fill', FIXED[i] !== null ? 'var(--dsw-alias-label-secondary,#6b7280)' : 'var(--dsw-alias-brand-primary,#2563eb)');
    });

    stepEl.textContent = step;
    midEl.style.display = '';
    midEl.textContent = T[1].toFixed(1) + ' / ' + T[2].toFixed(1) + ' / ' + T[3].toFixed(1) + ' °C';
    stateEl.textContent = step === 0 ? '初始' : (settled() ? '已趋于稳态' : '扩散中');
    stepBtn.disabled = settled();
    stepBtn.textContent = settled() ? '已稳定' : '单步 (n → n+1)';
  }

  function doStep(){
    if(settled()){ return; }
    const next = T.slice();
    for(let i = 1; i <= 3; i++){
      next[i] = T[i] + r * (T[i-1] + T[i+1] - 2*T[i]);
    }
    T = next;
    step += 1;
    render();
  }

  function doReset(){
    T = FIXED.slice();
    step = 0;
    render();
  }

  stepBtn.addEventListener('click', doStep);
  resetBtn.addEventListener('click', doReset);
  root.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){
      if(e.target === stepBtn || e.target === resetBtn){ return; }
      e.preventDefault();
      doStep();
    }
  });
  root.setAttribute('tabindex','0');

  render();
})();
</script></body></html>
