<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH 成品 · 独立操作</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#25313b;background:#f4f6f8;font:15px/1.5 system-ui}
header{padding:14px 20px;background:white;border-bottom:1px solid #d8dfe5;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1,h2{font-size:17px;margin:0}select,button{font:inherit;padding:5px 10px;background:white;border:1px solid #ccd4dc;border-radius:5px}a{color:#245bc4}
main{padding:22px}#visuals{overflow-x:auto}.stage{margin:14px auto;background:white;width:736px;outline:1px solid #d8dfe5}
.stage>h2{padding:10px 14px;border-bottom:1px solid #d8dfe5}iframe{display:block;border:0;width:100%;min-height:120px}
.info{margin:16px auto;max-width:850px;font-size:14px}.event{white-space:pre-wrap;border-top:1px solid #d8dfe5;padding:10px 14px;overflow-wrap:anywhere}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 system-ui}body[data-theme=dark]{background:#15191e;color:#e5e7eb}
body[data-theme=dark] header,body[data-theme=dark] .stage{background:#1c2128}body[data-theme=dark] select,body[data-theme=dark] button{background:#292f38;color:#e5e7eb}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #819dff}.warning{border-left:3px solid #b48027;padding:10px 14px}
.prose{white-space:normal;overflow-wrap:anywhere}.prose p{margin:9px 0}.prose h1,.prose h2,.prose h3{margin:16px 0 8px;font-size:18px}.prose ul,.prose ol{padding-left:24px}.prose pre{white-space:pre-wrap;background:#f4f6f8;padding:12px;border-radius:5px;overflow-wrap:anywhere}.prose code{font:13px/1.5 ui-monospace,monospace}.prose table{border-collapse:collapse;width:100%}.prose td,.prose th{padding:6px;border-bottom:1px solid #dce3e8;text-align:left}
</style>
<header>
<a href="/label.html?stage=calibration">返回打标</a><h1 id="title">正在加载</h1>
<label>宽度 <select id="width"><option value="736">736 px</option><option value="360">360 px</option></select></label>
<label>外观 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
<button id="reset">重置预览</button>
</header>
<main>
<p class="info" id="description">这里展示已保存的原始成品预览。追问仅捕获内容，不会向模型发消息；主题切换会重置预览。</p>
<p class="info" id="meta"></p><div id="visuals"></div>
<div class="info"><details open><summary>完整回复</summary><div id="final" class="prose"></div><details><summary>原始 Markdown（未经改写）</summary><pre id="raw-final"></pre></details></details><details><summary>客观检查与轨迹</summary><pre id="trace"></pre></details></div>
</main>
<script src="/vendor/marked-16.4.2.js"></script>
<script>
const $ = id => document.getElementById(id);
const node = (tag,text) => {const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};

const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const markdown = new marked.Marked({gfm:true, renderer:{
  html(token) { return escapeHtml(token.text); },
  image(token) { return '<span>[图片未加载：' + escapeHtml(token.text || '无文字说明') + ']</span>'; },
  link(token) {
    const text = this.parser.parseInline(token.tokens);
    if (!/^(https?:|#|\/(?!\/))/i.test(token.href)) return text;
    return '<a href="' + escapeHtml(token.href) + '" target="_blank" rel="noopener noreferrer">' + text + '</a>';
  }
}});

const light={'--dsh-widget-color-scheme':'light','--dsw-alias-bg-base':'#fff','--dsw-alias-bg-layer-1':'#fff','--dsw-alias-bg-layer-2':'#f4f5f7','--dsw-alias-label-primary':'#1f2329','--dsw-alias-label-secondary':'#606875','--dsw-alias-label-tertiary':'#9299a3','--dsw-alias-label-primary-inverted':'#fff','--dsw-alias-border-l1':'#e5e7eb','--dsw-alias-border-l2':'#d1d5db','--dsw-alias-brand-primary':'#4d6bfe','--dsw-alias-button-primary-fill':'#4d6bfe','--dsw-alias-interactive-bg-hover':'#eef1ff','--dsw-alias-interactive-bg-active':'#e0e7ff','--dsw-alias-state-error-primary':'#c43535'};
const dark={'--dsh-widget-color-scheme':'dark','--dsw-alias-bg-base':'#1c2128','--dsw-alias-bg-layer-1':'#1c2128','--dsw-alias-bg-layer-2':'#292f38','--dsw-alias-label-primary':'#e5e7eb','--dsw-alias-label-secondary':'#abb4c0','--dsw-alias-label-tertiary':'#929ba8','--dsw-alias-label-primary-inverted':'#1c2128','--dsw-alias-border-l1':'#373e48','--dsw-alias-border-l2':'#4b5563','--dsw-alias-brand-primary':'#8195ff','--dsw-alias-button-primary-fill':'#8195ff','--dsw-alias-interactive-bg-hover':'#343f69','--dsw-alias-interactive-bg-active':'#3e4b7a','--dsw-alias-state-error-primary':'#ff8177'};
let trial, generation=0;
const tokens=()=> $('theme').value==='dark'?dark:light;
function resize(){document.querySelectorAll('.stage').forEach(stage=>{stage.style.width=$('width').value+'px';const frame=stage.querySelector('iframe');if(frame?.dataset.aspect)frame.style.height=Math.ceil(stage.clientWidth*Number(frame.dataset.aspect))+'px';});}
async function show(item,index,tag,isArtifact){
  const stage=node('section');stage.className='stage';stage.style.width=$('width').value+'px';
  const head=node('h2',(isArtifact?'项目产物':'组件 '+(index+1))+' · '+(item.title||item.name||item.kind));stage.append(head);
  if(item.source){const link=node('a','原始源码');link.href='/'+item.source;link.target='_blank';link.rel='noopener';head.append(' · ',link);}
  const event=node('div','等待预览；不向模型发送。');event.className='event';stage.append(event);$('visuals').append(stage);
  if(!item.preview){event.textContent='该条没有可加载的预览。';return;}
  const frame=node('iframe');frame.sandbox='allow-scripts';frame.title=head.textContent;frame.style.height=isArtifact?'600px':'350px';frame.dataset.count='0';stage.insertBefore(frame,event);
  try{
    const response=await fetch('/'+item.preview);if(!response.ok)throw Error('文件不存在');
    let html=await response.text();if(tag!==generation)return;
    html=html.replace('</head>','<style>:root{'+Object.entries(tokens()).map(([k,v])=>k+':'+v).join(';')+'}</style></head>');
    frame.srcdoc=html;
    if(item.kind==='svg'&&item.source){
      const source=await(await fetch('/'+item.source)).text();
      const box=source.match(/\bviewBox\s*=\s*["']([^"']+)["']/i)?.[1].trim().split(/[\s,]+/).map(Number);
      if(box?.length===4&&box[2]>0&&box[3]>0){frame.dataset.aspect=String(box[3]/box[2]);resize();}
      event.textContent='静态 SVG：无脚本事件；请检查图像。';
    }
    if(isArtifact)event.textContent='实际工作区产物的隔离预览；未调用内联组件工具。';
  }catch(error){event.textContent='预览加载失败：'+error.message;}
}
function reload(){
  $('visuals').replaceChildren();const tag=++generation;document.body.dataset.theme=$('theme').value;
  if(trial.widgets.length)trial.widgets.forEach((item,index)=>show(item,index,tag,false));
  else{
    const empty=node('p',trial.status==='planned'?'尚未运行，没有成品。':'本次没有已接受的内联组件。失败记录和回复保留在下方。');empty.className='info warning';$('visuals').append(empty);
    (trial.artifacts||[]).filter(item=>item.preview).forEach((item,index)=>show(item,index,tag,true));
  }
}
addEventListener('message',event=>{
  for(const frame of document.querySelectorAll('iframe')){
    if(event.source!==frame.contentWindow||event.data?.source!=='dsh-widget')continue;
    const m=event.data,output=frame.parentElement.querySelector('.event');
    if(m.type==='ready')frame.contentWindow.postMessage({source:'dsh-widget',type:'theme',payload:{tokens:tokens()}},'*');
    if(m.type==='resize'&&Number.isFinite(m.payload?.height)&&m.payload.height>0&&m.payload.height<50000)frame.style.height=Math.ceil(m.payload.height)+'px';
    if(m.type==='rendered')output.textContent='已渲染 · 捕获追问 '+frame.dataset.count+' 次（未向模型发送）。';
    if(m.type==='send_prompt'){frame.dataset.count=String(Number(frame.dataset.count)+1);output.textContent='捕获追问 '+frame.dataset.count+' 次（未向模型发送）：\n'+String(m.payload?.text);}
    if(m.type==='error'||m.type==='resource_error')output.textContent='渲染错误：'+String(m.payload?.message);
  }
});
$('width').onchange=resize;$('theme').onchange=reload;$('reset').onclick=reload;
fetch('/api/catalog').then(response=>response.json()).then(data=>{
  trial=data.trials.find(item=>item.id===new URLSearchParams(location.search).get('run')||item.localTrialId===new URLSearchParams(location.search).get('run'));
  if(!trial)throw Error('没有这条运行记录');$('title').textContent=trial.caseTitle+' · '+trial.id;
  $('meta').textContent=(trial.modelLabel||'')+' / '+trial.effort+' · '+trial.status+' · 全部 '+trial.widgets.length+' 份组件';
  $('final').innerHTML=markdown.parse(trial.final||'没有回复正文。');$('raw-final').textContent=trial.final;
  $('trace').textContent=JSON.stringify({checks:trial.checks,trace:trial.trace,sourceHead:trial.sourceHead,artifactHash:trial.artifactHash},null,2);
  reload();
}).catch(error=>$('title').textContent=error.message);
</script>
</html>
