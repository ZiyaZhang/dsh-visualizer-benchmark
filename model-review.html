<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH · 视觉评审与迭代</title>
<style>
:root{color-scheme:light;font:15px/1.6 system-ui;color:#18232c;background:#f5f7f9}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;background:white;border-bottom:1px solid #dbe1e7}h1{font-size:25px;margin:0 0 6px}p{margin:8px 0}a{color:#245bc4}main{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1440px;margin:auto}aside{padding:20px 14px;border-right:1px solid #dbe1e7}article{min-width:0;padding:24px}button,select{font:inherit;padding:7px 10px;border:1px solid #cad3dc;border-radius:5px;background:white;color:inherit;cursor:pointer}aside button{display:block;width:100%;text-align:left;margin:7px 0}button[aria-current=true]{border-color:#245bc4;background:#edf3ff}small,.muted{color:#657381}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.score,.note,section{background:white;border:1px solid #dbe1e7;border-radius:7px;padding:15px}.score strong{display:block;font-size:26px}.note{border-left:3px solid #c69032;margin:14px 0}.viewport{overflow:auto;border:1px solid #dbe1e7;background:white;margin:15px 0}.frame-wrap{margin:auto;max-width:none}iframe{border:0;display:block;width:100%;height:350px}.caption{padding:8px 12px;font-size:13px;color:#657381;background:#f0f3f6}.error{color:#a12c2c}.pass{color:#216244}section{margin:18px 0}h2{font-size:21px;margin:0}h3{font-size:17px;margin:12px 0}#reply{overflow-wrap:anywhere}table{border-collapse:collapse;font-size:14px}td,th{padding:8px;border:1px solid #dbe1e7}#evidence{display:flex;flex-wrap:wrap;gap:12px}details{margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.footer{display:flex;justify-content:space-between;margin:24px 0}@media(max-width:760px){main{display:block}aside{border:0;padding:12px}#list{display:flex;overflow:auto;gap:8px}aside button{min-width:140px}article{padding:16px}.scores{grid-template-columns:1fr 1fr}header{padding:18px}}
</style>
<header><h1>内联组件 · 视觉评审与迭代</h1><p>Codex 按你的授权逐份看图、操作并核对正文。这是<span class="error">非盲模型评审</span>，用于定位改进，不冒充人工标注；四维分别报告，不合成总分。</p><div class="controls"><a href="/index.html">评测入口</a><a href="/results/visual-review.md">结论与选择依据</a><a href="/model-review.json">完整评分记录</a><span id="progress"></span></div></header>
<main><aside><label>版本 <select id="arm"><option value="all">全部</option><option>A</option><option>B</option><option>C</option><option>D</option></select></label><p><label>题集 <select id="split"><option value="all">全部</option><option value="dev">开发集</option><option value="test">保留集</option></select></label></p><div id="list"></div></aside><article><h2 id="title"></h2><p id="query"></p><div class="scores" id="scores"></div><p id="checks"></p><div class="note" id="notes"></div><div class="controls"><label>宽度 <select id="width"><option value="736">736 px</option><option value="360">360 px</option></select></label><label>外观 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="reset">重置组件</button></div><p class="muted">预览使用产品主题。控件可操作，追问只显示消息内容；不会请求模型。原位修复与真实对话交付另列验证。</p><div id="widgets"></div><section><h3>同次完整回复</h3><div id="reply"></div></section><details><summary>截图与执行证据</summary><div id="evidence"></div><pre id="meta"></pre></details><div class="footer"><button id="previous">上一份</button><button id="next">下一份</button></div></article></main>
<script src="/vendor/marked-16.4.2.js"></script><script>
const $=id=>document.getElementById(id),node=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const markdown=new marked.Marked({gfm:true,renderer:{html(t){return escapeHtml(t.text)},image(t){return escapeHtml('[图片] '+t.text)},link(t){const text=this.parser.parseInline(t.tokens);return /^https?:/i.test(t.href)?'<a rel="noopener noreferrer" target="_blank" href="'+escapeHtml(t.href)+'">'+text+'</a>':text}}});
let data,list=[],index=0,epoch=0,frames=new Map();const labels={understanding:'理解价值',layout:'信息与布局',operability:'操作可理解性',focus:'简洁与聚焦'};
function nav(){list=data.reviews.filter(r=>($('arm').value==='all'||r.arm===$('arm').value)&&($('split').value==='all'||r.split===$('split').value));index=Math.min(index,list.length-1);$('list').replaceChildren();for(const [i,r] of list.entries()){const b=node('button',r.trialId+(r.split==='test'?' 保留集':'')+' · '+(r.correctness==='fail'?'内容有误':'已评'));b.setAttribute('aria-current',i===index);b.onclick=()=>{index=i;nav();show()};$('list').append(b)}$('progress').textContent=data.reviews.length+' 份已完成模型视觉评审'}
async function show(){const r=list[index];if(!r)return;const token=++epoch;frames=new Map();$('title').textContent=r.trialId;$('notes').textContent=r.notes;$('scores').replaceChildren();for(const [key,title] of Object.entries(labels)){const box=node('div');box.className='score';box.append(node('span',title),node('strong',r.ratings[key]??'N/A'));$('scores').append(box)}$('checks').textContent='内容：'+r.correctness+' · 完成情况：'+r.completion+' · 静态图的操作分为 N/A';$('widgets').replaceChildren();const t=await(await fetch(r.trialPath)).json();if(token!==epoch)return;$('query').textContent=t.prompt;$('reply').innerHTML=markdown.parse(t.final||'');$('meta').textContent=JSON.stringify({reviewType:r.reviewType,artifactHash:r.artifactHash,evidence:r.evidence},null,2);$('evidence').replaceChildren();for(const e of r.evidence){const a=node('a',e.path.split('/').slice(-1)[0]);a.href='/'+e.path;a.target='_blank';a.rel='noopener';$('evidence').append(a)}
const checks=await(await fetch(r.trialPath.replace('trial.json','browser-checks.json'))).json();const tokens=checks.themeTokens[$('theme').value];
for(const [i,w] of t.widgets.entries()){const box=node('div');box.className='viewport';box.append(node('h3','组件 '+(i+1)+' · '+w.title));const wrap=node('div');wrap.className='frame-wrap';wrap.style.width=$('width').value+'px';const frame=node('iframe');frame.title=w.title;frame.setAttribute('sandbox',w.kind==='svg'?'':'allow-scripts');const caption=node('div','正在加载；未发送模型请求。');caption.className='caption';wrap.append(frame);box.append(wrap,caption);$('widgets').append(box);frames.set(frame,{tokens,caption});let html=await(await fetch('/'+w.preview)).text();if(token!==epoch)return;const style='<style>:root{'+Object.entries(tokens).map(([k,v])=>k+':'+v).join(';')+'}</style>';frame.srcdoc=html.replace('</head>',style+'</head>');if(w.kind==='svg'){const source=await(await fetch('/'+w.source)).text();const v=source.match(/\bviewBox\s*=\s*["']([^"']+)["']/i)?.[1].trim().split(/[\s,]+/).map(Number);if(v?.length===4){frame.style.height=Math.ceil(Number($('width').value)*v[3]/v[2])+'px'}caption.textContent='静态 SVG；请结合截图查看布局。'}}
const url=new URL(location);url.searchParams.set('trial',r.trialId);history.replaceState(null,'',url);}
window.addEventListener('message',e=>{for(const [frame,info] of frames){if(e.source!==frame.contentWindow||e.data?.source!=='dsh-widget')continue;const m=e.data;if(m.type==='ready')frame.contentWindow.postMessage({source:'dsh-widget',type:'theme',payload:{tokens:info.tokens}},'*');if(m.type==='resize'&&Number.isFinite(m.payload?.height))frame.style.height=Math.max(100,Math.min(8192,m.payload.height))+'px';if(m.type==='rendered')info.caption.textContent='已渲染；追问仅在此捕获。';if(m.type==='send_prompt')info.caption.textContent='捕获的追问：'+String(m.payload?.text||JSON.stringify(m.payload));if(['error','resource_error'].includes(m.type)){info.caption.textContent='原始渲染错误：'+JSON.stringify(m.payload);info.caption.classList.add('error')}}});
$('split').onchange=$('arm').onchange=()=>{index=0;nav();show()};for(const id of ['theme','width'])$(id).onchange=show;$('reset').onclick=show;$('previous').onclick=()=>{index=Math.max(0,index-1);nav();show()};$('next').onclick=()=>{index=Math.min(list.length-1,index+1);nav();show()};
(async()=>{if(innerWidth<760)$('width').value='360';data=await(await fetch('/model-review.json')).json();nav();const wanted=new URL(location).searchParams.get('trial');const found=list.findIndex(r=>r.trialId===wanted);if(found>=0)index=found;nav();await show()})().catch(e=>$('notes').textContent='无法加载评审：'+e.message);
</script></html>
